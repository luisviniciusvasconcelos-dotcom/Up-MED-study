 L(as('medmacro',2,'Associe o espaço meníngeo ao conteúdo.',[['Epidural','Gordura e plexo venoso vertebral interno'],['Subdural','Fenda virtual com pouco líquido'],['Subaracnóideo','Liquor'],['Entre L2 e S2','Raízes da cauda equina e filamento terminal']],'O liquor fica no subaracnóideo.'),'O epidural está entre dura e periósteo; o subdural é virtual; o subaracnóideo, entre aracnoide e pia, contém o liquor e, abaixo do cone, as raízes.','É no subaracnóideo que se coleta liquor e se faz a raquianestesia; no epidural, a peridural.'),
 L(ar('medmacro',3,'Metástases de câncer de próstata podem atingir a coluna vertebral sem passar pelos pulmões.','As veias do plexo venoso vertebral interno não têm válvulas e se comunicam com veias da pelve.',0,'A ausência de válvulas permite fluxo invertido para a coluna.'),'Aumentos de pressão abdominal, como na tosse, empurram sangue para o plexo vertebral. Células tumorais e infecções seguem esse caminho até vértebras e medula.','O mesmo mecanismo explica a esquistossomose medular: ovos de Schistosoma mansoni chegam à medula e causam mielite.'),
 L(od('medmacro',2,'Ordene as camadas atravessadas pela agulha na raquianestesia lombar.',['Pele e tela subcutânea','Ligamento interespinhal','Ligamento amarelo','Dura-máter','Aracnoide'],'A agulha passa pelos ligamentos, pelo espaço epidural e perfura dura e aracnoide.'),'Depois do ligamento amarelo vem o espaço epidural; na raqui a agulha segue e perfura dura e aracnoide até o liquor gotejar.','Na peridural para-se no espaço epidural, logo após a perda de resistência do ligamento amarelo.'),
 L(ar('medmacro',2,'A punção lombar costuma ser feita entre L3 e L4.','Nesse nível o espaço subaracnóideo contém apenas raízes da cauda equina, que se afastam da agulha.',0,'A ausência de medula torna o local seguro.'),'Entre L2 e S2 o espaço subaracnóideo é amplo e tem bastante liquor. As raízes flutuam e raramente são lesadas pela agulha.','Antes da punção é preciso excluir hipertensão intracraniana com efeito de massa, pelo risco de herniação.'),
 L(cs('medmacro',2,'Um dia após uma raquianestesia, paciente tem dor de cabeça que surge ao ficar em pé e melhora ao deitar. Qual a causa?',['Vazamento de liquor pelo orifício na dura-máter','Hematoma no espaço epidural','Injeção acidental no espaço subdural','Lesão do cone medular pela agulha'],'Cefaleia pós-punção: a perda de liquor reduz a pressão intracraniana.'),'Ao perfurar a dura, o liquor pode vazar. Em pé, a queda de pressão traciona estruturas sensíveis à dor dentro do crânio.','Agulhas mais finas e de ponta romba reduzem o risco; casos persistentes podem ser tratados com tampão sanguíneo peridural.'),
 L(mc('medmacro',2,'Na anestesia peridural, o anestesista sabe que chegou ao espaço certo quando:',['Há perda súbita de resistência após o ligamento amarelo','O liquor começa a gotejar da agulha','O paciente sente choque na perna','A agulha encosta no corpo vertebral'],'O espaço epidural vem logo depois do ligamento amarelo.'),'O ligamento amarelo é denso; ao atravessá-lo, a resistência cai bruscamente. Se gotejar liquor, a agulha passou da dura.','A peridural é muito usada em trabalho de parto por permitir analgesia contínua com cateter.'),
 L(mc('medmacro',3,'O filamento terminal, ao atravessar o fundo do saco dural, recebe prolongamentos da dura e termina:',['Fixado ao cóccix como ligamento coccígeo','Livre no hiato sacral','No periósteo de L2','Junto ao cone medular'],'O conjunto forma o filamento terminal (parte dural) e se fixa no cóccix.'),'A pia-máter continua após o cone medular como filamento terminal; ao passar pelo fundo do saco dural, ganha uma cobertura de dura e se insere no periósteo dorsal do cóccix.','Filamento terminal espesso e curto pode tracionar a medula (medula presa), com dor e alterações urinárias.'),
 L(gp('medmacro',2,'O conjunto de raízes que descem ao redor do cone medular e do filamento terminal forma a ____.',['cauda equina','cauda eqüina'],'Lembra a cauda de um cavalo.'),'As raízes dos segmentos lombares, sacrais e coccígeo descem até seus forames, abaixo de L2.','A síndrome da cauda equina causa anestesia em sela, retenção urinária e fraqueza flácida das pernas.')
);

/* Capítulo 5 — Tronco encefálico e cerebelo: macroscopia */
LESSON.tronco=[
 {t:'Visão geral do tronco encefálico',b:[
  ['p','O tronco encefálico fica entre a medula e o diencéfalo, à frente do cerebelo. Tem três partes, de baixo para cima: **bulbo, ponte e mesencéfalo**. Dez dos doze pares cranianos se ligam a ele, por isso reconhecer onde cada nervo emerge é o centro deste capítulo.'],
  ['p','Por dentro há **núcleos** (grupos de corpos neuronais) e **tratos, fascículos e lemniscos** (feixes de fibras). Muitos relevos da superfície correspondem a essas estruturas internas.'],
  ['fig','troncoAnt','Tronco encefálico em vista anterior (ventral).'],
  ['key','Só o **olfatório (I)** e o **óptico (II)** não se ligam ao tronco: ligam-se diretamente ao cérebro.']]},
 {t:'Bulbo: face anterior e lateral',b:[
  ['p','O bulbo (medula oblonga) tem forma de cone. O limite com a medula é um plano logo acima das radículas de C1, na altura do forame magno. O limite com a ponte é o **sulco bulbopontino**.'],
  ['ul',['**Pirâmides:** eminências de cada lado da fissura mediana anterior, formadas pelo trato corticospinal.','**Decussação das pirâmides:** na parte caudal, as fibras cruzam a linha média e apagam a fissura.','**Oliva:** eminência oval na área lateral, criada pelo **núcleo olivar inferior**.']],
  ['tbl',[['Sulco do bulbo','Nervos que emergem'],['Sulco lateral anterior (entre pirâmide e oliva)','XII, hipoglosso'],['Sulco lateral posterior (atrás da oliva)','IX, X e raiz craniana do XI']]],
  ['mn','O **hipoglosso** sai **à frente** da oliva; **IX, X e XI** saem **atrás** dela, em fila.'],
  ['chk','O nervo hipoglosso emerge:',['Atrás da oliva, no sulco lateral posterior','Entre a pirâmide e a oliva, no sulco lateral anterior','No sulco bulbopontino'],1,'O XII sai do sulco lateral anterior, entre a pirâmide e a oliva.']]},
 {t:'Bulbo: face posterior',b:[
  ['p','A metade caudal do bulbo é a **porção fechada**: tem um canal central, continuação do da medula. Na metade rostral o canal se abre no **IV ventrículo** (porção aberta), cujo ângulo inferior se chama **óbex**.'],
  ['ul',['**Fascículos grácil e cuneiforme** continuam os da medula e terminam nos **núcleos grácil e cuneiforme**, que formam os **tubérculos** desses núcleos.','Com a abertura do ventrículo, os tubérculos se afastam como os braços de um V e continuam com o **pedúnculo cerebelar inferior**.','O pedúnculo inferior tem uma parte lateral (**corpo restiforme**, proprioceptiva) e uma medial (**justarrestiforme**, vestibular).']]]},
 {t:'Ponte',b:[
  ['p','A ponte fica entre bulbo e mesencéfalo e repousa sobre o clivo. Sua **base** tem estrias transversais: fibras que convergem de cada lado no grosso **pedúnculo cerebelar médio**.'],
  ['ul',['**Trigêmeo (V):** emerge no limite entre a ponte e o pedúnculo cerebelar médio, com raiz sensitiva (maior) e motora (menor). Esse ponto define onde termina a ponte e começa o pedúnculo.','**Sulco basilar:** na linha média, aloja a artéria basilar.','**Sulco bulbopontino:** dele saem, de medial para lateral, **VI, VII (com o intermédio) e VIII**.']],
  ['tbl',[['Nervo','Ponto exato'],['VI, abducente','Entre a ponte e a pirâmide'],['VII, facial','Medial ao VIII'],['Intermédio','Entre VII e VIII; raiz sensitiva do facial'],['VIII, vestibulococlear','Mais lateral, junto ao flóculo do cerebelo']]],
  ['clin','No **ângulo pontocerebelar** ficam V, VII, VIII e o flóculo, muito próximos. Um tumor ali, como o **schwannoma vestibular**, causa perda auditiva e zumbido, depois dormência da face e fraqueza facial.'],
  ['chk','Ordem de emergência no sulco bulbopontino, de medial para lateral:',['VII, VI, VIII','VI, VII, VIII','VIII, VII, VI'],1,'VI mais medial, junto à pirâmide; VIII mais lateral, junto ao flóculo.']]},
 {t:'IV ventrículo',b:[
  ['p','É a cavidade do rombencéfalo, em forma de losango, entre ponte e bulbo (assoalho) e cerebelo (teto). Comunica-se com o **canal central do bulbo** embaixo, com o **aqueduto cerebral** em cima e com o **espaço subaracnóideo** pelas aberturas:'],
  ['ul',['Duas **aberturas laterais** (forames de Luschka), na ponta dos recessos laterais, junto ao flóculo.','Uma **abertura mediana** (forame de Magendie), no teto caudal.']],
  ['fig','troncoDorsal','Tronco em vista dorsal com o assoalho do IV ventrículo.'],
  ['tbl',[['Estrutura do assoalho','O que há embaixo'],['Sulco mediano','Linha média'],['Eminência medial','Núcleos motores, mediais ao sulco limitante'],['Colículo facial','Fibras do VII contornando o núcleo do VI'],['Trígono do hipoglosso','Núcleo do XII'],['Trígono do vago','Núcleo dorsal do vago'],['Área postrema','Centro do vômito (quimiorreceptor)'],['Área vestibular','Núcleos vestibulares'],['Locus ceruleus','Neurônios noradrenérgicos']]],
  ['key','O **sulco limitante** separa núcleos **motores** (mediais, da lâmina basal) de **sensitivos** (laterais, da lâmina alar). Ele se alarga nas fóveas superior e inferior.'],
  ['p','O teto tem, em cima, o **véu medular superior** (entre os pedúnculos superiores) e, embaixo, a **tela corioide** (epêndima + pia), de onde pendem os **plexos corioides** que produzem liquor. Um pouco de plexo aparece pelas aberturas laterais.'],
  ['clin','A **área postrema** não tem barreira hematoencefálica e detecta substâncias no sangue; por isso quimioterápicos e toxinas provocam vômito. O assoalho do IV ventrículo abriga centros vitais do bulbo: lesões ali, e não do cerebelo, é que matavam os feridos de guerra atingidos na nuca.'],
  ['chk','O colículo facial é formado por:',['Núcleo do nervo facial','Fibras do facial contornando o núcleo do abducente','Núcleo vestibular superior'],1,'O joelho interno do facial passa em volta do núcleo do VI e levanta o assoalho.']]},
 {t:'Mesencéfalo',b:[
  ['p','O mesencéfalo fica entre ponte e diencéfalo e é atravessado pelo **aqueduto cerebral**. Atrás do aqueduto está o **teto**; à frente, os **pedúnculos cerebrais**, cada um com **tegmento** (dorsal) e **base** (ventral), separados pela **substância negra**.'],
  ['ul',['**Colículos superiores:** ligados ao corpo geniculado lateral pelo braço do colículo superior; via óptica e reflexos visuais.','**Colículos inferiores:** ligados ao corpo geniculado medial pelo braço do colículo inferior; via auditiva.','**Troclear (IV):** emerge logo abaixo do colículo inferior, é o único par que sai da face dorsal e contorna o mesencéfalo até a face ventral.','**Oculomotor (III):** emerge do **sulco medial do pedúnculo**, na fossa interpeduncular.']],
  ['p','Vistos de frente, os pedúnculos divergem e delimitam a **fossa interpeduncular**, fechada à frente pelos **corpos mamilares**. O fundo, cheio de orifícios para vasos, é a **substância perfurada posterior**.'],
  ['chk','O único nervo craniano que emerge da face dorsal do tronco é o:',['Oculomotor','Troclear','Abducente'],1,'O IV sai abaixo do colículo inferior.']]},
 {t:'Cerebelo: forma e divisões',b:[
  ['p','O cerebelo fica atrás da ponte e do bulbo, na fossa posterior, separado do lobo occipital pelo **tentório do cerebelo**. Tem uma parte mediana, o **verme**, e dois **hemisférios**. Funciona na postura, no equilíbrio, na coordenação e no aprendizado motor, e participa de algumas funções cognitivas.'],
  ['p','Sulcos transversais formam as **folhas**; fissuras mais profundas separam **lóbulos**. Por dentro há o **corpo medular** com lâminas brancas ("árvore da vida") coberto pelo **córtex cerebelar**, e quatro pares de **núcleos centrais**: **denteado, emboliforme, globoso e fastigial**. Todas as fibras que saem do cerebelo partem desses núcleos.'],
  ['fig','cerebeloDorsal','Cerebelo em vista superior: verme, hemisférios, lóbulos e fissuras.'],['fig','cerebeloSag','Lóbulos do verme em secção sagital mediana.'],
  ['tbl',[['Divisão anatômica','Limite'],['Lobo anterior','Acima da fissura prima'],['Lobo posterior','Entre a fissura prima e a posterolateral'],['Lobo floculonodular','Nódulo + flóculos, abaixo da fissura posterolateral']]],
  ['key','Para a prova basta reconhecer três lóbulos (**nódulo, flóculo e tonsila**) e duas fissuras (**prima e posterolateral**). O lobo floculonodular cuida do **equilíbrio**.'],
  ['fig','cerebeloInf','Face inferior do cerebelo com as tonsilas.'],
  ['clin','As **tonsilas** ficam sobre a face dorsal do bulbo. Com aumento da pressão intracraniana elas podem descer pelo forame magno (**hérnia de tonsila**) e comprimir o bulbo, com parada respiratória.'],
  ['p','Os três **pedúnculos cerebelares** ligam o cerebelo ao tronco: **superior** ao mesencéfalo, **médio** à ponte (é o maior) e **inferior** ao bulbo e à medula.'],
  ['chk','O lobo floculonodular é separado do corpo do cerebelo pela fissura:',['Prima','Posterolateral','Horizontal'],1,'A fissura posterolateral isola nódulo e flóculo.']]}
];
RESUMO.tronco={pts:['Tronco: bulbo, ponte e mesencéfalo; 10 dos 12 pares cranianos se ligam a ele.','Bulbo ventral: pirâmides (corticospinal) e decussação; oliva (núcleo olivar inferior).','XII entre pirâmide e oliva; IX, X e XI atrás da oliva (sulco lateral posterior).','Sulco bulbopontino: VI, VII, intermédio e VIII, de medial para lateral.','V emerge no limite entre ponte e pedúnculo cerebelar médio; sulco basilar aloja a artéria basilar.','IV ventrículo: aberturas laterais (Luschka) e mediana (Magendie); assoalho = fossa romboide.','Assoalho: colículo facial (VII contornando o núcleo do VI), trígonos do XII e do vago, área postrema, área vestibular, locus ceruleus.','Mesencéfalo: teto (colículos) e pedúnculos (tegmento e base, separados pela substância negra); III no sulco medial do pedúnculo; IV abaixo do colículo inferior, face dorsal.','Cerebelo: verme e hemisférios; fissura prima (lobo anterior/posterior) e posterolateral (lobo floculonodular).','Núcleos centrais: denteado, emboliforme, globoso e fastigial.'],
 clin:['Tumor do ângulo pontocerebelar: perda auditiva, zumbido, hipoestesia facial e paralisia facial.','Área postrema sem barreira: vômito por substâncias no sangue.','Hérnia de tonsila pelo forame magno comprime o bulbo e pode ser fatal.','Lesões do assoalho do IV ventrículo atingem centros vitais.']};
QB.push(
 L(mc('tronco',1,'O limite entre bulbo e ponte na face ventral é o:',['Sulco bulbopontino','Sulco basilar','Óbex','Sulco lateral anterior'],'O sulco bulbopontino marca a margem inferior da ponte.'),'Do sulco bulbopontino emergem VI, VII, intermédio e VIII. O sulco basilar é longitudinal, na ponte.','Lesões nessa transição podem atingir vários nervos ao mesmo tempo, como no ângulo pontocerebelar.'),
 L(mc('tronco',2,'A oliva bulbar é uma eminência produzida pelo:',['Núcleo olivar inferior','Trato corticospinal','Núcleo grácil','Lemnisco medial'],'Sob a oliva fica o núcleo olivar inferior.'),'O núcleo olivar inferior é uma grande massa de substância cinzenta ligada ao cerebelo pelas fibras olivocerebelares (fibras trepadeiras).','Lesões que interrompem o circuito entre núcleo denteado, núcleo rubro e oliva podem causar tremor palatal.'),
 L(as('tronco',2,'Associe o nervo ao seu ponto de emergência.',[['Hipoglosso','Sulco lateral anterior do bulbo'],['Vago','Sulco lateral posterior do bulbo'],['Abducente','Entre ponte e pirâmide'],['Oculomotor','Sulco medial do pedúnculo cerebral']],'Cada nervo tem um endereço fixo no tronco.'),'XII sai à frente da oliva; IX, X e XI atrás dela; VI no sulco bulbopontino junto à pirâmide; III na fossa interpeduncular.','Saber onde cada nervo emerge ajuda a entender síndromes do tronco, em que um nervo craniano lesado aponta o nível da lesão.'),
 L(mc('tronco',2,'Do sulco bulbopontino, o nervo mais lateral é o:',['Vestibulococlear','Abducente','Facial','Intermédio'],'O VIII emerge mais lateralmente, junto ao flóculo.'),'De medial para lateral: VI, VII, intermédio e VIII. O intermédio é a raiz sensitiva do facial.','Schwannoma vestibular cresce no ângulo pontocerebelar e comprime o VIII primeiro, depois V e VII.'),
 L(cs('tronco',2,'Mulher de 50 anos com perda auditiva progressiva à direita e zumbido há dois anos. Agora tem dormência na hemiface direita e o reflexo corneano direito está diminuído. Onde está a lesão?',['Ângulo pontocerebelar direito','Mesencéfalo dorsal','Bulbo medial direito','Córtex auditivo esquerdo'],'VIII e V juntos apontam para o ângulo pontocerebelar.'),'O tumor típico é o schwannoma vestibular. Comprime o VIII (hipoacusia, zumbido), depois o V (hipoestesia, reflexo corneano reduzido) e o VII. Grandes tumores comprimem o cerebelo e o tronco.','A ressonância com contraste confirma; o tratamento pode ser cirurgia ou radiocirurgia.'),
 L(mc('tronco',2,'O ângulo inferior do IV ventrículo, que marca o início da porção fechada do bulbo, é o:',['Óbex','Forame de Magendie','Funículo separante','Recesso lateral'],'O óbex é o vértice caudal do assoalho.'),'Abaixo do óbex o bulbo tem canal central; acima, o canal se abre no IV ventrículo.','O óbex é referência em cirurgias da fossa posterior.'),
 L(vf('tronco',2,'Julgue sobre o IV ventrículo.',[['Comunica-se com o espaço subaracnóideo pelas aberturas laterais e mediana.',true],['O véu medular superior forma a metade caudal do teto.',false],['A área postrema fica no assoalho, perto do óbex.',true],['O sulco limitante separa núcleos motores mediais de sensitivos laterais.',true]],'O véu medular superior forma a metade cranial do teto; a caudal é a tela corioide.'),'O teto tem o véu medular superior em cima e a tela corioide embaixo. O assoalho, formado por ponte e bulbo, tem as eminências e trígonos dos núcleos.','Obstrução das aberturas do IV ventrículo causa hidrocefalia com dilatação de todos os ventrículos, como na malformação de Dandy-Walker.'),
 L(as('tronco',2,'Associe a estrutura do assoalho ao que há embaixo dela.',[['Colículo facial','Joelho do facial em volta do núcleo do VI'],['Trígono do hipoglosso','Núcleo do XII'],['Trígono do vago','Núcleo dorsal do vago'],['Área vestibular','Núcleos vestibulares']],'Os relevos do assoalho refletem núcleos e fibras.'),'Os núcleos motores ficam mediais ao sulco limitante (eminência medial, trígono do XII); os sensitivos, laterais (área vestibular).','Uma lesão no colículo facial causa paralisia facial periférica e paralisia do olhar lateral para o mesmo lado.'),
 L(ar('tronco',3,'Substâncias tóxicas no sangue podem provocar vômito ao agir diretamente sobre a área postrema.','A área postrema não tem barreira hematoencefálica.',0,'Sem barreira, a área postrema detecta substâncias circulantes.'),'É uma zona quimiorreceptora no assoalho do IV ventrículo, lateral ao trígono do vago, separada dele pelo funículo separante.','Antieméticos que bloqueiam receptores de dopamina e serotonina nessa área são usados na quimioterapia.'),
 L(mc('tronco',2,'O nervo trigêmeo emerge:',['Entre a ponte e o pedúnculo cerebelar médio','No sulco bulbopontino','Na fossa interpeduncular','Abaixo do colículo inferior'],'O ponto de emergência do V é o limite entre ponte e pedúnculo médio.'),'Emerge por uma raiz sensitiva maior e uma motora menor. Por convenção, esse ponto marca onde termina a ponte e começa o pedúnculo cerebelar médio.','A neuralgia do trigêmeo pode ser causada por uma alça arterial comprimindo a raiz nessa região.'),
 L(as('tronco',2,'Associe o colículo à via e à conexão.',[['Colículo superior','Via óptica, braço para o geniculado lateral'],['Colículo inferior','Via auditiva, braço para o geniculado medial'],['Corpo geniculado lateral','Recebe o trato óptico'],['Corpo geniculado medial','Estação auditiva talâmica']],'Superior com visão, inferior com audição.'),'Os braços dos colículos ligam o teto do mesencéfalo aos corpos geniculados do diencéfalo.','Tumores da pineal comprimem os colículos superiores e causam paralisia do olhar para cima (síndrome de Parinaud).'),
 L(mc('tronco',2,'No mesencéfalo, o tegmento é separado da base do pedúnculo pela:',['Substância negra','Fossa interpeduncular','Comissura posterior','Lâmina quadrigêmea'],'A substância negra, com melanina, separa tegmento e base.'),'Na superfície, o sulco lateral do mesencéfalo e o sulco medial do pedúnculo marcam esse limite. Do sulco medial emerge o III.','A perda dos neurônios dopaminérgicos da substância negra causa a doença de Parkinson.'),
 L(mc('tronco',2,'O fundo da fossa interpeduncular, com vários orifícios vasculares, é a:',['Substância perfurada posterior','Substância perfurada anterior','Área postrema','Lâmina terminal'],'Perfurada posterior: fossa interpeduncular; anterior: perto do trato olfatório.'),'Pequenas artérias penetram ali para irrigar estruturas profundas do mesencéfalo e do diencéfalo.','Oclusão dessas artérias perfurantes causa pequenos infartos com paralisia do III e déficits motores.'),
 L(gp('tronco',2,'O maior dos pedúnculos cerebelares, que liga o cerebelo à ponte, é o pedúnculo cerebelar ____.',['médio','medio'],'O pedúnculo médio é a continuação das fibras transversais da ponte.'),'Superior liga ao mesencéfalo, médio à ponte, inferior ao bulbo e à medula.','Lesões do pedúnculo médio causam ataxia do mesmo lado.'),
 L(mc('tronco',2,'Qual estrutura NÃO faz parte do lobo floculonodular?',['Nódulo','Flóculo','Pedúnculo do flóculo','Tonsila'],'A tonsila pertence ao lobo posterior.'),'O lobo floculonodular é formado por nódulo, flóculos e seus pedúnculos, abaixo da fissura posterolateral. Relaciona-se ao equilíbrio.','Lesões do nódulo, como o meduloblastoma em crianças, causam desequilíbrio e marcha instável.'),
 L(cs('tronco',3,'Paciente com tumor cerebral volumoso piora subitamente, com rigidez de nuca, bradicardia e respiração irregular, e para de respirar. Qual o mecanismo mais provável?',['Herniação das tonsilas cerebelares pelo forame magno','Hemorragia no lobo floculonodular','Compressão do quiasma óptico','Obstrução do aqueduto cerebral isolada'],'A hérnia de tonsila comprime o bulbo, onde estão os centros respiratório e vasomotor.'),'O aumento da pressão empurra as tonsilas, que ficam sobre o bulbo, pelo forame magno. A compressão bulbar altera respiração e circulação e pode matar.','Por isso não se faz punção lombar sem descartar massa com efeito de massa: a queda de pressão abaixo pode precipitar a herniação.'),
 L(ar('tronco',2,'Lesões traumáticas da nuca que atingiam a "árvore da vida" eram fatais.','O cerebelo abriga os centros respiratório e vasomotor.',2,'A asserção é verdadeira; a razão é falsa, pois esses centros estão no bulbo, no assoalho do IV ventrículo.'),'A morte vinha da lesão do assoalho do IV ventrículo, logo abaixo. O cerebelo pode ser destruído sem causar morte.','Pacientes com grandes lesões cerebelares sobrevivem, mas com ataxia importante.'),
 L(od('tronco',2,'Ordene os lóbulos do verme do cerebelo, do mais anterior ao mais posterior.',['Língula','Lóbulo central','Cúlmen','Declive','Fólio','Túber','Pirâmide','Úvula','Nódulo'],'O verme "dá a volta" de cima para baixo até o nódulo, sob o IV ventrículo.'),'A fissura prima fica entre cúlmen e declive; a posterolateral, entre úvula e nódulo.','Não é preciso decorar todos para a clínica, mas a ordem ajuda a ler cortes sagitais de ressonância.')
);

/* Capítulo 6 — Diencéfalo: macroscopia */
LESSON.diencefalo=[
 {t:'Cérebro = telencéfalo + diencéfalo',b:[
  ['p','O **cérebro** corresponde ao prosencéfalo do embrião e ocupa cerca de **80% da cavidade craniana**. Tem duas partes: o **telencéfalo**, que cresce muito para os lados e para trás formando os hemisférios, e o **diencéfalo**, que fica no meio, quase todo escondido, visível apenas na face inferior do cérebro.'],
  ['p','O diencéfalo tem quatro partes, todas em relação com o **III ventrículo**: **tálamo, hipotálamo, epitálamo e subtálamo**. Por isso o estudo começa pelo ventrículo.'],
  ['fig','medialDien','Diencéfalo e III ventrículo em corte sagital mediano.']]},
 {t:'III ventrículo',b:[
  ['p','É uma fenda estreita, ímpar e mediana. Comunica-se com o IV ventrículo pelo **aqueduto cerebral** e com cada ventrículo lateral pelo **forame interventricular** (de Monro).'],
  ['ul',['**Paredes laterais:** o **sulco hipotalâmico**, que vai do aqueduto ao forame interventricular, separa o **tálamo** (acima) do **hipotálamo** (abaixo).','**Aderência intertalâmica:** trave de substância cinzenta que une os dois tálamos através do ventrículo; falta em cerca de 30% das pessoas.','**Assoalho**, de frente para trás: **quiasma óptico, infundíbulo, túber cinéreo e corpos mamilares** (todos do hipotálamo).','**Parede posterior:** epitálamo.','**Teto:** **tela corioide**, presa nas **estrias medulares do tálamo**; dela pendem dois cordões de **plexo corioide**, contínuos com os dos ventrículos laterais pelos forames interventriculares.','**Parede anterior:** **lâmina terminal**, entre o quiasma e a **comissura anterior**.']],
  ['key','A lâmina terminal, a comissura anterior e a parte vizinha das paredes do III ventrículo pertencem ao **telencéfalo**, não ao diencéfalo: vêm da parte mediana da vesícula telencefálica.'],
  ['chk','O sulco hipotalâmico separa:',['Tálamo do hipotálamo','Tálamo do epitálamo','Hipotálamo do subtálamo'],0,'Acima do sulco fica o tálamo; abaixo, o hipotálamo.']]},
 {t:'Tálamo',b:[
  ['p','Os tálamos são duas massas ovoides de substância cinzenta na parte dorsal e lateral do diencéfalo.'],
  ['ul',['**Tubérculo anterior:** extremidade anterior; ajuda a delimitar o forame interventricular.','**Pulvinar:** extremidade posterior, maior, projetada sobre os **corpos geniculados**.','**Corpo geniculado medial** (via auditiva) e **lateral** (via óptica); alguns autores os chamam de **metatálamo**.','**Face superior:** a parte lateral forma parte do assoalho do ventrículo lateral.','**Face medial:** forma a maior parte da parede lateral do III ventrículo.','**Face lateral:** separada do telencéfalo pela **cápsula interna**.','**Face inferior:** continua com hipotálamo e subtálamo.']],
  ['p','O tálamo é, sobretudo, uma grande estação de **sensibilidade** a caminho do córtex, mas tem também funções motoras, emocionais e de consciência, vistas no capítulo de tálamo.'],
  ['chk','O pulvinar é:',['A extremidade posterior do tálamo','Uma parte do hipotálamo','O teto do III ventrículo'],0,'O pulvinar se projeta sobre os corpos geniculados.']]},
 {t:'Hipotálamo',b:[
  ['p','Pequeno, mas essencial: controla o **sistema nervoso autônomo**, as **glândulas endócrinas** e a **homeostase**. Fica abaixo do sulco hipotalâmico, nas paredes laterais do III ventrículo, e inclui as estruturas do assoalho visíveis na base do cérebro:'],
  ['tbl',[['Estrutura','Características'],['Quiasma óptico','Parte anterior do assoalho; cruzamento parcial das fibras ópticas'],['Túber cinéreo','Área cinzenta entre quiasma e corpos mamilares; nele se prende a hipófise'],['Infundíbulo','Funil que liga o túber à neuro-hipófise; em cima forma a eminência mediana'],['Corpos mamilares','Duas eminências na frente da fossa interpeduncular']]],
  ['clin','Na retirada do encéfalo, o infundíbulo costuma se romper e a hipófise fica na sela turca. Tumores da hipófise crescem para cima e comprimem o quiasma, causando perda dos campos visuais temporais.'],
  ['chk','A hipófise se prende ao diencéfalo pelo:',['Túber cinéreo, por meio do infundíbulo','Corpo mamilar','Quiasma óptico'],0,'O infundíbulo liga o túber cinéreo à neuro-hipófise.']]},
 {t:'Epitálamo e subtálamo',b:[
  ['p','O **epitálamo** forma a parede posterior do III ventrículo, acima do sulco hipotalâmico, na transição com o mesencéfalo.'],
  ['ul',['**Glândula pineal (epífise):** endócrina, ímpar, em forma de pinha, sobre o teto do mesencéfalo; produz **melatonina**.','**Comissura posterior:** no ponto em que o aqueduto se abre no III ventrículo; marca o **limite entre mesencéfalo e diencéfalo**.','**Comissura das habênulas:** entre os **trígonos das habênulas**; continua com as estrias medulares do tálamo.']],
  ['p','O **subtálamo** é a transição entre diencéfalo e tegmento do mesencéfalo. Não aparece nas paredes do ventrículo: só é visto em cortes frontais, abaixo do tálamo, entre a cápsula interna (lateral) e o hipotálamo (medial). Tem função **motora**; seu principal núcleo é o **núcleo subtalâmico**.'],
  ['clin','Lesão do núcleo subtalâmico, geralmente por AVC, causa **hemibalismo**: movimentos amplos e violentos de arremesso do membro do lado oposto.'],
  ['chk','O limite entre mesencéfalo e diencéfalo é marcado pela:',['Comissura anterior','Comissura posterior','Comissura das habênulas'],1,'A comissura posterior fica onde o aqueduto se abre no III ventrículo.']]}
];
RESUMO.diencefalo={pts:['Cérebro = telencéfalo + diencéfalo; o diencéfalo só aparece na face inferior.','Partes: tálamo, hipotálamo, epitálamo e subtálamo, todas ligadas ao III ventrículo.','III ventrículo: aqueduto atrás-embaixo, forames interventriculares à frente, sulco hipotalâmico nas paredes, aderência intertalâmica (falta em 30%).','Assoalho: quiasma óptico, infundíbulo, túber cinéreo e corpos mamilares.','Teto: tela corioide presa nas estrias medulares do tálamo; parede anterior: lâmina terminal e comissura anterior (telencéfalo).','Tálamo: tubérculo anterior, pulvinar, corpos geniculados (metatálamo); face lateral junto à cápsula interna.','Epitálamo: pineal, comissura posterior (limite com mesencéfalo), comissura e trígonos das habênulas.','Subtálamo: entre tálamo, cápsula interna e hipotálamo; função motora.'],
 clin:['Tumor de hipófise comprime o quiasma: hemianopsia bitemporal.','Lesão do núcleo subtalâmico: hemibalismo contralateral.','Tumor da pineal comprime o teto do mesencéfalo e o aqueduto: paralisia do olhar vertical e hidrocefalia.']};
QB.push(
 L(mc('diencefalo',1,'O diencéfalo é visível, no encéfalo intacto, apenas:',['Na face inferior do cérebro','Na face lateral do hemisfério','No polo occipital','Na face superior, entre os hemisférios'],'O telencéfalo cobre o diencéfalo, que aparece só na base.'),'Na face inferior vemos quiasma, túber cinéreo, infundíbulo e corpos mamilares. Para ver o resto é preciso um corte sagital.','O exame da base do encéfalo em peças é a forma mais rápida de identificar o hipotálamo em prova prática.'),
 L(as('diencefalo',2,'Associe a parede do III ventrículo à estrutura.',[['Parede anterior','Lâmina terminal'],['Teto','Tela corioide'],['Parede posterior','Epitálamo'],['Assoalho','Quiasma, túber e corpos mamilares']],'Cada parede tem sua estrutura típica.'),'A tela corioide prende-se às estrias medulares do tálamo e emite plexos corioides. A lâmina terminal fica entre o quiasma e a comissura anterior.','A lâmina terminal pode ser aberta cirurgicamente para drenar liquor em algumas hidrocefalias.'),
 L(mc('diencefalo',2,'A aderência intertalâmica:',['Une os dois tálamos através do III ventrículo','Une tálamo e hipotálamo do mesmo lado','Forma o teto do III ventrículo','Liga os corpos mamilares ao tálamo'],'É uma trave de substância cinzenta que cruza o III ventrículo.'),'Está ausente em cerca de 30% das pessoas e não tem função relevante conhecida.','Em imagens, aparece como uma ponte de tecido no meio do III ventrículo, sem significado patológico.'),
 L(mc('diencefalo',2,'Pertencem ao telencéfalo, e não ao diencéfalo, a lâmina terminal e a:',['Comissura anterior','Comissura posterior','Glândula pineal','Aderência intertalâmica'],'Lâmina terminal e comissura anterior derivam da parte mediana da vesícula telencefálica.'),'Embora estejam nas paredes do III ventrículo, essas estruturas vêm do telencéfalo não evaginado.','A comissura anterior serve de referência (linha CA-CP) para cortes axiais de ressonância e para neurocirurgia estereotáxica.'),
 L(vf('diencefalo',2,'Julgue sobre o tálamo.',[['A face lateral do tálamo é separada do telencéfalo pela cápsula interna.',true],['A face medial forma a maior parte da parede lateral do III ventrículo.',true],['O pulvinar é a extremidade anterior do tálamo.',false],['Parte da face superior forma o assoalho do ventrículo lateral.',true]],'O pulvinar é posterior; a extremidade anterior é o tubérculo anterior.'),'O tálamo tem tubérculo anterior, pulvinar posterior, face medial ventricular e face lateral junto à cápsula interna.','Hemorragias talâmicas podem invadir o III ventrículo ou o ventrículo lateral e comprimir a cápsula interna.'),
 L(as('diencefalo',2,'Associe o corpo geniculado à sua via.',[['Corpo geniculado lateral','Via óptica'],['Corpo geniculado medial','Via auditiva'],['Braço do colículo superior','Liga o colículo superior ao geniculado lateral'],['Braço do colículo inferior','Liga o colículo inferior ao geniculado medial']],'Lateral com luz, medial com música.'),'Os corpos geniculados formam o metatálamo e ficam sob o pulvinar.','Lesão do geniculado lateral causa hemianopsia homônima contralateral.'),
 L(mc('diencefalo',2,'Entre o quiasma óptico e os corpos mamilares, no assoalho do III ventrículo, fica o:',['Túber cinéreo','Trígono da habênula','Tubérculo anterior','Pulvinar'],'O túber cinéreo é uma área cinzenta onde se prende o infundíbulo.'),'De frente para trás: quiasma, infundíbulo (preso ao túber cinéreo) e corpos mamilares.','Hamartomas do túber cinéreo podem causar puberdade precoce e crises gelásticas (de riso).'),
 L(gp('diencefalo',2,'A parte superior dilatada do infundíbulo, no túber cinéreo, é chamada eminência ____.',['mediana'],'A eminência mediana é onde hormônios hipotalâmicos entram no sistema porta-hipofisário.'),'A extremidade inferior do infundíbulo continua com o lobo nervoso da neuro-hipófise.','A eminência mediana fica fora da barreira hematoencefálica, permitindo a troca de hormônios com o sangue.'),
 L(cs('diencefalo',2,'Homem de 45 anos com cefaleia e dificuldade para ver objetos dos lados, batendo nas portas. A campimetria mostra perda dos dois campos temporais. Qual estrutura está comprimida?',['Quiasma óptico','Trato óptico direito','Corpo geniculado lateral','Radiação óptica'],'Hemianopsia bitemporal: lesão do quiasma.'),'As fibras das hemirretinas nasais, que cruzam no quiasma, levam a visão dos campos temporais. Um tumor de hipófise que cresce para cima as comprime.','A ressonância de sela confirma o adenoma; o tratamento pode ser cirúrgico ou medicamentoso, conforme o tipo.'),
 L(mc('diencefalo',2,'Fazem parte do epitálamo:',['Glândula pineal e trígonos das habênulas','Corpos mamilares e túber cinéreo','Pulvinar e corpos geniculados','Núcleo subtalâmico e zona incerta'],'O epitálamo forma a parede posterior do III ventrículo.'),'Pineal, comissura posterior, comissura e trígonos das habênulas pertencem ao epitálamo.','A pineal costuma calcificar com a idade e servia de referência de linha média em radiografias de crânio.'),
 L(ar('diencefalo',2,'A comissura posterior marca o limite entre mesencéfalo e diencéfalo.','Ela fica no ponto em que o aqueduto cerebral se abre no III ventrículo.',0,'A posição explica por que serve de limite.'),'A comissura posterior fica logo abaixo da base da pineal; a comissura das habênulas, logo acima.','Lesões nessa área, como tumores da pineal, afetam o olhar vertical por atingir centros vizinhos.'),
 L(mc('diencefalo',2,'O subtálamo só é bem visto:',['Em cortes frontais do cérebro','Na face medial do hemisfério','Na base do encéfalo intacto','Na vista dorsal do tronco'],'Ele não se relaciona com as paredes do III ventrículo.'),'Fica abaixo do tálamo, entre a cápsula interna e o hipotálamo, na transição com o tegmento do mesencéfalo.','O núcleo subtalâmico é alvo de estimulação cerebral profunda na doença de Parkinson.'),
 L(cs('diencefalo',3,'Idoso hipertenso desenvolve, de repente, movimentos amplos e violentos de arremesso no braço esquerdo. Onde é mais provável a lesão?',['Núcleo subtalâmico direito','Núcleo subtalâmico esquerdo','Cerebelo esquerdo','Pulvinar direito'],'Hemibalismo contralateral à lesão do núcleo subtalâmico.'),'O núcleo subtalâmico faz parte dos circuitos dos núcleos da base. Lesado, perde-se um freio sobre o movimento e surgem os arremessos do lado oposto.','Costuma melhorar em semanas; quando não, usam-se bloqueadores de dopamina.'),
 L(mc('diencefalo',2,'O teto do III ventrículo é formado pela tela corioide, que se insere lateralmente nas:',['Estrias medulares do tálamo','Estrias medulares do IV ventrículo','Estrias terminais','Fímbrias do hipocampo'],'A tela corioide prende-se às estrias medulares do tálamo e, atrás, à comissura das habênulas.'),'Dela pendem os plexos corioides do III ventrículo, em duas faixas paralelas, contínuos com os dos ventrículos laterais.','Tumores do plexo corioide podem produzir liquor em excesso e causar hidrocefalia.'),
 L(ar('diencefalo',3,'Os corpos mamilares pertencem ao diencéfalo.','Eles ficam no limite posterior da fossa interpeduncular, que pertence ao mesencéfalo.',2,'A asserção é verdadeira; a razão é falsa, porque os corpos mamilares limitam a fossa anteriormente.'),'Os corpos mamilares são parte do hipotálamo e fecham a fossa interpeduncular pela frente.','Lesões dos corpos mamilares por falta de tiamina participam da síndrome de Wernicke-Korsakoff.'),
 L(od('diencefalo',1,'Ordene as estruturas do assoalho do III ventrículo, de anterior para posterior.',['Quiasma óptico','Infundíbulo','Túber cinéreo','Corpos mamilares'],'Do quiasma aos corpos mamilares.'),'Todas pertencem ao hipotálamo, exceto o quiasma, que é via óptica, mas está no assoalho.','Na base do encéfalo, essa sequência ajuda a localizar a hipófise e o hipotálamo em peças e imagens.'),
 L(mc('diencefalo',2,'O forame interventricular é delimitado, em parte, pelo:',['Tubérculo anterior do tálamo','Pulvinar','Corpo mamilar','Trígono da habênula'],'O tubérculo anterior do tálamo e o fórnice delimitam o forame interventricular.'),'O forame liga cada ventrículo lateral ao III ventrículo, e por ele os plexos corioides são contínuos.','Cistos coloides no teto do III ventrículo podem fechar os dois forames de uma vez e causar hidrocefalia aguda e morte súbita.'),
 L(mc('diencefalo',3,'Um dos limites laterais do subtálamo, visto em corte frontal, é a:',['Cápsula interna','Cápsula externa','Fissura transversa','Lâmina terminal'],'Lateral: cápsula interna; medial: hipotálamo; acima: tálamo.'),'O subtálamo é zona de transição com o tegmento do mesencéfalo e contém o núcleo subtalâmico e a zona incerta.','Infartos lacunares podem atingir juntos a cápsula interna e o subtálamo, mesclando déficit motor e movimentos involuntários.'),
 L(gp('diencefalo',1,'O hormônio produzido pela glândula pineal é a ____.',['melatonina'],'A melatonina participa da regulação do ciclo sono-vigília.'),'A secreção cresce no escuro, sob controle de vias que passam pelo hipotálamo e pelo simpático.','A melatonina é usada em alguns distúrbios do sono e no jet lag.')
);

/* Capítulo 7 — Telencéfalo: macroscopia */
LESSON.telencefalo=[
 {t:'Hemisférios, polos e faces',b:[
  ['p','O telencéfalo compreende os dois **hemisférios cerebrais** e a **lâmina terminal**. Os hemisférios se unem pelo **corpo caloso** e têm cavidades, os **ventrículos laterais**, que se abrem no III ventrículo pelos forames interventriculares.'],
  ['ul',['**Três polos:** frontal, occipital e temporal.','**Três faces:** superolateral (convexa), medial (plana) e inferior ou base (irregular, apoiada nas fossas anterior e média e no tentório).']],
  ['p','Os **sulcos** delimitam os **giros** e permitem aumentar muito a superfície sem aumentar o volume: cerca de **dois terços** do córtex ficam escondidos dentro dos sulcos. Muitos sulcos variam de pessoa para pessoa; vale estudar mais de um hemisfério.']]},
 {t:'Sulcos lateral e central e os lobos',b:[
  ['p','Os dois sulcos mais importantes de cada hemisfério:'],
  ['ul',['**Sulco lateral** (de Sylvius): começa na base entre os lobos frontal e temporal, sobe à face lateral e se divide em ramos **anterior** e **ascendente** (curtos, no lobo frontal) e **posterior** (longo, termina no lobo parietal).','**Sulco central** (de Rolando): começa na face medial, perto do meio da borda superior, e desce obliquamente para a frente quase até o sulco lateral. Separa frontal e parietal e fica entre o **giro pré-central** (motor) e o **giro pós-central** (sensitivo).']],
  ['fig','telLobos','Lobos do hemisfério esquerdo e seus limites.'],
  ['p','Os lobos recebem o nome dos ossos vizinhos: **frontal, parietal, temporal e occipital**. A **ínsula** fica no fundo do sulco lateral, sem contato com o osso. Na face lateral, o limite do lobo occipital é uma linha imaginária do sulco parieto-occipital até a **incisura pré-occipital** (cerca de 4 cm do polo occipital).'],
  ['key','A divisão em lobos é útil na clínica, mas **não é funcional**, com uma exceção: o lobo occipital inteiro serve à visão.']]},
 {t:'Face superolateral, giro a giro',b:[
  ['fig','telLatSulcos','Sulcos da face superolateral.'],['fig','telLateral','Giros da face superolateral.'],
  ['tbl',[['Lobo','Sulcos','Giros'],['Frontal','Pré-central, frontal superior e frontal inferior','Pré-central (motor), frontal superior, médio e inferior (partes orbital, triangular e opercular)'],['Parietal','Pós-central e intraparietal','Pós-central (somestésico), lóbulo parietal superior e inferior (giros supramarginal e angular)'],['Temporal','Temporal superior e inferior','Temporal superior, médio e inferior; temporais transversos no assoalho do sulco lateral'],['Occipital','Pequenos e inconstantes','Pequenos e irregulares na face lateral']]],
  ['p','O **giro frontal inferior** é dividido pelos ramos anterior e ascendente do sulco lateral em **parte orbital** (abaixo do anterior), **triangular** (entre os dois) e **opercular** (entre o ascendente e o sulco pré-central). No hemisfério esquerdo, ele é o **giro de Broca**, área da expressão da linguagem.'],
  ['p','O **supramarginal** se curva em volta da ponta do sulco lateral; o **angular**, em volta da ponta do sulco temporal superior. No assoalho do sulco lateral, o **giro temporal transverso anterior** abriga a área da **audição**.'],
  ['chk','O giro angular contorna a extremidade do:',['Sulco lateral','Sulco temporal superior','Sulco intraparietal'],1,'O supramarginal contorna o sulco lateral; o angular, o temporal superior.']]},
 {t:'Ínsula',b:[
  ['p','Afastando os lábios do sulco lateral aparece uma fossa com a **ínsula** no fundo. Ela cresceu menos que os lobos vizinhos durante o desenvolvimento e foi coberta por eles (os **opérculos** frontal, parietal e temporal).'],
  ['ul',['**Sulco circular**, que contorna a ínsula.','**Sulco central da ínsula**, que separa os **giros curtos** (à frente) do **giro longo** (atrás).']]]},
 {t:'Face medial: corpo caloso, fórnice e septo',b:[
  ['p','A face medial só aparece por inteiro num corte sagital mediano, que expõe também o diencéfalo e as formações entre os hemisférios.'],
  ['fig','telMedial','Face medial do hemisfério.'],
  ['ul',['**Corpo caloso:** maior comissura; liga áreas simétricas dos dois córtices. Partes: **rostro**, **joelho**, **tronco** e **esplênio**. O rostro termina na **comissura anterior**.','**Lâmina terminal:** entre a comissura anterior e o quiasma; une os hemisférios e fecha o III ventrículo à frente.','**Fórnice:** duas metades que se unem no **corpo** sob o corpo caloso e se separam nas **colunas** (à frente, até os corpos mamilares) e nas **pernas** (atrás, até o hipocampo no corno inferior).','**Septo pelúcido:** duas lâminas finas entre corpo caloso e fórnice; separa os ventrículos laterais.']],
  ['chk','As colunas do fórnice terminam:',['No hipocampo','Nos corpos mamilares','Na comissura anterior'],1,'As colunas descem pela parede do III ventrículo até os corpos mamilares.']]},
 {t:'Face medial: sulcos e giros',b:[
  ['ul',['**Sulco calcarino:** do esplênio ao polo occipital; seus lábios têm a **área visual primária** (área estriada, com a **estria de Gennari** visível a olho nu).','**Sulco parieto-occipital:** profundo; separa parietal e occipital e encontra o calcarino em ângulo agudo.','**Cúneo:** triângulo entre os dois.','**Giro lingual** (occipitotemporal medial): abaixo do calcarino, continua à frente com o para-hipocampal.','**Sulco do corpo caloso** e **sulco do cíngulo**, paralelos; entre eles, o **giro do cíngulo**.','O sulco do cíngulo termina no **ramo marginal**, que sobe à borda, e no **sulco subparietal**.','**Lóbulo paracentral:** entre o sulco paracentral e o ramo marginal; o sulco central termina no meio dele. Contém as áreas motora (frente) e sensitiva (trás) da **perna e do pé**.','**Área septal:** abaixo do rostro, à frente da lâmina terminal; um dos centros do prazer.']],
  ['clin','Lesão do lóbulo paracentral (por exemplo, oclusão da artéria cerebral anterior) causa fraqueza e alteração sensitiva predominando na **perna** do lado oposto.'],
  ['chk','O cúneo fica entre os sulcos:',['Calcarino e colateral','Parieto-occipital e calcarino','Do cíngulo e do corpo caloso'],1,'O cúneo é o triângulo entre o parieto-occipital e o calcarino.']]},
 {t:'Face inferior e lobo límbico',b:[
  ['fig','telBase','Base do encéfalo.'],
  ['p','Na face inferior do lobo temporal há três sulcos longitudinais, de lateral para medial: **occipitotemporal**, **colateral** e **do hipocampo**. Entre eles ficam o **giro occipitotemporal lateral (fusiforme)** e o **giro para-hipocampal**, cuja ponta anterior se curva em gancho, o **unco**.'],
  ['p','O **sulco rinal** e a parte anterior do colateral separam o córtex antigo (paleocórtex), medial, do neocórtex, lateral. A parte anterior do para-hipocampal é a **área entorrinal**, importante para a memória e uma das primeiras atingidas na **doença de Alzheimer**.'],
  ['key','**Unco + giro para-hipocampal + istmo + giro do cíngulo** formam um anel contínuo em volta das estruturas entre os hemisférios: o **lobo límbico**.'],
  ['p','Na face inferior do lobo frontal há um sulco importante, o **sulco olfatório**, com o **giro reto** medial a ele e os **giros orbitários** lateralmente. No sulco ficam o **bulbo** e o **trato olfatório**; o trato se divide nas **estrias olfatórias** lateral e medial, que limitam o **trígono olfatório**. Atrás dele fica a **substância perfurada anterior**. Essas estruturas formam o **rinencéfalo**.'],
  ['chk','O unco é a extremidade anterior do:',['Giro do cíngulo','Giro para-hipocampal','Giro fusiforme'],1,'O unco se curva em volta do fim do sulco do hipocampo.']]},
 {t:'Ventrículos laterais',b:[
  ['fig','ventriculos','Ventrículos em projeção lateral.'],
  ['p','Cada ventrículo lateral tem uma **parte central** e três **cornos**, um para cada polo: **anterior** (frontal), **posterior** (occipital) e **inferior** (temporal). É fechado, exceto pelo **forame interventricular**. Com exceção do corno inferior, o teto é o **corpo caloso**.'],
  ['tbl',[['Parte','Paredes e relevos'],['Corno anterior','Parede medial: septo pelúcido. Assoalho e parede lateral: cabeça do núcleo caudado'],['Parte central','Teto: corpo caloso. Assoalho: fórnice, plexo corioide, face superior do tálamo, estria terminal e núcleo caudado'],['Trígono colateral','Onde a parte central se divide em corno posterior e inferior'],['Corno posterior','Paredes de fibras do corpo caloso; bulbo do corno posterior e calcar avis'],['Corno inferior','Teto: cauda do caudado, estria terminal e amígdala. Assoalho: hipocampo e eminência colateral']]],
  ['p','O **hipocampo** é uma elevação curva de córtex antigo (arquicórtex) no assoalho do corno inferior. Liga-se ao fórnice pela **fímbria**; ao longo da fímbria corre o **giro denteado**; o **subículo** faz a transição para o para-hipocampal.'],
  ['key','Os **plexos corioides** dos ventrículos laterais estão na parte central e no corno inferior, contínuos com os do III ventrículo. Os cornos **anterior e posterior não têm plexo**.'],
  ['chk','Qual parte do ventrículo lateral não tem o corpo caloso como teto?',['Corno anterior','Parte central','Corno inferior'],2,'O teto do corno inferior é a substância branca do lobo temporal.']]},
 {t:'Organização interna dos hemisférios',b:[
  ['p','Como no cerebelo, cada hemisfério tem **córtex** por fora, **centro branco medular** por dentro e **núcleos da base** mergulhados nele.'],
  ['ul',['**Núcleo caudado:** cabeça (no corno anterior), corpo e cauda arqueada até o corno inferior; por isso aparece duas vezes em alguns cortes.','**Núcleo lentiforme:** dividido em **putame** (lateral, maior) e **globo pálido** (medial, mais claro, com porções lateral e medial).','**Claustro:** lâmina fina entre a ínsula e o putame; **cápsula extrema** o separa da ínsula e **cápsula externa**, do putame.','**Corpo amigdaloide:** cerca de 2 cm, no polo temporal, junto à cauda do caudado; ligado ao medo e às emoções.','**Núcleo accumbens:** na união do putame com a cabeça do caudado; área de prazer.']],
  ['p','O centro branco tem **fibras de projeção** (córtex com estruturas abaixo dele) e **de associação** (córtex com córtex). As que cruzam a linha média são as **comissuras**: corpo caloso, comissura anterior e comissura do fórnice.'],
  ['p','A **cápsula interna** concentra quase todas as fibras que entram e saem do córtex. Tem **perna anterior** (entre a cabeça do caudado e o lentiforme), **joelho** e **perna posterior** (entre o lentiforme e o tálamo). Acima dos núcleos, abre-se na **coroa radiada**.'],
  ['ol',['Córtex da ínsula','Cápsula extrema','Claustro','Cápsula externa','Putame','Globo pálido lateral','Globo pálido medial','Cápsula interna','Tálamo','III ventrículo']],
  ['key','Essa sequência, de lateral para medial num corte horizontal, é uma das mais cobradas em prova prática.']]},
 {t:'Peso do encéfalo',b:[
  ['p','O peso do encéfalo depende do peso corporal e da complexidade, expressa pelo **coeficiente de encefalização**, que no ser humano é cerca de **quatro vezes** o do chimpanzé. Não há diferença desse coeficiente entre grupos étnicos.'],
  ['ul',['Adulto brasileiro: cerca de **1.300 g** no homem e **1.200 g** na mulher (diferença ligada ao peso corporal).','Cérebro: cerca de 85% do peso; cerebelo: 10%; tronco: menos de 10%.','Acima de cerca de 900 g, o peso não se correlaciona com inteligência.']]]}
];
RESUMO.telencefalo={pts:['Telencéfalo: dois hemisférios + lâmina terminal; unidos pelo corpo caloso.','Sulco lateral: ramos anterior, ascendente e posterior. Sulco central: entre giros pré-central (motor) e pós-central (sensitivo).','Lobos: frontal, parietal, temporal, occipital e ínsula; só o occipital tem função única (visão).','Giro frontal inferior: partes orbital, triangular e opercular; à esquerda é o giro de Broca.','Lóbulo parietal inferior: supramarginal (fim do sulco lateral) e angular (fim do temporal superior).','Face medial: corpo caloso (rostro, joelho, tronco, esplênio), fórnice (colunas, corpo, pernas), septo pelúcido.','Calcarino: área visual; parieto-occipital; cúneo entre eles; lóbulo paracentral = perna e pé.','Base: sulcos occipitotemporal, colateral e do hipocampo; para-hipocampal com unco; área entorrinal.','Lobo límbico: unco, para-hipocampal, istmo e cíngulo.','Ventrículo lateral: parte central e cornos anterior, posterior e inferior; cornos anterior e posterior sem plexo.','Corte horizontal, lateral para medial: ínsula, cápsula extrema, claustro, cápsula externa, putame, pálido, cápsula interna, tálamo.'],
 clin:['Lesão do giro de Broca (esquerdo): afasia de expressão.','Lesão do lóbulo paracentral: déficit motor e sensitivo da perna oposta.','Área entorrinal: uma das primeiras lesadas no Alzheimer.','Unco pode herniar pela incisura do tentório e comprimir o III nervo e o mesencéfalo.']};
QB.push(
 L(mc('telencefalo',1,'Cerca de quanto do córtex cerebral fica escondido dentro dos sulcos?',['Dois terços','Um décimo','Um terço','Nove décimos'],'Cerca de dois terços.'),'Os sulcos aumentam a superfície sem aumentar o volume, permitindo que um córtex de cerca de 1.100 cm² caiba no crânio.','Nas imagens, lesões corticais pequenas podem ficar no fundo de um sulco e ser difíceis de ver.'),
 L(mc('telencefalo',2,'O sulco central separa:',['Lobo frontal do parietal','Lobo parietal do occipital','Lobo temporal do frontal','Lobo frontal da ínsula'],'O sulco central fica entre o giro pré-central (frontal) e o pós-central (parietal).'),'Ele começa na face medial e desce obliquamente para a frente quase até o sulco lateral, do qual é separado por uma pequena prega.','Na cirurgia, a identificação do sulco central é crítica para evitar déficit motor; usa-se mapeamento cortical.'),
 L(as('telencefalo',2,'Associe a parte do giro frontal inferior ao seu limite.',[['Parte orbital','Abaixo do ramo anterior do sulco lateral'],['Parte triangular','Entre os ramos anterior e ascendente'],['Parte opercular','Entre o ramo ascendente e o sulco pré-central'],['Giro de Broca','Giro frontal inferior esquerdo']],'Os ramos do sulco lateral dividem o giro frontal inferior.'),'As partes triangular e opercular do lado esquerdo correspondem à área de Broca na maioria das pessoas.','AVC nessa área causa afasia de expressão: fala lenta e com esforço, compreensão relativamente preservada.'),
 L(mc('telencefalo',2,'A área da audição fica no:',['Giro temporal transverso anterior','Giro angular','Giro temporal inferior','Giro supramarginal'],'Os giros temporais transversos ficam no assoalho do sulco lateral.'),'Afastando os lábios do sulco lateral, vê-se o assoalho, parte do giro temporal superior, cruzado pelos giros temporais transversos. O anterior é a área auditiva primária.','Como a via auditiva é bilateral, lesão de uma área auditiva não causa surdez de um ouvido.'),
 L(ar('telencefalo',2,'A ínsula fica escondida no fundo do sulco lateral.','Durante o desenvolvimento ela cresce menos que os lobos vizinhos e é recoberta por eles.',0,'O crescimento menor explica a posição profunda.'),'Os lobos frontal, parietal e temporal crescem sobre a ínsula e formam os opérculos. A ínsula tem giros curtos e um longo, separados pelo sulco central da ínsula.','A ínsula participa de sensações viscerais, gustação e dor; infartos da artéria cerebral média frequentemente a atingem.'),
 L(gp('telencefalo',2,'Na face lateral, o limite anterior do lobo occipital é uma linha que vai do sulco parieto-occipital até a incisura ____.',['pré-occipital','pre-occipital','preoccipital'],'A incisura pré-occipital fica cerca de 4 cm à frente do polo occipital.'),'Na face medial, o limite é o próprio sulco parieto-occipital. Na lateral o limite é imaginário.','Lesões occipitais causam déficits visuais, como hemianopsia homônima contralateral.'),
 L(mc('telencefalo',2,'O lóbulo paracentral é delimitado pelo sulco paracentral e pelo:',['Ramo marginal do sulco do cíngulo','Sulco calcarino','Sulco parieto-occipital','Sulco do corpo caloso'],'O ramo marginal sobe à borda superior atrás do lóbulo.'),'O sulco central termina perto do meio do lóbulo paracentral; a frente é motora e a parte de trás é sensitiva, ambas para perna e pé.','Oclusão da artéria cerebral anterior atinge o lóbulo paracentral: fraqueza da perna contralateral, às vezes com incontinência urinária.'),
 L(vf('telencefalo',2,'Julgue sobre o fórnice.',[['As colunas terminam nos corpos mamilares.',true],['As pernas se ligam ao hipocampo no corno inferior.',true],['O fórnice é uma fibra de associação que cruza a linha média.',false],['O septo pelúcido fica entre o corpo caloso e o fórnice.',true]],'O fórnice é um feixe de projeção que liga o hipocampo ao corpo mamilar.'),'As duas metades se unem no corpo do fórnice sob o corpo caloso; nas extremidades se afastam como colunas (anterior) e pernas (posterior). A comissura do fórnice une as pernas.','Lesão bilateral do fórnice, por exemplo em cirurgias do III ventrículo, pode causar amnésia anterógrada.'),
 L(as('telencefalo',2,'Associe a parte do corpo caloso à posição.',[['Rostro','Afila-se e termina na comissura anterior'],['Joelho','Curva anterior'],['Tronco','Arco superior'],['Esplênio','Extremidade posterior espessa']],'Da frente para trás: rostro, joelho, tronco e esplênio.'),'O corpo caloso é a maior comissura; suas fibras penetram no centro branco e unem áreas simétricas.','Lesões do esplênio podem causar alexia sem agrafia, quando combinadas a lesão occipital esquerda.'),
 L(mc('telencefalo',2,'O sulco que separa o giro para-hipocampal do giro occipitotemporal lateral é o:',['Sulco colateral','Sulco do hipocampo','Sulco occipitotemporal','Sulco rinal'],'Da borda lateral para a medial: occipitotemporal, colateral e do hipocampo.'),'Entre occipitotemporal e colateral fica o fusiforme; medialmente ao colateral, o para-hipocampal. O sulco do hipocampo separa o para-hipocampal do unco.','O giro fusiforme participa do reconhecimento de faces; lesões bilaterais podem causar prosopagnosia.'),
 L(as('telencefalo',3,'Associe os componentes do lobo límbico.',[['Unco','Gancho anterior do para-hipocampal'],['Giro para-hipocampal','Face inferomedial do lobo temporal'],['Istmo do giro do cíngulo','Liga cíngulo ao para-hipocampal'],['Giro do cíngulo','Acima do sulco do corpo caloso']],'O lobo límbico forma um anel em volta das estruturas inter-hemisféricas.'),'Esses giros formam uma faixa contínua ao redor do corpo caloso e do diencéfalo.','Doenças degenerativas e encefalites, como a herpética, atingem preferencialmente o lobo temporal medial.'),
 L(cs('telencefalo',3,'Idosa com perda progressiva de memória recente. A ressonância mostra atrofia precoce da parte anterior do giro para-hipocampal. Que área é essa?',['Área entorrinal','Área septal','Área estriada','Área de Broca'],'A parte anterior do para-hipocampal é a área entorrinal.'),'A área entorrinal faz a ponte entre o neocórtex e o hipocampo e é uma das primeiras lesadas na doença de Alzheimer.','A volumetria do lobo temporal medial ajuda no diagnóstico de doença de Alzheimer inicial.'),
 L(mc('telencefalo',2,'O bulbo e o trato olfatório ficam alojados no:',['Sulco olfatório','Sulco lateral','Giro reto','Sulco colateral'],'O sulco olfatório é o único sulco importante da face inferior do lobo frontal.'),'Medial a ele fica o giro reto; lateralmente, os giros orbitários.','Meningiomas do sulco olfatório causam perda do olfato e alterações de comportamento por compressão frontal.'),
 L(od('telencefalo',2,'Ordene as estruturas olfatórias, da periferia para dentro.',['Filamentos do nervo olfatório','Bulbo olfatório','Trato olfatório','Estrias olfatórias'],'Os filamentos atravessam a lâmina crivosa e chegam ao bulbo.'),'O trato se divide em estrias lateral e medial, que delimitam o trígono olfatório; atrás fica a substância perfurada anterior.','Fraturas da lâmina crivosa podem romper os filamentos e causar anosmia.'),
 L(mc('telencefalo',2,'A parede medial do corno anterior do ventrículo lateral é formada pelo:',['Septo pelúcido','Núcleo caudado','Fórnice','Tálamo'],'O septo pelúcido separa os cornos anteriores.'),'O assoalho e a parede lateral do corno anterior são a cabeça do caudado; o teto, o corpo caloso.','Na doença de Huntington, a atrofia da cabeça do caudado deixa os cornos anteriores arredondados e alargados.'),
 L(mc('telencefalo',2,'No assoalho do corno inferior do ventrículo lateral encontram-se:',['Hipocampo e eminência colateral','Cabeça do caudado e septo','Tálamo e estria terminal','Calcar avis e bulbo do corno'],'Hipocampo medial e eminência colateral lateral.'),'O teto do corno inferior tem a cauda do caudado, a estria terminal e, na ponta, a amígdala.','A esclerose do hipocampo é causa comum de epilepsia do lobo temporal resistente a remédios.'),
 L(ar('telencefalo',2,'Os cornos anterior e posterior do ventrículo lateral não têm plexo corioide.','Os plexos corioides dos ventrículos laterais produzem a maior parte do liquor.',1,'As duas são verdadeiras, mas a produção de liquor não explica onde o plexo está ausente.'),'O plexo da parte central continua com o do III ventrículo pelo forame interventricular e segue a curva do fórnice até o corno inferior.','O glômus do plexo no átrio costuma calcificar e aparece em tomografias de adultos.'),
 L(od('telencefalo',3,'Ordene as estruturas de lateral para medial num corte horizontal na altura do estriado.',['Córtex da ínsula','Cápsula extrema','Claustro','Cápsula externa','Putame','Globo pálido','Cápsula interna','Tálamo'],'Da ínsula ao tálamo, alternando cinzenta e branca.'),'A cápsula interna separa o lentiforme (lateral) do tálamo e do caudado (mediais).','Hemorragias hipertensivas do putame costumam atingir a cápsula interna vizinha e causar hemiplegia contralateral.'),
 L(mc('telencefalo',2,'A perna anterior da cápsula interna fica entre:',['Cabeça do caudado e núcleo lentiforme','Núcleo lentiforme e tálamo','Claustro e putame','Tálamo e III ventrículo'],'Perna anterior: caudado e lentiforme; posterior: lentiforme e tálamo.'),'As duas pernas se encontram no joelho. Acima dos núcleos, as fibras se abrem na coroa radiada.','A perna posterior concentra as fibras motoras para o corpo; lesões pequenas ali causam hemiplegia completa.'),
 L(ar('telencefalo',3,'O núcleo caudado pode aparecer seccionado duas vezes num mesmo corte frontal.','A cauda do caudado é longa e fortemente arqueada, acompanhando o ventrículo lateral até o corno inferior.',0,'A forma em arco explica o duplo aparecimento.'),'A cabeça e o corpo aparecem junto ao corno anterior e à parte central; a cauda reaparece no teto do corno inferior.','Saber disso evita confundir a cauda do caudado com lesão em cortes de ressonância.'),
 L(mc('telencefalo',2,'O peso médio do encéfalo do homem adulto brasileiro é de cerca de:',['1.300 g','900 g','1.800 g','2.200 g'],'Cerca de 1.300 g no homem e 1.200 g na mulher.'),'O cérebro responde por cerca de 85% do peso; o cerebelo, 10%. Acima de cerca de 900 g, peso não se correlaciona com inteligência.','A atrofia em doenças degenerativas reduz o peso e alarga sulcos e ventrículos.'),
 L(gp('telencefalo',2,'A estria branca visível a olho nu no córtex da área visual primária chama-se estria de ____.',['gennari'],'Por isso a área visual primária é chamada área estriada.'),'Ela fica nos lábios do sulco calcarino.','Lesões do córtex calcarino causam déficits de campo visual contralaterais, às vezes com preservação macular.')
);

/* Capítulo 8 — Meninges e liquor */
LESSON.meninges=[
 {t:'As três meninges',b:[
  ['p','O SNC é envolvido por **dura-máter**, **aracnoide** e **pia-máter**. A dura é a meninge espessa (**paquimeninge**); aracnoide e pia, que no embrião são um só folheto, formam a **leptomeninge**. Conhecê-las explica meningites, meningiomas, hematomas e o acesso cirúrgico ao SNC.'],
  ['tbl',[['','Dura-máter','Aracnoide','Pia-máter'],['Aspecto','Espessa, colágena, vascularizada e inervada','Fina, com trabéculas em teia','Delicada, colada ao tecido nervoso'],['Relação','Colada ao osso no crânio','Justaposta à dura','Desce até o fundo dos sulcos'],['Destaques','Pregas, seios venosos, cavo trigeminal','Cisternas e granulações','Membrana pio-glial e espaços perivasculares']]]]},
 {t:'Dura-máter do encéfalo',b:[
  ['p','No crânio a dura tem dois folhetos: o **externo (periosteal)**, colado aos ossos, e o **interno (meníngeo)**, que continua com a dura espinal. O folheto externo funciona como periósteo, mas **não forma osso**: fraturas da calota consolidam mal e falhas ósseas não se regeneram (o que evita calos irritando o encéfalo).'],
  ['ul',['Por estar colada ao osso, **não há espaço epidural no crânio**, ao contrário da medula. Ele só aparece quando um trauma descola a dura, formando um **hematoma extradural**.','A principal artéria da dura é a **meníngea média**, ramo da maxilar.','O encéfalo não tem receptores de dor; a **sensibilidade intracraniana está na dura e nos vasos**, que respondem pela maioria das cefaleias.']],
  ['fig','duraSeios','Pregas e seios da dura-máter.'],
  ['tbl',[['Prega','Onde fica'],['Foice do cérebro','Vertical, na fissura longitudinal, entre os hemisférios'],['Tentório do cerebelo','Transversal, entre lobos occipitais e cerebelo; borda livre anterior = incisura do tentório'],['Foice do cerebelo','Vertical, abaixo do tentório, entre os hemisférios cerebelares'],['Diafragma da sela','Horizontal, fecha a sela turca, com orifício para a haste hipofisária']]],
  ['key','O tentório divide o crânio em **supratentorial** e **infratentorial**, com quadros clínicos muito diferentes. A incisura do tentório abraça o **mesencéfalo** e fica perto dos nervos **III e IV**.'],
  ['p','Onde os folhetos se separam surgem cavidades: o **cavo trigeminal** (de Meckel), com o gânglio trigeminal, e os **seios da dura-máter**.']]},
 {t:'Seios da dura-máter',b:[
  ['p','São canais venosos revestidos de endotélio entre os dois folhetos, de paredes rígidas que não colabam. Recebem o sangue do encéfalo e do olho e o levam às **veias jugulares internas**. Comunicam-se com veias de fora do crânio pelas **veias emissárias**.'],
  ['tbl',[['Seio','Trajeto'],['Sagital superior','Borda de inserção da foice; termina na confluência dos seios'],['Sagital inferior','Borda livre da foice; termina no seio reto'],['Reto','União da foice com o tentório; recebe sagital inferior e veia cerebral magna'],['Transverso','Inserção do tentório no occipital, da confluência à parte petrosa'],['Sigmoide','Continua o transverso até o forame jugular; drena quase todo o crânio'],['Occipital','Inserção da foice do cerebelo'],['Cavernoso','Dos lados da sela turca'],['Petroso superior e inferior','Do cavernoso ao sigmoide e à jugular']]],
  ['p','O **seio cavernoso** é atravessado pela **artéria carótida interna** e pelo **nervo abducente**; na parede lateral passam **oculomotor, troclear e oftálmico** (V1). Ele recebe as veias oftálmicas e se comunica com o do outro lado pelos seios intercavernosos.'],
  ['clin','**Aneurisma da carótida no seio cavernoso** comprime primeiro o VI. A **fístula carótido-cavernosa** inverte o fluxo das veias oftálmicas e causa **exoftalmia pulsátil**. Infecções da face (região do nariz) podem chegar ao seio cavernoso pela veia angular e veias oftálmicas e causar trombose.'],
  ['chk','Qual nervo atravessa o seio cavernoso junto à carótida, e não na parede lateral?',['Oculomotor','Abducente','Troclear'],1,'O VI passa por dentro do seio; III, IV e V1 vão na parede lateral.']]},
 {t:'Aracnoide, cisternas e granulações',b:[
  ['p','A aracnoide acompanha a dura e só grosseiramente o encéfalo; a pia segue cada sulco. Por isso o **espaço subaracnóideo** tem profundidade variável e forma dilatações cheias de liquor, as **cisternas**.'],
  ['fig','liquorCirc','Ventrículos, cisternas e trajeto do liquor.'],
  ['tbl',[['Cisterna','Localização'],['Magna (cerebelobulbar)','Entre cerebelo e bulbo; a maior; liga-se ao IV ventrículo pela abertura mediana'],['Pontina','À frente da ponte'],['Interpeduncular','Na fossa interpeduncular'],['Quiasmática','À frente do quiasma'],['Superior (da veia cerebral magna)','Atrás do teto do mesencéfalo; corresponde à cisterna ambiens'],['Da fossa lateral','No sulco lateral']]],
  ['p','As **granulações aracnóideas** são tufos de aracnoide que entram nos seios, sobretudo no **sagital superior**. Nelas o liquor fica separado do sangue só pelo endotélio e por uma camada fina de aracnoide e passa para o sangue em grandes vacúolos. No idoso podem crescer e calcificar (**corpos de Pacchioni**), marcando a calota.'],
  ['clin','A **punção suboccipital** entra na cisterna magna, entre o occipital e o atlas, quando não é possível a punção lombar.']]},
 {t:'Pia-máter e espaços perivasculares',b:[
  ['p','A pia adere ao tecido nervoso e recebe prolongamentos de astrócitos, formando a **membrana pio-glial**. Dá resistência ao tecido, que é muito mole.'],
  ['p','Ela acompanha os vasos que penetram no tecido, formando a parede externa dos **espaços perivasculares**, prolongamentos do espaço subaracnóideo com liquor. Esse manguito amortece a pulsação das artérias. Mais adentro, as arteríolas pequenas ficam envolvidas pelos pés vasculares dos astrócitos.']]},
 {t:'Liquor: funções e características',b:[
  ['p','O liquor (líquido cerebrospinal) é aquoso e incolor e ocupa ventrículos e espaço subaracnóideo.'],
  ['ul',['**Proteção mecânica:** pelo empuxo, um encéfalo de 1.500 g "pesa" cerca de 50 g flutuando no liquor.','**Meio químico estável** para neurônios e glia, mesmo quando o plasma varia.','**Excreção** de metabólitos; os espaços intersticiais aumentam cerca de 60% durante o sono, facilitando a limpeza.','**Comunicação** química entre regiões, por exemplo hormônios hipotalâmicos.']],
  ['tbl',[['Parâmetro','Normal no adulto'],['Aspecto','Límpido e incolor'],['Leucócitos','0 a 4 por mm³; sem hemácias'],['Pressão (lombar, decúbito lateral)','5 a 20 cm de água'],['Proteínas','Cerca de 25 mg/dL (bem menor que no plasma)'],['Glicose','Cerca de dois terços da glicemia'],['Cloretos','120 a 130 mEq/L (maior que no plasma)'],['Volume','Cerca de 150 mL; renovado a cada 8 horas'],['Produção','Cerca de 500 mL por dia']]],
  ['clin','O exame do liquor é decisivo no diagnóstico das **meningites** e das **hemorragias subaracnóideas**.']]},
 {t:'Formação, circulação e absorção',b:[
  ['p','O liquor é **secretado ativamente** pelos **plexos corioides** (dobras de pia, vasos e epêndima modificado), com transporte de Na⁺ e Cl⁻ que arrasta água. Por isso sua composição difere da do plasma. Os plexos dos **ventrículos laterais** produzem a maior parte.'],
  ['ol',['Ventrículos laterais','Forames interventriculares','III ventrículo','Aqueduto cerebral','IV ventrículo','Aberturas mediana e laterais','Cisternas e espaço subaracnóideo','Granulações aracnóideas','Seio sagital superior']],
  ['p','Como as granulações predominam no seio sagital superior, o liquor sobe pelo espaço subaracnóideo, **passando entre a incisura do tentório e o mesencéfalo**. Na medula ele desce e parte é absorvida em granulações das bainhas das raízes. O movimento depende da produção numa ponta, da absorção na outra e da pulsação arterial.'],
  ['chk','O liquor chega ao espaço subaracnóideo saindo do:',['III ventrículo','IV ventrículo','Aqueduto cerebral'],1,'As aberturas mediana e laterais ficam no IV ventrículo.']]},
 {t:'Hidrocefalia e hipertensão intracraniana',b:[
  ['p','Na **hidrocefalia** há mais liquor e mais pressão, com ventrículos dilatados. No feto e no lactente as suturas abertas deixam a cabeça crescer; no adulto a pressão sobe rápido, com cefaleia, vômitos, herniação, coma e morte se não houver tratamento.'],
  ['tbl',[['Obstrução em','Ventrículos dilatados'],['Forame interventricular','Só o ventrículo lateral daquele lado'],['Aqueduto cerebral','Laterais e III; IV normal'],['Aberturas do IV ventrículo','Todo o sistema'],['Incisura do tentório','Todo o sistema']]],
  ['p','Hidrocefalias **comunicantes** vêm de produção excessiva ou absorção deficiente (plexos, seios, granulações). As **não comunicantes** (obstrutivas) são mais frequentes. O tratamento pode ser a **derivação ventriculoperitoneal** ou a **terceiroventriculostomia endoscópica** (abrir o assoalho do III ventrículo para as cisternas da base).'],
  ['p','A cavidade craniovertebral é fechada: qualquer volume a mais (tumor, hematoma, edema) aumenta a pressão de todo o conteúdo. Os sinais típicos são **cefaleia** e **vômitos**. O espaço subaracnóideo envolve o nervo óptico; a pressão alta comprime a veia central da retina e causa **papiledema**, visto no fundo de olho.'],
  ['chk','Estenose do aqueduto cerebral dilata:',['Todos os ventrículos','Ventrículos laterais e III, com IV normal','Apenas o IV ventrículo'],1,'O bloqueio fica entre o III e o IV ventrículo.']]},
 {t:'Hérnias intracranianas',b:[
  ['p','As pregas da dura criam compartimentos. Uma massa num deles empurra tecido para o vizinho:'],
  ['fig','hernias','Hérnias do cíngulo, do unco e das tonsilas.'],
  ['ul',['**Giro do cíngulo** sob a borda da foice, para o outro lado.','**Unco** pela incisura do tentório, comprimindo o mesencéfalo: primeiro **midríase** do mesmo lado com reação lenta à luz, depois olho desviado para fora (III), **hemiparesia** do lado oposto (pedúnculo) e **coma** por lesão das estruturas que ativam o córtex.','**Tonsilas** do cerebelo pelo forame magno, comprimindo o **bulbo**: parada respiratória e circulatória.']],
  ['clin','Nunca se faz punção lombar com suspeita de hipertensão intracraniana sem antes ver o fundo de olho ou uma imagem: a queda súbita da pressão espinal pode puxar as tonsilas para o forame magno.']]},
 {t:'Hematomas, hemorragia e meningioma',b:[
  ['fig','hematomas','Onde o sangue se acumula em cada tipo de sangramento.'],
  ['tbl',[['','Extradural','Subdural','Subaracnóidea'],['Onde','Entre osso e dura','Entre dura e aracnoide','No liquor'],['Causa típica','Fratura com lesão da artéria meníngea média','Ruptura de veias em ponte','Aneurisma, malformação arteriovenosa, trauma'],['Evolução','Rápida, mortal em horas sem drenagem','Lenta, quadro subagudo','Súbita, cefaleia muito intensa'],['Imagem','Lente biconvexa','Crescente','Sangue nas cisternas e sulcos']]],
  ['p','O **meningioma** nasce das meninges, é o tumor primário mais comum do SNC, mais frequente em mulheres adultas, em geral benigno e de crescimento lento. Os sintomas dependem da compressão; o tratamento é a retirada cirúrgica.'],
  ['chk','Hematoma em forma de lente biconvexa após fratura temporal sugere lesão de:',['Veias em ponte','Artéria meníngea média','Seio cavernoso'],1,'O sangue arterial descola a dura do osso: hematoma extradural.']]}
];
RESUMO.meninges={pts:['Dura-máter (paquimeninge); aracnoide e pia (leptomeninge).','Dura craniana: folheto externo (periosteal, sem capacidade osteogênica) e interno (continua com a dura espinal).','Não há espaço epidural no crânio; dura irrigada pela meníngea média; dor intracraniana vem da dura e dos vasos.','Pregas: foice do cérebro, tentório do cerebelo (incisura do tentório), foice do cerebelo, diafragma da sela.','Seios: sagital superior e inferior, reto, transverso, sigmoide, occipital, cavernoso, petrosos; confluência dos seios.','Seio cavernoso: carótida interna e VI por dentro; III, IV e V1 na parede lateral.','Cisternas: magna, pontina, interpeduncular, quiasmática, superior e da fossa lateral.','Liquor: 150 mL, 500 mL por dia, pressão 5 a 20 cmH2O, 0 a 4 leucócitos, glicose 2/3 da glicemia, proteínas cerca de 25 mg/dL.','Trajeto: laterais, forames interventriculares, III, aqueduto, IV, aberturas, cisternas, granulações, seio sagital superior.'],
 clin:['Estenose do aqueduto: dilata laterais e III; IV normal.','Hipertensão intracraniana: cefaleia, vômitos e papiledema.','Hérnia do unco: midríase ipsilateral, hemiparesia contralateral e coma.','Hérnia de tonsila: compressão bulbar e morte; cuidado com punção lombar.','Extradural (meníngea média, biconvexo, rápido); subdural (veias em ponte, crescente, lento); subaracnóidea (aneurisma, cefaleia súbita).','Fístula carótido-cavernosa: exoftalmia pulsátil.','Meningioma: tumor primário mais comum do SNC, em geral benigno.']};
QB.push(
 L(mc('meninges',2,'Por que as perdas ósseas da calota craniana não se regeneram bem?',['O folheto externo da dura não tem capacidade osteogênica','A aracnoide reabsorve o osso novo','O liquor dissolve o calo ósseo','A pia-máter impede a vascularização do osso'],'O folheto periosteal da dura não forma osso.'),'Ao contrário do periósteo de outros ossos, o folheto externo da dura não produz osso. Isso dificulta a consolidação, mas evita calos ósseos que poderiam irritar o encéfalo.','Grandes falhas da calota após cirurgia ou trauma costumam ser corrigidas com próteses (cranioplastia).'),
 L(ar('meninges',2,'No crânio não existe espaço epidural, ao contrário do canal vertebral.','O folheto externo da dura-máter adere intimamente aos ossos do crânio.',0,'A aderência ao osso elimina o espaço.'),'Na coluna há gordura e plexo venoso entre a dura e o periósteo. No crânio, a dura funciona como periósteo e só se descola em traumas, criando o hematoma extradural.','Por isso não se faz anestesia peridural no crânio: o espaço não existe.'),
 L(mc('meninges',1,'A maior parte das cefaleias se origina em estruturas sensíveis à dor como:',['Dura-máter e vasos','Córtex cerebral','Substância branca','Plexos corioides'],'O tecido nervoso não tem receptores de dor; a dura e os vasos têm.'),'A dura é ricamente inervada, sobretudo pelo trigêmeo e, na fossa posterior, por ramos cervicais altos e do vago.','Por isso a cirurgia de encéfalo acordado é possível: depois da anestesia da pele e da dura, o córtex pode ser manipulado sem dor.'),
 L(as('meninges',2,'Associe a prega da dura-máter à posição.',[['Foice do cérebro','Entre os hemisférios cerebrais'],['Tentório do cerebelo','Entre lobos occipitais e cerebelo'],['Foice do cerebelo','Entre os hemisférios cerebelares'],['Diafragma da sela','Sobre a sela turca']],'As pregas dividem o crânio em compartimentos.'),'Elas são formadas pelo folheto interno da dura, que se destaca do externo.','O diafragma da sela isola a hipófise, mas dificulta a cirurgia dessa glândula por via alta.'),
 L(mc('meninges',2,'O seio sagital inferior termina no:',['Seio reto','Seio transverso','Seio cavernoso','Seio sigmoide'],'O sagital inferior corre na borda livre da foice e desemboca no seio reto.'),'O seio reto recebe também a veia cerebral magna e vai até a confluência dos seios.','A trombose dos seios profundos pode causar infartos venosos bilaterais do tálamo.'),
 L(od('meninges',2,'Ordene o trajeto do sangue do seio sagital superior até a veia jugular interna.',['Seio sagital superior','Confluência dos seios','Seio transverso','Seio sigmoide','Veia jugular interna'],'A drenagem segue para trás e depois para baixo e para a frente.'),'O seio sigmoide atravessa o forame jugular e continua como veia jugular interna.','A trombose do seio transverso ou sigmoide pode complicar infecções do ouvido médio (mastoidite).'),
 L(cs('meninges',3,'Mulher de 60 anos com cefaleia, diplopia e olho direito que não abduz. Depois surge ptose e o olho não sobe nem desce. A RM mostra aneurisma da carótida interna dentro do seio cavernoso direito. Qual nervo é tipicamente o primeiro a ser atingido?',['Abducente','Oculomotor','Óptico','Troclear'],'O VI passa dentro do seio, junto à carótida.'),'O abducente atravessa o seio cavernoso ao lado da carótida, enquanto III, IV e V1 ficam na parede lateral. Por isso a paralisia do VI costuma vir primeiro.','Aneurismas cavernosos grandes podem ser tratados por via endovascular.'),
 L(ar('meninges',3,'Infecção de pele no nariz pode chegar ao seio cavernoso.','A veia angular comunica-se com as veias oftálmicas, tributárias do seio cavernoso.',0,'A comunicação venosa explica a propagação.'),'Essa região da face é chamada "triângulo perigoso": espremer lesões ali pode levar germes para dentro do crânio.','A trombose séptica do seio cavernoso causa febre, edema periorbital, exoftalmia e oftalmoplegia, e é emergência.'),
 L(mc('meninges',2,'A maior cisterna subaracnóidea, entre cerebelo e bulbo, é a:',['Cisterna magna','Cisterna pontina','Cisterna quiasmática','Cisterna superior'],'A cisterna cerebelobulbar ou magna.'),'Liga-se ao IV ventrículo pela abertura mediana e continua com o espaço subaracnóideo espinal.','É acessível pela punção suboccipital, entre o occipital e o atlas.'),
 L(as('meninges',2,'Associe a cisterna à localização.',[['Pontina','À frente da ponte'],['Interpeduncular','Na fossa interpeduncular'],['Quiasmática','À frente do quiasma'],['Superior','Atrás do teto do mesencéfalo']],'As cisternas ficam onde o encéfalo se afasta do crânio.'),'A cisterna superior, da veia cerebral magna, corresponde em parte à cisterna ambiens.','Na hemorragia subaracnóidea por aneurisma, o sangue se acumula sobretudo nas cisternas da base.'),
