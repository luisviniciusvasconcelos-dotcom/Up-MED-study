<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Up-MED study</title>
<meta name="description" content="Neuroanatomia em questões, prova prática e ranking da turma.">
<meta name="theme-color" content="#164A37">
<meta name="color-scheme" content="only light">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta http-equiv="Cache-Control" content="no-cache">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: app clínico — barra lateral no computador, navegação inferior no celular; conteúdo em coluna de leitura */
:root{
  --petroleo:#1B3A4B; --teal:#2A9D8F; --ambar:#E9C46A;
  --bg:#f7fbf8; --surface:#ffffff; --surface2:#eff8f2; --ink:#1e293b; --muted:#5f6f68; --line:#dcebe2;
  --brand:#e3f4ea; --brandInk:#14532d; --accent:#2a8a55; --accentInk:#ffffff;
  --navHover:rgba(20,83,45,.07); --navActive:rgba(20,83,45,.13); --logoEm:#2a8a55; --sideLine:rgba(20,83,45,.15); --hi:#E9C46A; --hiInk:#5a4300;
  --ok:#23845f; --bad:#c2412f; --warn:#b07a00;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c161c; --surface:#13222b; --surface2:#182b35; --ink:#e3ecef; --muted:#93a6ae; --line:#26404d;
  --brand:#0f2531; --brandInk:#e3ecef; --accent:#38b3a4; --accentInk:#06201c; --hi:#E9C46A; --hiInk:#2b2000;
  --ok:#47c08f; --bad:#ff7a66; --warn:#e3b341; --navHover:rgba(255,255,255,.06); --navActive:rgba(255,255,255,.12); --logoEm:#E9C46A; --sideLine:rgba(255,255,255,.12); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c161c; --surface:#13222b; --surface2:#182b35; --ink:#e3ecef; --muted:#93a6ae; --line:#26404d;
  --brand:#0f2531; --brandInk:#e3ecef; --accent:#38b3a4; --accentInk:#06201c; --hi:#E9C46A; --hiInk:#2b2000;
  --ok:#47c08f; --bad:#ff7a66; --warn:#e3b341; --navHover:rgba(255,255,255,.06); --navActive:rgba(255,255,255,.12); --logoEm:#E9C46A; --sideLine:rgba(255,255,255,.12); color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(26px,4.5vw,36px);font-weight:800}
h2{font-size:clamp(20px,3.2vw,26px);font-weight:700}
h3{font-size:18px;font-weight:700}
p{margin:0}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:14px}
.num{font-variant-numeric:tabular-nums}

/* ---------- login ---------- */
.auth{min-height:100vh;display:grid;grid-template-columns:1fr;background:var(--brand);color:var(--brandInk)}
@media (min-width:900px){.auth{grid-template-columns:1.1fr 1fr}}
.auth-hero{padding-block:40px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:24px;display:flex;flex-direction:column;justify-content:center;gap:18px;position:relative;overflow:hidden}
.auth-hero .mark{font-family:var(--f-display);font-weight:800;font-size:clamp(40px,8vw,72px);line-height:.95;letter-spacing:-.03em}
.auth-hero .mark span{color:var(--logoEm)}
.auth-hero p{max-width:42ch;opacity:.85}
.auth-hero svg{position:absolute;right:-40px;bottom:-40px;width:320px;opacity:.12;pointer-events:none}
.auth-card{background:var(--surface);color:var(--ink);padding-block:32px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;justify-content:center}
.auth-card form{display:grid;gap:12px;max-width:380px;width:100%;margin:0 auto}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:4px}
.seg button{border:0;background:transparent;padding:8px;border-radius:999px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brandInk)}
label.f{display:grid;gap:4px;font-size:14px;font-weight:700}
input.in,select.in,textarea.in{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:400}
input.in:focus,select.in:focus{border-color:var(--accent);outline:none}
.msg{font-size:14px;padding:10px 12px;border-radius:10px;background:var(--surface2);border:1px solid var(--line)}
.msg.err{border-color:var(--bad);color:var(--bad)}
.msg.ok{border-color:var(--ok);color:var(--ok)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px}

/* ---------- botões ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:10px;border:1.5px solid transparent;font-weight:700;line-height:1.1;min-height:44px}
.btn.pri{background:var(--accent);color:var(--accentInk)}
.btn.dark{background:var(--brand);color:var(--brandInk)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.sm{padding:8px 12px;min-height:36px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:700;min-height:36px}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--brandInk);border-color:var(--brand)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:1fr;min-height:100vh}
@media (min-width:900px){.shell{grid-template-columns:232px 1fr}}
.side{display:none}
@media (min-width:900px){.side{display:flex;flex-direction:column;gap:4px;background:var(--brand);color:var(--brandInk);padding:20px 12px;position:sticky;top:0;height:100vh}}
.side .logo{font-family:var(--f-display);font-weight:800;font-size:22px;padding:4px 10px 18px;letter-spacing:-.02em}
.side .logo span{color:var(--logoEm)}
.navb{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;color:inherit;padding:10px 12px;border-radius:10px;font-weight:700;opacity:.8}
.navb:hover{opacity:1;background:var(--navHover)}
.navb[aria-current="page"]{opacity:1;background:var(--navActive);box-shadow:inset 3px 0 0 var(--accent)}
.navb svg{width:20px;height:20px;flex:0 0 auto}
.side .foot{margin-top:auto;display:grid;gap:4px;font-size:13px;opacity:.85;padding:8px 10px}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--brand);color:var(--brandInk);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
@media (min-width:900px){.bottom{display:none}}
.bottom .navb{flex-direction:column;gap:2px;font-size:11px;padding:8px 2px;border-radius:0;justify-content:center;text-align:center}
.bottom .navb[aria-current="page"]{box-shadow:inset 0 3px 0 var(--accent);background:var(--navActive)}
.main{min-width:0;padding-block:20px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:900px){.main{padding-block:28px 48px;padding-left:32px;padding-right:32px}}
.page{max-width:1080px;margin:0 auto;display:grid;gap:20px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.banner{padding:10px 14px;border-radius:10px;background:color-mix(in srgb,var(--hi) 22%,var(--surface));border:1px solid color-mix(in srgb,var(--hi) 60%,var(--line));font-size:14px}

/* ---------- cartões ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr}
@media (min-width:640px){.g2{grid-template-columns:1fr 1fr}}
.g3{grid-template-columns:1fr}
@media (min-width:640px){.g3{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1000px){.g3{grid-template-columns:repeat(3,1fr)}}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px}
.stat b{font-family:var(--f-display);font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.mod{display:grid;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-height:118px}
.mod:hover{border-color:var(--accent)}
.mod .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.meter{height:6px;background:var(--surface2);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--accent)}
.meter i.lo{background:var(--bad)} .meter i.mid{background:var(--warn)}
.game{display:grid;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;position:relative;overflow:hidden}
.game:hover{border-color:var(--accent)}
.game .tag{justify-self:start}
.tag{display:inline-block;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--ink)}
.tag.amb{background:color-mix(in srgb,var(--hi) 35%,transparent)}

/* ---------- quiz ---------- */
.qwrap{max-width:760px;width:100%;margin:0 auto;display:grid;gap:14px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.bar{height:5px;background:var(--line);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.stem{font-size:18px;line-height:1.45}
.stem.case{background:var(--surface2);border-left:4px solid var(--hi);padding:12px 14px;border-radius:0 10px 10px 0}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;text-align:left;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);line-height:1.35;min-height:48px}
.opt .k{font-family:var(--f-mono);font-weight:500;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);font-size:13px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 11%,var(--surface))}
.opt:disabled{cursor:default}
.vfrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface)}
.vfrow.right{border-color:var(--ok)} .vfrow.wrong{border-color:var(--bad)}
.tog{display:flex;gap:4px}
.tog button{width:44px;height:40px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-weight:800}
.tog button[aria-pressed="true"]{background:var(--brand);color:var(--brandInk);border-color:var(--brand)}
.asrow{display:grid;grid-template-columns:1fr;gap:6px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface)}
@media (min-width:560px){.asrow{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);align-items:center}}
.asrow.right{border-color:var(--ok)} .asrow.wrong{border-color:var(--bad)}
.asrow .fix{font-size:13px;color:var(--ok);grid-column:1/-1}
.arbox{display:grid;gap:8px}
.arbox div{padding:10px 12px;border-radius:10px;background:var(--surface2);border:1px solid var(--line)}
.arbox b{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block}
ol.seq{list-style:none;margin:0;padding:0;display:grid;gap:6px;counter-reset:s}
ol.seq li{counter-increment:s;display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:8px 10px;border-radius:8px;background:var(--surface2);border:1px solid var(--line)}
ol.seq li::before{content:counter(s);font-family:var(--f-mono);color:var(--accent);font-weight:500}
ol.seq li.right{border-color:var(--ok)} ol.seq li.wrong{border-color:var(--bad)}
.fb{border-radius:12px;padding:14px 16px;background:var(--surface);border:1.5px solid var(--line);display:grid;gap:6px}
.fb.good{border-color:var(--ok)} .fb.bad{border-color:var(--bad)}
.fb .verdict{font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.07em}
.fb.good .verdict{color:var(--ok)} .fb.bad .verdict{color:var(--bad)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.score{font-family:var(--f-display);font-weight:800;font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* ---------- ranking ---------- */
.rank{display:grid;gap:6px}
.rrow{display:grid;grid-template-columns:40px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.rrow .pos{font-family:var(--f-display);font-weight:800;font-size:20px;text-align:center;font-variant-numeric:tabular-nums}
.rrow.me{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.rrow .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.rrow .xp{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500}
.rrow .acc{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:end}
.pod{background:var(--surface);border:1px solid var(--line);border-radius:var(--r) var(--r) 0 0;padding:10px;text-align:center;display:grid;gap:2px;min-width:0}
.pod b{font-family:var(--f-display);font-size:26px}
.pod .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod.p1{min-height:150px;border-top:4px solid var(--hi)} .pod.p2{min-height:120px} .pod.p3{min-height:100px}

/* ---------- estações ---------- */
.stage{display:grid;gap:16px;align-items:start}
@media (min-width:860px){.stage{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}}
.fig{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px;display:grid;gap:6px;min-width:0}
.fig svg{width:100%;height:auto;display:block;max-height:70vh}
.photo{position:relative;width:100%;line-height:0;border-radius:8px;overflow:hidden;background:#000;touch-action:manipulation}
.photo img{width:100%;height:auto;display:block;user-select:none;-webkit-user-drag:none;max-height:72vh;object-fit:contain}
.photo .pin{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:3px solid var(--hi);box-shadow:0 0 0 2px rgba(0,0,0,.55);pointer-events:none}
.photo .pin.pulse::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px solid var(--hi);animation:pulse 1.4s ease-out infinite}
.photo .pin.ok{border-color:var(--ok)} .photo .pin.bad{border-color:var(--bad)}
.photo .pin.dot{width:16px;height:16px;margin:-8px 0 0 -8px;border-width:2px;background:rgba(0,0,0,.35)}
.photo .pin.dot.cur{border-color:var(--hi);background:var(--hi)}
.photo .lbl{position:absolute;transform:translate(-50%,-150%);background:rgba(0,0,0,.75);color:#fff;font-size:12px;line-height:1.2;padding:3px 6px;border-radius:6px;white-space:nowrap;pointer-events:none;font-family:var(--f-body)}
.credit{font-size:12px;color:var(--muted);line-height:1.4}
.credit a{color:inherit}
.imgfail{line-height:1.5;color:#fff;padding:24px;text-align:center;font-size:14px}
@keyframes pulse{0%{opacity:.9;transform:scale(.6)}100%{opacity:0;transform:scale(1.6)}}
.timer{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500}
.timer.low{color:var(--bad)}
.lvls{display:grid;gap:6px;grid-template-columns:1fr 1fr}
@media (min-width:560px){.lvls{grid-template-columns:repeat(3,1fr)}}
.lv{padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;min-height:44px}
.lv[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.lv.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.lv.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.edlist{display:grid;gap:4px;max-height:52vh;overflow:auto;padding-right:4px}
.edlist button{display:grid;grid-template-columns:18px 1fr auto;gap:8px;align-items:center;text-align:left;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.edlist button.cur{border-color:var(--hi);box-shadow:inset 3px 0 0 var(--hi)}
.edlist .st{width:12px;height:12px;border-radius:50%;border:2px solid var(--line)}
.edlist .st.on{background:var(--ok);border-color:var(--ok)}
.edlist .st.skip{background:var(--muted);border-color:var(--muted)}

/* ---------- SVG esquemas ---------- */
.wm{fill:var(--sv-my);stroke:var(--sv-edge);stroke-width:.7}
.tr{fill:var(--sv-my2);stroke:var(--sv-edge);stroke-width:.7}
.base{fill:var(--sv-my)}
.gm{fill:var(--sv-gray);stroke:var(--sv-grayEdge);stroke-width:.6}
.sg{fill:var(--sv-gel);stroke:var(--sv-grayEdge);stroke-width:.6}
.nt{fill:var(--sv-deep)}
.cc{fill:var(--surface);stroke:var(--sv-grayEdge)}
.cba{fill:var(--sv-my2);stroke:var(--sv-edge);stroke-width:.6}
.fis{fill:var(--surface)}
.sep{stroke:var(--surface);stroke-width:1.8}
.outline{fill:none;stroke:var(--sv-pia);stroke-width:2}
.nerve{fill:none;stroke:var(--sv-nerve);stroke-width:7;stroke-linecap:round}
.thin{fill:none;stroke:var(--sv-nerve);stroke-width:2;stroke-linecap:round}
.gang{fill:var(--sv-gang);stroke:var(--sv-nerve)}
.hit{fill:none;stroke:transparent;stroke-width:16;pointer-events:stroke;stroke-linecap:round}
.zone{fill:transparent;stroke:var(--muted);stroke-dasharray:3 3;stroke-opacity:.6}
.cord{fill:var(--sv-gray);stroke:var(--sv-pia);stroke-width:1.5}
.dura{fill:none;stroke:var(--muted);stroke-width:2;stroke-dasharray:6 4}
.cist{fill:var(--sv-csf)}
.deco{stroke:var(--sv-nerve);stroke-width:2;fill:none}
.fil{stroke:var(--sv-pia);stroke-width:2;fill:none}
.lab{font-family:var(--f-mono);font-size:9px;fill:var(--muted);letter-spacing:.08em}
.tick{stroke:var(--line);stroke-width:1}
.guide{stroke:var(--line);stroke-dasharray:2 3}
:root{--sv-my:#2c3172;--sv-my2:#454ba3;--sv-edge:#9196dc;--sv-gray:#e7d5dc;--sv-grayEdge:#b99aa8;--sv-gel:#f6ecf0;--sv-deep:#ad7a91;--sv-pia:#7a2e4a;--sv-nerve:#c4b9a4;--sv-gang:#ab9d82;--sv-csf:#dbe8f4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sv-my:#343b8f;--sv-my2:#5058bb;--sv-edge:#8a90dd;--sv-gray:#cdb6bf;--sv-grayEdge:#9a7d8a;--sv-gel:#e6d6dc;--sv-deep:#9c6b81;--sv-pia:#c06a8a;--sv-nerve:#a89f8f;--sv-gang:#8f856f;--sv-csf:#1d3247}}
:root[data-theme="dark"]{--sv-my:#343b8f;--sv-my2:#5058bb;--sv-edge:#8a90dd;--sv-gray:#cdb6bf;--sv-grayEdge:#9a7d8a;--sv-gel:#e6d6dc;--sv-deep:#9c6b81;--sv-pia:#c06a8a;--sv-nerve:#a89f8f;--sv-gang:#8f856f;--sv-csf:#1d3247}
[data-id]{cursor:pointer}
.hl:not(.ln):not(.hit){fill:var(--hi)!important;fill-opacity:1}
.zone.hl{fill-opacity:.75!important;stroke:none}
.ln.hl,.hit.hl{stroke:var(--hi)!important}
.hit.hl,.hit.ok,.hit.bad{stroke-opacity:.35}
.ok:not(.ln):not(.hit){fill:var(--ok)!important;fill-opacity:.9}
.ln.ok,.hit.ok{stroke:var(--ok)!important}
.bad:not(.ln):not(.hit){fill:var(--bad)!important;fill-opacity:.9}
.ln.bad,.hit.bad{stroke:var(--bad)!important}
.spin{fill:none;stroke:var(--hi);stroke-width:2.5;pointer-events:none}
.spin.pulse{animation:pulse 1.4s ease-out infinite;transform-box:fill-box;transform-origin:center}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:50;background:rgba(5,15,20,.55);display:grid;place-items:center;padding:16px}
.modal .box{background:var(--surface);border-radius:14px;max-width:620px;width:100%;max-height:86vh;overflow:auto;padding:20px;display:grid;gap:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:90vw}
@media (min-width:900px){.toast{bottom:24px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.cereb{fill:var(--sv-gray);stroke:var(--sv-grayEdge);opacity:.75}
.peduncle{fill:var(--sv-my2);stroke:var(--sv-edge)}
.pcm{fill:var(--sv-my);stroke:var(--sv-edge)}
.pons{fill:var(--sv-gray);stroke:var(--sv-pia);stroke-width:1.5}
.medulla{fill:var(--sv-gray);stroke:var(--sv-pia);stroke-width:1.5}
.pyr{fill:var(--sv-my2);stroke:var(--sv-edge)}
.olive{fill:var(--sv-deep);stroke:var(--sv-pia)}
.fossa{fill:var(--sv-csf);stroke:var(--sv-grayEdge)}
.mam,.mamS{fill:var(--sv-deep);stroke:var(--sv-pia)}
.chiasm{fill:var(--sv-nerve);stroke:var(--sv-gang)}
.optic{fill:none;stroke:var(--sv-nerve);stroke-width:8;stroke-linecap:round}
.nervef{fill:none;stroke:var(--sv-nerve);stroke-width:4;stroke-linecap:round}
.nerveT{fill:none;stroke:var(--sv-nerve);stroke-width:9;stroke-linecap:round}
.rootl{fill:none;stroke:var(--sv-nerve);stroke-width:2.5;stroke-linecap:round}
.ln.hl .rootl,.ln.hl .dec{stroke:var(--hi)} .ln.ok .rootl,.ln.ok .dec{stroke:var(--ok)} .ln.bad .rootl,.ln.bad .dec{stroke:var(--bad)}
.dec{stroke:var(--sv-my2);stroke-width:3}
.sulc{stroke:var(--sv-pia);stroke-width:1.5}
.cordS{fill:var(--sv-gray);stroke:var(--sv-pia);stroke-width:1.5}
.cortex{fill:var(--sv-gray);stroke:var(--sv-pia);stroke-width:2}
.gyrus{fill:none;stroke:var(--sv-gel);stroke-width:14;stroke-linecap:round;opacity:.9}
.sulcL{fill:none;stroke:var(--sv-pia);stroke-width:2;stroke-linecap:round}
.septum{fill:var(--sv-gel);stroke:var(--sv-grayEdge)}
.wmS{fill:none;stroke:var(--sv-my2);stroke-width:15;stroke-linecap:round}
.fornix{fill:none;stroke:var(--sv-my);stroke-width:7;stroke-linecap:round}
.thal{fill:var(--sv-deep);stroke:var(--sv-pia)}
.hypo{fill:var(--sv-gel);stroke:var(--sv-grayEdge)}
.deepS{fill:var(--sv-my2)}
.optS{fill:var(--sv-nerve)}
.hypoph{fill:var(--sv-gang);stroke:var(--sv-nerve)}
.mes{fill:var(--sv-gel);stroke:var(--sv-grayEdge)}
.coll{fill:var(--sv-deep)}
.pine{fill:var(--sv-gang)}
.aq{fill:none;stroke:var(--sv-csf);stroke-width:5;stroke-linecap:round}
.ponsS,.bulbS{fill:var(--sv-gel);stroke:var(--sv-grayEdge)}
.v4{fill:var(--sv-csf);stroke:var(--sv-grayEdge)}
.cerebS{fill:var(--sv-gray);stroke:var(--sv-pia);stroke-width:1.5}
.arbor path{stroke:var(--sv-my2);stroke-width:3;fill:none;stroke-linecap:round}

/* ===== v2.1 ===== */
.side .logo{display:flex;align-items:center;gap:10px}
.side .logo em{font-style:normal;color:var(--logoEm)}
.logo-mark{width:34px;height:34px;flex:0 0 auto}
.side-sep{height:1px;background:var(--sideLine);margin:8px 10px}
.side .foot{display:flex;align-items:center;gap:10px}
.av{display:inline-grid;place-items:center;border-radius:50%;object-fit:cover;flex:0 0 auto;background:color-mix(in srgb,var(--accent) 30%,var(--surface2));color:var(--ink);font-weight:700;font-family:var(--f-display);border:2px solid var(--surface)}
.side .av{border-color:var(--sideLine)}
.hello{display:flex;align-items:center;gap:14px;min-width:0}
.row-b{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.btn svg{width:18px;height:18px}
.glyph{display:inline-grid;place-items:center;border-radius:12px;background:color-mix(in srgb,var(--ac) 16%,var(--surface));color:var(--ac);flex:0 0 auto}
.glyph svg{width:58%;height:58%}
.mod{grid-template-columns:auto 1fr;align-items:start;column-gap:12px}
.mod .mod-t{display:grid;gap:4px;min-width:0}
.mod .meter,.mod .row{grid-column:1/-1}
.area{display:grid;gap:10px}
.area-h{display:flex;align-items:center;gap:10px}
.area-h .dot{width:10px;height:10px;border-radius:3px}
.hero-grid{display:grid;gap:12px}
@media (min-width:900px){.hero-grid{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}}
.sdcard{display:grid;gap:12px}
.sd-body{display:grid;gap:12px}
@media (min-width:640px){.sd-body{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}}
.sdfig .fig{padding:4px}
.sdfig .fig svg{max-height:300px}
.sdfig .photo img{max-height:300px}
.rev{display:grid;gap:8px;align-content:start}
.big{font-family:var(--f-display);font-size:44px;font-weight:800;line-height:1}
.streak{display:grid;grid-template-columns:auto auto;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:10px;margin-top:4px;gap:2px 8px}
.streak .eyebrow{grid-column:1/-1}
.streak b{font-family:var(--f-display);font-size:24px}
.heat{width:100%;height:auto;display:block}
.hm{fill:var(--surface2);stroke:var(--line);stroke-width:.5}
.hm.l1{fill:color-mix(in srgb,var(--accent) 30%,var(--surface2))}
.hm.l2{fill:color-mix(in srgb,var(--accent) 55%,var(--surface2))}
.hm.l3{fill:color-mix(in srgb,var(--accent) 80%,var(--surface2))}
.hm.l4{fill:var(--accent)}
.chart{width:100%;height:auto;display:block}
.cgrid{stroke:var(--line);stroke-width:1}
.clab{fill:var(--muted);font-size:10px;font-family:var(--f-mono)}
.cline{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.carea{fill:color-mix(in srgb,var(--accent) 16%,transparent)}
.cdot{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.cdot.last{fill:var(--accent)}
.weak{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.weak > div{display:grid;gap:4px}
.resumo ul{margin:0;padding-left:20px;display:grid;gap:8px}
.resumo li{line-height:1.45}
.resumo.clin{background:color-mix(in srgb,var(--hi) 12%,var(--surface))}
.favbtn{margin-left:auto;background:none;border:0;font-size:22px;line-height:1;color:var(--hi);padding:4px 6px;border-radius:8px;min-height:36px}
.favbtn[aria-pressed="false"]{color:var(--muted)}
.chips .favbtn{margin-left:auto}
.result-hero{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.rev-item{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:6px}
.sres{display:grid;gap:4px;text-align:left;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
button.sres:hover{border-color:var(--accent)}
.cq{display:grid;gap:8px}
details summary{cursor:pointer;color:var(--accent);font-weight:700}
.badges{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:640px){.badges{grid-template-columns:1fr 1fr}}
@media (min-width:1000px){.badges{grid-template-columns:1fr 1fr 1fr}}
.badge{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.badge:not(.on){opacity:.7}
.medal{width:52px;height:52px}
.medals{display:flex;flex-wrap:wrap;gap:6px}
.medals .medal{width:44px;height:44px}
.badge-toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:70;display:flex;gap:12px;align-items:center;background:var(--surface);color:var(--ink);border:1px solid var(--hi);box-shadow:0 10px 30px rgba(0,0,0,.25);padding:10px 16px;border-radius:14px;animation:drop .5s cubic-bezier(.2,1.4,.4,1)}
.badge-toast b{display:block}
@keyframes drop{from{transform:translate(-50%,-40px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.xpfloat{position:fixed;left:50%;top:40%;z-index:65;font-family:var(--f-display);font-weight:800;font-size:40px;color:var(--ok);pointer-events:none;animation:floatup 1.1s ease-out forwards}
@keyframes floatup{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-80px);opacity:0}}
.fb.good{animation:pop .35s cubic-bezier(.2,1.5,.4,1)}
.fb.bad{animation:shake .35s}
@keyframes pop{from{transform:scale(.94)}to{transform:scale(1)}}
.game.feature{background:var(--brand);color:var(--brandInk);border-color:var(--brand)}
.sect{margin-top:6px}
.code{font-family:var(--f-mono);font-size:13px;word-break:break-all;resize:vertical}
.duel-res{display:flex;justify-content:space-around;align-items:center;text-align:center}
.duel-res div{display:grid;gap:4px}
.roomcode{font-family:var(--f-mono);font-size:56px;font-weight:500;letter-spacing:.2em;color:var(--accent)}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (min-width:640px){.mem{grid-template-columns:repeat(4,1fr)}}
.memc{min-height:92px;border-radius:12px;border:1.5px solid var(--line);background:var(--brand);color:var(--brandInk);font-size:14px;line-height:1.25;padding:8px;display:grid;place-items:center;transition:transform .25s}
.memc.up{background:var(--surface);color:var(--ink);transform:rotateY(0)}
.memc.s1.up{background:color-mix(in srgb,var(--hi) 14%,var(--surface))}
.memc.got{border-color:var(--ok);opacity:.85}
.numpin circle{fill:var(--hi);stroke:#000;stroke-opacity:.5;stroke-width:1.5;cursor:pointer}
.numpin text{font-family:var(--f-mono);font-size:11px;font-weight:700;fill:#1B3A4B;pointer-events:none}
.numpin.set circle{fill:var(--accent)}
.numpin.ok circle{fill:var(--ok)} .numpin.bad circle{fill:var(--bad)}
.numpin-h{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:2px solid rgba(0,0,0,.5);background:var(--hi);color:#1B3A4B;font:700 13px/1 var(--f-mono);display:grid;place-items:center;padding:0;line-height:26px}
.numpin-h.set{background:var(--accent);color:#fff} .numpin-h.ok{background:var(--ok);color:#fff} .numpin-h.bad{background:var(--bad);color:#fff}
.zoomwrap{position:relative;overflow:hidden;touch-action:pan-y}
.zoomwrap.zoomed{touch-action:none;cursor:grab}
.zoomer{transform-origin:0 0;position:relative}
.photo{text-align:center;background:#0b1114}
.photo .zoomer{display:inline-block;line-height:0;vertical-align:top}
.photo img{width:auto;max-width:100%;max-height:70vh}
.zctl{position:absolute;right:8px;bottom:8px;display:flex;gap:4px;z-index:3}
.zctl button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 88%,transparent);color:var(--ink);font:700 16px var(--f-mono);display:grid;place-items:center;padding:0}
:root[data-theme="dark"] .fig,.fig{box-shadow:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .photo img{filter:brightness(.95)}}

/* ===== v2.2 — identidade refinada: verde-floresta, branco e um toque de dourado =====
   Layout: barra lateral branca com filete; conteúdo em fundo off-white levemente esverdeado; cartões brancos com sombra mínima */
:root{
  --bg:#F5F7F4; --surface:#FFFFFF; --surface2:#F0F4F1; --ink:#17251F; --muted:#5E6E66; --line:#E1E8E3;
  --brand:#FFFFFF; --brandInk:#17251F; --accent:#1E6B4E; --accentInk:#FFFFFF; --hi:#D4AF4F; --hiInk:#5C4709;
  --ok:#1F8159; --bad:#B9473A; --warn:#A87A12;
  --navHover:#F2F6F3; --navActive:#E6F0EA; --logoEm:#4E8A6E; --sideLine:#E1E8E3;
  --feature:#164A37; --featureInk:#F2F7F4; --featureMuted:#B9D7C7;
  --logoBg:#1E6B4E; --logoFg:#F2F7F4;
  --shadow:0 1px 2px rgba(16,40,30,.05),0 2px 8px rgba(16,40,30,.04);
  --f-display:Sora,"Segoe UI",system-ui,sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1512; --surface:#151F1B; --surface2:#1B2823; --ink:#E6EEE9; --muted:#97A8A0; --line:#26362F;
  --brand:#121B17; --brandInk:#E6EEE9; --accent:#4FB58A; --accentInk:#06180F; --hi:#E2C46A; --hiInk:#2B2000;
  --ok:#4FB58A; --bad:#F07A6A; --warn:#E3B341;
  --navHover:rgba(255,255,255,.04); --navActive:rgba(79,181,138,.14); --logoEm:#7FC4A4; --sideLine:#26362F;
  --feature:#183A2D; --featureInk:#E6EEE9; --featureMuted:#9BCDB3; --logoBg:#4FB58A; --logoFg:#0E1512;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1512; --surface:#151F1B; --surface2:#1B2823; --ink:#E6EEE9; --muted:#97A8A0; --line:#26362F;
  --brand:#121B17; --brandInk:#E6EEE9; --accent:#4FB58A; --accentInk:#06180F; --hi:#E2C46A; --hiInk:#2B2000;
  --ok:#4FB58A; --bad:#F07A6A; --warn:#E3B341;
  --navHover:rgba(255,255,255,.04); --navActive:rgba(79,181,138,.14); --logoEm:#7FC4A4; --sideLine:#26362F;
  --feature:#183A2D; --featureInk:#E6EEE9; --featureMuted:#9BCDB3; --logoBg:#4FB58A; --logoFg:#0E1512;
  --shadow:none; color-scheme:dark}

body{font-size:16.5px;-webkit-font-smoothing:antialiased}
h1{font-weight:700;letter-spacing:-.025em}
h2{font-weight:600;letter-spacing:-.02em}
h3{font-weight:600;letter-spacing:-.01em}
.eyebrow{font-family:var(--f-body);font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.tag{font-family:var(--f-body);font-size:12.5px;font-weight:600;letter-spacing:0;text-transform:none;border-radius:6px;padding:3px 9px;background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.tag.amb{background:color-mix(in srgb,var(--hi) 16%,var(--surface));border-color:color-mix(in srgb,var(--hi) 40%,var(--line));color:var(--ink)}

/* barra lateral e navegação */
.side{background:var(--brand)!important;color:var(--brandInk);border-right:1px solid var(--line);padding:24px 14px}
.side .logo{padding:2px 8px 22px}
.logo-mark{width:38px;height:38px}
.wmark{display:grid;line-height:1.05}
.wmark b{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.02em;color:var(--ink)}
.wmark small{font-size:10.5px;font-weight:700;letter-spacing:.34em;text-transform:uppercase;color:var(--logoEm);margin-top:3px}
.navb{opacity:1;color:var(--muted);font-weight:600;padding:10px 12px;border-radius:10px}
.navb:hover{background:var(--navHover);color:var(--ink)}
.navb[aria-current="page"]{background:var(--navActive);color:var(--accent);box-shadow:none;font-weight:700}
.side .foot{border-top:1px solid var(--line);padding-top:14px;opacity:1;color:var(--ink)}
.side .foot span span{color:var(--muted)}
.bottom{background:var(--surface);color:var(--muted);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(16,40,30,.05)}
.bottom .navb{color:var(--muted);font-weight:600}
.bottom .navb[aria-current="page"]{background:transparent;box-shadow:none;color:var(--accent)}
.bottom .navb[aria-current="page"] svg{background:var(--navActive);border-radius:999px;padding:3px 14px;box-sizing:content-box}

/* superfícies */
.main{padding-block:32px 104px}
@media (min-width:900px){.main{padding-block:36px 56px;padding-left:44px;padding-right:44px}}
.page{gap:24px}
.card,.stat,.mod,.game,.fig,.badge,.sres{border-color:var(--line);box-shadow:var(--shadow)}
.card{padding:20px}
.stat{padding:14px 16px;gap:4px}
.stat b{font-size:26px;font-weight:700;letter-spacing:-.02em}
.banner{background:var(--surface2);border:1px solid var(--line);color:var(--muted);font-size:13.5px;padding:8px 14px;border-radius:999px;justify-self:start}
.mod{padding:16px;border-radius:var(--r);transition:border-color .15s,transform .15s,box-shadow .15s}
.mod:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));transform:translateY(-1px);box-shadow:0 6px 18px rgba(16,40,30,.08)}
.mod h3{font-size:16.5px}
.glyph{border-radius:12px;background:color-mix(in srgb,var(--accent) 10%,var(--surface));color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 18%,var(--line))}
.area-h h2{font-size:19px}
.area-h .dot{background:var(--accent)!important;width:4px;height:18px;border-radius:2px}
.meter{height:5px;border:0;background:var(--surface2)}
.game{padding:20px;border-radius:var(--r)}
.game:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.game.feature,.memc:not(.up){background:var(--feature);color:var(--featureInk);border-color:var(--feature)}
.game.feature p{color:var(--featureMuted)}
.game.feature .tag.amb{background:color-mix(in srgb,var(--hi) 28%,transparent);border-color:transparent;color:var(--featureInk)}
.game.feature .btn.pri{background:var(--featureInk);color:var(--feature)}

/* botões e controles */
.btn{border-radius:10px;font-weight:700;letter-spacing:.005em}
.btn.pri{background:var(--accent);color:var(--accentInk)}
.btn.pri:hover:not(:disabled){filter:brightness(1.07)}
.btn.dark{background:var(--ink);color:var(--surface)}
.btn.ghost{background:var(--surface);border-color:var(--line)}
.btn.ghost:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.chip{background:var(--surface);border-color:var(--line);font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accentInk)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accentInk)}
.opt{border-color:var(--line);border-radius:12px}
.opt .k{font-family:var(--f-body);font-weight:700;border-color:var(--line);color:var(--muted)}
input.in,select.in,textarea.in{border-color:var(--line);border-radius:10px}
.bar{height:4px;background:var(--surface2)}
.rrow{border-color:var(--line);box-shadow:var(--shadow)}
.rrow.me{box-shadow:inset 3px 0 0 var(--accent),var(--shadow)}
.pod.p1{border-top-color:var(--hi)}

/* login */
.auth{background:var(--feature);color:var(--featureInk)}
.auth-hero .mark{font-weight:700;letter-spacing:-.035em}
.auth-hero .mark span{color:var(--featureMuted)}
.auth-hero p{color:var(--featureMuted);opacity:1}
.auth-hero svg:not(.logo-mark){opacity:.08}

 {v:'3.3.0',date:'20/10/2026',changes:['Parte 2 do conteúdo (capítulos 9 a 16): aulas completas de Nervos e terminações, Nervos cranianos, SNA (aspectos gerais e anatomia), Estrutura da medula, do bulbo, da ponte e do mesencéfalo.','Cerca de 160 questões novas nesses oito módulos, com explicação curta, completa e correlação clínica, em todos os formatos (múltipla escolha, caso clínico, V ou F, associação, ordem, lacuna e assertiva-razão).','Resumos refeitos para os oito módulos.','Figuras novas no padrão em relevo, com nomes: formação do nervo espinal e trajeto do simpático, fuso neuromuscular, territórios de inervação da língua, organização do simpático e do parassimpático, lâminas de Rexed, bulbo fechado, bulbo aberto (oliva), ponte (colículo facial) e mesencéfalo (colículo superior).','Oito estações novas na prova prática, com essas figuras sem nomes, incluindo os cortes do tronco encefálico.','Figuras das aulas ampliáveis: toque na figura para abrir em tela cheia, com zoom e arraste (útil no celular).'],tests:['Banco validado; ids antigos preservados.','Todas as estações novas respondidas corretamente por toque em três rodadas.','Aulas dos oito módulos abertas no celular, sem rolagem lateral.','Figura ampliada: abrir, aumentar, fechar.'],analysis:'Os cortes do tronco são a parte mais cobrada em prova prática e agora têm estação própria. Com os nomes nos dois lados, as figuras ficam pequenas no celular; a ampliação em tela cheia resolve. Próximo passo: Parte 3 (capítulos 17 a 24).'},
 {v:'3.2.0',date:'20/10/2026',changes:['Painel mais curto: os 32 módulos viraram uma lista compacta agrupada por área, que abre e fecha (a área em que você está estudando já vem aberta e o painel lembra o que você deixou aberto). No celular o painel ficou com menos da metade da altura.','Cartão Continuar de onde parou no topo do painel: leva direto à seção da aula em que você parou e sugere o próximo passo (terminar a aula, treinar o módulo ou seguir para o próximo).','Cada módulo mostra se tem aula, se a aula já foi lida ou se a aula ainda vem num próximo lote.','Menu do celular com o botão Mais: Perfil, Buscar, Caderno, Flashcards e Conquistas a um toque de qualquer tela.','Aula com barra fixa no topo: seção atual, barra de progresso da leitura, botões de seção anterior e próxima e índice que abre por cima do texto. A seção atual fica destacada no índice.','A plataforma guarda a seção em que você parou e oferece Continuar dali ao reabrir a aula.'],tests:['Painel no celular e no computador: abrir e fechar áreas, recarregar e conferir que o estado ficou.','Continuar a aula pelo cartão do painel e conferir que abre na seção certa.','Barra da aula: rolar e conferir a seção e o progresso; usar anterior, próxima e o índice.','Menu Mais: abrir, navegar, fechar tocando fora.','Regressões de questões, estações, revisão e navegação.'],analysis:'O painel tinha cerca de 7 telas de altura no celular, com os módulos no fim; agora a navegação principal fica no topo e o restante (estação, revisão e desempenho) vem depois. Próximo passo sugerido: busca acessível dentro das aulas e confirmação ao sair de uma prova pela metade.'},
 {v:'3.1.4',date:'20/10/2026',changes:['Abertura mais segura: se o servidor demorar ou der erro ao carregar o progresso, a plataforma mostra uma mensagem com o motivo e um botão Tentar de novo, em vez de ficar carregando para sempre.','Proteção do progresso: se a leitura falhar, nada é gravado por cima do seu progresso salvo.'],tests:['Abrir com o servidor lento e conferir a mensagem após alguns segundos.','Abrir normalmente e conferir o painel.'],analysis:'Relato de tela presa em carregamento. Qualquer erro durante a abertura deixava a tela parada sem explicação; agora o erro aparece na tela e pode ser enviado em print.'},
 {v:'3.1.3',date:'20/10/2026',changes:['Revisão do dia: questões erradas entram na revisão na hora, em vez de só no dia seguinte (inclusive as que você errou antes desta versão). Acertos continuam voltando em 3, 7, 16 e 35 dias.','O cartão da revisão mostra quantas questões voltam amanhã e explica como a fila funciona.'],tests:['Errar uma questão e conferir que o número da revisão sobe na hora.','Acertar a questão na revisão e conferir que ela sai da fila.','Acertar uma questão nova e conferir que ela não entra hoje.'],analysis:'A revisão funcionava, mas só liberava questões no dia seguinte; no primeiro dia de uso o cartão ficava sempre zerado e parecia quebrado.'},
 {v:'3.1.2',date:'20/10/2026',changes:['Estação do dia fixa: a estação sorteada fica gravada no seu progresso e só muda à meia-noite. Antes, ela podia trocar de imagem e estrutura ao longo do dia quando as estações com foto terminavam de carregar ou quando o conjunto de estações mudava, e continuava aparecendo como respondida.'],tests:['Responder a estação, recarregar a página e conferir que a mesma estação continua, já respondida.','Adicionar estações novas no mesmo dia e conferir que a estação do dia não muda.','Simular a virada do dia e conferir que uma nova estação aparece liberada.'],analysis:'O sorteio dependia do tamanho da lista de estações, que muda quando as fotos do Firebase chegam depois da primeira tela. Gravar a escolha do dia resolve e ainda sincroniza entre aparelhos.'},
 {v:'3.1.1',date:'20/10/2026',changes:['Botão Voltar em todas as telas internas: retorna à tela anterior (e não só ao painel), inclusive pelo botão voltar do celular e do navegador.','Gabarito corrigido em 20 questões de múltipla escolha cuja alternativa correta estava fora da posição esperada (ex.: coluna lateral da substância cinzenta = medula torácica e lombar alta; término da medula; forame magno; C8; sulco bulbopontino; vestibulococlear; peso do encéfalo; potencial de repouso e transporte axonal).','Revisão de todo o banco: ajustes em afirmações e pares que divergiam do material de referência (SNA como componente eferente visceral, forame do nervo facial, corpúsculo de Ruffini, proprioceptores, astrócitos, assertiva-razão do cerebelo e dos plexos corioides).'],tests:['Banco validado (formatos, gabaritos, ids únicos).','Ids das questões antigas preservados (progresso mantido).','Regressões de estações e prova prática.','Navegação: pilha de telas, Voltar no cabeçalho e voltar do sistema.'],analysis:'Correções só em alternativas, afirmações e pares; enunciados intactos para não perder progresso.'},
 {v:'3.1.0',date:'20/10/2026',changes:['Novo padrão de ilustração anatômica, desenhado do zero: tons de cinza, relevo, giros e folhas com volume, e nomes escritos dos dois lados com linhas tracejadas.','Redesenhados: hemisfério cerebral em vista lateral (giros e sulcos), face medial em corte sagital, base do encéfalo, tronco encefálico em vista anterior e dorsal (IV ventrículo), cerebelo em vista superior (novo), em corte sagital e em vista inferior, e medula em corte transversal (estrutura e tratos).','Dura-máter e seios, liquor e cisternas, ventrículos e medula em vista posterior passaram para o mesmo padrão de cores.','Nas aulas as figuras vêm com os nomes escritos. Na prova prática a mesma figura aparece sem nomes, para você identificar.','Nova estação: cerebelo em vista superior.'],

 {v:'3.0.0',date:'20/10/2026',changes:['Plataforma reorganizada em 32 módulos que seguem a ordem dos capítulos da neuroanatomia funcional, agrupados em sete áreas. O progresso das questões já respondidas foi mantido.','Parte 1 completa (módulos 1 a 8): evolução do sistema nervoso, desenvolvimento e organização geral, tecido nervoso, medula, tronco encefálico e cerebelo, diencéfalo, telencéfalo, meninges e liquor. Todos têm aula nova ou ampliada, resumo e questões em três níveis.','Banco ampliado de 265 para 421 questões.','Novos esquemas detalhados, também como estações da prova prática: assoalho do IV ventrículo, cerebelo em corte sagital e em vista inferior, face lateral e base do cérebro, face medial redesenhada, ventrículos, seios da dura-máter e cisternas do liquor.','Figuras novas nas aulas: evolução e arcos reflexos, migração neuronal, potencial de ação, corte da medula, punção lombar, crescimento da coluna, espaços meníngeos, hérnias e hematomas.','Terminologia padronizada (fórnice, liquor, unco).','Duelo direto entre colegas pela plataforma, sem código: desafie, responda e veja o placar dos dois.'],

 {v:'2.5.0',date:'20/10/2026',changes:['Plataforma online: login com e-mail e senha pelo Firebase, progresso salvo na nuvem e ranking compartilhado da turma.','Regras de segurança do banco: só quem tem conta lê o ranking, cada aluno altera apenas os próprios dados e só o administrador cria estações.'],

 {v:'2.3.0',date:'18/10/2026',changes:['Novo ícone: letra M com seta ascendente, em todo o site e no ícone do app.','Barra lateral (e barra inferior no celular) em verde-sálvia; demais telas com fundo branco.','Instalável no celular como aplicativo, com ícone próprio e funcionamento sem internet.','Atualização automática: a plataforma sempre busca a versão mais nova quando há conexão.','Atalhos de teclado no computador: A–E ou 1–5 escolhem a alternativa, Enter avança.'],

/* Camada 1 — resumos por módulo: pontos-chave e correlação clínica */
var RESUMO={
 intro:{pts:['O sistema nervoso central (SNC) tem encéfalo e medula; o periférico (SNP) tem nervos, gânglios e terminações.','Encéfalo = cérebro (telencéfalo + diencéfalo), cerebelo e tronco encefálico (mesencéfalo, ponte, bulbo).','Divisão funcional: SN segmentar (medula, tronco e nervos) e suprassegmentar (cérebro e cerebelo, com córtex).','Neurulação: placa neural → goteira → tubo neural; neuróporo rostral fecha por volta do 25º dia e o caudal por volta do 27º.','Vesículas primárias: prosencéfalo, mesencéfalo e rombencéfalo. Secundárias: telencéfalo, diencéfalo, mesencéfalo, metencéfalo e mielencéfalo.','Sulco limitante separa a lâmina alar (dorsal, sensitiva) da lâmina basal (ventral, motora).','Crista neural: gânglios sensitivos e autônomos, células de Schwann, medula da adrenal e melanócitos.'],
  clin:['Falha do neuróporo caudal: espinha bífida e mielomeningocele.','Falha do neuróporo rostral: anencefalia.','Ácido fólico antes e no início da gestação reduz defeitos do tubo neural.']},
 tecido:{pts:['Neurônio: corpo celular, dendritos e axônio; o potencial de ação nasce no segmento inicial do axônio.','Classificação: multipolares (maioria), bipolares (retina, olfato, gânglios do VIII) e pseudounipolares (gânglios sensitivos).','Glia do SNC: astrócitos, oligodendrócitos, micróglia e células ependimárias. No SNP: células de Schwann e satélites.','Mielina: oligodendrócito no SNC (vários axônios), Schwann no SNP (um internodo).','Condução saltatória entre nódulos de Ranvier torna a fibra mielínica mais rápida.','Sinapse química: entrada de cálcio no terminal libera neurotransmissor; o sentido é único.','Lesão axonal: degeneração walleriana distal e cromatólise no corpo celular. Regeneração boa no SNP e muito limitada no SNC.'],
  clin:['Esclerose múltipla: desmielinização central (oligodendrócitos).','Síndrome de Guillain-Barré: desmielinização periférica (Schwann).','Gliomas derivam da glia; astrocitomas são os mais comuns.']},
 nervos:{pts:['Envoltórios: endoneuro (fibra), perineuro (fascículo, barreira hematoneural) e epineuro (nervo).','Receptores: exteroceptores, proprioceptores e interoceptores.','Meissner: tato fino. Pacini: vibração. Terminações livres: dor e temperatura.','Fuso neuromuscular detecta estiramento; órgão tendinoso de Golgi detecta tensão.','Motoneurônios alfa inervam fibras extrafusais; gama inervam fibras intrafusais.','Placa motora: acetilcolina sobre receptores nicotínicos da fibra esquelética.','Unidade motora = um motoneurônio e as fibras que ele inerva.'],
  clin:['Miastenia grave: anticorpos contra receptores de acetilcolina.','Hanseníase: perda precoce de dor e temperatura por lesão de fibras finas.']},
 medmacro:{pts:['A medula vai do forame magno até L2 no adulto (L3 no recém-nascido).','Intumescência cervical (plexo braquial) e lombossacral (plexo lombossacral).','Abaixo do cone medular: filamento terminal e cauda equina.','31 pares de nervos espinais: 8 C, 12 T, 5 L, 5 S e 1 Co.','Topografia: de C2 a T10 soma-se 2 ao processo espinhoso; T11–T12 correspondem aos segmentos lombares; L1 aos sacrais.','Saco dural termina em S2; cisterna lombar entre L2 e S2.','Ligamentos denticulados são expansões da pia-máter.'],
  clin:['Punção lombar entre L3–L4 ou L4–L5, abaixo do fim da medula.','Peridural: espaço epidural. Raquianestesia: espaço subaracnóideo.','Cone medular: quadro simétrico, esfíncteres precoces. Cauda equina: radicular, doloroso, assimétrico.']},
 medest:{pts:['Substância cinzenta em H: colunas anterior (motora), posterior (sensitiva) e lateral (T1–L2, simpática).','Lâmina II de Rexed = substância gelatinosa (modulação da dor); lâmina IX = motoneurônios.','Núcleo torácico (C8–L2) origina o trato espinocerebelar posterior.','Funículo posterior: fascículos grácil e cuneiforme (acima de T6) — tato epicrítico e propriocepção, sem cruzar.','Funículo lateral: corticospinal lateral (já cruzado), espinotalâmico lateral (cruzado) e espinocerebelares.','Fibras espinotalâmicas cruzam na comissura branca anterior.','Motoneurônios mediais: musculatura axial; laterais: distal dos membros.'],
  clin:['Brown-Séquard: déficit motor e proprioceptivo do mesmo lado; dor e temperatura do lado oposto.','Siringomielia: perda de dor e temperatura em xale, bilateral.','Tabes dorsalis: funículos posteriores, Romberg positivo.','Degeneração combinada (B12): funículos posteriores e laterais.','Artéria espinal anterior: poupa os funículos posteriores.']},
 tronco:{pts:['Bulbo: pirâmides, decussação das pirâmides, olivas, tubérculos grácil e cuneiforme, óbex.','Ponte: base com sulco basilar, pedúnculos cerebelares médios.','Mesencéfalo: pedúnculos cerebrais, fossa interpeduncular, colículos superiores (visão) e inferiores (audição).','Origens aparentes: III fossa interpeduncular; IV dorsal; V lateral na ponte; VI, VII e VIII no sulco bulbopontino.','XII no sulco lateral anterior do bulbo; IX, X e XI no sulco lateral posterior.','IV ventrículo: colículo facial, trígonos do hipoglosso (medial) e do vago (lateral), área vestibular.','Pedúnculos cerebelares: inferior (bulbo), médio (ponte) e superior (mesencéfalo).'],
  clin:['O troclear é o único nervo que emerge da face dorsal e o mais longo no trajeto intracraniano.','Herniação tonsilar comprime o bulbo e os centros respiratórios.']},
 troncoest:{pts:['Lemnisco medial: fibras arqueadas internas que cruzam no bulbo.','Núcleo ambíguo: motor de IX, X e XI (faringe e laringe).','Núcleo do trato solitário: gustação e aferência visceral.','Núcleo de Edinger-Westphal: parassimpático da pupila (III).','Fascículo longitudinal medial: integra núcleos oculomotores e vestibulares.','Formação reticular: vigília (SARA), centros respiratório e vasomotor; rafe serotoninérgica, locus ceruleus noradrenérgico.','Substância negra dopaminérgica entre tegmento e base do pedúnculo.'],
  clin:['Weber: hemiplegia contralateral e III do mesmo lado (base do mesencéfalo).','Millard-Gubler: hemiplegia contralateral e VI/VII do mesmo lado (base da ponte).','Wallenberg: síndrome bulbar lateral (artéria cerebelar inferior posterior).','Síndrome bulbar medial: hemiplegia contralateral e língua desviando para o lado lesado.']},
 cerebelo:{pts:['Arquicerebelo (floculonodular): equilíbrio. Paleocerebelo (vérmis anterior): tônus e postura. Neocerebelo (hemisférios): coordenação fina.','Córtex: camadas molecular, de Purkinje e granular.','Células de Purkinje são a única saída do córtex e são inibitórias (GABA).','Núcleos centrais, de lateral para medial: denteado, emboliforme, globoso e fastigial.','Fibras trepadeiras vêm da oliva inferior; as demais aferências são musgosas.','Via denteado → pedúnculo superior → tálamo (VL) contralateral → córtex motor.','Efeito final homolateral: as vias cruzam duas vezes.'],
  clin:['Lesão de hemisfério: dismetria, tremor de intenção, disdiadococinesia do mesmo lado.','Lesão de vérmis: ataxia de tronco e marcha (ex.: meduloblastoma infantil).','Alcoolismo crônico: degeneração do vérmis anterior.']},
 diencefalo:{pts:['Partes: tálamo, hipotálamo, epitálamo e subtálamo; cavidade = III ventrículo.','Sulco hipotalâmico separa tálamo de hipotálamo.','Núcleos talâmicos: VPL (corpo), VPM (face), geniculado lateral (visão), geniculado medial (audição), VL (motor).','Hipotálamo: supraquiasmático (ritmo circadiano), supraóptico e paraventricular (ADH e ocitocina), lateral (fome), ventromedial (saciedade).','Hipotálamo anterior perde calor; posterior conserva calor.','Epitálamo: pineal (melatonina) e habênulas.','Subtálamo: núcleo subtalâmico, ligado aos núcleos da base.'],
  clin:['Hemibalismo: núcleo subtalâmico contralateral.','Diabetes insípido central: falta de ADH.','Síndrome talâmica (Dejerine-Roussy): dor contralateral intensa.']},
 telencefalo:{pts:['Sulcos principais: central, lateral, parieto-occipital, calcarino e do cíngulo.','Lobos: frontal, parietal, temporal, occipital, ínsula e límbico.','Giro pré-central: área motora (4). Giro pós-central: somestésica (3, 1, 2).','Área visual (17) nos lábios do sulco calcarino; auditiva (41, 42) no giro temporal transverso.','Broca (44, 45): giro frontal inferior esquerdo. Wernicke: parte posterior do giro temporal superior esquerdo.','Membro inferior representado no lóbulo paracentral (face medial).','Corpo caloso: rostro, joelho, tronco e esplênio; fibras comissurais.'],
  clin:['Afasia de Broca: expressão comprometida, compreensão preservada.','Afasia de Wernicke: fala fluente sem sentido, compreensão comprometida.','Herniação do unco: compressão do III nervo (midríase).']},
 telest:{pts:['Corpo estriado = caudado + lentiforme (putame + globo pálido).','Neoestriado = caudado + putame; paleoestriado = globo pálido.','Cápsula interna: perna anterior (caudado/lentiforme), joelho e perna posterior (tálamo/lentiforme).','Perna posterior contém o corticospinal e radiações sensitivas; joelho contém o corticonuclear.','De lateral para medial: ínsula, cápsula extrema, claustro, cápsula externa, putame, globo pálido, cápsula interna, tálamo.','Fibras de associação (mesmo hemisfério), comissurais (entre hemisférios) e de projeção.','Área pré-frontal: planejamento, comportamento e juízo crítico.'],
  clin:['Lesão capsular: hemiplegia proporcionada contralateral.','Parkinson: perda dopaminérgica nigroestriatal.','Huntington: atrofia do caudado e coreia.','Negligência espacial: lesão parietal direita.']},
 meninges:{pts:['Dura-máter, aracnoide e pia-máter; espaço subaracnóideo com liquor.','Pregas da dura: foice do cérebro, tenda do cerebelo, foice do cerebelo e diafragma da sela.','Liquor: produzido pelos plexos corioides, absorvido pelas granulações aracnóideas.','Circulação: ventrículos laterais → forames interventriculares → III → aqueduto → IV → aberturas → espaço subaracnóideo.','Volume total no adulto em torno de 130–150 mL.','No crânio o espaço epidural é virtual; na coluna é real.'],
  clin:['Hematoma epidural: artéria meníngea média, forma biconvexa, intervalo lúcido.','Hematoma subdural: veias-ponte, forma em crescente, comum em idosos.','Hemorragia subaracnóidea: ruptura de aneurisma, cefaleia súbita intensa.','Estenose do aqueduto: hidrocefalia não comunicante.']},
 vasc:{pts:['Sistema carotídeo (carótidas internas) e vertebrobasilar (vertebrais → basilar).','Círculo arterial: cerebrais anteriores e posteriores, comunicantes e carótidas internas. A cerebral média não faz parte.','Cerebral anterior: face medial frontal e parietal. Média: face lateral. Posterior: occipital e face inferior do temporal.','Lenticuloestriadas (da cerebral média) irrigam cápsula interna e núcleos da base.','Barreira hematoencefálica: junções oclusivas endoteliais e pés de astrócitos.','Órgãos circunventriculares (área postrema, neuro-hipófise) não têm barreira.','Seio cavernoso: carótida interna e VI dentro; III, IV, V1 e V2 na parede.'],
  clin:['Cerebral anterior: déficit crural contralateral.','Cerebral média: déficit braquiofacial e afasia (hemisfério dominante).','Cerebral posterior: hemianopsia homônima com preservação macular.','Hemorragia hipertensiva: ruptura das lenticuloestriadas.']},
 nervesp:{pts:['Nervo espinal = raiz dorsal (sensitiva) + raiz ventral (motora); é misto.','Ramo dorsal: músculos profundos e pele do dorso. Ramo ventral: membros e parede anterolateral.','Plexos: cervical (C1–C4), braquial (C5–T1), lombar e sacral. Nervos torácicos seguem como intercostais.','Dermátomos de referência: C6 polegar, T4 mamilo, T10 umbigo, L4 face medial da perna, S1 borda lateral do pé.','Reflexos: bicipital C5–C6, tricipital C7, patelar L3–L4 (L2–L4), aquileu S1.','Frênico: C3–C5.'],
  clin:['Hérnia lombar posterolateral comprime a raiz que sai no forame abaixo (L5–S1 → S1).','Hérnia cervical: a raiz tem o número da vértebra de baixo (C5–C6 → C6).']},
 nervcran:{pts:['I olfação; II visão; III, IV e VI motricidade ocular; V sensibilidade da face e mastigação.','VII mímica, gustação dos 2/3 anteriores e glândulas; VIII audição e equilíbrio.','IX gustação do 1/3 posterior; X parassimpático visceral e laringe; XI trapézio e esternocleidomastóideo; XII língua.','Forames: canal óptico (II), fissura orbital superior (III, IV, V1, VI), redondo (V2), oval (V3), meato acústico interno (VII, VIII), jugular (IX, X, XI), canal do hipoglosso (XII).','Reflexo corneano: aferência V1, eferência VII. Fotomotor: aferência II, eferência III.','Núcleo facial superior recebe fibras dos dois hemisférios.'],
  clin:['Paralisia facial periférica: toda a hemiface. Central: só a metade inferior, contralateral.','Lesão do XII: língua desvia para o lado lesado.','Lesão do X: úvula desvia para o lado são.','Aneurisma da comunicante posterior: III com midríase.']},
 sna:{pts:['Simpático: origem toracolombar (T1–L2), gânglios paravertebrais e pré-vertebrais, pré-ganglionar curta.','Parassimpático: origem craniossacral (III, VII, IX, X e S2–S4), gânglios junto às vísceras.','Pré-ganglionares: acetilcolina. Pós-ganglionares simpáticas: noradrenalina (exceto sudoríparas: acetilcolina).','Medula da adrenal equivale a um gânglio simpático.','Gânglios parassimpáticos da cabeça: ciliar (III), pterigopalatino e submandibular (VII), ótico (IX).','Bexiga: parassimpático contrai o detrusor; simpático relaxa.'],
  clin:['Síndrome de Horner: ptose, miose e anidrose do mesmo lado.','Tumor de Pancoast compromete a cadeia simpática cervical.','Disreflexia autonômica em lesões acima de T6.']},
 vias:{pts:['Dor e temperatura: gânglio → coluna posterior → cruza na comissura branca → espinotalâmico lateral → VPL → giro pós-central.','Tato epicrítico e propriocepção: gânglio → grácil/cuneiforme → núcleos no bulbo → cruza → lemnisco medial → VPL → córtex.','Face: núcleos do trigêmeo → lemnisco trigeminal → VPM.','Visão: retina → nervo → quiasma (cruzam fibras nasais) → trato → geniculado lateral → radiação → calcarino.','Audição: gânglio espiral → núcleos cocleares → colículo inferior → geniculado medial → giro temporal transverso. Via bilateral.','Propriocepção inconsciente vai ao cerebelo, não ao córtex.'],
  clin:['Quiasma (tumor de hipófise): hemianopsia bitemporal.','Trato óptico: hemianopsia homônima contralateral.','Alça de Meyer (temporal): quadrantanopsia superior contralateral.']},

LESSON.intro=[
 {t:'Para que serve o sistema nervoso',b:[
  ['p','O sistema nervoso recebe informações do meio externo e do próprio corpo, integra essas informações e produz respostas: movimento, secreção de glândulas, ajuste de vísceras, memória e comportamento. Tudo o que você estudar em neuroanatomia é uma variação dessa sequência: **receber → integrar → responder**.'],
  ['p','Por isso as estruturas sempre aparecem em pares funcionais: uma via que **chega** (aferente, sensitiva) e uma via que **sai** (eferente, motora). Guardar essa lógica facilita muito o estudo das vias, que vem mais adiante.'],
  ['key','Aferente = chega ao sistema nervoso central (sensitivo). Eferente = sai do sistema nervoso central (motor ou secretor).']]},
 {t:'Divisão anatômica',b:[

  ['fig','divisoes','Divisão anatômica do sistema nervoso.'],
  ['ul',['**Encéfalo:** cérebro (telencéfalo + diencéfalo), cerebelo e tronco encefálico.','**Tronco encefálico:** mesencéfalo, ponte e bulbo, de cima para baixo.','**SNP:** nervos (12 pares cranianos e 31 pares espinais), gânglios e terminações nervosas.']],
  ['mn','O diencéfalo faz parte do **cérebro**, não do tronco. O cerebelo fica atrás do tronco, mas também não faz parte dele.'],
  ['chk','O tronco encefálico é formado por:',['Mesencéfalo, ponte e bulbo','Diencéfalo, ponte e bulbo','Cerebelo, ponte e bulbo'],0,'O tronco tem três partes: mesencéfalo, ponte e bulbo.']]},
 {t:'Divisão funcional: segmentar e suprassegmentar',b:[
  ['p','Uma segunda forma de dividir olha para a função. O **sistema nervoso segmentar** é a parte que se relaciona diretamente com os nervos: a medula espinal, o tronco encefálico e os próprios nervos. Ele é "segmentar" porque mantém a organização em segmentos do embrião.'],
  ['p','O **sistema nervoso suprassegmentar** fica acima: o cérebro e o cerebelo. Eles não emitem nervos diretamente e têm uma característica em comum, o **córtex**, uma camada de substância cinzenta na superfície.'],
  ['tbl',[['','Segmentar','Suprassegmentar'],['Componentes','Medula, tronco encefálico e nervos','Cérebro e cerebelo'],['Substância cinzenta','Central, cercada pela branca','Em córtex, na superfície'],['Relação com nervos','Direta','Indireta, por meio do segmentar']]],
  ['key','Os arcos reflexos simples se fecham no sistema segmentar; o suprassegmentar modula e comanda esses arcos.']]},
 {t:'Substância cinzenta e substância branca',b:[
  ['p','A **substância cinzenta** concentra corpos de neurônios. A **substância branca** concentra fibras (axônios), muitas delas com mielina, que dá a cor esbranquiçada.'],
  ['p','Na medula e no tronco, a substância cinzenta fica no centro. No cérebro e no cerebelo ela forma o córtex na superfície e também núcleos isolados na profundidade, como os núcleos da base.'],
  ['ul',['Agrupamento de corpos de neurônios **no SNC** = núcleo.','Agrupamento de corpos de neurônios **no SNP** = gânglio.','Feixe de fibras **no SNC** = trato, fascículo ou lemnisco.','Feixe de fibras **no SNP** = nervo.']],
  ['chk','Um conjunto de corpos de neurônios fora do SNC é chamado de:',['Núcleo','Gânglio','Trato'],1,'Fora do SNC, agrupamentos de corpos neuronais formam gânglios.']]},
 {t:'Neurulação: o início de tudo',b:[
  ['p','Na terceira semana do desenvolvimento, a notocorda induz o ectoderma acima dela a se espessar e formar a **placa neural**. As bordas da placa se elevam como pregas e o centro afunda, formando a **goteira neural**.'],
  ['p','As pregas se encontram na linha média e se fundem, fechando o **tubo neural**. Células das bordas das pregas se destacam e formam a **crista neural**, que vai originar boa parte do SNP.'],
  ['fig','neurulacao','Etapas da neurulação, em cortes transversais.'],
  ['p','O tubo fecha primeiro no meio e depois em direção às pontas. As aberturas que restam são os **neuróporos**: o rostral fecha por volta do 25º dia e o caudal por volta do 27º.'],
  ['clin','Falha no fechamento do neuróporo caudal causa **espinha bífida**, inclusive a mielomeningocele. Falha do rostral causa **anencefalia**. O ácido fólico antes e no início da gestação reduz bastante esse risco, e o SUS fornece a suplementação no pré-natal.'],
  ['ol',['Placa neural','Goteira neural','Tubo neural','Fechamento dos neuróporos']]]},
 {t:'Derivados do tubo neural e da crista neural',b:[
  ['p','O **tubo neural** origina todo o SNC: neurônios, a maior parte da glia central e o epitélio que reveste os ventrículos. A luz do tubo persiste como o **sistema ventricular** e o canal central da medula.'],
  ['p','A **crista neural** é o grande "doador" do SNP. Dela vêm:'],
  ['ul',['Neurônios dos **gânglios sensitivos** (espinais e de nervos cranianos).','Neurônios dos **gânglios autônomos**.','**Células de Schwann** e células satélites.','**Medula da glândula adrenal**.','Melanócitos e parte do esqueleto da face.']],
  ['key','Se é gânglio sensitivo, gânglio autônomo ou célula de Schwann, veio da crista neural.']]},
 {t:'Vesículas encefálicas',b:[
  ['p','A parte cranial do tubo neural cresce mais e forma três dilatações, as **vesículas primárias**: prosencéfalo, mesencéfalo e rombencéfalo. Depois, o prosencéfalo e o rombencéfalo se dividem, formando cinco **vesículas secundárias**. O mesencéfalo é o único que não se divide.'],
  ['fig','vesiculas','Vesículas primárias, secundárias, derivados e cavidades.'],
  ['mn','"**T**odo **D**ia **M**edito **M**uito **M**al": Telencéfalo, Diencéfalo, Mesencéfalo, Metencéfalo, Mielencéfalo, na ordem de cima para baixo.'],
  ['p','O tubo também se dobra: a **flexura cefálica** fica no mesencéfalo, a **cervical** na junção com a medula e a **pontina** no rombencéfalo. A pontina é a que "abre" o teto do rombencéfalo e forma o IV ventrículo.'],
  ['chk','Qual vesícula origina a ponte e o cerebelo?',['Mielencéfalo','Metencéfalo','Mesencéfalo'],1,'Metencéfalo: ponte e cerebelo. Mielencéfalo: bulbo.']]},
 {t:'Lâmina alar, lâmina basal e a lógica sensitivo-motora',b:[
  ['p','Na parede do tubo neural, o **sulco limitante** separa duas regiões. Atrás dele fica a **lâmina alar**, que forma neurônios sensitivos. À frente fica a **lâmina basal**, que forma neurônios motores.'],
  ['p','Na medula adulta isso explica por que a **coluna posterior** é sensitiva e a **coluna anterior** é motora. No tronco encefálico, o tubo se abre e as lâminas ficam lado a lado: núcleos motores mais mediais, sensitivos mais laterais no assoalho do IV ventrículo.'],
  ['key','Posterior/lateral = sensitivo (lâmina alar). Anterior/medial = motor (lâmina basal).'],
  ['chk','No assoalho do IV ventrículo, os núcleos motores tendem a ficar:',['Lateralmente','Medialmente','No teto do ventrículo'],1,'A lâmina basal, motora, fica medial ao sulco limitante no tronco aberto.']]}
];

LESSON.tecido=[
 {t:'Os dois tipos de célula',b:[
  ['p','O tecido nervoso tem **neurônios**, que geram e conduzem impulsos, e **células da glia**, que sustentam, isolam, nutrem e defendem. Há muito mais glia do que neurônios.'],
  ['key','Neurônio conduz o impulso. Glia cuida do ambiente em que o neurônio trabalha.']]},
 {t:'Anatomia do neurônio',b:[
  ['fig','neuronio','Neurônio multipolar e suas partes.'],
  ['ul',['**Corpo celular (pericário):** núcleo grande, nucléolo evidente e muitos corpúsculos de Nissl (retículo endoplasmático rugoso), que mostram intensa síntese de proteínas.','**Dendritos:** ramificados, recebem a maior parte das sinapses.','**Axônio:** prolongamento único que conduz o impulso para longe do corpo. Começa no **cone de implantação**, onde não há corpúsculos de Nissl.','**Terminais axônicos:** liberam neurotransmissores na sinapse.']],
  ['p','O potencial de ação nasce no **segmento inicial do axônio**, logo após o cone de implantação, porque ali há grande concentração de canais de sódio dependentes de voltagem.'],
  ['chk','Onde normalmente se inicia o potencial de ação?',['No dendrito','No segmento inicial do axônio','No núcleo'],1,'O segmento inicial tem a maior densidade de canais de sódio.']]},
 {t:'Classificação dos neurônios',b:[
  ['tbl',[['Tipo','Forma','Onde encontrar'],['Multipolar','Vários dendritos e um axônio','Maioria: neurônios motores, interneurônios, córtex'],['Bipolar','Um dendrito e um axônio','Retina, mucosa olfatória, gânglios do VIII par'],['Pseudounipolar','Um prolongamento que se divide em T','Gânglios sensitivos dos nervos espinais e cranianos']]],
  ['p','O **neurônio pseudounipolar** merece atenção: o ramo periférico leva o impulso do receptor até o gânglio e o ramo central leva do gânglio até a medula ou o tronco, sem passar pelo corpo celular. Ele é o **neurônio I** de quase todas as vias sensitivas.'],
  ['key','Gânglio sensitivo = neurônio pseudounipolar = neurônio I das vias aferentes.']]},
 {t:'Células da glia',b:[
  ['fig','glia','Principais células da glia do sistema nervoso central.'],
  ['tbl',[['Célula','Local','Função principal'],['Astrócito','SNC','Sustentação, controle do meio extracelular, participa da barreira hematoencefálica, forma cicatriz'],['Oligodendrócito','SNC','Forma mielina; um oligodendrócito mieliniza vários axônios'],['Micróglia','SNC','Defesa e fagocitose; origem mesodérmica (monocítica)'],['Ependimária','SNC','Reveste ventrículos e canal central; forma o epitélio dos plexos corioides'],['Célula de Schwann','SNP','Forma mielina; cada célula mieliniza um único segmento de um axônio'],['Célula satélite','SNP','Envolve os corpos neuronais nos gânglios']]],
  ['mn','Micróglia é a "exceção": é a única glia que não vem do ectoderma, e sim de células de defesa (linhagem monocítica).']]},
 {t:'Mielina e condução do impulso',b:[
  ['p','A mielina é formada por voltas da membrana de uma célula glial ao redor do axônio. Entre dois segmentos de mielina fica o **nódulo de Ranvier**, onde a membrana do axônio fica exposta.'],
  ['p','Como a despolarização só acontece nos nódulos, o impulso "salta" de nódulo em nódulo: é a **condução saltatória**, muito mais rápida e econômica. Quanto mais grossa a fibra e mais espessa a mielina, mais rápida a condução.'],
  ['tbl',[['Fibra','Mielina','Velocidade','Exemplo de função'],['Aα (Ia)','Espessa','Muito alta','Fuso neuromuscular, motoneurônio alfa'],['Aβ','Espessa','Alta','Tato fino'],['Aδ','Fina','Média','Dor rápida, temperatura'],['C','Ausente','Baixa','Dor lenta, autonômicas pós-ganglionares']]],
  ['clin','Na **esclerose múltipla**, a destruição da mielina central (oligodendrócitos) torna a condução lenta ou bloqueada, causando surtos de neurite óptica, fraqueza e alterações sensitivas. Na **síndrome de Guillain-Barré**, quem é atacada é a mielina periférica (Schwann).']]},
 {t:'Sinapse',b:[
  ['fig','sinapse','Sinapse química: do terminal pré-sináptico ao receptor.'],
  ['ol',['O potencial de ação chega ao terminal.','Canais de cálcio se abrem e o Ca²⁺ entra.','Vesículas se fundem à membrana e liberam o neurotransmissor (exocitose).','O neurotransmissor atravessa a fenda e se liga aos receptores pós-sinápticos.','O receptor abre ou fecha canais: excitação ou inibição.','O neurotransmissor é removido por recaptação ou degradação.']],
  ['p','Nas **sinapses elétricas** não há neurotransmissor: os neurônios se ligam por junções comunicantes, e a passagem é quase instantânea. Na química o sentido é único, do pré para o pós.'],
  ['key','O mesmo neurotransmissor pode excitar ou inibir: quem decide é o receptor.']]},
 {t:'Lesão e regeneração',b:[
  ['p','Quando um axônio é cortado, o segmento distal, separado do corpo celular, degenera: é a **degeneração walleriana**. No corpo celular aparece a **cromatólise**: o corpo incha, o núcleo vai para a periferia e os corpúsculos de Nissl se desfazem, sinal de que a célula tenta se recuperar.'],
  ['p','No **SNP**, as células de Schwann formam tubos (faixas de Büngner) que guiam o broto do axônio, que cresce cerca de 1 a 3 mm por dia. No **SNC**, a regeneração é muito limitada: proteínas da mielina central inibem o crescimento e a cicatriz astrocitária forma uma barreira.'],
  ['clin','Por isso uma lesão de nervo periférico pode recuperar a função em meses, enquanto uma lesão medular completa costuma deixar sequelas permanentes.'],
  ['chk','Por que a regeneração é melhor no SNP?',['Porque não há degeneração walleriana','Porque as células de Schwann guiam o crescimento do axônio','Porque os neurônios periféricos não têm corpo celular'],1,'As células de Schwann formam tubos que orientam o broto axonal.']]}
];

LESSON.nervos=[
 {t:'O que é um nervo',b:[
  ['p','Nervo é um feixe de fibras nervosas fora do SNC, envolvido por tecido conjuntivo. A maioria dos nervos é **mista**: leva fibras sensitivas e motoras juntas.'],
  ['fig','nervo','Nervo periférico em corte transversal, com seus envoltórios.'],
  ['ol',['**Endoneuro:** envolve cada fibra.','**Perineuro:** envolve cada fascículo e forma a barreira hematoneural.','**Epineuro:** envolve o nervo inteiro e une os fascículos.']],
  ['key','De dentro para fora: endo, peri, epi.']]},
 {t:'Terminações nervosas',b:[
  ['p','As fibras terminam de dois modos. As **terminações sensitivas** são receptores, que transformam um estímulo em impulso. As **terminações motoras** ligam o nervo a um músculo ou a uma glândula.'],
  ['p','Pela localização do estímulo, Sherrington classificou os receptores em **exteroceptores** (superfície do corpo), **proprioceptores** (músculos, tendões, articulações e labirinto) e **interoceptores** (vísceras e vasos).']]},
 {t:'Principais receptores',b:[

  ['p','O **fuso neuromuscular** tem fibras musculares próprias, as fibras intrafusais, inervadas pelos **motoneurônios gama**. Eles ajustam a sensibilidade do fuso. As fibras comuns do músculo, extrafusais, são inervadas pelos **motoneurônios alfa**.'],
  ['chk','O estiramento do músculo é detectado principalmente pelo:',['Órgão tendinoso de Golgi','Fuso neuromuscular','Corpúsculo de Pacini'],1,'O fuso detecta estiramento; o órgão de Golgi detecta tensão.']]},
 {t:'Placa motora e unidade motora',b:[
  ['p','A **placa motora** é a sinapse entre o axônio do motoneurônio e a fibra muscular esquelética. O neurotransmissor é a **acetilcolina**, que age sobre receptores nicotínicos. Em geral cada fibra muscular tem uma única placa.'],
  ['fig','unidade','Unidade motora: um motoneurônio e todas as fibras que ele inerva.'],
  ['p','A **unidade motora** é o motoneurônio e todas as fibras que ele inerva. Músculos de movimentos finos, como os do olho, têm unidades pequenas (poucas fibras por neurônio). Músculos de força, como o glúteo máximo, têm unidades grandes.'],
  ['clin','Na **miastenia grave**, anticorpos atacam os receptores de acetilcolina da placa motora. O paciente tem fraqueza que piora com o esforço, muitas vezes começando com ptose e visão dupla.']]},
 {t:'Do receptor ao reflexo',b:[
  ['p','O caminho mais curto entre receber e responder é o **reflexo miotático**: o estiramento ativa o fuso, a fibra Ia leva o impulso à medula e faz sinapse **direta** com o motoneurônio alfa, que contrai o mesmo músculo. É um reflexo monossináptico.'],
  ['ol',['Martelo estira o tendão e o músculo.','Fuso neuromuscular ativado.','Fibra aferente Ia (corpo no gânglio sensitivo).','Sinapse com o motoneurônio alfa na coluna anterior.','Contração do músculo estirado.']],
  ['key','Hiporreflexia aponta para lesão no arco (nervo, raiz, motoneurônio). Hiper-reflexia aponta para lesão acima, nas vias que controlam o arco.']]}
