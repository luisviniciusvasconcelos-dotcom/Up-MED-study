<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Up-MED study</title>
<meta name="description" content="Neuroanatomia em questões, prova prática e ranking da turma.">
<meta name="theme-color" content="#1B3A4B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: app clínico — barra lateral no computador, navegação inferior no celular; conteúdo em coluna de leitura */
:root{
  --petroleo:#1B3A4B; --teal:#2A9D8F; --ambar:#E9C46A;
  --bg:#eef2f3; --surface:#ffffff; --surface2:#f6f8f9; --ink:#14232c; --muted:#5b6b74; --line:#d6dee2;
  --brand:#1B3A4B; --brandInk:#ffffff; --accent:#2A9D8F; --accentInk:#ffffff; --hi:#E9C46A; --hiInk:#5a4300;
  --ok:#23845f; --bad:#c2412f; --warn:#b07a00;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c161c; --surface:#13222b; --surface2:#182b35; --ink:#e3ecef; --muted:#93a6ae; --line:#26404d;
  --brand:#0f2531; --brandInk:#e3ecef; --accent:#38b3a4; --accentInk:#06201c; --hi:#E9C46A; --hiInk:#2b2000;
  --ok:#47c08f; --bad:#ff7a66; --warn:#e3b341; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c161c; --surface:#13222b; --surface2:#182b35; --ink:#e3ecef; --muted:#93a6ae; --line:#26404d;
  --brand:#0f2531; --brandInk:#e3ecef; --accent:#38b3a4; --accentInk:#06201c; --hi:#E9C46A; --hiInk:#2b2000;
  --ok:#47c08f; --bad:#ff7a66; --warn:#e3b341; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(26px,4.5vw,36px);font-weight:800}
h2{font-size:clamp(20px,3.2vw,26px);font-weight:700}
h3{font-size:18px;font-weight:700}
p{margin:0}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:14px}
.num{font-variant-numeric:tabular-nums}

/* ---------- login ---------- */
.auth{min-height:100vh;display:grid;grid-template-columns:1fr;background:var(--brand);color:var(--brandInk)}
@media (min-width:900px){.auth{grid-template-columns:1.1fr 1fr}}
.auth-hero{padding-block:40px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:24px;display:flex;flex-direction:column;justify-content:center;gap:18px;position:relative;overflow:hidden}
.auth-hero .mark{font-family:var(--f-display);font-weight:800;font-size:clamp(40px,8vw,72px);line-height:.95;letter-spacing:-.03em}
.auth-hero .mark span{color:var(--hi)}
.auth-hero p{max-width:42ch;opacity:.85}
.auth-hero svg{position:absolute;right:-40px;bottom:-40px;width:320px;opacity:.12;pointer-events:none}
.auth-card{background:var(--surface);color:var(--ink);padding-block:32px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;justify-content:center}
.auth-card form{display:grid;gap:12px;max-width:380px;width:100%;margin:0 auto}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:4px}
.seg button{border:0;background:transparent;padding:8px;border-radius:999px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brandInk)}
label.f{display:grid;gap:4px;font-size:14px;font-weight:700}
input.in,select.in,textarea.in{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:400}
input.in:focus,select.in:focus{border-color:var(--accent);outline:none}
.msg{font-size:14px;padding:10px 12px;border-radius:10px;background:var(--surface2);border:1px solid var(--line)}
.msg.err{border-color:var(--bad);color:var(--bad)}
.msg.ok{border-color:var(--ok);color:var(--ok)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px}

/* ---------- botões ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:10px;border:1.5px solid transparent;font-weight:700;line-height:1.1;min-height:44px}
.btn.pri{background:var(--accent);color:var(--accentInk)}
.btn.dark{background:var(--brand);color:var(--brandInk)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.sm{padding:8px 12px;min-height:36px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:700;min-height:36px}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--brandInk);border-color:var(--brand)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:1fr;min-height:100vh}
@media (min-width:900px){.shell{grid-template-columns:232px 1fr}}
.side{display:none}
@media (min-width:900px){.side{display:flex;flex-direction:column;gap:4px;background:var(--brand);color:var(--brandInk);padding:20px 12px;position:sticky;top:0;height:100vh}}
.side .logo{font-family:var(--f-display);font-weight:800;font-size:22px;padding:4px 10px 18px;letter-spacing:-.02em}
.side .logo span{color:var(--hi)}
.navb{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;color:inherit;padding:10px 12px;border-radius:10px;font-weight:700;opacity:.8}
.navb:hover{opacity:1;background:rgba(255,255,255,.06)}
.navb[aria-current="page"]{opacity:1;background:rgba(255,255,255,.12);box-shadow:inset 3px 0 0 var(--hi)}
.navb svg{width:20px;height:20px;flex:0 0 auto}
.side .foot{margin-top:auto;display:grid;gap:4px;font-size:13px;opacity:.85;padding:8px 10px}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--brand);color:var(--brandInk);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
@media (min-width:900px){.bottom{display:none}}
.bottom .navb{flex-direction:column;gap:2px;font-size:11px;padding:8px 2px;border-radius:0;justify-content:center;text-align:center}
.bottom .navb[aria-current="page"]{box-shadow:inset 0 3px 0 var(--hi);background:rgba(255,255,255,.08)}
.main{min-width:0;padding-block:20px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:900px){.main{padding-block:28px 48px;padding-left:32px;padding-right:32px}}
.page{max-width:1080px;margin:0 auto;display:grid;gap:20px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.banner{padding:10px 14px;border-radius:10px;background:color-mix(in srgb,var(--hi) 22%,var(--surface));border:1px solid color-mix(in srgb,var(--hi) 60%,var(--line));font-size:14px}

/* ---------- cartões ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr}
@media (min-width:640px){.g2{grid-template-columns:1fr 1fr}}
.g3{grid-template-columns:1fr}
@media (min-width:640px){.g3{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1000px){.g3{grid-template-columns:repeat(3,1fr)}}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px}
.stat b{font-family:var(--f-display);font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.mod{display:grid;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-height:118px}
.mod:hover{border-color:var(--accent)}
.mod .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.meter{height:6px;background:var(--surface2);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--accent)}
.meter i.lo{background:var(--bad)} .meter i.mid{background:var(--warn)}
.game{display:grid;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;position:relative;overflow:hidden}
.game:hover{border-color:var(--accent)}
.game .tag{justify-self:start}
.tag{display:inline-block;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--ink)}
.tag.amb{background:color-mix(in srgb,var(--hi) 35%,transparent)}

/* ---------- quiz ---------- */
.qwrap{max-width:760px;width:100%;margin:0 auto;display:grid;gap:14px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.bar{height:5px;background:var(--line);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.stem{font-size:18px;line-height:1.45}
.stem.case{background:var(--surface2);border-left:4px solid var(--hi);padding:12px 14px;border-radius:0 10px 10px 0}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;text-align:left;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);line-height:1.35;min-height:48px}
.opt .k{font-family:var(--f-mono);font-weight:500;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);font-size:13px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 11%,var(--surface))}
.opt:disabled{cursor:default}
.vfrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface)}
.vfrow.right{border-color:var(--ok)} .vfrow.wrong{border-color:var(--bad)}
.tog{display:flex;gap:4px}
.tog button{width:44px;height:40px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-weight:800}
.tog button[aria-pressed="true"]{background:var(--brand);color:var(--brandInk);border-color:var(--brand)}
.asrow{display:grid;grid-template-columns:1fr;gap:6px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface)}
@media (min-width:560px){.asrow{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);align-items:center}}
.asrow.right{border-color:var(--ok)} .asrow.wrong{border-color:var(--bad)}
.asrow .fix{font-size:13px;color:var(--ok);grid-column:1/-1}
.arbox{display:grid;gap:8px}
.arbox div{padding:10px 12px;border-radius:10px;background:var(--surface2);border:1px solid var(--line)}
.arbox b{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block}
ol.seq{list-style:none;margin:0;padding:0;display:grid;gap:6px;counter-reset:s}
ol.seq li{counter-increment:s;display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:8px 10px;border-radius:8px;background:var(--surface2);border:1px solid var(--line)}
ol.seq li::before{content:counter(s);font-family:var(--f-mono);color:var(--accent);font-weight:500}
ol.seq li.right{border-color:var(--ok)} ol.seq li.wrong{border-color:var(--bad)}
.fb{border-radius:12px;padding:14px 16px;background:var(--surface);border:1.5px solid var(--line);display:grid;gap:6px}
.fb.good{border-color:var(--ok)} .fb.bad{border-color:var(--bad)}
.fb .verdict{font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.07em}
.fb.good .verdict{color:var(--ok)} .fb.bad .verdict{color:var(--bad)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.score{font-family:var(--f-display);font-weight:800;font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* ---------- ranking ---------- */
.rank{display:grid;gap:6px}
.rrow{display:grid;grid-template-columns:40px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.rrow .pos{font-family:var(--f-display);font-weight:800;font-size:20px;text-align:center;font-variant-numeric:tabular-nums}
.rrow.me{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.rrow .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.rrow .xp{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500}
.rrow .acc{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:end}
.pod{background:var(--surface);border:1px solid var(--line);border-radius:var(--r) var(--r) 0 0;padding:10px;text-align:center;display:grid;gap:2px;min-width:0}
.pod b{font-family:var(--f-display);font-size:26px}
.pod .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod.p1{min-height:150px;border-top:4px solid var(--hi)} .pod.p2{min-height:120px} .pod.p3{min-height:100px}

/* ---------- estações ---------- */
.stage{display:grid;gap:16px;align-items:start}
@media (min-width:860px){.stage{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}}
.fig{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px;display:grid;gap:6px;min-width:0}
.fig svg{width:100%;height:auto;display:block;max-height:70vh}
.photo{position:relative;width:100%;line-height:0;border-radius:8px;overflow:hidden;background:#000;touch-action:manipulation}
.photo img{width:100%;height:auto;display:block;user-select:none;-webkit-user-drag:none;max-height:72vh;object-fit:contain}
.photo .pin{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:3px solid var(--hi);box-shadow:0 0 0 2px rgba(0,0,0,.55);pointer-events:none}
.photo .pin.pulse::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px solid var(--hi);animation:pulse 1.4s ease-out infinite}
.photo .pin.ok{border-color:var(--ok)} .photo .pin.bad{border-color:var(--bad)}
.photo .pin.dot{width:16px;height:16px;margin:-8px 0 0 -8px;border-width:2px;background:rgba(0,0,0,.35)}
.photo .pin.dot.cur{border-color:var(--hi);background:var(--hi)}
.photo .lbl{position:absolute;transform:translate(-50%,-150%);background:rgba(0,0,0,.75);color:#fff;font-size:12px;line-height:1.2;padding:3px 6px;border-radius:6px;white-space:nowrap;pointer-events:none;font-family:var(--f-body)}
.credit{font-size:12px;color:var(--muted);line-height:1.4}
.credit a{color:inherit}
.imgfail{line-height:1.5;color:#fff;padding:24px;text-align:center;font-size:14px}
@keyframes pulse{0%{opacity:.9;transform:scale(.6)}100%{opacity:0;transform:scale(1.6)}}
.timer{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500}
.timer.low{color:var(--bad)}
.lvls{display:grid;gap:6px;grid-template-columns:1fr 1fr}
@media (min-width:560px){.lvls{grid-template-columns:repeat(3,1fr)}}
.lv{padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;min-height:44px}
.lv[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.lv.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.lv.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.edlist{display:grid;gap:4px;max-height:52vh;overflow:auto;padding-right:4px}
.edlist button{display:grid;grid-template-columns:18px 1fr auto;gap:8px;align-items:center;text-align:left;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.edlist button.cur{border-color:var(--hi);box-shadow:inset 3px 0 0 var(--hi)}
.edlist .st{width:12px;height:12px;border-radius:50%;border:2px solid var(--line)}
.edlist .st.on{background:var(--ok);border-color:var(--ok)}
.edlist .st.skip{background:var(--muted);border-color:var(--muted)}

/* ---------- SVG esquemas ---------- */
.wm{fill:var(--sv-my);stroke:var(--sv-edge);stroke-width:.7}
.tr{fill:var(--sv-my2);stroke:var(--sv-edge);stroke-width:.7}
.base{fill:var(--sv-my)}
.gm{fill:var(--sv-gray);stroke:var(--sv-grayEdge);stroke-width:.6}
.sg{fill:var(--sv-gel);stroke:var(--sv-grayEdge);stroke-width:.6}
.nt{fill:var(--sv-deep)}
.cc{fill:var(--surface);stroke:var(--sv-grayEdge)}
.cba{fill:var(--sv-my2);stroke:var(--sv-edge);stroke-width:.6}
.fis{fill:var(--surface)}
.sep{stroke:var(--surface);stroke-width:1.8}
.outline{fill:none;stroke:var(--sv-pia);stroke-width:2}
.nerve{fill:none;stroke:var(--sv-nerve);stroke-width:7;stroke-linecap:round}
.thin{fill:none;stroke:var(--sv-nerve);stroke-width:2;stroke-linecap:round}
.gang{fill:var(--sv-gang);stroke:var(--sv-nerve)}
.hit{fill:none;stroke:transparent;stroke-width:16;pointer-events:stroke;stroke-linecap:round}
.zone{fill:transparent;stroke:var(--muted);stroke-dasharray:3 3;stroke-opacity:.6}
.cord{fill:var(--sv-gray);stroke:var(--sv-pia);stroke-width:1.5}
.dura{fill:none;stroke:var(--muted);stroke-width:2;stroke-dasharray:6 4}
.cist{fill:var(--sv-csf)}
.deco{stroke:var(--sv-nerve);stroke-width:2;fill:none}
.fil{stroke:var(--sv-pia);stroke-width:2;fill:none}
.lab{font-family:var(--f-mono);font-size:9px;fill:var(--muted);letter-spacing:.08em}
.tick{stroke:var(--line);stroke-width:1}
.guide{stroke:var(--line);stroke-dasharray:2 3}
:root{--sv-my:#2c3172;--sv-my2:#454ba3;--sv-edge:#9196dc;--sv-gray:#e7d5dc;--sv-grayEdge:#b99aa8;--sv-gel:#f6ecf0;--sv-deep:#ad7a91;--sv-pia:#7a2e4a;--sv-nerve:#c4b9a4;--sv-gang:#ab9d82;--sv-csf:#dbe8f4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sv-my:#343b8f;--sv-my2:#5058bb;--sv-edge:#8a90dd;--sv-gray:#cdb6bf;--sv-grayEdge:#9a7d8a;--sv-gel:#e6d6dc;--sv-deep:#9c6b81;--sv-pia:#c06a8a;--sv-nerve:#a89f8f;--sv-gang:#8f856f;--sv-csf:#1d3247}}
:root[data-theme="dark"]{--sv-my:#343b8f;--sv-my2:#5058bb;--sv-edge:#8a90dd;--sv-gray:#cdb6bf;--sv-grayEdge:#9a7d8a;--sv-gel:#e6d6dc;--sv-deep:#9c6b81;--sv-pia:#c06a8a;--sv-nerve:#a89f8f;--sv-gang:#8f856f;--sv-csf:#1d3247}
[data-id]{cursor:pointer}
.hl:not(.ln):not(.hit){fill:var(--hi)!important;fill-opacity:1}
.zone.hl{fill-opacity:.75!important;stroke:none}
.ln.hl,.hit.hl{stroke:var(--hi)!important}

/* Camada 1 — resumos por módulo: pontos-chave e correlação clínica */
var RESUMO={
 intro:{pts:['O sistema nervoso central (SNC) tem encéfalo e medula; o periférico (SNP) tem nervos, gânglios e terminações.','Encéfalo = cérebro (telencéfalo + diencéfalo), cerebelo e tronco encefálico (mesencéfalo, ponte, bulbo).','Divisão funcional: SN segmentar (medula, tronco e nervos) e suprassegmentar (cérebro e cerebelo, com córtex).','Neurulação: placa neural → goteira → tubo neural; neuróporo rostral fecha por volta do 25º dia e o caudal por volta do 27º.','Vesículas primárias: prosencéfalo, mesencéfalo e rombencéfalo. Secundárias: telencéfalo, diencéfalo, mesencéfalo, metencéfalo e mielencéfalo.','Sulco limitante separa a lâmina alar (dorsal, sensitiva) da lâmina basal (ventral, motora).','Crista neural: gânglios sensitivos e autônomos, células de Schwann, medula da adrenal e melanócitos.'],
  clin:['Falha do neuróporo caudal: espinha bífida e mielomeningocele.','Falha do neuróporo rostral: anencefalia.','Ácido fólico antes e no início da gestação reduz defeitos do tubo neural.']},
 tecido:{pts:['Neurônio: corpo celular, dendritos e axônio; o potencial de ação nasce no segmento inicial do axônio.','Classificação: multipolares (maioria), bipolares (retina, olfato, gânglios do VIII) e pseudounipolares (gânglios sensitivos).','Glia do SNC: astrócitos, oligodendrócitos, micróglia e células ependimárias. No SNP: células de Schwann e satélites.','Mielina: oligodendrócito no SNC (vários axônios), Schwann no SNP (um internodo).','Condução saltatória entre nódulos de Ranvier torna a fibra mielínica mais rápida.','Sinapse química: entrada de cálcio no terminal libera neurotransmissor; o sentido é único.','Lesão axonal: degeneração walleriana distal e cromatólise no corpo celular. Regeneração boa no SNP e muito limitada no SNC.'],
  clin:['Esclerose múltipla: desmielinização central (oligodendrócitos).','Síndrome de Guillain-Barré: desmielinização periférica (Schwann).','Gliomas derivam da glia; astrocitomas são os mais comuns.']},
 nervos:{pts:['Envoltórios: endoneuro (fibra), perineuro (fascículo, barreira hematoneural) e epineuro (nervo).','Receptores: exteroceptores, proprioceptores e interoceptores.','Meissner: tato fino. Pacini: vibração. Terminações livres: dor e temperatura.','Fuso neuromuscular detecta estiramento; órgão tendinoso de Golgi detecta tensão.','Motoneurônios alfa inervam fibras extrafusais; gama inervam fibras intrafusais.','Placa motora: acetilcolina sobre receptores nicotínicos da fibra esquelética.','Unidade motora = um motoneurônio e as fibras que ele inerva.'],
  clin:['Miastenia grave: anticorpos contra receptores de acetilcolina.','Hanseníase: perda precoce de dor e temperatura por lesão de fibras finas.']},
 medmacro:{pts:['A medula vai do forame magno até L2 no adulto (L3 no recém-nascido).','Intumescência cervical (plexo braquial) e lombossacral (plexo lombossacral).','Abaixo do cone medular: filamento terminal e cauda equina.','31 pares de nervos espinais: 8 C, 12 T, 5 L, 5 S e 1 Co.','Topografia: de C2 a T10 soma-se 2 ao processo espinhoso; T11–T12 correspondem aos segmentos lombares; L1 aos sacrais.','Saco dural termina em S2; cisterna lombar entre L2 e S2.','Ligamentos denticulados são expansões da pia-máter.'],
  clin:['Punção lombar entre L3–L4 ou L4–L5, abaixo do fim da medula.','Peridural: espaço epidural. Raquianestesia: espaço subaracnóideo.','Cone medular: quadro simétrico, esfíncteres precoces. Cauda equina: radicular, doloroso, assimétrico.']},
 medest:{pts:['Substância cinzenta em H: colunas anterior (motora), posterior (sensitiva) e lateral (T1–L2, simpática).','Lâmina II de Rexed = substância gelatinosa (modulação da dor); lâmina IX = motoneurônios.','Núcleo torácico (C8–L2) origina o trato espinocerebelar posterior.','Funículo posterior: fascículos grácil e cuneiforme (acima de T6) — tato epicrítico e propriocepção, sem cruzar.','Funículo lateral: corticospinal lateral (já cruzado), espinotalâmico lateral (cruzado) e espinocerebelares.','Fibras espinotalâmicas cruzam na comissura branca anterior.','Motoneurônios mediais: musculatura axial; laterais: distal dos membros.'],
  clin:['Brown-Séquard: déficit motor e proprioceptivo do mesmo lado; dor e temperatura do lado oposto.','Siringomielia: perda de dor e temperatura em xale, bilateral.','Tabes dorsalis: funículos posteriores, Romberg positivo.','Degeneração combinada (B12): funículos posteriores e laterais.','Artéria espinal anterior: poupa os funículos posteriores.']},
 tronco:{pts:['Bulbo: pirâmides, decussação das pirâmides, olivas, tubérculos grácil e cuneiforme, óbex.','Ponte: base com sulco basilar, pedúnculos cerebelares médios.','Mesencéfalo: pedúnculos cerebrais, fossa interpeduncular, colículos superiores (visão) e inferiores (audição).','Origens aparentes: III fossa interpeduncular; IV dorsal; V lateral na ponte; VI, VII e VIII no sulco bulbopontino.','XII no sulco lateral anterior do bulbo; IX, X e XI no sulco lateral posterior.','IV ventrículo: colículo facial, trígonos do hipoglosso (medial) e do vago (lateral), área vestibular.','Pedúnculos cerebelares: inferior (bulbo), médio (ponte) e superior (mesencéfalo).'],
  clin:['O troclear é o único nervo que emerge da face dorsal e o mais longo no trajeto intracraniano.','Herniação tonsilar comprime o bulbo e os centros respiratórios.']},
 troncoest:{pts:['Lemnisco medial: fibras arqueadas internas que cruzam no bulbo.','Núcleo ambíguo: motor de IX, X e XI (faringe e laringe).','Núcleo do trato solitário: gustação e aferência visceral.','Núcleo de Edinger-Westphal: parassimpático da pupila (III).','Fascículo longitudinal medial: integra núcleos oculomotores e vestibulares.','Formação reticular: vigília (SARA), centros respiratório e vasomotor; rafe serotoninérgica, locus ceruleus noradrenérgico.','Substância negra dopaminérgica entre tegmento e base do pedúnculo.'],
  clin:['Weber: hemiplegia contralateral e III do mesmo lado (base do mesencéfalo).','Millard-Gubler: hemiplegia contralateral e VI/VII do mesmo lado (base da ponte).','Wallenberg: síndrome bulbar lateral (artéria cerebelar inferior posterior).','Síndrome bulbar medial: hemiplegia contralateral e língua desviando para o lado lesado.']},
 cerebelo:{pts:['Arquicerebelo (floculonodular): equilíbrio. Paleocerebelo (vérmis anterior): tônus e postura. Neocerebelo (hemisférios): coordenação fina.','Córtex: camadas molecular, de Purkinje e granular.','Células de Purkinje são a única saída do córtex e são inibitórias (GABA).','Núcleos centrais, de lateral para medial: denteado, emboliforme, globoso e fastigial.','Fibras trepadeiras vêm da oliva inferior; as demais aferências são musgosas.','Via denteado → pedúnculo superior → tálamo (VL) contralateral → córtex motor.','Efeito final homolateral: as vias cruzam duas vezes.'],
  clin:['Lesão de hemisfério: dismetria, tremor de intenção, disdiadococinesia do mesmo lado.','Lesão de vérmis: ataxia de tronco e marcha (ex.: meduloblastoma infantil).','Alcoolismo crônico: degeneração do vérmis anterior.']},
 diencefalo:{pts:['Partes: tálamo, hipotálamo, epitálamo e subtálamo; cavidade = III ventrículo.','Sulco hipotalâmico separa tálamo de hipotálamo.','Núcleos talâmicos: VPL (corpo), VPM (face), geniculado lateral (visão), geniculado medial (audição), VL (motor).','Hipotálamo: supraquiasmático (ritmo circadiano), supraóptico e paraventricular (ADH e ocitocina), lateral (fome), ventromedial (saciedade).','Hipotálamo anterior perde calor; posterior conserva calor.','Epitálamo: pineal (melatonina) e habênulas.','Subtálamo: núcleo subtalâmico, ligado aos núcleos da base.'],
  clin:['Hemibalismo: núcleo subtalâmico contralateral.','Diabetes insípido central: falta de ADH.','Síndrome talâmica (Dejerine-Roussy): dor contralateral intensa.']},
 telencefalo:{pts:['Sulcos principais: central, lateral, parieto-occipital, calcarino e do cíngulo.','Lobos: frontal, parietal, temporal, occipital, ínsula e límbico.','Giro pré-central: área motora (4). Giro pós-central: somestésica (3, 1, 2).','Área visual (17) nos lábios do sulco calcarino; auditiva (41, 42) no giro temporal transverso.','Broca (44, 45): giro frontal inferior esquerdo. Wernicke: parte posterior do giro temporal superior esquerdo.','Membro inferior representado no lóbulo paracentral (face medial).','Corpo caloso: rostro, joelho, tronco e esplênio; fibras comissurais.'],
  clin:['Afasia de Broca: expressão comprometida, compreensão preservada.','Afasia de Wernicke: fala fluente sem sentido, compreensão comprometida.','Herniação do úncus: compressão do III nervo (midríase).']},
 telest:{pts:['Corpo estriado = caudado + lentiforme (putame + globo pálido).','Neoestriado = caudado + putame; paleoestriado = globo pálido.','Cápsula interna: perna anterior (caudado/lentiforme), joelho e perna posterior (tálamo/lentiforme).','Perna posterior contém o corticospinal e radiações sensitivas; joelho contém o corticonuclear.','De lateral para medial: ínsula, cápsula extrema, claustro, cápsula externa, putame, globo pálido, cápsula interna, tálamo.','Fibras de associação (mesmo hemisfério), comissurais (entre hemisférios) e de projeção.','Área pré-frontal: planejamento, comportamento e juízo crítico.'],
  clin:['Lesão capsular: hemiplegia proporcionada contralateral.','Parkinson: perda dopaminérgica nigroestriatal.','Huntington: atrofia do caudado e coreia.','Negligência espacial: lesão parietal direita.']},
 meninges:{pts:['Dura-máter, aracnoide e pia-máter; espaço subaracnóideo com líquor.','Pregas da dura: foice do cérebro, tenda do cerebelo, foice do cerebelo e diafragma da sela.','Líquor: produzido pelos plexos corioides, absorvido pelas granulações aracnóideas.','Circulação: ventrículos laterais → forames interventriculares → III → aqueduto → IV → aberturas → espaço subaracnóideo.','Volume total no adulto em torno de 130–150 mL.','No crânio o espaço epidural é virtual; na coluna é real.'],
  clin:['Hematoma epidural: artéria meníngea média, forma biconvexa, intervalo lúcido.','Hematoma subdural: veias-ponte, forma em crescente, comum em idosos.','Hemorragia subaracnóidea: ruptura de aneurisma, cefaleia súbita intensa.','Estenose do aqueduto: hidrocefalia não comunicante.']},
 vasc:{pts:['Sistema carotídeo (carótidas internas) e vertebrobasilar (vertebrais → basilar).','Círculo arterial: cerebrais anteriores e posteriores, comunicantes e carótidas internas. A cerebral média não faz parte.','Cerebral anterior: face medial frontal e parietal. Média: face lateral. Posterior: occipital e face inferior do temporal.','Lenticuloestriadas (da cerebral média) irrigam cápsula interna e núcleos da base.','Barreira hematoencefálica: junções oclusivas endoteliais e pés de astrócitos.','Órgãos circunventriculares (área postrema, neuro-hipófise) não têm barreira.','Seio cavernoso: carótida interna e VI dentro; III, IV, V1 e V2 na parede.'],
  clin:['Cerebral anterior: déficit crural contralateral.','Cerebral média: déficit braquiofacial e afasia (hemisfério dominante).','Cerebral posterior: hemianopsia homônima com preservação macular.','Hemorragia hipertensiva: ruptura das lenticuloestriadas.']},
 nervesp:{pts:['Nervo espinal = raiz dorsal (sensitiva) + raiz ventral (motora); é misto.','Ramo dorsal: músculos profundos e pele do dorso. Ramo ventral: membros e parede anterolateral.','Plexos: cervical (C1–C4), braquial (C5–T1), lombar e sacral. Nervos torácicos seguem como intercostais.','Dermátomos de referência: C6 polegar, T4 mamilo, T10 umbigo, L4 face medial da perna, S1 borda lateral do pé.','Reflexos: bicipital C5–C6, tricipital C7, patelar L3–L4 (L2–L4), aquileu S1.','Frênico: C3–C5.'],
  clin:['Hérnia lombar posterolateral comprime a raiz que sai no forame abaixo (L5–S1 → S1).','Hérnia cervical: a raiz tem o número da vértebra de baixo (C5–C6 → C6).']},
 nervcran:{pts:['I olfação; II visão; III, IV e VI motricidade ocular; V sensibilidade da face e mastigação.','VII mímica, gustação dos 2/3 anteriores e glândulas; VIII audição e equilíbrio.','IX gustação do 1/3 posterior; X parassimpático visceral e laringe; XI trapézio e esternocleidomastóideo; XII língua.','Forames: canal óptico (II), fissura orbital superior (III, IV, V1, VI), redondo (V2), oval (V3), meato acústico interno (VII, VIII), jugular (IX, X, XI), canal do hipoglosso (XII).','Reflexo corneano: aferência V1, eferência VII. Fotomotor: aferência II, eferência III.','Núcleo facial superior recebe fibras dos dois hemisférios.'],
  clin:['Paralisia facial periférica: toda a hemiface. Central: só a metade inferior, contralateral.','Lesão do XII: língua desvia para o lado lesado.','Lesão do X: úvula desvia para o lado são.','Aneurisma da comunicante posterior: III com midríase.']},
 sna:{pts:['Simpático: origem toracolombar (T1–L2), gânglios paravertebrais e pré-vertebrais, pré-ganglionar curta.','Parassimpático: origem craniossacral (III, VII, IX, X e S2–S4), gânglios junto às vísceras.','Pré-ganglionares: acetilcolina. Pós-ganglionares simpáticas: noradrenalina (exceto sudoríparas: acetilcolina).','Medula da adrenal equivale a um gânglio simpático.','Gânglios parassimpáticos da cabeça: ciliar (III), pterigopalatino e submandibular (VII), ótico (IX).','Bexiga: parassimpático contrai o detrusor; simpático relaxa.'],
  clin:['Síndrome de Horner: ptose, miose e anidrose do mesmo lado.','Tumor de Pancoast compromete a cadeia simpática cervical.','Disreflexia autonômica em lesões acima de T6.']},
 vias:{pts:['Dor e temperatura: gânglio → coluna posterior → cruza na comissura branca → espinotalâmico lateral → VPL → giro pós-central.','Tato epicrítico e propriocepção: gânglio → grácil/cuneiforme → núcleos no bulbo → cruza → lemnisco medial → VPL → córtex.','Face: núcleos do trigêmeo → lemnisco trigeminal → VPM.','Visão: retina → nervo → quiasma (cruzam fibras nasais) → trato → geniculado lateral → radiação → calcarino.','Audição: gânglio espiral → núcleos cocleares → colículo inferior → geniculado medial → giro temporal transverso. Via bilateral.','Propriocepção inconsciente vai ao cerebelo, não ao córtex.'],
  clin:['Quiasma (tumor de hipófise): hemianopsia bitemporal.','Trato óptico: hemianopsia homônima contralateral.','Alça de Meyer (temporal): quadrantanopsia superior contralateral.']},

 }

function record(q,ok,partial){
 var p=S.priv,st=p.stats;if(st.week.id!==weekId())st.week={id:weekId(),xp:0};
 var gain=ok?XPD[q.d]:Math.round((partial||0)*XPD[q.d]*0.5);

 while(out.length<n&&left.length){
  var tot=0,ws=left.map(function(q){var v=(w[q.id]||1)*(seen[q.id]?1:2.2);tot+=v;return v});

function dayKey(d){d=d||new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function dayNum(d){d=d||new Date();return Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()))/864e5)}
var SRS_INT=[0,1,3,7,16,35];

window.__onRecord=function(q,ok){
 var p=S.priv,k=dayKey(),w=weekId();
 p.days[k]=(p.days[k]||0)+1;
 var wk=p.wks[w]||(p.wks[w]={a:0,c:0});wk.a++;if(ok)wk.c++;
 var s=p.srs[q.id],t=dayNum();
 if(!s){s=p.srs[q.id]={b:ok?2:1,due:t+(ok?SRS_INT[2]:SRS_INT[1])}}
 else if(ok){s.b=Math.min(5,s.b+1);s.due=t+SRS_INT[s.b]}
 else{s.b=1;s.due=t+1}
 checkBadges();
};
window.__onGame=function(g,pts){var p=S.priv;p.days[dayKey()]=(p.days[dayKey()]||0)+1;checkBadges()};
function dueList(){var t=dayNum(),s=S.priv.srs;return Object.keys(s).filter(function(id){return QBY[id]&&s[id].due<=t}).map(function(id){return QBY[id]})}
function streak(){var d=new Date(),n=0,days=S.priv.days;if(!days[dayKey(d)]){d.setDate(d.getDate()-1)}while(days[dayKey(d)]){n++;d.setDate(d.getDate()-1)}return n}
function bestStreak(){var keys=Object.keys(S.priv.days).sort(),best=0,cur=0,prev=null;keys.forEach(function(k){var t=dayNum(new Date(k+'T12:00:00'));cur=(prev!=null&&t===prev+1)?cur+1:1;prev=t;best=Math.max(best,cur)});return best}
function cnt(k,v){var c=S.priv.c;if(v===undefined)return c[k]||0;c[k]=v}
function inc(k,n){S.priv.c[k]=(S.priv.c[k]||0)+(n||1);checkBadges()}

/* ---- semente determinística (desafio semanal, duelo) ---- */
function rng(seed){var s=seed>>>0;return function(){s=(s+0x6D2B79F5)>>>0;var t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function seededPick(arr,n,seed){var r=rng(seed),a=arr.slice().sort(function(x,y){return x.id<y.id?-1:1});for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a.slice(0,n)}
function hashNum(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}

function heatmap(){
 var days=S.priv.days,cols=18,cell=12,gap=3,today=new Date(),start=new Date(today);start.setDate(start.getDate()-(cols*7-1)-((today.getDay()+6)%7>=0?0:0));
 // alinhar para começar numa segunda-feira
 var end=new Date(today);var back=cols*7-1-(6-((today.getDay()+6)%7));start=new Date(today);start.setDate(today.getDate()-back);
 var out='',max=1,k;for(k in days)max=Math.max(max,days[k]);
 for(var c=0;c<cols;c++)for(var r=0;r<7;r++){var d=new Date(start);d.setDate(start.getDate()+c*7+r);if(d>end)continue;var v=days[dayKey(d)]||0;var lv=v?Math.min(4,1+Math.floor(3*v/max)):0;out+='<rect x="'+(c*(cell+gap))+'" y="'+(r*(cell+gap))+'" width="'+cell+'" height="'+cell+'" rx="3" class="hm l'+lv+'"><title>'+d.toLocaleDateString('pt-BR')+': '+v+' atividade'+(v===1?'':'s')+'</title></rect>'}
 var W=cols*(cell+gap)-gap,H=7*(cell+gap)-gap;
 return '<svg class="heat" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Dias de estudo nas últimas '+cols+' semanas">'+out+'</svg>';
}
function accChart(){
 var pts=[],d=new Date();for(var i=7;i>=0;i--){var x=new Date(d);x.setDate(d.getDate()-i*7);var id=weekId(x),w=S.priv.wks[id];var mon=new Date(x);mon.setDate(x.getDate()-((x.getDay()+6)%7));pts.push({lab:('0'+mon.getDate()).slice(-2)+'/'+('0'+(mon.getMonth()+1)).slice(-2),v:w&&w.a?Math.round(100*w.c/w.a):null,n:w?w.a:0})}
 var W=320,H=140,pl=28,pr=8,pt=10,pb=22,iw=W-pl-pr,ih=H-pt-pb;
 var X=function(i){return pl+i*iw/7},Y=function(v){return pt+ih-(v/100)*ih};
 var grid=[0,50,100].map(function(v){return '<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" class="cgrid"/><text x="'+(pl-6)+'" y="'+(Y(v)+3)+'" class="clab" text-anchor="end">'+v+'%</text>'}).join('');
 var valid=pts.map(function(p,i){return p.v==null?null:[X(i),Y(p.v),p]}).filter(Boolean);
 var line=valid.map(function(p,i){return(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)}).join(' ');
 var area=valid.length>1?line+' L'+valid[valid.length-1][0].toFixed(1)+','+Y(0)+' L'+valid[0][0].toFixed(1)+','+Y(0)+' Z':'';
 var labs=pts.map(function(p,i){return i%2===1||i===7?'<text x="'+X(i)+'" y="'+(H-6)+'" class="clab" text-anchor="middle">'+p.lab+'</text>':''}).join('');
 var dots=valid.map(function(p,i){var last=i===valid.length-1;return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+(last?4.5:3)+'" class="'+(last?'cdot last':'cdot')+'"><title>Semana de '+p[2].lab+': '+p[2].v+'% em '+p[2].n+' respostas</title></circle>'}).join('');
 return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Acerto por semana">'+grid+(area?'<path d="'+area+'" class="carea"/>':'')+(line?'<path d="'+line+'" class="cline"/>':'')+dots+labs+(valid.length?'':'<text x="'+(W/2)+'" y="'+(H/2)+'" class="clab" text-anchor="middle">Responda questões para ver sua evolução</text>')+'</svg>';
}

function shuffleSeed(a,seed){var r=rng(seed);a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

function avatarImage(file){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){var img=new Image();img.onload=function(){var s=96,c=document.createElement('canvas');c.width=s;c.height=s;var g=c.getContext('2d');var m=Math.min(img.width,img.height);g.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,s,s);res(c.toDataURL('image/jpeg',0.8))};img.onerror=rej;img.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
