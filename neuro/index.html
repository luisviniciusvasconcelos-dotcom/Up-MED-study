/* Capítulo 1 — Evolução do sistema nervoso */
LESSON.filo=[
 {t:'Por que estudar a evolução',b:[
  ['p','Muitas peças do sistema nervoso humano só fazem sentido quando olhamos para trás. Os reflexos da medula, a posição dos gânglios sensitivos e o tamanho do cérebro são respostas a problemas que animais muito mais simples já precisavam resolver: **perceber o ambiente, levar a informação adiante e reagir**.'],
  ['p','Toda célula viva tem três propriedades básicas que, no sistema nervoso, chegam ao máximo de especialização:'],
  ['ul',['**Irritabilidade (excitabilidade):** perceber um estímulo.','**Condutibilidade:** levar o sinal de um ponto a outro da célula.','**Contratilidade:** responder encurtando a célula.']],
  ['p','Um organismo unicelular, como a ameba, tem as três ao mesmo tempo, mas nenhuma delas especializada. Quando tocada, ela se afasta devagar, retraindo um lado e emitindo pseudópodes do outro. É uma resposta real, porém lenta e grosseira.'],
  ['key','A evolução do sistema nervoso é a história da **divisão de trabalho**: células diferentes passam a cuidar de perceber, conduzir e responder.']]},
 {t:'Das esponjas aos primeiros neurônios',b:[
  ['p','Nas **esponjas**, algumas células que revestem os poros já têm uma parte superficial sensível e uma parte profunda contrátil. Uma substância irritante na água faz essas células se contraírem e fecharem o poro. Ainda não há neurônio: a mesma célula percebe e responde.'],
  ['p','Nos animais com várias camadas de células, o músculo foi para dentro e perdeu contato com o ambiente. Surgiram então, na superfície, células especializadas em **perceber e conduzir**, ligadas ao músculo mais profundo. Esses foram os **primeiros neurônios**, provavelmente nos celenterados (como as anêmonas e águas-vivas).'],
  ['p','Na ponta desses neurônios apareceu o **receptor**, uma estrutura que transforma um estímulo físico ou químico em impulso nervoso. O impulso segue até o **efetuador**, que é um músculo ou uma glândula.'],
  ['fig','filoEvo','Etapas da especialização: célula única, célula muscular primitiva, neurônio sensitivo ligado ao músculo.'],
  ['p','O sistema nervoso dos celenterados é **difuso**, uma rede espalhada pelo corpo. Em vermes achatados e anelídeos, os neurônios passam a se agrupar: começa a **centralização**, com gânglios e cordões nervosos.'],
  ['chk','Qual estrutura transforma um estímulo em impulso nervoso?',['O efetuador','O receptor','A sinapse'],1,'O receptor converte energia do estímulo em impulso; o efetuador (músculo ou glândula) executa a resposta.']]},
 {t:'O arco reflexo na minhoca',b:[
  ['p','A minhoca é segmentada. Cada segmento tem um par de gânglios unidos por uma **corda ventral**, e na frente há os gânglios cerebroides. Num segmento já aparece o desenho básico de um **arco reflexo**:'],
  ['ol',['**Receptor** na pele.','**Neurônio aferente** (sensitivo), que leva o impulso ao gânglio.','**Centro**: o gânglio, onde acontece a sinapse.','**Neurônio eferente** (motor), que sai do gânglio.','**Efetuador**: o músculo do segmento.']],
  ['key','**Aferente** é tudo o que chega a uma região do sistema nervoso. **Eferente** é tudo o que sai dela. Os termos são relativos: uma fibra pode ser eferente para o tálamo e aferente para o córtex.'],
  ['p','Quando o estímulo e a resposta ficam no mesmo segmento, o arco é **intrassegmentar** e tem uma sinapse. Mas às vezes a minhoca precisa responder em outro segmento. Para isso existe um terceiro tipo de célula, o **neurônio de associação**, que liga segmentos diferentes pela corda ventral. O arco passa a ser **intersegmentar**, com três neurônios e duas sinapses.'],
  ['fig','filoArco','Arco intrassegmentar (à esquerda) e intersegmentar (à direita).'],
  ['chk','Um arco reflexo intersegmentar típico tem:',['Dois neurônios e uma sinapse','Três neurônios e duas sinapses','Um neurônio e nenhuma sinapse'],1,'O neurônio de associação acrescenta um elo: aferente, associação e eferente, com duas sinapses.']]},
 {t:'Os mesmos reflexos na medula humana',b:[
  ['p','A medula espinal dos vertebrados conserva a segmentação: cada par de nervos espinais corresponde a um segmento. Por isso ela tem reflexos que lembram os da minhoca.'],
  ['p','O **reflexo patelar** é o exemplo clássico de reflexo que se fecha em poucos segmentos. O martelo estira o tendão do quadríceps, os receptores do músculo disparam, o neurônio sensitivo entra na medula lombar e faz sinapse direto com o neurônio motor, e a perna se estende.'],
  ['p','Muitos outros reflexos medulares são **intersegmentares**: o estímulo chega num nível e a resposta sai em níveis distantes, graças a neurônios de associação com axônios longos que sobem ou descem na medula. Um experimento clássico em cães com a medula cervical seccionada mostra isso: estimular a pele do dorso do tórax faz a pata traseira do mesmo lado fazer movimentos rítmicos de coçar.'],
  ['clin','Quando o neurologista testa reflexos, está examinando arcos com níveis conhecidos. Um reflexo abolido aponta para lesão do próprio arco (nervo, raiz ou segmento medular); um reflexo exaltado sugere que o controle de cima, que normalmente freia o arco, foi perdido.'],
  ['p','Na prática, arcos estritamente de um só segmento talvez nem existam nos mamíferos: a menor porção de medula que mantém um reflexo isolado costuma ter dois ou três segmentos.']]},
 {t:'O neurônio sensitivo ao longo da evolução',b:[
  ['p','A posição do **corpo** do neurônio sensitivo mudou bastante:'],
  ['tbl',[['Grupo','Onde fica o corpo','Forma do neurônio'],['Alguns anelídeos','No epitélio da superfície','Unipolar'],['Moluscos','No interior do corpo, com um prolongamento até a superfície','Bipolar'],['Vertebrados','Em gânglios sensitivos junto ao SNC, sem entrar nele','Pseudounipolar, na maioria']]],
  ['fig','filoSens','O corpo do neurônio sensitivo se afasta da superfície e se aproxima do sistema nervoso central.'],
  ['p','A tendência é de **centralização do corpo celular**. A vantagem é proteger o corpo, que não se regenera, enquanto o axônio periférico, exposto, pode se regenerar quando lesado.'],
  ['p','Com a formação de um **meio interno** nos animais mais complexos, parte dos neurônios aferentes passou a informar sobre as vísceras e não só sobre o ambiente externo.'],
  ['mn','Nos vertebrados o corpo do neurônio sensitivo fica **fora** do SNC, mas **perto** dele: nos gânglios das raízes dorsais e nos gânglios sensitivos dos nervos cranianos.']]},
 {t:'O neurônio motor e o de associação',b:[
  ['p','O **neurônio eferente** surgiu dentro do sistema nervoso central e, na maioria, ficou lá. A exceção são os neurônios que comandam **músculo liso, músculo cardíaco e glândulas**: seus corpos estão em **gânglios viscerais**, fora do SNC. São os neurônios pós-ganglionares do sistema nervoso autônomo.'],
  ['ul',['Músculo estriado esquelético: corpo do neurônio motor sempre dentro do SNC (por exemplo, na coluna anterior da medula).','Músculo liso, cardíaco e glândulas: último neurônio da cadeia com corpo num gânglio autônomo.']],
  ['p','O **neurônio de associação** aumentou o número de sinapses e permitiu comportamentos cada vez mais elaborados. Seu corpo sempre ficou dentro do SNC e ele se tornou de longe o tipo mais numeroso. Os de axônio curto, que se ligam só a vizinhos, são chamados **interneurônios** (internunciais).'],
  ['chk','O corpo do neurônio que inerva diretamente o músculo liso do intestino fica:',['Na coluna anterior da medula','Num gânglio visceral, fora do SNC','No gânglio da raiz dorsal'],1,'Músculo liso, cardíaco e glândulas recebem o neurônio pós-ganglionar, cujo corpo está num gânglio autônomo.']]},
 {t:'Encefalização',b:[
  ['p','A extremidade anterior do animal é a primeira a encontrar o ambiente quando ele se desloca. Ali se concentraram a boca, os órgãos dos sentidos e, junto deles, os neurônios de associação. Esse acúmulo deu origem aos gânglios cerebroides dos invertebrados e ao **encéfalo** dos vertebrados.'],
  ['p','O crescimento progressivo do encéfalo ao longo da evolução dos vertebrados se chama **encefalização** e chega ao máximo no ser humano, com cerca de **86 bilhões de neurônios**. As funções psíquicas superiores dependem justamente desses neurônios de associação.'],
  ['key','Três tipos fundamentais explicam todos os neurônios humanos: **aferente, eferente e de associação**. Os nomes mudam em cada região, mas a lógica é sempre essa.'],
  ['chk','O termo encefalização se refere a:',['Concentração de neurônios de associação na extremidade anterior','Migração dos corpos sensitivos para a pele','Fusão dos gânglios autônomos na medula'],0,'Encefalização é o acúmulo de neurônios de associação na cabeça, formando o encéfalo.']]}
];
RESUMO.filo={pts:['Três propriedades da célula especializadas no sistema nervoso: irritabilidade, condutibilidade e contratilidade.','Primeiros neurônios: celenterados, em sistema nervoso difuso; centralização em vermes achatados e anelídeos.','Receptor transforma estímulo em impulso; efetuador (músculo ou glândula) produz a resposta.','Aferente chega a uma área do sistema nervoso; eferente sai dela.','Arco intrassegmentar: aferente + eferente, uma sinapse. Intersegmentar: acrescenta neurônio de associação, duas sinapses.','Corpo do neurônio sensitivo: superfície (anelídeos) → interior (moluscos) → gânglios junto ao SNC (vertebrados).','Neurônio motor somático tem corpo no SNC; o que inerva músculo liso, cardíaco e glândulas tem corpo num gânglio visceral.','Neurônios de associação são a maioria; seu acúmulo anterior gerou o encéfalo (encefalização), com cerca de 86 bilhões de neurônios no ser humano.'],
 clin:['Reflexos testados no exame neurológico são arcos com níveis conhecidos: o patelar fecha nos segmentos lombares altos.','Reflexo abolido sugere lesão do arco; reflexo exaltado sugere perda do controle descendente.','O corpo do neurônio sensitivo, protegido no gânglio, não se regenera; o axônio periférico pode se regenerar.']};
QB.push(
 L(mc('filo',1,'A propriedade que permite a uma célula perceber uma mudança no ambiente é a:',['Irritabilidade','Contratilidade','Condutibilidade','Secretoriedade'],'Irritabilidade (excitabilidade) é a capacidade de ser sensível a um estímulo.'),'As três propriedades do protoplasma relevantes aqui são irritabilidade (perceber), condutibilidade (levar o sinal) e contratilidade (responder encurtando). O neurônio é a célula que levou irritabilidade e condutibilidade ao máximo.','Testes de sensibilidade no exame neurológico avaliam justamente a capacidade dos receptores e vias de perceber e conduzir estímulos.'),
 L(mc('filo',1,'Os primeiros neurônios surgiram, provavelmente, em qual grupo?',['Celenterados','Esponjas','Anelídeos','Moluscos'],'Nos celenterados aparecem células de superfície especializadas em perceber e conduzir, ligadas a músculos mais profundos.'),'Nas esponjas a mesma célula percebe e contrai. Nos celenterados, o músculo fica mais interno e células de superfície, os primeiros neurônios, passam a levar o estímulo até ele, num sistema nervoso difuso.','A ideia de que o músculo depende de um neurônio para ser ativado é a base para entender a paralisia por lesão do nervo motor.'),
 L(mc('filo',2,'Na esponja, a célula muscular primitiva que fecha o poro:',['Recebe o estímulo e se contrai, sem neurônio intermediário','Recebe impulsos de um neurônio sensitivo próximo','Depende de um gânglio central para responder','Secreta substância que ativa células vizinhas'],'Nas esponjas não há neurônio: a mesma célula tem uma parte sensível e outra contrátil.'),'A parte superficial dessa célula tem irritabilidade e condutibilidade e a parte profunda, contratilidade. O estímulo irritante na água provoca contração e fechamento do poro.','Mostra a forma mais simples de resposta a um estímulo, sem sinapse; o arco reflexo verdadeiro só aparece com neurônios separados.'),
 L(vf('filo',1,'Julgue sobre a evolução do sistema nervoso.',[['O sistema nervoso dos celenterados é difuso, em rede.',true],['Nos anelídeos já há gânglios unidos por uma corda ventral.',true],['A ameba tem um neurônio rudimentar especializado em conduzir.',false],['A centralização do sistema nervoso aparece em vermes achatados e anelídeos.',true]],'A ameba tem as propriedades do protoplasma, mas nenhuma especializada; não há neurônio.'),'O caminho foi: célula única sem especialização, célula muscular primitiva nas esponjas, neurônios em rede nos celenterados e agrupamento em gânglios e cordões nos vermes achatados e anelídeos.','Entender a organização segmentar dos anelídeos ajuda a raciocinar sobre a medula humana, que também é segmentada.'),
 L(mc('filo',1,'São chamados aferentes os neurônios ou fibras que:',['Chegam a uma área do sistema nervoso','Saem de uma área do sistema nervoso','Ligam dois hemisférios entre si','Inervam apenas glândulas'],'Aferente entra, eferente sai, sempre em relação a uma área de referência.'),'O termo é relativo à área considerada. Uma fibra que sai do tálamo é eferente do tálamo e aferente para o córtex. Por isso é importante dizer sempre em relação a quê.','Raízes dorsais da medula são aferentes (sensitivas); raízes ventrais são eferentes (motoras). Essa distinção orienta o exame de radiculopatias.'),
 L(mc('filo',2,'Uma fibra que sai do tálamo e chega ao córtex cerebral é:',['Eferente para o tálamo e aferente para o córtex','Aferente para o tálamo e eferente para o córtex','Eferente para os dois','Aferente para os dois'],'Ela sai do tálamo (eferente dele) e entra no córtex (aferente para ele).'),'Aferente e eferente não são propriedades fixas da fibra; dependem do ponto de referência. A mesma fibra pode receber os dois nomes conforme a estrutura considerada.','Em neurologia, descrever bem o sentido das fibras evita confusão ao interpretar lesões ao longo das vias.'),
 L(od('filo',1,'Ordene os elementos de um arco reflexo simples, do estímulo à resposta.',['Receptor','Neurônio aferente','Centro (sinapse)','Neurônio eferente','Efetuador'],'O impulso vai do receptor ao efetuador passando pelo centro.'),'O receptor transforma o estímulo; o neurônio aferente leva ao centro; no centro ocorre a sinapse; o neurônio eferente sai até o efetuador, músculo ou glândula.','Cada elo pode ser testado: um reflexo abolido indica lesão em algum ponto do arco.'),
 L(mc('filo',2,'No arco reflexo intersegmentar da minhoca, o elemento que liga um segmento a outro é o:',['Neurônio de associação','Receptor cutâneo','Neurônio motor do mesmo segmento','Efetuador muscular'],'O neurônio de associação percorre a corda ventral e liga segmentos diferentes.'),'O estímulo entra por um segmento, o neurônio sensitivo faz sinapse com um neurônio de associação, e este, pela corda ventral, faz sinapse com o neurônio motor de outro segmento. São três neurônios e duas sinapses.','Na medula humana, neurônios de associação com axônios longos explicam reflexos que envolvem vários níveis, como a retirada de um membro com ajuste postural do outro.'),
 L(as('filo',2,'Associe o tipo de arco reflexo à característica.',[['Intrassegmentar','Aferente e eferente no mesmo segmento'],['Intersegmentar','Resposta em segmento distante do estímulo'],['Arco com associação','Três neurônios e duas sinapses'],['Arco monossináptico','Dois neurônios e uma sinapse']],'O neurônio de associação acrescenta um neurônio e uma sinapse ao arco.'),'O arco mais simples liga diretamente o neurônio sensitivo ao motor. Quando há neurônio de associação, o arco ganha um elo e pode alcançar outros segmentos.','O reflexo patelar é o exemplo clássico de arco monossináptico usado no exame neurológico.'),
 L(cs('filo',2,'No exame de um paciente, o médico percute o tendão patelar e a perna se estende. Qual afirmação descreve corretamente o arco envolvido?',['O neurônio sensitivo entra na medula e faz sinapse com o neurônio motor da coluna anterior','O impulso sensitivo vai ao córtex motor e depois desce até o quadríceps','O reflexo depende de neurônio de associação no tronco encefálico','O corpo do neurônio sensitivo fica na coluna anterior da medula'],'O reflexo patelar se fecha na medula, com o neurônio sensitivo fazendo sinapse direta com o motor.'),'O estiramento do tendão ativa receptores do quadríceps; o neurônio sensitivo, com corpo no gânglio da raiz dorsal, entra na medula lombar e faz sinapse com o neurônio motor. O impulso volta ao quadríceps e a perna se projeta para frente.','Reflexo patelar abolido sugere lesão do arco nos segmentos lombares altos ou no nervo femoral; reflexo vivo demais sugere lesão do controle descendente.'),
 L(mc('filo',3,'No experimento clássico do reflexo de coçar em cães com a medula cervical seccionada, estimular a pele do dorso do tórax provoca movimentos rítmicos da pata posterior do mesmo lado. Isso demonstra que:',['A medula sozinha organiza reflexos entre segmentos distantes','O encéfalo é indispensável para qualquer reflexo','Só existem reflexos intrassegmentares nos mamíferos','O estímulo é levado ao cerebelo pela medula'],'Mesmo sem o encéfalo, neurônios de associação ligam segmentos torácicos aos lombossacrais.'),'O arco tem neurônios sensitivos da pele torácica, neurônios de associação com axônio longo descendente e neurônios motores da pata posterior. A secção cervical elimina a influência do encéfalo, mostrando que o circuito é medular.','Em lesões medulares completas, reflexos abaixo do nível podem persistir ou ficar exagerados, justamente porque os circuitos medulares continuam funcionando.'),
 L(ar('filo',3,'Nos mamíferos, os arcos reflexos estritamente de um só segmento talvez não existam.','A menor porção de medula que mantém atividade reflexa isolada contém dois ou três segmentos.',0,'A observação experimental sustenta a asserção.'),'Mesmo reflexos considerados intrassegmentares, como o patelar, envolvem segmentos vizinhos. Isso foi visto experimentalmente em gatos.','Por isso os reflexos do exame neurológico são associados a dois segmentos (por exemplo, L3–L4 no patelar), e não a um só.'),
 L(as('filo',2,'Associe o grupo animal à posição do corpo do neurônio sensitivo.',[['Anelídeos (alguns)','No epitélio da superfície'],['Moluscos','No interior, com prolongamento na superfície'],['Vertebrados','Em gânglios junto ao SNC'],['Esponjas','Não há neurônio sensitivo']],'O corpo do neurônio sensitivo foi se afastando da superfície e se aproximando do SNC.'),'Em anelídeos o neurônio é unipolar e fica no epitélio. Em moluscos é bipolar e o corpo fica no interior. Em vertebrados quase todos os corpos sensitivos estão em gânglios sensitivos, perto do SNC sem entrar nele.','Os gânglios das raízes dorsais e dos nervos cranianos são alvo de doenças específicas, como o herpes-zóster, que fica latente nesses corpos celulares.'),
 L(ar('filo',2,'Durante a evolução, o corpo do neurônio sensitivo se aproximou do sistema nervoso central.','Ao contrário do axônio, o corpo do neurônio não se regenera, e ficar protegido é vantajoso.',0,'A razão explica a vantagem evolutiva da centralização.'),'Na superfície, o corpo celular ficaria exposto a lesões. Nos vertebrados ele fica em gânglios protegidos, enquanto o axônio periférico, que pode se regenerar, alcança a pele e os órgãos.','Na lesão de nervo periférico, a recuperação depende da regeneração do axônio a partir do corpo celular, que precisa estar íntegro.'),
 L(mc('filo',2,'Nos vertebrados, a quase totalidade dos neurônios aferentes tem o corpo:',['Em gânglios sensitivos junto ao SNC','Na pele, junto ao receptor','Na coluna anterior da medula','Nos gânglios do sistema autônomo'],'Corpos dos neurônios sensitivos estão em gânglios sensitivos, fora do SNC mas perto dele.'),'Os gânglios das raízes dorsais (espinais) e os gânglios sensitivos de nervos cranianos abrigam esses corpos. Exceções existem, como o núcleo mesencefálico do trigêmeo, mas são raras.','O herpes-zóster reativa a partir do gânglio sensitivo e produz lesões no dermátomo correspondente.'),
 L(mc('filo',2,'O neurônio que inerva diretamente uma glândula salivar tem o corpo:',['Num gânglio visceral do sistema autônomo','No núcleo salivatório do tronco encefálico','No gânglio sensitivo do nervo facial','Na própria glândula, como receptor'],'O último neurônio para glândula, músculo liso ou cardíaco é pós-ganglionar, com corpo num gânglio visceral.'),'O neurônio do tronco encefálico é pré-ganglionar: seu axônio vai até um gânglio. Lá, o neurônio pós-ganglionar envia o axônio à glândula. Essa é a organização de dois neurônios do sistema autônomo.','Lesões de gânglios autônomos ou de fibras pós-ganglionares alteram secreção e função visceral, como o olho seco ou a boca seca em algumas neuropatias.'),
 L(vf('filo',2,'Julgue sobre o neurônio eferente.',[['Neurônios motores de músculo esquelético têm corpo dentro do SNC.',true],['Neurônios que inervam músculo cardíaco têm corpo em gânglios viscerais.',true],['Todos os neurônios eferentes têm corpo fora do SNC.',false],['O impulso eferente pode causar contração ou secreção.',true]],'Eferentes somáticos têm corpo no SNC; os pós-ganglionares autônomos, fora.'),'O neurônio eferente nasceu dentro do SNC e ali ficou, exceto os que comandam músculo liso, músculo cardíaco e glândulas, que estão em gânglios viscerais.','A poliomielite destrói corpos de neurônios motores na coluna anterior da medula, causando paralisia flácida.'),
 L(mc('filo',2,'Os neurônios de associação de axônio curto, que se ligam apenas a vizinhos, são chamados:',['Interneurônios ou internunciais','Neurônios pseudounipolares','Neurônios pós-ganglionares','Neurônios de projeção'],'Interneurônios fazem conexões locais.'),'Neurônios de associação com axônio longo ligam áreas distantes; os de axônio curto, interneurônios, organizam circuitos locais, como na medula e no córtex.','Interneurônios inibitórios da medula participam da inibição recíproca: ao contrair um músculo, o antagonista relaxa.'),
 L(mc('filo',1,'O tipo de neurônio que mais aumentou em número ao longo da evolução dos vertebrados foi o:',['De associação','Sensitivo','Motor somático','Pós-ganglionar'],'Os neurônios de associação são a imensa maioria no SNC humano.'),'O aumento dos neurônios de associação multiplicou as sinapses e permitiu comportamentos complexos. Concentrados na cabeça, formaram o encéfalo.','As funções cognitivas avaliadas no exame do estado mental dependem desses neurônios de associação do córtex.'),
 L(gp('filo',1,'O crescimento progressivo do encéfalo ao longo da evolução dos vertebrados é chamado de ____.',['encefalização','encefalizacao'],'Encefalização: acúmulo de neurônios de associação na extremidade anterior.'),'A extremidade anterior encontra primeiro o ambiente; ali se concentraram boca, órgãos dos sentidos e neurônios de associação, originando o encéfalo.','O grau de encefalização humano explica a grande dependência de funções corticais, vulneráveis em lesões difusas como o traumatismo craniano grave.'),
 L(mc('filo',2,'A concentração de neurônios na extremidade anterior dos animais se explica principalmente porque essa região:',['Primeiro encontra as mudanças do ambiente quando o animal se desloca','Tem menor exposição a estímulos nocivos','Não possui órgãos dos sentidos','É a única com músculos estriados'],'A extremidade anterior explora o ambiente e concentra órgãos dos sentidos e o aparelho bucal.'),'Olhos, antenas, ouvidos e boca ficaram na frente. Neurônios de associação se acumularam junto deles, formando gânglios cerebroides nos invertebrados e o encéfalo nos vertebrados.','Isso explica por que vários nervos cranianos são sensoriais especiais: visão, audição, olfação e gustação estão na cabeça.'),
 L(gp('filo',2,'O encéfalo humano tem cerca de ____ bilhões de neurônios.',['86','oitenta e seis'],'Estimativas recentes apontam cerca de 86 bilhões de neurônios.'),'O número vem de contagens por fracionamento isotrópico. A maior parte está no cerebelo, embora o córtex cerebral concentre as funções mais elaboradas.','A perda neuronal difusa em doenças degenerativas reduz o volume encefálico visível nas imagens.'),
 L(ar('filo',2,'Todos os neurônios humanos podem ser enquadrados em três tipos fundamentais: aferente, eferente e de associação.','Os neurônios de associação são o tipo menos numeroso no sistema nervoso central dos vertebrados.',2,'A asserção é verdadeira; a razão é falsa, pois os de associação são a maioria.'),'Os nomes variam em cada região, mas a função básica cabe em um dos três tipos. Os de associação são, de longe, os mais numerosos.','A classificação ajuda a localizar lesões: déficits sensitivos, motores ou de integração apontam para tipos de neurônio diferentes.'),
 L(mc('filo',3,'Um aluno afirma que o receptor e o efetuador são a mesma coisa vista de lados opostos. A melhor correção é:',['O receptor transforma o estímulo em impulso; o efetuador é o músculo ou a glândula que responde','O receptor é a sinapse central; o efetuador é o neurônio motor','O receptor só existe no SNC; o efetuador, no SNP','O receptor é o corpo do neurônio sensitivo; o efetuador, o axônio motor'],'Receptor fica no início do arco e transforma o estímulo; efetuador fica no fim e executa a resposta.'),'O receptor está na extremidade periférica do neurônio sensitivo e faz a transdução do estímulo. O efetuador, músculo ou glândula, recebe o impulso eferente e produz contração ou secreção.','Na clínica, distinguimos alterações de receptores (por exemplo, neuropatia sensitiva) de alterações do efetuador (miopatias), que produzem quadros diferentes.'),
 L(ar('filo',2,'Na minhoca, o arco reflexo intrassegmentar envolve duas sinapses.','O arco intrassegmentar acrescenta um neurônio de associação entre o sensitivo e o motor.',4,'As duas são falsas: o intrassegmentar tem uma sinapse e não precisa do neurônio de associação.'),'O arco intrassegmentar liga direto o neurônio sensitivo ao motor no gânglio do segmento, com uma sinapse. O intersegmentar é que tem neurônio de associação e duas sinapses.','O reflexo monossináptico humano (patelar) é o equivalente mais próximo do arco intrassegmentar.'),
 L(ar('filo',3,'Os neurônios pós-ganglionares do sistema autônomo têm corpo fora do sistema nervoso central.','O neurônio eferente surgiu no interior do sistema nervoso central e, sem exceção, permaneceu nessa posição.',2,'A asserção é verdadeira; a razão é falsa, porque justamente os pós-ganglionares são a exceção.'),'A maioria dos neurônios eferentes ficou no SNC, mas os que inervam músculo liso, cardíaco e glândulas estão em gânglios viscerais.','O bloqueio de gânglios autônomos tem efeitos amplos na pressão arterial e na função visceral, por isso os bloqueadores ganglionares caíram em desuso.')
);

/* Capítulo 2 — Desenvolvimento, divisões e organização geral (amplia a aula já existente) */
(function(){
 var old={};LESSON.intro.forEach(function(s){old[s.t]=s});
 var cav={t:'Cavidades do tubo neural',b:[
  ['p','A luz do tubo neural não desaparece: ela persiste no adulto como um sistema de cavidades revestidas por **epêndima**, quase todas cheias de liquor.'],
  ['tbl',[['Parte do tubo','Cavidade no adulto'],['Medula primitiva','Canal central da medula (estreito e em parte obliterado)'],['Rombencéfalo','IV ventrículo'],['Mesencéfalo','Aqueduto cerebral, que liga o III ao IV ventrículo'],['Diencéfalo e parte mediana do telencéfalo','III ventrículo'],['Vesículas telencefálicas laterais','Ventrículos laterais, ligados ao III pelos forames interventriculares']]],
  ['p','A parte mediana do telencéfalo é fechada à frente pela **lâmina terminal**, o ponto mais cranial do sistema nervoso. As vesículas laterais crescem tanto que escondem quase todo o diencéfalo.'],
  ['p','A **lâmina do teto** continua muito fina em alguns pontos e forma o epêndima das telas e plexos corioides. A **lâmina do assoalho** deixa marcas como o sulco mediano do assoalho do IV ventrículo.'],
  ['chk','O aqueduto cerebral é a cavidade remanescente de qual vesícula?',['Rombencéfalo','Mesencéfalo','Diencéfalo'],1,'A luz do mesencéfalo fica estreita e forma o aqueduto.']]};
 var dif={t:'Do neurônio jovem ao circuito pronto',b:[
  ['p','Aos quatro meses de gestação as grandes estruturas já existem, mas o córtex ainda é **liso**. Os giros e sulcos aparecem porque a superfície cortical, de cerca de 1.100 cm² no adulto, cresce muito mais que o crânio e precisa se dobrar. A organização do tecido segue seis etapas:'],
  ['ol',['**Proliferação** na matriz germinativa, junto aos ventrículos.','**Migração** dos neurônios jovens para a superfície.','**Diferenciação** em tipos específicos de neurônio.','**Sinaptogênese** e formação de circuitos.','**Morte programada** de neurônios e eliminação de sinapses.','**Mielinização**.']],
  ['p','Na **migração**, os neurônios deslizam sobre os prolongamentos da **glia radial**, que se estendem da superfície ventricular à superfície externa como trilhos. Cada nova leva ultrapassa a anterior e para logo acima dela, por sinais das células já instaladas. Por isso as camadas mais profundas do córtex são as mais antigas. A migração acontece principalmente entre a 7ª e a 28ª semana, e a matriz germinativa some por volta da 32ª.'],
  ['fig','migracao','Neurônios jovens migram da zona ventricular ao córtex apoiados na glia radial.'],
  ['p','Depois de chegar, o neurônio emite o axônio, cuja ponta, o **cone de crescimento**, "tateia" o ambiente atrás de pistas químicas que atraem ou repelem, até encontrar o alvo certo.'],
  ['p','São produzidos neurônios e sinapses **a mais**. Os que conseguem estabilizar sinapses e captar **fatores neurotróficos** do alvo sobrevivem; os outros entram em **apoptose**. O primeiro fator descoberto foi o NGF (fator de crescimento do nervo).'],
  ['key','Essa reserva de neurônios e sinapses explica a **plasticidade** da criança: quanto mais jovem, melhor a recuperação de lesões e mais fácil o aprendizado. Cada função tem seu **período crítico**.'],
  ['p','O cérebro cresce até a puberdade por aumento de **sinapses**, não de neurônios. Depois vem a **poda sináptica**, que elimina conexões pouco usadas. Ela é mais intensa entre 2 e 3 anos e na adolescência. Poda insuficiente na infância tem sido associada ao transtorno do espectro autista; poda excessiva na adolescência, à esquizofrenia.'],
  ['p','A **mielinização** começa no segundo trimestre e termina em momentos diferentes em cada região. A última a completar é a área pré-frontal, perto dos 30 anos.'],
  ['chk','O que guia os neurônios jovens na migração até o córtex?',['A glia radial','A micróglia','Os oligodendrócitos'],0,'Os prolongamentos da glia radial funcionam como trilhos.']]};
 var mal={t:'Quando o desenvolvimento falha',b:[

  ['tbl',[['Defeito','O que acontece'],['Espinha bífida oculta','Só o arco vertebral posterior não fecha; dura e medula normais, muitas vezes sem sintomas'],['Meningocele','Falha óssea maior; a dura-máter faz saliência como um balão; precisa de cirurgia'],['Mielomeningocele','Medula e raízes também saem pela falha; déficits persistem mesmo após a correção'],['Anencefalia','Falha do neuróporo rostral; falta prosencéfalo e calota craniana; sempre fatal'],['Encefalocele','Herniação de parte do encéfalo por uma falha do crânio']]],
  ['clin','Os defeitos do tubo neural ocorrem em cerca de 1 a cada 1.000 nascimentos. A mielomeningocele costuma vir com **hidrocefalia** e **malformação de Chiari** (cerebelo herniado para o canal vertebral). O déficit vai de alteração do controle da bexiga à paraplegia, conforme o nível.'],
  ['p','Nos **distúrbios de migração**, grupos de neurônios param no caminho (heterotopias). Esses neurônios fora do lugar são muito excitáveis e causam **epilepsias** frequentemente resistentes a remédios. Formas extensas causam deficiência intelectual ou paralisia cerebral.'],
  ['clin','A **matriz germinativa** é muito vascularizada e sangra com facilidade em **prematuros**, sobretudo em ventilação mecânica. Como fica perto da cápsula interna, a hemorragia pode causar paralisia cerebral com sinais de neurônio motor superior. As fibras mais mediais da cápsula vão para os membros inferiores, por isso o quadro típico é a **diparesia espástica**.'],
  ['chk','Prematuro com hemorragia periventricular evolui com espasticidade predominante nas pernas. O quadro se chama:',['Diparesia espástica','Paraplegia flácida','Hemibalismo'],0,'As fibras mediais da cápsula interna, perto da matriz germinativa, levam o comando aos membros inferiores.']]};

  ['chk','O sistema nervoso autônomo corresponde a:',['Todo o sistema nervoso visceral','Apenas o componente eferente visceral','Os componentes aferente e eferente somáticos'],1,'Autônomo é o eferente visceral, dividido em simpático e parassimpático.']]};
 var org={t:'Organização geral: do reflexo à consciência',b:[
  ['p','Imagine encostar a mão numa chapa quente. Tudo o que o sistema nervoso faz aparece nesse exemplo:'],
  ['ol',['O neurônio sensitivo, com corpo no gânglio, leva o impulso à medula.','Na medula, neurônios de associação ativam neurônios motores: a mão é **retirada por reflexo**, antes de qualquer dor ser sentida.','Ao mesmo tempo, fibras **ascendentes** levam a informação ao cérebro, onde ela se torna consciente como dor.','O córtex decide o que fazer e envia ordens por fibras **descendentes** aos neurônios motores da medula.','O **cerebelo** coordena os movimentos usando informações sobre o grau de contração dos músculos.','A situação fica guardada na **memória**, e o aprendizado evita a repetição.']],

  ['p','Os arcos reflexos podem ser **segmentares** (fecham na medula ou no tronco) ou **suprassegmentares** (fecham no cérebro ou cerebelo). Um arco com uma só sinapse é **monossináptico**; com interneurônios, **polissináptico**.'],
  ['chk','Na retirada da mão de uma chapa quente, a sensação de dor:',['Surge antes do reflexo e o desencadeia','É independente do reflexo, que é medular','Só ocorre se o cerebelo estiver íntegro'],1,'O reflexo é segmentar e automático; a dor depende da chegada da informação ao cérebro.']]};

RESUMO.intro.pts=RESUMO.intro.pts.concat(['Cavidades: canal central (medula), IV ventrículo (rombencéfalo), aqueduto (mesencéfalo), III ventrículo (diencéfalo), ventrículos laterais (vesículas telencefálicas).','Organização do tecido: proliferação, migração pela glia radial, diferenciação, sinaptogênese, morte programada e poda, mielinização.','A área pré-frontal é a última a terminar a mielinização, perto dos 30 anos.','SN autônomo = eferente visceral (simpático e parassimpático).']);
RESUMO.intro.clin=RESUMO.intro.clin.concat(['Mielomeningocele costuma vir com hidrocefalia e malformação de Chiari.','Heterotopias (falha de migração) causam epilepsias de difícil controle.','Hemorragia da matriz germinativa no prematuro pode causar diparesia espástica.','Teratógenos no 1º trimestre: microcefalia; no 2º e 3º: atraso do desenvolvimento.']);
QB.push(
 L(mc('intro',2,'Os neurônios jovens que vão formar o córtex cerebral chegam ao destino:',['Deslizando sobre prolongamentos da glia radial','Transportados pelo liquor dos ventrículos','Arrastados pelos vasos da pia-máter','Empurrados pelos oligodendrócitos já maduros'],'A glia radial forma trilhos da superfície ventricular à superfície externa.'),'Os neurônios nascem na matriz germinativa, junto aos ventrículos, e sobem aderidos aos prolongamentos da glia radial. Cada leva ultrapassa a anterior, de modo que as camadas profundas são as mais antigas. A glia radial depois origina astrócitos.','Falhas nesse processo geram heterotopias, grupos de neurônios fora do lugar que causam epilepsias de difícil controle.'),
 L(ar('intro',2,'As camadas mais profundas do córtex cerebral são formadas antes das superficiais.','Cada nova leva de neurônios ultrapassa as camadas já formadas e para logo acima delas.',0,'O padrão "de dentro para fora" explica a idade relativa das camadas.'),'Os neurônios migram em ondas; os que chegam depois passam pelos já instalados e se posicionam mais externamente. Sinais das células já migradas determinam onde parar.','Na heterotopia em banda, uma faixa de neurônios para na substância branca, abaixo de um córtex fino com poucos giros, e o paciente costuma ter epilepsia.'),
 L(mc('intro',2,'A morte neuronal programada durante o desenvolvimento é regulada principalmente:',['Pela oferta de fatores neurotróficos vindos do tecido-alvo','Pela falta de oxigênio no tubo neural','Pela ação da micróglia sobre neurônios saudáveis','Pela pressão do liquor sobre a matriz germinativa'],'Neurônios que captam fatores tróficos suficientes sobrevivem; os demais entram em apoptose.'),'São produzidos mais neurônios e sinapses do que o necessário. Os neurônios competem pelo alvo; os que estabilizam sinapses e recebem fatores neurotróficos bloqueiam a apoptose. O primeiro fator descoberto foi o NGF.','Essa reserva sustenta a plasticidade infantil: lesões precoces têm melhor recuperação que lesões na vida adulta.'),
 L(vf('intro',2,'Julgue sobre a maturação do sistema nervoso.',[['O cérebro cresce até a puberdade principalmente por aumento do número de neurônios.',false],['A poda sináptica é mais intensa entre 2 e 3 anos e na adolescência.',true],['A mielinização da área pré-frontal só termina perto dos 30 anos.',true],['O córtex do feto de 4 meses ainda é liso.',true]],'O crescimento pós-natal se deve a sinapses, não a neurônios novos.'),'Depois do nascimento o número de neurônios praticamente não aumenta; crescem as sinapses e a mielina. A poda elimina conexões pouco usadas e refina os circuitos.','Alterações da poda têm sido ligadas ao autismo (poda insuficiente na infância) e à esquizofrenia (poda excessiva na adolescência).'),
 L(cs('intro',2,'Recém-nascido prematuro de 28 semanas, em ventilação mecânica, tem hemorragia periventricular bilateral. Aos 2 anos anda na ponta dos pés, com pernas espásticas e reflexos vivos, e braços quase normais. Qual a melhor explicação?',['Lesão das fibras mediais da cápsula interna, que vão para os membros inferiores','Destruição dos neurônios motores da coluna anterior lombar','Lesão do cerebelo por compressão do IV ventrículo','Falha do fechamento do neuróporo caudal'],'A matriz germinativa fica junto à cápsula interna, e as fibras mais mediais são as dos membros inferiores.'),'A matriz germinativa periventricular é muito vascularizada e sangra em prematuros. A lesão atinge a substância branca periventricular e as fibras mediais da cápsula interna, gerando sinais de neurônio motor superior nas pernas: a diparesia espástica.','É uma forma comum de paralisia cerebral; o acompanhamento com fisioterapia precoce aproveita a plasticidade da criança.'),
 L(as('intro',2,'Associe o defeito de fechamento ao achado.',[['Espinha bífida oculta','Arco vertebral aberto, dura e medula normais'],['Meningocele','Dura-máter em saliência, sem medula no saco'],['Mielomeningocele','Medula e raízes dentro da saliência'],['Anencefalia','Ausência de prosencéfalo e calota craniana']],'A gravidade cresce conforme mais estruturas saem pela falha.'),'Falhas da parte posterior do tubo vão da espinha bífida oculta, geralmente sem sintomas, à mielomeningocele, com déficit neurológico permanente. A falha anterior grave é a anencefalia, incompatível com a vida.','O ácido fólico antes da concepção e no início da gestação reduz esses defeitos; a mielomeningocele costuma vir com hidrocefalia e malformação de Chiari.'),
 L(mc('intro',3,'Um agente teratogênico que atua principalmente no 1º trimestre tende a causar:',['Microcefalia por redução da proliferação neuronal','Atraso de mielinização isolado','Poda sináptica excessiva na adolescência','Hemorragia da matriz germinativa'],'No 1º trimestre o alvo é a proliferação; menos neurônios resulta em microcefalia.'),'Fatores externos no início da gestação reduzem a produção de neurônios. No 2º e 3º trimestres prejudicam a organização e as sinapses, levando a atraso do desenvolvimento e deficiência intelectual.','Infecções congênitas no início da gestação, como a do vírus Zika, ficaram conhecidas pela microcefalia.'),
 L(mc('intro',2,'O componente do sistema nervoso que recebe o nome de sistema nervoso autônomo é o:',['Eferente visceral','Aferente visceral','Eferente somático','Aferente e eferente viscerais juntos'],'Autônomo é apenas a parte eferente do sistema visceral.'),'O sistema visceral tem aferentes (visceroceptores) e eferentes. Só o eferente, para músculo liso, cardíaco e glândulas, é chamado autônomo e se divide em simpático e parassimpático.','A dor visceral, levada por aferentes viscerais, não é função do sistema autônomo propriamente dito, embora as fibras viajem junto com ele.'),
 L(as('intro',2,'Associe a vesícula ao derivado no adulto (divisão embriológica).',[['Metencéfalo','Ponte e cerebelo'],['Mielencéfalo','Bulbo'],['Diencéfalo','Tálamo, hipotálamo e retina'],['Telencéfalo','Hemisférios cerebrais']],'Cada parte do adulto recebe o nome da vesícula que a formou.'),'O diencéfalo dá origem também ao cálice óptico, que forma a retina e o nervo óptico. Por isso o nervo óptico é um prolongamento do SNC, envolvido por meninges.','Aumento da pressão do liquor se transmite ao redor do nervo óptico e causa edema de papila, visível no fundo de olho.'),
 L(cs('intro',3,'Paciente com secção completa da medula torácica encosta a perna numa bolsa muito quente e retira o membro, mas não sente dor. O que explica o achado?',['O reflexo de retirada se fecha na medula, abaixo da lesão; a dor depende de vias que sobem ao cérebro','O cerebelo produz o reflexo sem informar o córtex','A dor é sentida, mas não é lembrada por falha da memória','O reflexo é suprassegmentar e não depende da medula'],'O arco reflexo é segmentar; a consciência da dor precisa das vias ascendentes, interrompidas.'),'Neurônios sensitivos e de associação da medula lombossacral ativam os neurônios motores e produzem a retirada. A informação não consegue subir pela medula seccionada, por isso não se torna consciente.','Pacientes com lesão medular precisam de cuidado com queimaduras e úlceras de pressão, porque não sentem o estímulo, mesmo quando os reflexos estão presentes.'),
 L(gp('intro',2,'A ponta do axônio em crescimento, que reconhece pistas químicas até o alvo, é o cone de ____.',['crescimento'],'O cone de crescimento é atraído ou repelido por moléculas do ambiente.'),'Ao chegar perto do alvo, o axônio se ramifica e começa a sinaptogênese.','Moléculas que guiam o cone de crescimento também influenciam a regeneração após lesões, alvo de pesquisas em lesão medular.'),
 L(ar('intro',3,'A dura-máter e a aracnoide derivam da crista neural.','A crista neural forma estruturas apenas do sistema nervoso periférico.',2,'A asserção é verdadeira; a razão é falsa, pois a crista forma também melanócitos, medula adrenal, odontoblastos e meninges.'),'A crista neural é muito versátil: gânglios sensitivos e autônomos, células de Schwann, células satélites, medula da adrenal, melanócitos, odontoblastos e as meninges dura-máter e aracnoide.','Doenças da crista neural (neurocristopatias) afetam sistemas aparentemente sem relação, como pele, adrenal e intestino.')
);

(function(){
 var L0=LESSON.tecido,find=function(t){return L0.findIndex(function(s){return s.t===t})};
 L0[0].b.push(['p','Depois de diferenciados, os neurônios **não se dividem**: os que morrem não são repostos. Há duas exceções no adulto, o **bulbo olfatório** e o **hipocampo**, onde surgem neurônios novos todos os dias. No hipocampo eles vivem poucas semanas e parecem participar da formação de memórias novas.'],
  ['p','O encéfalo humano tem cerca de **86 bilhões de neurônios**, a maioria (cerca de 80%) no cerebelo, e um número parecido de células gliais. Ao contrário dos neurônios, a glia se multiplica por mitose.']);
 var el={t:'Atividade elétrica do neurônio',b:[
  ['p','Dentro do neurônio predominam **K⁺** e ânions orgânicos; fora, **Na⁺** e **Cl⁻**. Essa diferença cria o **potencial de repouso**, em torno de **−60 a −70 mV**, com o interior negativo. Íons só cruzam a membrana por **canais iônicos**, que podem ser abertos por voltagem, por neurotransmissores, por fosforilação ou por estímulos mecânicos.'],
  ['tbl',[['','Potencial graduável','Potencial de ação'],['Onde nasce','Dendritos e corpo celular','Zona de gatilho (segmento inicial do axônio)'],['Amplitude','Pequena e variável','Grande, cerca de 100 mV'],['Soma com outros','Sim','Não: é "tudo ou nada"'],['Alcance','Poucos milímetros, depois se extingue','Percorre todo o axônio sem perder amplitude']]],
  ['fig','potencial','Fases do potencial de ação.'],
  ['ol',['Um estímulo despolariza a zona de gatilho até o **limiar**.','Canais de **Na⁺** dependentes de voltagem se abrem: o Na⁺ entra e o interior fica positivo.','Canais de **K⁺**, mais lentos, se abrem: o K⁺ sai e a membrana repolariza.','A **bomba de sódio e potássio**, gastando ATP, restaura as concentrações.']],
  ['p','Cada neurônio recebe de 1 mil a 10 mil sinapses. Os potenciais **excitatórios** (despolarização) e **inibitórios** (hiperpolarização) se somam perto do cone de implantação. Se a soma alcança o limiar, sai um potencial de ação.'],
  ['p','No neurônio **pseudounipolar**, os dois ramos têm estrutura de axônio. A zona de gatilho fica perto da terminação sensitiva, e o impulso passa direto do ramo periférico ao central, sem precisar atravessar o corpo celular.'],
  ['clin','Os **anestésicos locais**, como a lidocaína, ligam-se aos canais de Na⁺ dependentes de voltagem e impedem o potencial de ação. Nas **epilepsias**, grupos de neurônios ficam hiperexcitáveis por alterações de canais de Na⁺ e Ca²⁺ ou da inibição; muitos antiepilépticos estabilizam esses canais ou reforçam o GABA.'],
  ['chk','A hiperpolarização da membrana pós-sináptica tem efeito:',['Excitatório','Inibitório','Nenhum, pois só o potencial de ação conta'],1,'Interior mais negativo afasta a membrana do limiar: inibição.']]};
 var flx={t:'Fluxo axoplasmático',b:[
  ['p','O axônio não tem ribossomos e não fabrica proteínas. Tudo vem do corpo celular por **fluxo anterógrado**, e o que volta da terminação segue por **fluxo retrógrado**.'],
  ['tbl',[['Tipo','Velocidade','O que leva'],['Anterógrado rápido','200 a 400 mm por dia','Organelas com membrana: mitocôndrias, vesículas'],['Anterógrado lento','1 a 4 mm por dia','Proteínas do citoesqueleto e do citosol'],['Retrógrado','Em direção ao corpo','Material captado na terminação, como fatores tróficos']]],
  ['p','As terminações captam substâncias por **endocitose**. É assim que fatores tróficos chegam ao corpo celular e, também, que alguns agentes invadem o SNC.'],
  ['clin','O **vírus da raiva** entra nas terminações nervosas da mordida, sobe por fluxo retrógrado até a medula e daí ao encéfalo, causando encefalite fatal. A **toxina tetânica** também sobe pelos nervos motores até a medula e bloqueia interneurônios inibitórios: surgem rigidez, trismo e opistótono.'],
  ['p','Pesquisadores usam o fluxo para mapear vias: uma substância injetada no córtex aparece na medula (traçador anterógrado), ou uma enzima injetada na medula aparece nos corpos celulares do córtex (traçador retrógrado).'],
  ['chk','O vírus da raiva chega ao SNC principalmente por:',['Corrente sanguínea','Fluxo axoplasmático retrógrado','Liquor do espaço subaracnóideo'],1,'Ele é captado nas terminações e transportado ao corpo do neurônio.']]};
 var nt={t:'Neurotransmissores, receptores e inativação',b:[
  ['p','Nas sinapses químicas o elemento **pré-sináptico** guarda o neurotransmissor em vesículas, a **fenda** mede 20 a 30 nm e o **pós-sináptico** tem os receptores. A sinapse é **polarizada**: só funciona num sentido. Já as sinapses elétricas, raras, funcionam nos dois sentidos e sincronizam grupos de neurônios, como no centro respiratório do bulbo.'],
  ['tbl',[['Neurotransmissor','Destaque'],['Glutamato','Principal excitatório do encéfalo'],['GABA','Principal inibitório do encéfalo'],['Glicina','Inibitório, importante na medula'],['Acetilcolina','Placa motora e sistema autônomo'],['Monoaminas','Dopamina, noradrenalina, adrenalina, serotonina, histamina'],['Peptídeos','Substância P, encefalinas e endorfinas (opioides)']]],
  ['p','Um neurônio pode liberar mais de um neurotransmissor: um clássico junto com um peptídeo (**coexistência**).'],
  ['ul',['**Receptor ionotrópico:** é o próprio canal. Exemplo: receptor nicotínico da acetilcolina (entra Na⁺, excita) e receptor GABA-A (entra Cl⁻, inibe).','**Receptor metabotrópico:** ativa reações que geram um **segundo mensageiro**, como o AMP cíclico, e mudam a célula de forma mais lenta e duradoura.']],
  ['p','O neurotransmissor precisa sair rápido da fenda:'],
  ['ul',['**Acetilcolina:** quebrada pela **acetilcolinesterase** em acetato e colina; a colina é recaptada e reaproveitada.','**Monoaminas e aminoácidos:** **recaptados** pela membrana pré-sináptica (e por astrócitos). Dentro do terminal, parte volta às vesículas e parte é degradada pela **MAO**.','**Peptídeos:** removidos por proteases.']],
  ['clin','A **cocaína** bloqueia a recaptação de monoaminas, que ficam mais tempo agindo nos receptores. Muitos antidepressivos atuam no mesmo ponto, de forma controlada.'],
  ['chk','Qual mecanismo encerra a ação da acetilcolina na fenda?',['Recaptação pela membrana pré-sináptica','Hidrólise pela acetilcolinesterase','Degradação pela MAO'],1,'A acetilcolinesterase quebra a acetilcolina em acetato e colina.']]};
 var gl={t:'Glia: muito além da sustentação',b:[
  ['p','A glia do SNC tem **macróglia** (astrócitos e oligodendrócitos, do neuroectoderma) e **micróglia** (de origem monocítica). Os oligodendrócitos são os mais numerosos; a micróglia é menos de 10% da glia.'],
  ['ul',['**Astrócitos protoplasmáticos** (substância cinzenta, prolongamentos curtos e muito ramificados) e **fibrosos** (substância branca, prolongamentos longos e finos).','Os astrócitos apoiam **pés vasculares** nos capilares, envolvem as sinapses, controlam o K⁺ extracelular, recaptam glutamato, guardam glicogênio, participam da barreira hematoencefálica e ajudam a formar e eliminar sinapses.','Na lesão, viram **astrócitos reacionais** e formam a cicatriz glial (**gliose**).','**Oligodendrócitos:** satélites (junto ao corpo neuronal) e fasciculares (formam mielina).','**Micróglia:** macrófago do SNC; ativada, fica ameboide, migra, prolifera e libera citocinas.','**Células ependimárias:** revestem ventrículos e canal central; modificadas, cobrem os **plexos corioides**, que produzem o liquor.']],
  ['p','No SNP a glia é formada por **células satélites** (anficitos), em volta dos corpos neuronais nos gânglios, e **células de Schwann**, em volta dos axônios. Ambas vêm da crista neural e têm membrana basal.'],
  ['clin','**Gliomas** são tumores da glia e respondem por cerca de 80% dos tumores malignos primários do sistema nervoso. Infiltram o tecido e são difíceis de retirar. O **glioblastoma** (astrocitoma grau IV) é o mais comum e agressivo.'],
  ['chk','A cicatriz que se forma no SNC após uma lesão é produzida principalmente por:',['Astrócitos reacionais','Células de Schwann','Células ependimárias'],0,'Astrócitos aumentam e ocupam a área lesada: é a gliose.']]};
 var fib={t:'Fibras nervosas e mielinização',b:[
  ['p','Fibra nervosa = axônio + seus envoltórios gliais. Fibras **mielínicas** dominam a substância branca; corpos neuronais e fibras amielínicas dominam a cinzenta.'],
  ['tbl',[['','SNP','SNC'],['Quem faz a mielina','Célula de Schwann','Oligodendrócito'],['Axônios por célula','Um internódulo de um axônio','Internódulos de 20 a 30 axônios'],['Neurilema','Presente (resto da célula de Schwann)','Ausente'],['Fibras amielínicas','Envolvidas por Schwann, até 15 axônios por célula','Sem envoltório, só tocadas por astrócitos']]],
  ['p','Na mielinização periférica, a célula de Schwann forma uma goteira com o axônio, fecha-a (**mesaxônio**) e enrola essa dupla membrana várias vezes. O citoplasma e o núcleo que sobram formam o **neurilema**. Um nervo longo como o isquiático pode ter cerca de mil internódulos por fibra.'],

RESUMO.tecido.pts=RESUMO.tecido.pts.concat(['Neurônios novos no adulto: bulbo olfatório e hipocampo.','Potencial de repouso de −60 a −70 mV; graduável soma, potencial de ação é tudo ou nada.','Fluxo anterógrado rápido (200 a 400 mm/dia) e lento (1 a 4 mm/dia); retrógrado leva fatores tróficos ao corpo.','Glutamato: principal excitatório; GABA: principal inibitório; glicina inibe na medula.','Receptor ionotrópico é canal; metabotrópico usa segundo mensageiro.','Acetilcolina é hidrolisada pela acetilcolinesterase; monoaminas são recaptadas e degradadas pela MAO.','Oligodendrócito mieliniza 20 a 30 axônios; célula de Schwann, um internódulo de um axônio.','Nervo: epineuro, perineuro (barreira hematoneural) e endoneuro.']);
RESUMO.tecido.clin=RESUMO.tecido.clin.concat(['Anestésicos locais bloqueiam canais de Na⁺ dependentes de voltagem.','Raiva e toxina tetânica sobem ao SNC por transporte retrógrado.','Esclerose múltipla: desmielinização central em surtos. Guillain-Barré: desmielinização periférica aguda, ascendente.','Glioblastoma: tumor glial mais comum e agressivo.']);
QB.push(
 L(mc('tecido',2,'No potencial de ação, a fase de despolarização se deve principalmente a:',['Entrada de Na⁺ por canais dependentes de voltagem','Saída de K⁺ por canais de vazamento','Entrada de Cl⁻ por receptores GABA-A','Ação da bomba de sódio e potássio'],'A abertura dos canais de Na⁺ dependentes de voltagem faz o Na⁺ entrar e o interior ficar positivo.'),'Ao atingir o limiar, os canais de Na⁺ se abrem e há grande entrada de sódio. Depois os canais de K⁺, mais lentos, se abrem, o K⁺ sai e a membrana repolariza. A bomba de Na⁺/K⁺ restaura as concentrações gastando ATP.','Anestésicos locais bloqueiam esses canais de sódio e impedem o potencial de ação, por isso eliminam a dor no local.'),
 L(as('tecido',2,'Associe a característica ao tipo de potencial.',[['Soma-se a outros','Potencial graduável'],['Tudo ou nada','Potencial de ação'],['Nasce na zona de gatilho','Potencial de ação'],['Extingue-se em poucos milímetros','Potencial graduável']],'Graduáveis nascem em dendritos e corpo e se somam; o potencial de ação nasce no segmento inicial e não perde amplitude.'),'Os potenciais pós-sinápticos são graduáveis e se integram perto do cone de implantação. Se atingem o limiar, a zona de gatilho dispara um potencial de ação que se repete ao longo do axônio.','Antiepilépticos agem diminuindo a chance de disparos repetidos, estabilizando canais ou reforçando a inibição.'),
 L(mc('tecido',3,'No neurônio pseudounipolar do gânglio da raiz dorsal, a zona de gatilho fica:',['Perto da terminação sensitiva periférica','No segmento inicial, junto ao corpo celular','Na entrada da raiz dorsal na medula','No próprio corpo celular, que integra os sinais'],'A terminação sensitiva gera potenciais graduáveis que disparam o potencial de ação perto dela.'),'Os dois ramos têm estrutura de axônio. O potencial de ação nasce perto do receptor e passa direto do ramo periférico ao central, sem depender do corpo celular.','Por isso uma lesão do gânglio pode poupar temporariamente a condução, mas compromete a manutenção do axônio, que depende do corpo celular.'),
 L(mc('tecido',2,'A velocidade do fluxo axoplasmático anterógrado rápido é de cerca de:',['200 a 400 mm por dia','1 a 4 mm por dia','1 a 3 mm por hora','5 a 10 metros por dia'],'O rápido leva organelas a 200 a 400 mm por dia; o lento, proteínas do citoesqueleto a 1 a 4 mm por dia.'),'O axônio depende do corpo celular para receber proteínas e organelas. O rápido transporta organelas com membrana; o lento, componentes do citoesqueleto e proteínas solúveis.','A velocidade de regeneração de um nervo (1 a 3 mm por dia) é parecida com a do fluxo lento, que leva o citoesqueleto do axônio em crescimento.'),
 L(cs('tecido',2,'Trabalhador rural pisa num prego enferrujado e, dias depois, tem dificuldade para abrir a boca, rigidez do pescoço e do tronco e espasmos dolorosos. O que explica o quadro?',['A toxina sobe pelos nervos motores até a medula e bloqueia interneurônios inibitórios','A toxina bloqueia a liberação de acetilcolina na placa motora','O bacilo invade o liquor e inflama as meninges','A toxina destrói a mielina dos nervos periféricos'],'A toxina tetânica é captada nas terminações motoras, sobe por fluxo retrógrado e inibe a liberação de neurotransmissores inibitórios.'),'Sem a inibição dos interneurônios da medula e do tronco, os neurônios motores disparam em excesso: trismo (masseter), rigidez cervical, abdominal e opistótono.','O tratamento exige terapia intensiva, sedação e bloqueio muscular. A vacina é a única prevenção eficaz.'),
 L(ar('tecido',2,'O vírus da raiva pode atingir o encéfalo a partir de uma mordida na mão.','Nas terminações nervosas os axônios perdem seus envoltórios, e o vírus captado sobe por fluxo axoplasmático retrógrado.',0,'A razão explica o caminho do vírus.'),'As terminações livres, placas motoras e terminações autônomas não têm a proteção das barreiras do nervo. O vírus entra, chega ao corpo do neurônio medular e daí ao encéfalo.','Mordidas na cabeça e no pescoço têm período de incubação menor, pela menor distância até o SNC. A profilaxia pós-exposição segue protocolo do Ministério da Saúde.'),
 L(mc('tecido',1,'O principal neurotransmissor excitatório do encéfalo é o:',['Glutamato','GABA','Glicina','Dopamina'],'Glutamato excita; GABA inibe.'),'O glutamato está na maioria das sinapses excitatórias do encéfalo. O GABA é o principal inibitório; a glicina é inibitória sobretudo na medula.','Excesso de glutamato é tóxico para os neurônios (excitotoxicidade), mecanismo importante no AVC isquêmico.'),
 L(mc('tecido',2,'O receptor GABA-A, ao se ligar ao GABA, abre um canal de:',['Cloro, causando hiperpolarização','Sódio, causando despolarização','Cálcio, liberando vesículas','Potássio, gerando potencial de ação'],'GABA-A é um canal de Cl⁻; a entrada de cloro deixa o interior mais negativo.'),'É um receptor ionotrópico: o próprio receptor é o canal. A hiperpolarização afasta a membrana do limiar e inibe o neurônio.','Benzodiazepínicos aumentam o efeito do GABA nesse receptor e são usados para crises epilépticas prolongadas.'),
 L(as('tecido',2,'Associe o neurotransmissor ao modo principal de inativação.',[['Acetilcolina','Hidrólise pela acetilcolinesterase'],['Noradrenalina','Recaptação pré-sináptica e MAO'],['Encefalina','Proteases'],['Glutamato','Recaptação por neurônios e astrócitos']],'Cada classe tem seu mecanismo.'),'A acetilcolinesterase quebra a acetilcolina; a colina volta ao terminal. Monoaminas e aminoácidos são recaptados; dentro do terminal a MAO degrada monoaminas. Peptídeos são removidos por proteases.','Inibidores da acetilcolinesterase são usados na miastenia grave; inibidores da recaptação de serotonina são antidepressivos comuns.'),
 L(ar('tecido',2,'A cocaína prolonga a ação das monoaminas na fenda sináptica.','A cocaína inibe a enzima acetilcolinesterase.',2,'A asserção é verdadeira; a razão é falsa, pois a cocaína bloqueia a recaptação de monoaminas.'),'Bloqueando a bomba de captação pré-sináptica, a cocaína mantém dopamina, noradrenalina e serotonina disponíveis aos receptores por mais tempo, o que explica efeitos psíquicos e cardiovasculares.','Intoxicação por cocaína pode causar arritmias, hipertensão grave e AVC.'),
 L(vf('tecido',2,'Julgue sobre as sinapses.',[['Sinapses elétricas conduzem nos dois sentidos.',true],['Na sinapse química, a fenda mede cerca de 20 a 30 nm.',true],['Receptores metabotrópicos são canais iônicos que abrem diretamente.',false],['Um neurônio pode liberar um neurotransmissor clássico e um peptídeo.',true]],'Metabotrópicos agem por segundo mensageiro, não são canais.'),'Sinapses elétricas sincronizam grupos de neurônios, como no centro respiratório. Nas químicas, ionotrópicos são canais; metabotrópicos geram segundos mensageiros como o AMP cíclico.','Muitos fármacos psiquiátricos agem em receptores metabotrópicos, por isso o efeito clínico pode demorar a aparecer.'),
 L(mc('tecido',2,'Qual função NÃO é atribuída aos astrócitos?',['Formar a bainha de mielina no SNC','Recaptar glutamato da fenda','Controlar o potássio extracelular','Participar da barreira hematoencefálica'],'Quem forma mielina no SNC é o oligodendrócito.'),'Astrócitos sustentam e isolam sinapses, controlam K⁺, recaptam glutamato, armazenam glicogênio, participam da barreira e formam a cicatriz glial.','Astrócitos reacionais neurotóxicos aparecem em doenças degenerativas, como a doença de Alzheimer, e são alvo de pesquisa terapêutica.'),
 L(mc('tecido',2,'A micróglia ativada caracteriza-se por:',['Forma ameboide, migração e fagocitose','Produção de liquor nos plexos corioides','Formação de mielina em vários axônios','Revestimento dos ventrículos'],'A micróglia é o macrófago do SNC.'),'De origem monocítica, ela remove células mortas e microrganismos. Ativada, fica ameboide, prolifera e libera citocinas, óxido nítrico e fatores tróficos.','A neuroinflamação mediada pela micróglia participa de doenças degenerativas e de lesões após trauma.'),
 L(as('tecido',2,'Associe a estrutura ao envoltório do nervo.',[['Envolve todo o nervo','Epineuro'],['Envolve cada fascículo','Perineuro'],['Envolve cada fibra','Endoneuro'],['Forma a barreira hematoneural','Perineuro e capilares endoneurais']],'Epi, peri e endo: de fora para dentro.'),'O perineuro tem camadas de células epiteliais unidas por junções de oclusão e isola o interior do fascículo. Os capilares do endoneuro são seletivos, como os do SNC.','Em cirurgia de nervo, a sutura é feita no epineuro ou no perineuro, buscando alinhar os fascículos.'),
 L(cs('tecido',2,'Mulher de 30 anos teve, há dois anos, perda visual dolorosa num olho, que melhorou. Agora apresenta formigamento e fraqueza numa perna. A RM mostra vários focos na substância branca. Qual célula é o alvo principal da doença?',['Oligodendrócito','Célula de Schwann','Neurônio motor inferior','Astrócito fibroso'],'Esclerose múltipla: desmielinização autoimune do SNC.'),'Os surtos em locais diferentes, separados no tempo, com focos na substância branca, sugerem esclerose múltipla. A destruição da mielina central bloqueia a condução saltatória.','No surto agudo usa-se pulsoterapia com corticoide; medicamentos modificadores, como anticorpos monoclonais, reduzem novos surtos.'),
 L(cs('tecido',2,'Homem de 40 anos, duas semanas após diarreia, tem fraqueza que começou nos pés e subiu até as coxas em poucos dias, com reflexos abolidos. O liquor tem proteína alta com celularidade normal. Qual o mecanismo?',['Desmielinização autoimune de raízes e nervos periféricos','Destruição de neurônios da coluna anterior por vírus','Desmielinização de tratos medulares','Bloqueio pré-sináptico na placa motora'],'Síndrome de Guillain-Barré: polirradiculoneuropatia inflamatória aguda.'),'A desmielinização periférica causa fraqueza ascendente, paralisia flácida e arreflexia. A dissociação proteinocitológica no liquor e a eletroneuromiografia confirmam.','É preciso monitorar a capacidade respiratória; imunoglobulina ou plasmaférese abreviam a doença.'),
 L(mc('tecido',2,'Os gliomas representam cerca de que proporção dos tumores malignos primários do sistema nervoso?',['80%','10%','30%','100%'],'Cerca de 80%.'),'São tumores da glia, nomeados pela célula de origem (astrocitoma, oligodendroglioma). Costumam infiltrar o tecido, o que dificulta a retirada completa.','O glioblastoma, astrocitoma grau IV, é o tumor encefálico primário mais comum e agressivo.'),
 L(gp('tecido',2,'A dupla membrana que se forma quando a célula de Schwann envolve o axônio, e que depois se enrola em volta dele, é o ____.',['mesaxônio','mesaxonio'],'O mesaxônio se alonga e se enrola, formando as lamelas de mielina.'),'O restante da célula de Schwann, com núcleo e citoplasma, forma o neurilema por fora da mielina.','Doenças hereditárias que alteram proteínas da mielina periférica causam neuropatias desmielinizantes crônicas.')
);

LESSON.medmacro=[
 {t:'Onde a medula começa e termina',b:[
  ['p','Medula quer dizer "miolo": a medula espinal é o miolo do canal vertebral. É o órgão mais simples do SNC e aquele em que o tubo neural menos se modificou, por isso costuma abrir o estudo.'],
  ['ul',['Mede cerca de **45 cm** no homem adulto, um pouco menos na mulher.','Começa no **forame magno**, onde continua com o bulbo.','Termina no adulto, em geral, na altura da **vértebra L2**, afilando-se no **cone medular**.','Do cone sai o **filamento terminal**, um fio de pia-máter.']],
  ['key','O limite inferior em **L2** é o número mais cobrado do capítulo: abaixo dele não há medula, só raízes.'],
  ['chk','No adulto, a medula espinal termina geralmente na altura de:',['T12','L2','S2'],1,'O cone medular fica em L2; o saco dural vai até S2.']]},
 {t:'Forma, intumescências e sulcos',b:[
  ['p','A medula é um cilindro um pouco achatado no sentido anteroposterior, com duas dilatações:'],
  ['ul',['**Intumescência cervical:** onde se ligam as raízes do plexo braquial (membros superiores).','**Intumescência lombossacral:** onde se ligam as raízes do plexo lombossacral (membros inferiores).']],
  ['p','Elas existem porque os membros exigem muito mais neurônios e fibras do que o tronco.'],
  ['fig','medCorteMacro','Sulcos, funículos, colunas e raízes da medula em corte transversal.'],
  ['ul',['**Fissura mediana anterior** e **sulco mediano posterior**, na linha média.','**Sulco lateral anterior**, onde saem as raízes ventrais (motoras).','**Sulco lateral posterior**, onde entram as raízes dorsais (sensitivas).','**Sulco intermédio posterior**, só na medula cervical (e torácica alta), que divide o funículo posterior em fascículos grácil e cuneiforme.']],
  ['chk','O que explica as intumescências da medula?',['Maior quantidade de liquor nesses níveis','Maior número de neurônios e fibras para os membros','Presença dos gânglios espinais dentro da medula'],1,'Os plexos braquial e lombossacral exigem mais neurônios e fibras.']]},
 {t:'Substância cinzenta e funículos',b:[
  ['p','Na medula a **substância cinzenta fica por dentro** da branca, em forma de H ou de borboleta. Cada metade tem três colunas, que nos cortes aparecem como cornos:'],
  ['ul',['**Coluna anterior:** neurônios motores.','**Coluna posterior:** recebe as fibras sensitivas.','**Coluna lateral:** só na medula torácica e lombar alta (neurônios pré-ganglionares simpáticos).']],
  ['p','No centro fica o **canal central**, resto da luz do tubo neural. A substância branca, de fibras que sobem e descem, divide-se de cada lado em três **funículos**:'],
  ['tbl',[['Funículo','Limites'],['Anterior','Fissura mediana anterior e sulco lateral anterior'],['Lateral','Sulcos lateral anterior e lateral posterior'],['Posterior','Sulco lateral posterior e sulco mediano posterior']]],
  ['mn','Raiz **D**orsal entra pelo sulco lateral posterior e é sensitiva: **D** de "dor chega". Raiz **V**entral sai pelo sulco lateral anterior e é motora: **V** de "vai embora".']]},
 {t:'Nervos espinais e segmentos medulares',b:[
  ['p','Em cada sulco lateral entram ou saem **filamentos radiculares**, que se juntam em raízes. A **raiz dorsal** tem o **gânglio espinal**; logo depois dele as duas raízes se unem e formam o nervo espinal.'],
  ['p','O **segmento medular** de um nervo é a parte da medula onde se ligam os filamentos radiculares desse nervo. Não há septos entre segmentos: a segmentação é marcada só pelos nervos.'],
  ['tbl',[['Região','Pares de nervos'],['Cervical','8'],['Torácica','12'],['Lombar','5'],['Sacral','5'],['Coccígea','1 (em geral)'],['Total','31']]],
  ['p','Há **8 nervos cervicais e só 7 vértebras cervicais**. C1 sai entre o occipital e o atlas; C1 a C7 saem **acima** da vértebra de mesmo número; C8 sai abaixo de C7, e daí para baixo todos saem **abaixo** da vértebra correspondente.'],
  ['chk','O nervo C8 emerge:',['Acima da vértebra C7','Abaixo da vértebra C7','Entre o occipital e o atlas'],1,'Como há 8 nervos e 7 vértebras cervicais, C8 sai entre C7 e T1.']]},
 {t:'Topografia vertebromedular',b:[
  ['p','Até o **4º mês** de vida intrauterina, medula e coluna crescem juntas e cada nervo sai na horizontal. Depois, a coluna cresce mais, sobretudo embaixo. As raízes, presas aos seus forames, se alongam e descem obliquamente.'],
  ['fig','medCrescimento','Ao 4º mês a medula ocupa todo o canal; no adulto termina em L2 e as raízes descem formando a cauda equina.'],
  ['ul',['Abaixo de L2 o canal contém só meninges, filamento terminal e raízes: a **cauda equina**.','Os segmentos medulares ficam **acima** das vértebras de mesmo número.']],
  ['key','Regra prática: de **C2 a T10**, some **2** ao número do processo espinhoso para achar o segmento medular abaixo dele. Os processos espinhosos de **T11 e T12** cobrem os **5 segmentos lombares**; o de **L1** cobre os **5 sacrais**.'],
  ['clin','Uma fratura de **T12** pode lesar a **medula lombar**, com sinais de neurônio motor superior e inferior misturados. Uma fratura de **L3** só atinge **raízes da cauda equina**, que se comportam como nervo periférico e têm prognóstico melhor.'],
  ['chk','O processo espinhoso da vértebra T6 está sobre qual segmento medular?',['T6','T8','L1'],1,'Entre C2 e T10, soma-se 2: T6 + 2 = T8.']]},
 {t:'Meninges da medula',b:[
  ['p','Três membranas envolvem a medula. A **dura-máter** é espessa (paquimeninge); **aracnoide** e **pia-máter** são finas (leptomeninges).'],
  ['ul',['**Dura-máter:** forma o **saco dural**, como um dedo de luva, que termina em **S2**. Prolonga-se em volta das raízes e continua com o epineuro, vedando a saída do liquor.','**Aracnoide:** um folheto colado à dura e **trabéculas** que vão até a pia.','**Pia-máter:** adere à medula, entra na fissura mediana anterior e forma o **filamento terminal** e os **ligamentos denticulados**.']],
  ['p','O filamento terminal atravessa o fundo do saco dural, recebe prolongamentos da dura (filamento terminal, parte dural) e se fixa no cóccix como **ligamento coccígeo**.'],
  ['p','Os **ligamentos denticulados** são pregas da pia, uma de cada lado, num plano frontal entre as raízes dorsais e ventrais. Têm cerca de **21 dentes** que se prendem à dura, alternando com a saída dos nervos. Fixam a medula e servem de referência em cirurgias.'],
  ['fig','medEspacos','Envoltórios e espaços em corte transversal.'],
  ['tbl',[['Espaço','Onde','Conteúdo'],['Epidural','Entre dura-máter e periósteo','Gordura e plexo venoso vertebral interno'],['Subdural','Entre dura-máter e aracnoide','Fenda virtual com pouco líquido'],['Subaracnóideo','Entre aracnoide e pia-máter','Liquor']]],
  ['clin','As veias do **plexo venoso vertebral interno** não têm válvulas e se comunicam com veias do tórax, abdome e pelve. Tossir ou fazer força inverte o fluxo, o que explica metástases e infecções que chegam à coluna e à medula, inclusive ovos de *Schistosoma mansoni* (esquistossomose medular).']]},
 {t:'Punção lombar e anestesias',b:[
  ['p','Entre **L2** (fim da medula) e **S2** (fim do saco dural) o espaço subaracnóideo é amplo, tem bastante liquor e só contém raízes, que se afastam da agulha. É o lugar ideal para punção, geralmente entre **L3 e L4** ou L4 e L5.'],
  ['ul',['Coletar liquor para diagnóstico ou tratamento.','Medir a pressão do liquor.','Injetar contraste (mielografia).','Fazer anestesia raquidiana ou dar medicamentos.']],
  ['fig','puncao','Camadas atravessadas pela agulha na punção lombar.'],
  ['ol',['Pele e tela subcutânea','Ligamento supraespinhal e interespinhal','Ligamento amarelo','Espaço epidural (peridural)','Dura-máter e aracnoide','Espaço subaracnóideo, com liquor']],
  ['tbl',[['','Raquianestesia','Peridural'],['Onde fica o anestésico','Espaço subaracnóideo','Espaço epidural'],['Como confirmar','Liquor goteja da agulha','Perda súbita de resistência ao passar o ligamento amarelo'],['Perfura a dura','Sim','Não'],['Problema típico','Cefaleia pós-punção por vazamento de liquor','Exige mais técnica']]],
  ['clin','A **cefaleia pós-raquianestesia** piora em pé e melhora deitado: o liquor vaza pelo orifício da dura e a pressão cai. A peridural é muito usada no parto.'],
  ['chk','Na anestesia peridural, o anestésico fica:',['Entre aracnoide e pia-máter','Entre dura-máter e periósteo','Dentro do canal central'],1,'O espaço epidural fica fora da dura, entre ela e o periósteo.']]}
];
RESUMO.medmacro={pts:['Medula: cerca de 45 cm, do forame magno até L2 no adulto, terminando no cone medular e no filamento terminal.','Intumescências cervical e lombossacral: raízes dos plexos braquial e lombossacral.','Sulcos: fissura mediana anterior, mediano posterior, lateral anterior (raízes ventrais), lateral posterior (raízes dorsais) e intermédio posterior (cervical).','Substância cinzenta em H por dentro; coluna lateral só na torácica e lombar alta; canal central no meio.','31 pares de nervos espinais: 8 cervicais, 12 torácicos, 5 lombares, 5 sacrais e 1 coccígeo.','C1 a C7 saem acima da vértebra correspondente; C8 e os demais, abaixo.','Regra: de C2 a T10 some 2; T11 e T12 cobrem os segmentos lombares; L1 cobre os sacrais.','Saco dural até S2; ligamentos denticulados (pia) fixam a medula; filamento terminal termina como ligamento coccígeo.','Espaços: epidural (gordura e plexo venoso), subdural (virtual), subaracnóideo (liquor).'],
 clin:['Punção lombar entre L3 e L4 ou L4 e L5: só há raízes da cauda equina.','Raquianestesia no espaço subaracnóideo (liquor goteja); peridural no epidural (perda de resistência).','Cefaleia pós-raqui por vazamento de liquor, pior em pé.','Fratura de T12 atinge medula lombar; fratura de L3 atinge só raízes.','Plexo venoso vertebral sem válvulas espalha metástases e esquistossomose para a coluna e a medula.']};
QB.push(
 L(mc('medmacro',1,'A medula espinal continua cranialmente com o bulbo na altura do:',['Forame magno','Atlas','Dente do áxis','Clivo'],'O limite cranial é o forame magno do occipital.'),'A medula começa onde termina o bulbo, perto do forame magno, e desce pelo canal vertebral até L2 no adulto.','Malformações e tumores do forame magno podem comprimir a junção bulbomedular, com quadro misto de tronco e medula.'),
 L(mc('medmacro',2,'As intumescências cervical e lombossacral correspondem:',['Às regiões de saída das raízes dos plexos dos membros','Aos locais onde o canal central se dilata','Aos pontos de fixação dos ligamentos denticulados','Às áreas com mais substância branca ascendente'],'Os membros exigem mais neurônios e fibras, o que dilata a medula nesses níveis.'),'A intumescência cervical recebe e emite as raízes do plexo braquial; a lombossacral, as do plexo lombossacral. A maior quantidade de neurônios aumenta a substância cinzenta e, com ela, o calibre.','Lesões nas intumescências produzem déficits de neurônio motor inferior nos membros correspondentes.'),
 L(as('medmacro',2,'Associe o sulco ao que ele marca.',[['Sulco lateral anterior','Saída das raízes ventrais'],['Sulco lateral posterior','Entrada das raízes dorsais'],['Sulco intermédio posterior','Separação entre grácil e cuneiforme'],['Fissura mediana anterior','Limite medial do funículo anterior']],'Raízes ventrais saem anteriormente; dorsais entram posteriormente.'),'O sulco intermédio posterior aparece na medula cervical e torácica alta e continua num septo que separa os fascículos grácil (medial) e cuneiforme (lateral).','Lesões do funículo posterior causam perda de propriocepção e vibração; o nível ajuda a saber se o cuneiforme foi afetado.'),
 L(mc('medmacro',2,'A coluna lateral da substância cinzenta medular aparece:',['Na medula torácica e lombar alta','Em toda a medula','Só na intumescência cervical','Só nos segmentos sacrais'],'A coluna lateral existe de T1 a L2, aproximadamente.'),'Ela contém neurônios pré-ganglionares do simpático, por isso coincide com a região de saída do simpático (toracolombar).','Lesões medulares altas cortam o comando descendente para esses neurônios, explicando hipotensão e alterações autonômicas após trauma cervical.'),
 L(gp('medmacro',1,'No adulto existem ____ pares de nervos espinais.',['31','trinta e um'],'8 cervicais, 12 torácicos, 5 lombares, 5 sacrais e 1 coccígeo.'),'O número de segmentos medulares acompanha o de pares de nervos.','O dermátomo de cada nervo é usado para localizar o nível de uma lesão medular ou radicular.'),
 L(mc('medmacro',2,'O nervo espinal C1 emerge:',['Entre o occipital e o atlas','Entre o atlas e o áxis','Abaixo da vértebra C1','Pelo forame magno'],'C1 sai acima do atlas, entre ele e o occipital.'),'Como há 8 nervos cervicais e 7 vértebras, C1 a C7 saem acima da vértebra de mesmo número e C8 sai entre C7 e T1. Daí para baixo, cada nervo sai abaixo da sua vértebra.','Na radiculopatia por hérnia cervical C5–C6, a raiz afetada costuma ser C6, que sai entre essas vértebras.'),
 L(ar('medmacro',2,'Abaixo de L2, o canal vertebral do adulto contém apenas raízes nervosas, filamento terminal e meninges.','A partir do 4º mês de vida intrauterina, a coluna vertebral cresce mais que a medula.',0,'A diferença de crescimento explica a posição do cone e a cauda equina.'),'Até o 4º mês os nervos saem na horizontal. Depois a coluna se alonga mais, as raízes se alongam e descem obliquamente, formando a cauda equina abaixo do cone.','No recém-nascido o cone fica um pouco mais baixo (cerca de L3), o que é levado em conta na punção lombar em bebês.'),
 L(mc('medmacro',2,'Pela regra prática, o processo espinhoso da vértebra C6 está sobre o segmento medular:',['C8','C6','C7','T1'],'Entre C2 e T10, soma-se 2: C6 + 2 = C8.'),'A regra não é exata logo abaixo de C2, mas funciona bem na prática. T11 e T12 correspondem aos segmentos lombares e L1, aos sacrais.','Conhecer essa correspondência é essencial para prever o déficit de uma fratura vertebral.'),
 L(cs('medmacro',3,'Motociclista sofre fratura-luxação da vértebra T12. Qual parte do sistema nervoso está mais exposta?',['Segmentos lombares da medula','Segmentos T12 e L1 apenas','Somente raízes da cauda equina','Segmentos torácicos médios'],'Os processos espinhosos de T11 e T12 ficam sobre os cinco segmentos lombares.'),'Pela diferença de crescimento, a vértebra T12 cobre a medula lombar (e o início da sacral). A lesão pode misturar sinais de neurônio motor superior e inferior, porque atinge medula e raízes que descem ao redor.','O prognóstico é pior do que o de uma fratura de L3, que só atinge raízes da cauda equina, mais resistentes e capazes de regenerar.'),
 L(cs('medmacro',2,'Fratura da vértebra L3 com compressão do canal. O que se espera?',['Lesão de raízes da cauda equina, com quadro de neurônio motor inferior','Lesão do cone medular com hiper-reflexia','Lesão dos segmentos L3 da medula com Babinski','Lesão do filamento terminal sem repercussão'],'Abaixo de L2 só há raízes.'),'As raízes da cauda equina se comportam como nervo periférico: fraqueza flácida, arreflexia, perda sensitiva em sela e alteração esfincteriana conforme as raízes afetadas.','A síndrome da cauda equina por compressão é emergência cirúrgica, para preservar a função de bexiga e intestino.'),
 L(vf('medmacro',2,'Julgue sobre as meninges da medula.',[['O saco dural termina em S2.',true],['O filamento terminal é formado pela pia-máter.',true],['Os ligamentos denticulados são formados pela dura-máter.',false],['A dura-máter continua com o epineuro dos nervos espinais.',true]],'Ligamentos denticulados são pregas da pia-máter.'),'A pia forma o filamento terminal e os ligamentos denticulados. A dura forma o saco dural até S2 e embainha as raízes, continuando com o epineuro e vedando a saída de liquor.','Os ligamentos denticulados são referência cirúrgica: cortá-los permite girar a medula para abordar sua face anterior.'),
