<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Up-MED study</title>
<meta name="description" content="Neuroanatomia em questões, prova prática e ranking da turma.">
<meta name="theme-color" content="#1B3A4B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: app clínico — barra lateral no computador, navegação inferior no celular; conteúdo em coluna de leitura */
:root{
  --petroleo:#1B3A4B; --teal:#2A9D8F; --ambar:#E9C46A;
  --bg:#eef2f3; --surface:#ffffff; --surface2:#f6f8f9; --ink:#14232c; --muted:#5b6b74; --line:#d6dee2;
  --brand:#1B3A4B; --brandInk:#ffffff; --accent:#2A9D8F; --accentInk:#ffffff; --hi:#E9C46A; --hiInk:#5a4300;
  --ok:#23845f; --bad:#c2412f; --warn:#b07a00;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c161c; --surface:#13222b; --surface2:#182b35; --ink:#e3ecef; --muted:#93a6ae; --line:#26404d;
  --brand:#0f2531; --brandInk:#e3ecef; --accent:#38b3a4; --accentInk:#06201c; --hi:#E9C46A; --hiInk:#2b2000;
  --ok:#47c08f; --bad:#ff7a66; --warn:#e3b341; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c161c; --surface:#13222b; --surface2:#182b35; --ink:#e3ecef; --muted:#93a6ae; --line:#26404d;
  --brand:#0f2531; --brandInk:#e3ecef; --accent:#38b3a4; --accentInk:#06201c; --hi:#E9C46A; --hiInk:#2b2000;
  --ok:#47c08f; --bad:#ff7a66; --warn:#e3b341; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(26px,4.5vw,36px);font-weight:800}
h2{font-size:clamp(20px,3.2vw,26px);font-weight:700}
h3{font-size:18px;font-weight:700}
p{margin:0}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:14px}
.num{font-variant-numeric:tabular-nums}

/* ---------- login ---------- */
.auth{min-height:100vh;display:grid;grid-template-columns:1fr;background:var(--brand);color:var(--brandInk)}
@media (min-width:900px){.auth{grid-template-columns:1.1fr 1fr}}
.auth-hero{padding-block:40px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:24px;display:flex;flex-direction:column;justify-content:center;gap:18px;position:relative;overflow:hidden}
.auth-hero .mark{font-family:var(--f-display);font-weight:800;font-size:clamp(40px,8vw,72px);line-height:.95;letter-spacing:-.03em}
.auth-hero .mark span{color:var(--hi)}
.auth-hero p{max-width:42ch;opacity:.85}
.auth-hero svg{position:absolute;right:-40px;bottom:-40px;width:320px;opacity:.12;pointer-events:none}
.auth-card{background:var(--surface);color:var(--ink);padding-block:32px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;justify-content:center}
.auth-card form{display:grid;gap:12px;max-width:380px;width:100%;margin:0 auto}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:4px}
.seg button{border:0;background:transparent;padding:8px;border-radius:999px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brandInk)}
label.f{display:grid;gap:4px;font-size:14px;font-weight:700}
input.in,select.in,textarea.in{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:400}
input.in:focus,select.in:focus{border-color:var(--accent);outline:none}
.msg{font-size:14px;padding:10px 12px;border-radius:10px;background:var(--surface2);border:1px solid var(--line)}
.msg.err{border-color:var(--bad);color:var(--bad)}
.msg.ok{border-color:var(--ok);color:var(--ok)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px}

/* ---------- botões ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:10px;border:1.5px solid transparent;font-weight:700;line-height:1.1;min-height:44px}
.btn.pri{background:var(--accent);color:var(--accentInk)}
.btn.dark{background:var(--brand);color:var(--brandInk)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.sm{padding:8px 12px;min-height:36px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:700;min-height:36px}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--brandInk);border-color:var(--brand)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:1fr;min-height:100vh}
@media (min-width:900px){.shell{grid-template-columns:232px 1fr}}
.side{display:none}
@media (min-width:900px){.side{display:flex;flex-direction:column;gap:4px;background:var(--brand);color:var(--brandInk);padding:20px 12px;position:sticky;top:0;height:100vh}}
.side .logo{font-family:var(--f-display);font-weight:800;font-size:22px;padding:4px 10px 18px;letter-spacing:-.02em}
.side .logo span{color:var(--hi)}
.navb{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;color:inherit;padding:10px 12px;border-radius:10px;font-weight:700;opacity:.8}
.navb:hover{opacity:1;background:rgba(255,255,255,.06)}
.navb[aria-current="page"]{opacity:1;background:rgba(255,255,255,.12);box-shadow:inset 3px 0 0 var(--hi)}
.navb svg{width:20px;height:20px;flex:0 0 auto}
.side .foot{margin-top:auto;display:grid;gap:4px;font-size:13px;opacity:.85;padding:8px 10px}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--brand);color:var(--brandInk);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
@media (min-width:900px){.bottom{display:none}}
.bottom .navb{flex-direction:column;gap:2px;font-size:11px;padding:8px 2px;border-radius:0;justify-content:center;text-align:center}
.bottom .navb[aria-current="page"]{box-shadow:inset 0 3px 0 var(--hi);background:rgba(255,255,255,.08)}
.main{min-width:0;padding-block:20px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:900px){.main{padding-block:28px 48px;padding-left:32px;padding-right:32px}}
.page{max-width:1080px;margin:0 auto;display:grid;gap:20px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.banner{padding:10px 14px;border-radius:10px;background:color-mix(in srgb,var(--hi) 22%,var(--surface));border:1px solid color-mix(in srgb,var(--hi) 60%,var(--line));font-size:14px}

/* ---------- cartões ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr}
@media (min-width:640px){.g2{grid-template-columns:1fr 1fr}}
.g3{grid-template-columns:1fr}
@media (min-width:640px){.g3{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1000px){.g3{grid-template-columns:repeat(3,1fr)}}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px}
.stat b{font-family:var(--f-display);font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.mod{display:grid;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-height:118px}
.mod:hover{border-color:var(--accent)}
.mod .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.meter{height:6px;background:var(--surface2);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--accent)}
.meter i.lo{background:var(--bad)} .meter i.mid{background:var(--warn)}
.game{display:grid;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;position:relative;overflow:hidden}
.game:hover{border-color:var(--accent)}
.game .tag{justify-self:start}
.tag{display:inline-block;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--ink)}
.tag.amb{background:color-mix(in srgb,var(--hi) 35%,transparent)}

/* ---------- quiz ---------- */
.qwrap{max-width:760px;width:100%;margin:0 auto;display:grid;gap:14px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.bar{height:5px;background:var(--line);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.stem{font-size:18px;line-height:1.45}
.stem.case{background:var(--surface2);border-left:4px solid var(--hi);padding:12px 14px;border-radius:0 10px 10px 0}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;text-align:left;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);line-height:1.35;min-height:48px}
.opt .k{font-family:var(--f-mono);font-weight:500;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);font-size:13px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 11%,var(--surface))}
.opt:disabled{cursor:default}
.vfrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface)}
.vfrow.right{border-color:var(--ok)} .vfrow.wrong{border-color:var(--bad)}
.tog{display:flex;gap:4px}
.tog button{width:44px;height:40px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-weight:800}
.tog button[aria-pressed="true"]{background:var(--brand);color:var(--brandInk);border-color:var(--brand)}
.asrow{display:grid;grid-template-columns:1fr;gap:6px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface)}
@media (min-width:560px){.asrow{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);align-items:center}}
.asrow.right{border-color:var(--ok)} .asrow.wrong{border-color:var(--bad)}
.asrow .fix{font-size:13px;color:var(--ok);grid-column:1/-1}
.arbox{display:grid;gap:8px}
.arbox div{padding:10px 12px;border-radius:10px;background:var(--surface2);border:1px solid var(--line)}
.arbox b{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block}
ol.seq{list-style:none;margin:0;padding:0;display:grid;gap:6px;counter-reset:s}
ol.seq li{counter-increment:s;display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:8px 10px;border-radius:8px;background:var(--surface2);border:1px solid var(--line)}
ol.seq li::before{content:counter(s);font-family:var(--f-mono);color:var(--accent);font-weight:500}
ol.seq li.right{border-color:var(--ok)} ol.seq li.wrong{border-color:var(--bad)}
.fb{border-radius:12px;padding:14px 16px;background:var(--surface);border:1.5px solid var(--line);display:grid;gap:6px}
.fb.good{border-color:var(--ok)} .fb.bad{border-color:var(--bad)}
.fb .verdict{font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.07em}
.fb.good .verdict{color:var(--ok)} .fb.bad .verdict{color:var(--bad)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.score{font-family:var(--f-display);font-weight:800;font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* ---------- ranking ---------- */
.rank{display:grid;gap:6px}
.rrow{display:grid;grid-template-columns:40px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.rrow .pos{font-family:var(--f-display);font-weight:800;font-size:20px;text-align:center;font-variant-numeric:tabular-nums}
.rrow.me{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.rrow .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.rrow .xp{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500}
.rrow .acc{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:end}
.pod{background:var(--surface);border:1px solid var(--line);border-radius:var(--r) var(--r) 0 0;padding:10px;text-align:center;display:grid;gap:2px;min-width:0}
.pod b{font-family:var(--f-display);font-size:26px}
.pod .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod.p1{min-height:150px;border-top:4px solid var(--hi)} .pod.p2{min-height:120px} .pod.p3{min-height:100px}

/* ---------- estações ---------- */
.stage{display:grid;gap:16px;align-items:start}
@media (min-width:860px){.stage{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}}
.fig{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px;display:grid;gap:6px;min-width:0}
.fig svg{width:100%;height:auto;display:block;max-height:70vh}
.photo{position:relative;width:100%;line-height:0;border-radius:8px;overflow:hidden;background:#000;touch-action:manipulation}
.photo img{width:100%;height:auto;display:block;user-select:none;-webkit-user-drag:none;max-height:72vh;object-fit:contain}
.photo .pin{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:3px solid var(--hi);box-shadow:0 0 0 2px rgba(0,0,0,.55);pointer-events:none}
.photo .pin.pulse::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px solid var(--hi);animation:pulse 1.4s ease-out infinite}
.photo .pin.ok{border-color:var(--ok)} .photo .pin.bad{border-color:var(--bad)}
.photo .pin.dot{width:16px;height:16px;margin:-8px 0 0 -8px;border-width:2px;background:rgba(0,0,0,.35)}
.photo .pin.dot.cur{border-color:var(--hi);background:var(--hi)}
.photo .lbl{position:absolute;transform:translate(-50%,-150%);background:rgba(0,0,0,.75);color:#fff;font-size:12px;line-height:1.2;padding:3px 6px;border-radius:6px;white-space:nowrap;pointer-events:none;font-family:var(--f-body)}
.credit{font-size:12px;color:var(--muted);line-height:1.4}
.credit a{color:inherit}
.imgfail{line-height:1.5;color:#fff;padding:24px;text-align:center;font-size:14px}
@keyframes pulse{0%{opacity:.9;transform:scale(.6)}100%{opacity:0;transform:scale(1.6)}}
.timer{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500}
.timer.low{color:var(--bad)}
.lvls{display:grid;gap:6px;grid-template-columns:1fr 1fr}
@media (min-width:560px){.lvls{grid-template-columns:repeat(3,1fr)}}
.lv{padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;min-height:44px}
.lv[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.lv.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.lv.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.edlist{display:grid;gap:4px;max-height:52vh;overflow:auto;padding-right:4px}
.edlist button{display:grid;grid-template-columns:18px 1fr auto;gap:8px;align-items:center;text-align:left;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.edlist button.cur{border-color:var(--hi);box-shadow:inset 3px 0 0 var(--hi)}
.edlist .st{width:12px;height:12px;border-radius:50%;border:2px solid var(--line)}
.edlist .st.on{background:var(--ok);border-color:var(--ok)}
.edlist .st.skip{background:var(--muted);border-color:var(--muted)}

/* ---------- SVG esquemas ---------- */
.wm{fill:var(--sv-my);stroke:var(--sv-edge);stroke-width:.7}
.tr{fill:var(--sv-my2);stroke:var(--sv-edge);stroke-width:.7}
.base{fill:var(--sv-my)}
.gm{fill:var(--sv-gray);stroke:var(--sv-grayEdge);stroke-width:.6}
.sg{fill:var(--sv-gel);stroke:var(--sv-grayEdge);stroke-width:.6}
.nt{fill:var(--sv-deep)}
.cc{fill:var(--surface);stroke:var(--sv-grayEdge)}
.cba{fill:var(--sv-my2);stroke:var(--sv-edge);stroke-width:.6}
.fis{fill:var(--surface)}
.sep{stroke:var(--surface);stroke-width:1.8}
.outline{fill:none;stroke:var(--sv-pia);stroke-width:2}
.nerve{fill:none;stroke:var(--sv-nerve);stroke-width:7;stroke-linecap:round}
.thin{fill:none;stroke:var(--sv-nerve);stroke-width:2;stroke-linecap:round}
.gang{fill:var(--sv-gang);stroke:var(--sv-nerve)}
.hit{fill:none;stroke:transparent;stroke-width:16;pointer-events:stroke;stroke-linecap:round}
.zone{fill:transparent;stroke:var(--muted);stroke-dasharray:3 3;stroke-opacity:.6}
.cord{fill:var(--sv-gray);stroke:var(--sv-pia);stroke-width:1.5}
.dura{fill:none;stroke:var(--muted);stroke-width:2;stroke-dasharray:6 4}
.cist{fill:var(--sv-csf)}
.deco{stroke:var(--sv-nerve);stroke-width:2;fill:none}
.fil{stroke:var(--sv-pia);stroke-width:2;fill:none}
.lab{font-family:var(--f-mono);font-size:9px;fill:var(--muted);letter-spacing:.08em}
.tick{stroke:var(--line);stroke-width:1}
.guide{stroke:var(--line);stroke-dasharray:2 3}
:root{--sv-my:#2c3172;--sv-my2:#454ba3;--sv-edge:#9196dc;--sv-gray:#e7d5dc;--sv-grayEdge:#b99aa8;--sv-gel:#f6ecf0;--sv-deep:#ad7a91;--sv-pia:#7a2e4a;--sv-nerve:#c4b9a4;--sv-gang:#ab9d82;--sv-csf:#dbe8f4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sv-my:#343b8f;--sv-my2:#5058bb;--sv-edge:#8a90dd;--sv-gray:#cdb6bf;--sv-grayEdge:#9a7d8a;--sv-gel:#e6d6dc;--sv-deep:#9c6b81;--sv-pia:#c06a8a;--sv-nerve:#a89f8f;--sv-gang:#8f856f;--sv-csf:#1d3247}}
:root[data-theme="dark"]{--sv-my:#343b8f;--sv-my2:#5058bb;--sv-edge:#8a90dd;--sv-gray:#cdb6bf;--sv-grayEdge:#9a7d8a;--sv-gel:#e6d6dc;--sv-deep:#9c6b81;--sv-pia:#c06a8a;--sv-nerve:#a89f8f;--sv-gang:#8f856f;--sv-csf:#1d3247}
[data-id]{cursor:pointer}
.hl:not(.ln):not(.hit){fill:var(--hi)!important;fill-opacity:1}
.zone.hl{fill-opacity:.75!important;stroke:none}
.ln.hl,.hit.hl{stroke:var(--hi)!important}
.hit.hl,.hit.ok,.hit.bad{stroke-opacity:.35}
.ok:not(.ln):not(.hit){fill:var(--ok)!important;fill-opacity:.9}
.ln.ok,.hit.ok{stroke:var(--ok)!important}
.bad:not(.ln):not(.hit){fill:var(--bad)!important;fill-opacity:.9}
.ln.bad,.hit.bad{stroke:var(--bad)!important}
.spin{fill:none;stroke:var(--hi);stroke-width:2.5;pointer-events:none}
.spin.pulse{animation:pulse 1.4s ease-out infinite;transform-box:fill-box;transform-origin:center}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:50;background:rgba(5,15,20,.55);display:grid;place-items:center;padding:16px}
.modal .box{background:var(--surface);border-radius:14px;max-width:620px;width:100%;max-height:86vh;overflow:auto;padding:20px;display:grid;gap:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:90vw}
@media (min-width:900px){.toast{bottom:24px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function cyrb53(str,seed){seed=seed||0;var h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(var i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(4294967296*(2097151&h2)+(h1>>>0)).toString(36)}
function weekId(d){d=d||new Date();var t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));var day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);var y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return t.getUTCFullYear()+'-S'+Math.ceil(((t-y)/864e5+1)/7)}

var LocalStore={
 mode:'local',
 _cb:null,
 init:function(){return Promise.resolve()},
 onUser:function(cb){this._cb=cb;var uid=lsGet('upmed2_session',null);var u=uid&&this._users()[uid];cb(u?this._pub(u):null)},
 _users:function(){return lsGet('upmed2_users',{})},
 _pub:function(u){return{uid:u.uid,name:u.name,email:u.email,turma:u.turma}},
 signUp:function(name,email,pass,turma){
  var users=this._users();email=email.trim().toLowerCase();
  for(var k in users){if(users[k].email===email)return Promise.reject({code:'auth/email-already-in-use'})}
  if(pass.length<6)return Promise.reject({code:'auth/weak-password'});
  var uid='L'+cyrb53(email+Date.now());var salt=cyrb53(String(Math.random()));
  users[uid]={uid:uid,name:name,email:email,turma:turma,salt:salt,h:cyrb53(salt+pass,7)};
  if(!lsGet('upmed2_admins',null))lsSet('upmed2_admins',{});var ad=lsGet('upmed2_admins',{});if(!Object.keys(ad).length){ad[uid]=true;lsSet('upmed2_admins',ad)}
  lsSet('upmed2_users',users);lsSet('upmed2_session',uid);var p=this._pub(users[uid]);this._cb&&this._cb(p);return Promise.resolve(p)},
 signIn:function(email,pass){
  var users=this._users();email=email.trim().toLowerCase();
  for(var k in users){var u=users[k];if(u.email===email){if(u.h===cyrb53(u.salt+pass,7)){lsSet('upmed2_session',u.uid);var p=this._pub(u);this._cb&&this._cb(p);return Promise.resolve(p)}return Promise.reject({code:'auth/invalid-credential'})}}
  return Promise.reject({code:'auth/invalid-credential'})},
 signOut:function(){try{localStorage.removeItem('upmed2_session')}catch(e){}this._cb&&this._cb(null);return Promise.resolve()},
 reset:function(){return Promise.reject({code:'local/no-reset'})},
 isAdmin:function(uid){return Promise.resolve(!!lsGet('upmed2_admins',{})[uid])},

 listStations:function(){return Promise.resolve(lsGet('upmed2_stations',{}))},

};

var FB_VER='10.12.2';
function loadScript(src){return new Promise(function(res,rej){var s=document.createElement('script');s.src=src;s.async=true;s.onload=res;s.onerror=function(){rej(new Error('load '+src))};document.head.appendChild(s)})}
var FirebaseStore={
 mode:'firebase',
 init:function(cfg){
  var base='https://www.gstatic.com/firebasejs/'+FB_VER+'/';
  var self=this;
  var timeout=new Promise(function(_,rej){setTimeout(function(){rej(new Error('timeout'))},12000)});
  return Promise.race([loadScript(base+'firebase-app-compat.js').then(function(){return Promise.all([loadScript(base+'firebase-auth-compat.js'),loadScript(base+'firebase-database-compat.js')])}),timeout]).then(function(){
   if(!firebase.apps.length)firebase.initializeApp(cfg);
   self.auth=firebase.auth();self.db=firebase.database();
  });
 },
 onUser:function(cb){var self=this;this.auth.onAuthStateChanged(function(u){
   if(!u){cb(null);return}
   self.db.ref('profiles/'+u.uid).once('value').then(function(s){var p=s.val()||{};var pd=self._pending||{};cb({uid:u.uid,email:u.email,name:p.name||pd.name||u.displayName||u.email.split('@')[0],turma:p.turma||pd.turma||''})}).catch(function(){cb({uid:u.uid,email:u.email,name:u.displayName||u.email.split('@')[0],turma:''})});
 })},
 signUp:function(name,email,pass,turma){var self=this;self._pending={name:name,turma:turma};
  return this.auth.createUserWithEmailAndPassword(email.trim(),pass).then(function(cred){
   return Promise.all([cred.user.updateProfile({displayName:name}),self.db.ref('profiles/'+cred.user.uid).set({name:name,turma:turma,createdAt:Date.now()})]).then(function(){return{uid:cred.user.uid,name:name,email:cred.user.email,turma:turma}})})},
 signIn:function(email,pass){return this.auth.signInWithEmailAndPassword(email.trim(),pass)},
 signOut:function(){return this.auth.signOut()},
 reset:function(email){return this.auth.sendPasswordResetEmail(email.trim())},
 isAdmin:function(uid){return this.db.ref('admins/'+uid).once('value').then(function(s){return s.val()===true}).catch(function(){return false})},
 loadPrivate:function(uid){return this.db.ref('private/'+uid).once('value').then(function(s){return s.val()})},
 savePrivate:function(uid,p){return this.db.ref('private/'+uid).set(JSON.parse(JSON.stringify(p)))},
 saveScore:function(uid,s){return this.db.ref('scores/'+uid).set(s)},
 listScores:function(){return this.db.ref('scores').once('value').then(function(s){return s.val()||{}})},
 listStations:function(){return this.db.ref('stations').once('value').then(function(s){return s.val()||{}})},
 saveStation:function(st){return this.db.ref('stations/'+st.id).set(JSON.parse(JSON.stringify(st)))},
 deleteStation:function(id){return this.db.ref('stations/'+id).remove()}
};

(function(){
'use strict';
var $=function(s,r){return(r||document).querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function norm(s){return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function lev(a,b){var m=a.length,n=b.length,d=[],i,j;for(i=0;i<=m;i++)d[i]=[i];for(j=0;j<=n;j++)d[0][j]=j;for(i=1;i<=m;i++)for(j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function close(ans,target){var a=norm(ans),b=norm(target);if(!a)return false;if(a===b)return true;var stop=/\b(do|da|de|dos|das|o|a|e|nervo|trato|nucleo)\b/g;var a2=a.replace(stop,'').replace(/\s+/g,' ').trim(),b2=b.replace(stop,'').replace(/\s+/g,' ').trim();if(a2===b2)return true;if(lev(a2,b2)<=Math.max(1,Math.floor(b2.length*0.18)))return true;var tw=b2.split(' ').filter(function(w){return w.length>2}),aw=a2.split(' ');return tw.length>0&&aw.length<=tw.length+2&&tw.every(function(t){return aw.some(function(w){return lev(w,t)<=Math.floor(t.length*0.25)})})}
function pct(c,a){return a?Math.round(100*c/a):0}
function fmtDate(t){var d=new Date(t);return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}

var Store=LocalStore;
var S={user:null,admin:false,priv:null,view:'painel',sub:null,stations:{},scores:null,fbError:null};
function blankPriv(){return{stats:{answered:0,correct:0,xp:0,mods:{},week:{id:weekId(),xp:0}},w:{},seen:{},errs:{},hist:[]}}

var saveT=null;
function persist(){
 if(!S.user)return;clearTimeout(saveT);
 saveT=setTimeout(function(){
  var p=S.priv,st=p.stats;if(st.week.id!==weekId())st.week={id:weekId(),xp:0};
  Store.savePrivate(S.user.uid,p).catch(function(e){console.warn(e)});
  var mods={};Object.keys(st.mods).forEach(function(k){mods[k]={a:st.mods[k].a,c:st.mods[k].c,xp:st.mods[k].xp||0}});
  Store.saveScore(S.user.uid,{name:S.user.name,turma:S.user.turma||'',xp:st.xp,answered:st.answered,correct:st.correct,week:st.week,mods:mods,at:Date.now()}).then(function(){S.scores=null}).catch(function(e){console.warn(e)});
 },1200);
}
function record(q,ok,partial){
 var p=S.priv,st=p.stats;if(st.week.id!==weekId())st.week={id:weekId(),xp:0};
 var gain=ok?XPD[q.d]:Math.round((partial||0)*XPD[q.d]*0.5);
 st.answered++;if(ok)st.correct++;st.xp+=gain;st.week.xp+=gain;
 var m=st.mods[q.m]||(st.mods[q.m]={a:0,c:0,xp:0});m.a++;if(ok)m.c++;m.xp=(m.xp||0)+gain;
 var w=p.w[q.id]||1;p.w[q.id]=ok?Math.max(.35,+(w*.6).toFixed(2)):Math.min(6,w+1.5);
 p.seen[q.id]=(p.seen[q.id]||0)+1;
 if(ok){if(p.errs[q.id]){p.errs[q.id]--;if(p.errs[q.id]<=0)delete p.errs[q.id]}}else p.errs[q.id]=2;
 persist();return gain;
}
function addGameXp(game,pts){
 var p=S.priv,st=p.stats;if(st.week.id!==weekId())st.week={id:weekId(),xp:0};
 st.xp+=pts;st.week.xp+=pts;p.hist.unshift({t:Date.now(),k:'game',g:game,xp:pts});p.hist=p.hist.slice(0,60);persist();
}
function pickQuestions(pool,n){
 var w=S.priv.w,seen=S.priv.seen;var out=[],left=pool.slice();
 while(out.length<n&&left.length){
  var tot=0,ws=left.map(function(q){var v=(w[q.id]||1)*(seen[q.id]?1:2.2);tot+=v;return v});
  var r=Math.random()*tot,i=0;for(;i<left.length;i++){r-=ws[i];if(r<=0)break}
  out.push(left.splice(Math.min(i,left.length-1),1)[0]);
 }
 return out;
}

  finishQ(okc===tot,okc/tot);return}
 if(d.act==='next'&&Z){if(Z.i+1>=Z.list.length){Z.finished=true;S.priv.hist.unshift({t:Date.now(),k:'quiz',title:Z.title,ok:Z.ok,n:Z.list.length,xp:Z.xp});S.priv.hist=S.priv.hist.slice(0,60);persist()}else{Z.i++;Z.done=false}render();window.scrollTo(0,0);return}
 if(d.act==='again'&&Z){var same=Z.list.map(function(p){return p.q});var m=same[0].m,all=same.every(function(q){return q.m===m});startQuiz(pickQuestions(all?QB.filter(function(q){return q.m===m}):QB,same.length),Z.title);return}
 /* prática */
 if(d.prm){PR.mode=d.prm;S.keepScroll=true;render();return}
 if(d.act==='prStart'){prStart();return}
 if(d.prp!=null&&PR&&PR.phase==='play'){var it3=PR.items[PR.i];if(!it3.done){it3.pick=d.prp;prAnswer(d.prp===it3.pin.n)}return}
 if(d.act==='prNext'){if(PR.i+1>=PR.items.length){PR.phase='end';if(PR.pts)addGameXp('pratica',PR.pts)}else{PR.i++;startPrTimer()}render();window.scrollTo(0,0);return}
 if(d.act==='prAgain'){prStart();return}
 if(d.act==='prMenu'){PR.phase='menu';go('pratica');return}
 /* via */
 if(d.vi!=null&&VI){var seqs=QB.filter(function(q){return q.t==='od'});var qq=seqs[VI.idx%seqs.length];var i=+d.vi;if(i===VI.seq.length){VI.seq.push(i);if(VI.seq.length===qq.s.length){var pts=Math.max(2,qq.s.length*3-VI.err*3);VI.pts+=pts;VI.done++;addGameXp('via',pts)}S.keepScroll=true;render()}else{VI.err++;b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake','wrong');setTimeout(function(){b.classList.remove('wrong')},400);var ce=document.querySelector('.qwrap p.num:last-child');if(ce)ce.textContent='Erros nesta sequência: '+VI.err}return}
 if(d.act==='viaNext'){var sq=QB.filter(function(q){return q.t==='od'});VI.idx=(VI.idx+1+Math.floor(Math.random()*(sq.length-1)))%sq.length;VI.seq=[];VI.err=0;VI.pool=null;render();window.scrollTo(0,0);return}
 /* lesão */
 if(d.lel&&LE&&!LE.done){LE.l=d.lel;S.keepScroll=true;render();return}
 if(d.les&&LE&&!LE.done){LE.s=d.les;S.keepScroll=true;render();return}
 if(d.act==='leCheck'){var c=LE.items[LE.i];LE.done=true;var g=(LE.l===c.l?10:0)+(LE.s===c.s?5:0);LE.pts+=g;if(LE.l===c.l&&LE.s===c.s)LE.ok++;S.keepScroll=true;render();return}
 if(d.act==='leNext'){LE.i++;LE.l=LE.s=null;LE.done=false;if(LE.i>=LE.items.length&&LE.pts)addGameXp('lesao',LE.pts);render();window.scrollTo(0,0);return}
 if(d.act==='leAgain'){LE=null;render();return}
 /* nervos */
 if(d.act==='nvStart'){nvStart();return}
 if(d.nv!=null&&NV&&NV.phase==='play'){var okn=d.nv===NV.q.n[NV.q.k[0]];NV.n++;if(okn){NV.ok++;NV.streak++;NV.maxStreak=Math.max(NV.maxStreak,NV.streak);NV.pts+=10+Math.min(10,(NV.streak-1)*2)}else NV.streak=0;
  b.classList.add(okn?'right':'wrong');if(!okn){var rb=Array.prototype.find.call(document.querySelectorAll('[data-nv]'),function(x){return x.dataset.nv===NV.q.n[NV.q.k[0]]});rb&&rb.classList.add('right')}
  document.querySelectorAll('[data-nv]').forEach(function(x){x.disabled=true});setTimeout(function(){if(NV.phase!=='play')return;NV.q=nvQ();render()},okn?350:1100);return}
 /* ranking */
 if(d.rk){RK.tab=d.rk;if(d.rk==='modulo'&&!RK.mod)RK.mod=MODULES[0].id;S.keepScroll=true;render();return}
 if(d.act==='rkTurma'){RK.turma=!RK.turma;S.keepScroll=true;render();return}
 if(d.act==='rkRefresh'){S.scores=null;render();return}
 /* perfil */
 if(d.themeSet){lsSet('upmed2_theme',d.themeSet);applyTheme(d.themeSet);S.keepScroll=true;render();return}
 if(d.act==='logout'){Store.signOut();return}
 if(d.act==='versions'){showVersions();return}
 /* editor */
 if(d.edph){var p=PHOTO[d.edph];var ex=S.stations['ph-'+p.id];edOpen(ex?JSON.parse(JSON.stringify(ex)):{id:'ph-'+p.id,photo:p.id,t:p.t,src:commonsSrc(p.f),credit:commonsPage(p.f),pins:[]},p.list,p.key?commonsPage(p.key):'');return}
 if(d.edopen){var s=JSON.parse(JSON.stringify(S.stations[d.edopen]));edOpen(s,[],'');return}
 if(d.act==='edOwn'){var t=$('#edTitle').value.trim()||'Estação própria',f=$('#edFile').files[0],u=$('#edUrl').value.trim();var id='own-'+cyrb53(t+Date.now());
  if(f){b.disabled=true;b.textContent='Preparando…';resizeImage(f).then(function(src){edOpen({id:id,t:t,src:src,credit:'',pins:[]},[],'')}).catch(function(){toast('Não foi possível ler essa imagem.');b.disabled=false;b.textContent='Abrir no editor'})}
  else if(/^https:\/\//.test(u))edOpen({id:id,t:t,src:u,credit:u,pins:[]},[],'');else toast('Escolha um arquivo ou cole um endereço https.');return}
 if(d.edn!=null){ED.cur=+d.edn;S.keepScroll=true;render();return}
 if(d.act==='edSkip'){var nm=ED.list[ED.cur];ED.skip[nm]=true;ED.st.pins=ED.st.pins.filter(function(p){return p.n!==nm});var nx=ED.list.findIndex(function(n2,i){return i>ED.cur&&!ED.st.pins.find(function(p){return p.n===n2})&&!ED.skip[n2]});ED.cur=nx<0?null:nx;S.keepScroll=true;render();return}
 if(d.act==='edUnpin'){var nm2=ED.list[ED.cur];ED.st.pins=ED.st.pins.filter(function(p){return p.n!==nm2});S.keepScroll=true;render();return}
 if(d.act==='edBack'){ED=null;go('editor');return}
 if(d.act==='edSave'){if(ED.st.pins.length<2){toast('Marque pelo menos 2 estruturas.');return}ED.st.by=S.user.uid;ED.st.at=Date.now();b.disabled=true;Store.saveStation(ED.st).then(function(){S.stations[ED.st.id]=ED.st;toast('Estação publicada para a turma.');ED=null;go('editor')}).catch(function(err){b.disabled=false;toast(errMsg(err))});return}
 if(d.act==='edDel'){if(b.dataset.confirm!=='1'){b.dataset.confirm='1';b.textContent='Tocar de novo para excluir';return}Store.deleteStation(ED.st.id).then(function(){delete S.stations[ED.st.id];toast('Estação excluída.');ED=null;go('editor')}).catch(function(err){toast(errMsg(err))});return}
});
document.addEventListener('change',function(e){
 var t=e.target;
 if(t.id==='fMod'){F.mod=t.value;S.keepScroll=true;render();return}
 if(t.dataset&&t.dataset.as!=null){var P=S.quiz.list[S.quiz.i];P.v[t.dataset.as]=t.value;S.keepScroll=true;render();return}
 if(t.dataset&&t.dataset.prs){PR.sel[t.dataset.prs]=t.checked;return}
 if(t.id==='rkMod'){RK.mod=t.value;S.keepScroll=true;render();return}
});
document.addEventListener('submit',function(e){
 if(e.target.id==='gpForm'){e.preventDefault();var Z=S.quiz,P=Z.list[Z.i];if(Z.done)return;var v=$('#gpIn').value;if(!v.trim())return;P.typed=v;finishQ(P.q.a.some(function(a){return close(v,a)}));return}
 if(e.target.id==='exForm'){e.preventDefault();var it=PR.items[PR.i];if(it.done)return;var v2=$('#exIn').value;if(!v2.trim())return;prAnswer(close(v2,it.pin.n),{typed:v2});return}
 if(e.target.id==='edAddForm'){e.preventDefault();var n=$('#edAdd').value.trim();if(!n)return;if(ED.list.indexOf(n)<0)ED.list.push(n);ED.cur=ED.list.indexOf(n);S.keepScroll=true;render();return}
});
var _after=after;after=function(){_after();if(S.view==='editor'&&ED&&ED.st)edPaint()};

function refreshStations(){Store.listStations().then(function(s){var before=JSON.stringify(Object.keys(S.stations));S.stations=s||{};if(before!==JSON.stringify(Object.keys(S.stations))&&(S.view==='games'||(S.view==='pratica'&&PR&&PR.phase==='menu')||(S.view==='editor'&&!(ED&&ED.st)))){S.keepScroll=true;render()}}).catch(function(){})}

function onUser(u){
 if(!u){S.user=null;S.priv=null;S.scores=null;S.admin=false;authMode='in';render();return}
 S.user=u;$('#app').innerHTML='<div style="padding:40px;text-align:center" class="muted">Carregando seu progresso…</div>';
 Promise.all([Store.loadPrivate(u.uid).catch(function(){return null}),Store.isAdmin(u.uid),Store.listStations().catch(function(){return{}})]).then(function(r){
  var p=r[0]||blankPriv();var b=blankPriv();Object.keys(b).forEach(function(k){if(p[k]==null)p[k]=b[k]});if(!p.stats.mods)p.stats.mods={};if(!p.stats.week)p.stats.week=b.stats.week;if(!Array.isArray(p.hist))p.hist=Object.values(p.hist||{});
  S.priv=p;S.admin=r[1];S.stations=r[2]||{};S.view='painel';render();persist();
 });
}
function boot(){
 var cfg=window.FIREBASE_CONFIG;
 if(cfg&&cfg.apiKey&&cfg.databaseURL){
  $('#app').innerHTML='<div style="padding:40px;text-align:center" class="muted">Conectando…</div>';
  FirebaseStore.init(cfg).then(function(){Store=FirebaseStore;Store.onUser(onUser)}).catch(function(e){console.warn(e);S.fbError='Não foi possível conectar ao Firebase agora.';Store=LocalStore;Store.onUser(onUser)});
 } else {Store=LocalStore;Store.onUser(onUser)}
}
window.UPMED={boot:boot};
boot();
})();
