 L(mc('ponte',2,'Na via auditiva, as fibras do lemnisco lateral terminam:',['No colículo inferior','No corpo geniculado lateral','No núcleo olivar inferior','No tálamo diretamente'],'Do colículo inferior a via segue ao corpo geniculado medial.'),'Os núcleos cocleares projetam para o núcleo olivar superior e, pelo corpo trapezoide, para o lado oposto; a via sobe no lemnisco lateral até o colículo inferior.','O corpo geniculado lateral é da via visual: confundir os dois é erro comum.'),
 L(ar('ponte',2,'Uma lesão da via auditiva central de um só lado não causa surdez completa de um ouvido.','A via auditiva tem componentes cruzados e não cruzados, de modo que cada hemisfério recebe informações dos dois ouvidos.',0,'As duas são verdadeiras e a razão explica a afirmação.'),'Muitas fibras dos núcleos cocleares sobem do mesmo lado ou fazem sinapse no olivar superior do mesmo lado; outras cruzam no corpo trapezoide.','Surdez unilateral aponta para lesão do ouvido, do nervo coclear ou dos núcleos cocleares, e não da via central acima deles.'),
 L(mc('ponte',2,'Os núcleos vestibulares ficam:',['Na área vestibular do assoalho do IV ventrículo','Na base da ponte, entre os núcleos pontinos','No teto do mesencéfalo, junto aos colículos','Na parte lateral do bulbo, junto à oliva'],'São quatro: lateral, medial, superior e inferior.'),'Recebem a parte vestibular do VIII e fibras do cerebelo, e mandam fibras ao cerebelo, ao fascículo longitudinal medial, à medula (vestibulospinal) e, provavelmente, ao tálamo.','Lesões dos núcleos vestibulares causam vertigem, nistagmo, náusea e desequilíbrio.'),
 L(as('ponte',2,'Associe a saída dos núcleos vestibulares à função.',[['Fascículo vestibulocerebelar','Equilíbrio, pelo vestibulocerebelo'],['Fascículo longitudinal medial','Ajuste dos olhos aos movimentos da cabeça'],['Trato vestibulospinal','Equilíbrio, pelos motoneurônios da medula'],['Fibras vestibulotalâmicas','Informação ao córtex, ainda discutida']],'Os núcleos vestibulares distribuem a informação de posição da cabeça.'),'O reflexo vestíbulo-ocular, que mantém a imagem estável enquanto a cabeça se move, depende do fascículo longitudinal medial.','No paciente em coma, o teste dos "olhos de boneca" avalia essa via e a integridade do tronco.'),
 L(mc('ponte',2,'O joelho interno do nervo facial contorna o núcleo do:',['Abducente','Trigêmeo','Vestibular lateral','Hipoglosso'],'Esse contorno forma o colículo facial.'),'As fibras saem do núcleo do facial em direção dorsomedial, sobem medialmente ao núcleo do VI, passam por cima dele e descem para emergir no sulco bulbopontino.','O joelho externo, com o gânglio geniculado, fica no canal facial do temporal, não na ponte.'),
 L(cs('ponte',3,'Paciente tem estrabismo convergente à direita, não abduz o olho direito e apresenta paralisia de toda a hemiface direita. A lesão mais provável está:',['No tegmento da ponte, no colículo facial direito','No forame estilomastóideo direito, fora do crânio','No seio cavernoso direito, junto à carótida','No córtex motor esquerdo, na área da face'],'O núcleo do VI e o joelho interno do VII estão juntos.'),'A lesão do núcleo do abducente (ou de suas fibras) com as fibras do facial que o contornam explica os dois achados do mesmo lado. Uma lesão periférica não pegaria os dois juntos.','Doenças desmielinizantes e pequenos infartos pontinos são causas comuns desse quadro.'),
 L(gp('ponte',2,'A elevação do assoalho do IV ventrículo formada pelas fibras do facial sobre o núcleo do abducente chama-se colículo ____.',['facial'],'Fica na metade cranial do assoalho, junto à eminência medial.'),'É uma referência anatômica visível na vista dorsal do tronco encefálico e nos cortes da ponte.','Em cirurgias do IV ventrículo, o colículo facial é evitado para não lesar o VI e o VII.'),
 L(mc('ponte',2,'Os núcleos salivatório superior e lacrimal enviam suas fibras pelo:',['Nervo intermédio','Nervo glossofaríngeo','Nervo abducente','Nervo trigêmeo'],'São parassimpáticos do VII.'),'O salivatório superior serve às glândulas submandibular e sublingual (gânglio submandibular); o lacrimal, à glândula lacrimal (gânglio pterigopalatino).','A perda de lacrimejamento numa paralisia facial indica lesão proximal, antes da saída do petroso maior.'),
 L(as('ponte',3,'Associe o núcleo do trigêmeo à função.',[['Núcleo do trato espinal','Dor e temperatura da cabeça'],['Núcleo sensitivo principal','Tato da face'],['Núcleo do trato mesencefálico','Propriocepção dos músculos mastigadores'],['Núcleo motor','Músculos da mastigação']],'O motor é também chamado núcleo mastigador.'),'O sensitivo principal é a continuação cranial dilatada do núcleo do trato espinal. O mesencefálico sobe até o mesencéfalo. Dos sensitivos sai o lemnisco trigeminal.','O reflexo mandibular (masseteriano) usa o núcleo mesencefálico como aferência e o motor como eferência.'),
 L(mc('ponte',2,'Num corte da ponte no nível da entrada do trigêmeo, o núcleo motor do V está:',['Medial ao núcleo sensitivo principal','Lateral ao núcleo sensitivo principal','Na base da ponte','No assoalho do IV ventrículo, junto à linha média'],'Motor medial, sensitivo lateral.'),'A regra geral do tronco é que núcleos motores fiquem mais mediais e os sensitivos, mais laterais, herança da organização da medula.','Lesões laterais do tegmento pontino tiram a sensibilidade da face; as mais mediais podem poupar a sensibilidade e afetar a mastigação.'),
 L(ar('ponte',3,'No tegmento da ponte, o lemnisco medial forma uma fita vertical junto à linha média, como no bulbo.','No tegmento da ponte, o lemnisco medial é cruzado perpendicularmente pelas fibras do corpo trapezoide.',3,'A afirmação é falsa (na ponte ele fica transversal); a razão é verdadeira.'),'No bulbo o lemnisco medial é vertical, ao lado da linha média; na ponte ele gira e vira uma faixa horizontal, atravessada pelo corpo trapezoide.','Essa mudança de orientação é uma das pistas para distinguir cortes do bulbo e da ponte.'),
 L(mc('ponte',2,'O pedúnculo cerebelar superior:',['É o principal sistema de fibras eferentes do cerebelo e começa a decussar no limite com o mesencéfalo','Leva as fibras pontinas cruzadas até o córtex do cerebelo','Entra no cerebelo pelas bordas da metade inferior do IV ventrículo','É formado por fibras olivocerebelares e espinocerebelares posteriores'],'Forma a parede dorsolateral da metade cranial do IV ventrículo.'),'Depois de sair do cerebelo, o pedúnculo superior se aprofunda no tegmento e cruza com o do outro lado na decussação dos pedúnculos cerebelares superiores, seguindo para o núcleo rubro e o tálamo.','Lesões do pedúnculo superior causam tremor de intenção e ataxia; a decussação explica por que os sintomas ficam do lado do cerebelo afetado.'),
 L(mc('ponte',2,'Na formação reticular da ponte, os neurônios ricos em serotonina ficam:',['Nos núcleos da rafe, na linha média','No locus ceruleus, no assoalho do ventrículo','Nos núcleos pontinos, espalhados pela base','No núcleo olivar superior, junto ao corpo trapezoide'],'O locus ceruleus é noradrenérgico.'),'Locus ceruleus e núcleos da rafe projetam amplamente ao córtex e modulam vigília, humor e atenção. Serão estudados com a formação reticular.','Muitos antidepressivos agem sobre a serotonina e a noradrenalina liberadas por essas projeções.'),
 L(vf('ponte',2,'Julgue sobre lesões da ponte.',[['Podem causar alteração da sensibilidade da face.',true],['Podem causar paralisia do reto lateral.',true],['Causam, tipicamente, paralisia da língua.',false],['Podem causar tontura e desequilíbrio.',true]],'A língua depende do hipoglosso, cujo núcleo fica no bulbo.'),'Os nervos cuja lesão nuclear aparece na ponte são V, VI, VII e VIII. Associados a sinais de vias longas, formam as síndromes pontinas.','Identificar quais nervos cranianos estão afetados é a forma mais rápida de dizer o nível de uma lesão do tronco.'),
 L(cs('ponte',2,'Homem com zumbido e perda auditiva à direita. A ressonância mostra lesão nos núcleos cocleares direitos, na ponte. O que se espera?',['Perda auditiva no ouvido direito','Perda auditiva nos dois ouvidos igualmente','Perda auditiva só no ouvido esquerdo','Audição normal, porque a via é bilateral'],'Os núcleos cocleares recebem só do ouvido do mesmo lado.'),'Até os núcleos cocleares a via é unilateral; a bilateralidade só começa depois deles, no corpo trapezoide e no olivar superior.','Por isso lesões do VIII ou dos núcleos cocleares causam surdez do mesmo lado, enquanto lesões altas da via raramente causam surdez.'),
 L(gp('ponte',2,'O núcleo da formação reticular da ponte rico em neurônios noradrenérgicos é o locus ____.',['ceruleus','coeruleus','cerúleo','ceruleo'],'Tem cor azulada nas peças a fresco.'),'Fica no assoalho do IV ventrículo, na metade cranial, e projeta noradrenalina para quase todo o SNC.','Sua atividade aumenta no estresse e na vigília e cai no sono.')
);

/* Capítulo 16 — Estrutura do mesencéfalo */
LESSON.mesenc=[
 {t:'Divisões do mesencéfalo',b:[
  ['p','O **aqueduto cerebral** divide o mesencéfalo em uma parte dorsal, o **teto**, e uma ventral, muito maior, os **pedúnculos cerebrais**. Em volta do aqueduto há a **substância cinzenta central (periaquedutal)**.'],
  ['p','Cada pedúnculo tem uma parte ventral, a **base do pedúnculo** (fibras descendentes), e uma dorsal, o **tegmento** (continuação do tegmento da ponte). Entre as duas fica a **substância negra**.'],
  ['fig','mesencCorte','Mesencéfalo em corte no nível dos colículos superiores.'],
  ['chk','O que separa o tegmento da base do pedúnculo cerebral?',['O aqueduto cerebral','A substância negra','O núcleo rubro'],1,'A substância negra é uma lâmina pigmentada entre os dois.']]},
 {t:'Teto: colículos e área pré-tetal',b:[
  ['p','Nos vertebrados inferiores o teto é um grande centro integrador; nos mamíferos, parte dessas funções passou ao córtex. Tem quatro eminências e a área pré-tetal.'],
  ['ul',['**Colículo superior:** camadas alternadas de branca e cinzenta. Recebe fibras da **retina** (trato óptico e braço do colículo superior) e do **córtex occipital**; origina o **trato tetospinal**. Liga-se ao núcleo do III e participa dos **movimentos reflexos dos olhos**.','**Colículo inferior:** um núcleo bem delimitado que recebe o **lemnisco lateral** e projeta ao **corpo geniculado medial** pelo **braço do colículo inferior**; uma comissura liga os dois colículos. É estação da **via auditiva**.','**Área pré-tetal:** na extremidade rostral dos colículos superiores, no limite com o diencéfalo; controle **reflexo da pupila**.']],
  ['clin','Lesões que comprimem os colículos superiores, como tumores da glândula pineal, podem tirar a capacidade de **mover os olhos no sentido vertical**, voluntária ou reflexamente.'],
  ['chk','O colículo inferior faz parte da via:',['Visual','Auditiva','Gustativa'],1,'Recebe o lemnisco lateral e projeta ao corpo geniculado medial.']]},
 {t:'Base do pedúnculo',b:[
  ['p','A base do pedúnculo é formada pelos tratos descendentes **corticospinal**, **corticonuclear** e **corticopontino**, num conjunto compacto, com localização precisa das fibras para cada parte do corpo.'],
  ['clin','Lesões da base do pedúnculo causam **paralisias do lado oposto** ao da lesão, pois as fibras corticospinais ainda não cruzaram.'],
  ['chk','Uma lesão da base do pedúnculo cerebral esquerdo causa paralisia:',['Do lado esquerdo do corpo','Do lado direito do corpo','Dos dois lados'],1,'O corticospinal só cruza no bulbo.']]},
 {t:'Núcleos do III e do IV',b:[
  ['p','O **núcleo do troclear** fica no nível do **colículo inferior**, ventral à substância cinzenta central e dorsal ao fascículo longitudinal medial. Suas fibras saem pela face dorsal do núcleo, contornam a cinzenta central, **cruzam** com as do outro lado e emergem no véu medular superior, abaixo do colículo inferior.'],
  ['key','O troclear é o **único** nervo que sai da **face dorsal** do encéfalo e o **único** cujas fibras **decussam** antes de sair do SNC. O núcleo esquerdo inerva o oblíquo superior direito.'],
  ['p','O **complexo oculomotor** fica no nível do **colículo superior**, junto ao fascículo longitudinal medial. Tem uma parte **somática** (subnúcleos para reto superior, reto inferior, reto medial, oblíquo inferior e elevador da pálpebra) e uma parte **visceral**, o **núcleo de Edinger-Westphal**, com os pré-ganglionares para o gânglio ciliar (músculo ciliar e esfíncter da pupila). As fibras descem em curva e emergem na **fossa interpeduncular**.'],
  ['p','No tegmento está ainda o **núcleo do trato mesencefálico do V**, que recebe a propriocepção trazida pelo trigêmeo.'],
  ['chk','Qual nervo craniano tem fibras que cruzam antes de sair do tronco encefálico?',['Oculomotor','Troclear','Abducente'],1,'As fibras do IV decussam no véu medular superior.']]},
 {t:'Núcleo rubro, substância negra e periaquedutal',b:[
  ['p','O **núcleo rubro** tem tom rosado a fresco. É envolvido pelas fibras do **pedúnculo cerebelar superior**, que em parte terminam nele e em grande parte seguem ao tálamo. Recebe também das áreas motoras do córtex e dá origem ao **trato rubrospinal** (motricidade distal). Liga-se ao complexo olivar inferior (circuito rubro-olivar-cerebelar).'],
  ['p','A **substância negra** tem neurônios com **melanina**, que lhe dão a cor escura. Na **parte compacta** os neurônios são **dopaminérgicos**. Liga-se ao **corpo estriado** nos dois sentidos (fibras **nigrostriatais**, dopaminérgicas, e estriatonigrais).'],
  ['clin','A degeneração dos neurônios dopaminérgicos da substância negra reduz a dopamina no estriado e causa a **doença de Parkinson**. A substância negra é estrutura do tronco encefálico, não do corpo estriado, apesar das conexões.'],
  ['p','A **substância cinzenta periaquedutal** tem papel importante na **regulação da dor**.'],
  ['chk','O neurotransmissor dos neurônios da parte compacta da substância negra é:',['Serotonina','Dopamina','Noradrenalina'],1,'Por isso a perda desses neurônios causa Parkinson.']]},
 {t:'Substância branca e formação reticular',b:[
  ['p','No mesencéfalo, as fibras **descendentes** passam pela base do pedúnculo; as **ascendentes** passam pelo tegmento: os quatro lemniscos e o pedúnculo cerebelar superior.'],
  ['ul',['No nível do **colículo inferior**, o pedúnculo cerebelar superior **decussa** e sobe envolvendo o núcleo rubro.','Também nesse nível, os quatro lemniscos se alinham na parte lateral do tegmento, de medial para lateral: **medial, espinal, trigeminal e lateral**.','O lemnisco lateral termina no colículo inferior; os outros três sobem ao nível do colículo superior, laterais ao núcleo rubro.','O **fascículo longitudinal medial** corre junto à linha média em todo o tegmento.']],
  ['p','Na formação reticular destacam-se a **área tegmentar ventral** (dopamina) e os **núcleos da rafe** (serotonina), continuação dos da ponte.'],
  ['clin','Lesões do mesencéfalo combinam perdas sensitivas ou paralisias com lesão do oculomotor. Compressões que atingem a formação reticular mesencefálica podem causar **coma**.'],
  ['mn','Ordem dos lemniscos no colículo inferior, de medial para lateral: **M**uito **E**studo **T**raz **L**ucro: Medial, Espinal, Trigeminal, Lateral.'],
  ['chk','A decussação dos pedúnculos cerebelares superiores fica no nível:',['Do colículo superior','Do colículo inferior','Da área pré-tetal'],1,'Depois de cruzar, as fibras sobem envolvendo o núcleo rubro.']]}
];
RESUMO.mesenc={pts:['Aqueduto separa o teto (dorsal) dos pedúnculos cerebrais (ventral); em volta, substância cinzenta periaquedutal.','Pedúnculo: base (corticospinal, corticonuclear, corticopontino) e tegmento, separados pela substância negra.','Colículo superior: retina, córtex occipital, tetospinal; movimentos reflexos dos olhos. Colículo inferior: via auditiva até o geniculado medial.','Área pré-tetal: reflexo pupilar.','Núcleo do IV no nível do colículo inferior; único nervo dorsal e que decussa antes de sair.','Complexo oculomotor no nível do colículo superior: parte somática e Edinger-Westphal (pupila e acomodação). Sai na fossa interpeduncular.','Núcleo rubro: recebe cerebelo e córtex; origem do rubrospinal.','Substância negra: melanina, dopamina (parte compacta), conexões com o estriado.','Lemniscos no colículo inferior: medial, espinal, trigeminal e lateral; decussação do pedúnculo cerebelar superior.','Formação reticular: área tegmentar ventral (dopamina) e núcleos da rafe (serotonina).'],
 clin:['Tumores da pineal comprimem os colículos superiores: paralisia do olhar vertical.','Lesão da base do pedúnculo: paralisia contralateral, às vezes com lesão do III.','Doença de Parkinson: perda dos neurônios dopaminérgicos da substância negra.','Periaquedutal: controle da dor.','Compressão do mesencéfalo pode causar coma.']};
QB.push(
 L(mc('mesenc',1,'O aqueduto cerebral separa:',['O teto dos pedúnculos cerebrais','A base do pedúnculo do tegmento','O colículo superior do inferior','O núcleo rubro da substância negra'],'O teto é dorsal; os pedúnculos, ventrais.'),'O aqueduto percorre o mesencéfalo de cima a baixo e liga o III ao IV ventrículo. A substância cinzenta periaquedutal o envolve.','A estenose do aqueduto causa hidrocefalia dos ventrículos laterais e do III, com IV ventrículo normal.'),
 L(as('mesenc',2,'Associe a estrutura ao nível do mesencéfalo em que aparece.',[['Núcleo do nervo troclear','Colículo inferior'],['Complexo oculomotor','Colículo superior'],['Decussação dos pedúnculos cerebelares superiores','Colículo inferior'],['Núcleo rubro bem formado','Colículo superior']],'Cada nível tem estruturas típicas.'),'No colículo inferior: núcleo do IV, decussação do pedúnculo superior e lemnisco lateral chegando ao colículo. No colículo superior: complexo do III, núcleo rubro e substância negra bem visível.','Saber essas marcas permite dizer o nível de um corte em provas práticas.'),
 L(mc('mesenc',2,'O colículo superior recebe fibras:',['Da retina e do córtex occipital','Do lemnisco lateral','Do núcleo olivar inferior','Do pedúnculo cerebelar superior'],'Chegam pelo braço do colículo superior.'),'O colículo superior também origina o trato tetospinal, para a medula cervical, e se liga ao núcleo do oculomotor, participando de reflexos dos movimentos oculares.','Por estar ligado ao olhar vertical, sua compressão (por tumor da pineal) causa paralisia do olhar para cima.'),

function record(q,ok,partial){

function pickQuestions(pool,n){

 while(out.length<n&&left.length){
  var tot=0,ws=left.map(function(q){var v=(w[q.id]||1)*(seen[q.id]?1:2.2);tot+=v;return v});

 }

}

function stationOfDay(){var dk=dayKey(),c=S.priv.c,sv=c.sdPick;
 if(sv&&sv.day===dk){var st0=allStations().find(function(s){return s.id===sv.st});var pin0=st0&&st0.pins.find(function(p){return p.n===sv.n});if(pin0&&sv.opts&&sv.opts.length)return{st:st0,pin:pin0,opts:sv.opts}}
 var r=pickStationOfDay();c.sdPick={day:dk,st:r.st.id,n:r.pin.n,opts:r.opts};afterFns.push(function(){try{persist()}catch(e){}});return r}
function pickStationOfDay(){var sts=allStations(),pool=[];sts.forEach(function(s){s.pins.forEach(function(p){pool.push({st:s,pin:p})})});var it=pool[hashNum('sd'+dayKey())%pool.length];var others=shuffleSeed(it.st.pins.filter(function(p){return p.n!==it.pin.n}).map(function(p){return p.n}),hashNum(dayKey()+'o')).slice(0,3);return{st:it.st,pin:it.pin,opts:shuffleSeed([it.pin.n].concat(others),hashNum(dayKey()+'p'))}}
function shuffleSeed(a,seed){var r=rng(seed);a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
var SD=null;
function paintSD(){if(!SD)return;var st=SD.st,pin=SD.pin,res=S.priv.c.sd&&S.priv.c.sd.day===dayKey()?S.priv.c.sd:null;
 if(st.kind==='svg'){var svg=$('#sdfig svg');if(!svg)return;var p=SCHM[pin.sid];svg.querySelectorAll('[data-id="'+pin.sid+'"]').forEach(function(e){e.classList.add(res?(res.ok?'ok':'hl'):'hl')});var ns='http://www.w3.org/2000/svg';[['spin pulse',9],['spin',6]].forEach(function(a){var c=document.createElementNS(ns,'circle');c.setAttribute('class',a[0]);c.setAttribute('cx',p.a[0]);c.setAttribute('cy',p.a[1]);c.setAttribute('r',a[1]);svg.appendChild(c)})}
 else{var box=$('#sdfig .zoomer');if(!box)return;var d=document.createElement('span');d.className='pin pulse';d.style.left=(pin.x*100)+'%';d.style.top=(pin.y*100)+'%';box.appendChild(d)}}

function plain(t){return String(t||'').replace(/\*\*(.+?)\*\*/g,'$1').replace(/_(.+?)_/g,'$1')}
function lsGetSafe(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSetSafe(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function contCard(){
 var L=S.priv.c.last;if(L&&!MOD[L.m])L=null;
 var id,kicker,title,sub,btns;
 if(!L){id=MODULES[0].id;var L0=LESSON[id];kicker='Comece por aqui';title=MOD[id].n;sub=L0?'Aula com '+L0.length+' seções, figuras e questões de fixação.':MOD[id].s;
  btns=(L0?'<button class="btn pri" data-x="cont" data-xv="'+id+'|0">Abrir a aula</button>':'')+'<button class="btn ghost" data-x="train" data-xv="'+id+'">Treinar 10 questões</button>'}
 else{id=L.m;var Ls=LESSON[id],s=modStats(id),read=S.priv.c['read_'+id],idx=MODULES.findIndex(function(x){return x.id===id}),nx=MODULES.slice(idx+1).find(function(x){return LESSON[x.id]})||MODULES[idx+1];
  kicker='Continuar de onde parou';title=MOD[id].n;
  if(Ls&&!read){var sec=Math.max(0,Math.min(L.s||0,Ls.length-1));sub='Aula · seção '+(sec+1)+' de '+Ls.length+': '+plain(Ls[sec].t);
   btns='<button class="btn pri" data-x="cont" data-xv="'+id+'|'+sec+'">Continuar a aula</button><button class="btn ghost" data-x="train" data-xv="'+id+'">Treinar este módulo</button>'}
  else if(s.a>=10&&s.acc>=70&&nx){sub='Você acertou '+s.acc+'% neste módulo. Próximo passo: '+nx.n+'.';
   btns='<button class="btn pri" data-mod="'+nx.id+'">Ir para o próximo módulo</button><button class="btn ghost" data-x="train" data-xv="'+id+'">Treinar mais este</button>'}
  else{sub=(Ls?'Aula lida. ':'')+(s.a?s.acc+'% de acerto em '+s.a+' respostas. ':'')+'Próximo passo: fixar com questões.';
   btns='<button class="btn pri" data-x="train" data-xv="'+id+'">Treinar 10 questões</button><button class="btn ghost" data-mod="'+id+'">Abrir o módulo</button>'}}
 var pr=modStats(id);
 return '<section class="card cont"><div class="cont-g">'+glyph(id,48)+'<div class="cont-t"><span class="eyebrow">'+kicker+'</span><h2>'+esc(title)+'</h2><p class="small muted">'+esc(sub)+'</p>'+meter(pr.acc,pr.a)+'</div></div><div class="actions">'+btns+'</div></section>';
}
function modList(){

 var open=lsGetSafe('upmed_areas',null);
 return '<h2 class="sec-h">Módulos</h2><div class="areas">'+AREAS.map(function(a){
  var isOpen=open?!!open[a.id]:a.id===curArea;

   var tag=Ls?(read?'<span class="mtag ok">Aula lida</span>':'<span class="mtag">Aula</span>'):'<span class="mtag soon">Aula em breve</span>';
   return '<button class="mrow" data-mod="'+id+'">'+glyph(id,34)+'<span class="mrow-t"><b>'+esc(m.n)+'</b><span class="small muted num">'+s.seen+'/'+s.tot+' vistas'+(s.a?' · '+s.acc+'% de acerto':'')+'</span></span>'+tag+'<span class="mrow-m">'+meter(s.acc,s.a)+'</span></button>'}).join('')+

/* ---------- resultado do quiz ---------- */
function answerText(q){
 if(q.t==='mc'||q.t==='case')return esc(q.o[0]);
 if(q.t==='ar')return esc(AR_OPTS[q.k]);
 if(q.t==='gp')return esc(q.a[0]);
 if(q.t==='vf')return q.s.map(function(s){return(s[1]?'V':'F')+' · '+esc(s[0])}).join('<br>');
 if(q.t==='as')return q.p.map(function(p){return esc(p[0])+' → '+esc(p[1])}).join('<br>');
 if(q.t==='od')return q.s.map(function(s,i){return(i+1)+'. '+esc(s)}).join('<br>');
 return '';
}
window.quizResult=function(Z){

 (list.length?'<div class="card grid"><h3>'+(Z.exam?'Gabarito comentado':'Para revisar')+'</h3>'+list.map(function(r,i){var q=r.q;return '<div class="rev-item"><div class="row-b"><span class="chips"><span class="tag">'+esc(MOD[q.m].n)+'</span>'+(Z.exam?'<span class="tag" style="background:color-mix(in srgb,var('+(r.ok?'--ok':'--bad')+') 20%,transparent)">'+(r.skipped?'Sem resposta':r.ok?'Acertou':'Errou')+'</span>':'')+'</span><button class="favbtn" data-fav="'+q.id+'" aria-pressed="'+!!S.priv.fav[q.id]+'" aria-label="Favoritar">'+(S.priv.fav[q.id]?'★':'☆')+'</button></div><p>'+esc(q.q||q.a)+'</p>'+(q.t==='ar'?'<p class="small muted">Razão: '+esc(q.r)+'</p>':'')+'<p class="small"><b>Resposta:</b><br>'+answerText(q)+'</p><p class="small muted">'+esc(q.e)+'</p></div>'}).join('')+'</div>':'<p>Sessão sem erros.</p>')+'</div>';

window.__quizStart=function(Z){if(!Z.exam)return;timerH=setInterval(function(){var t=$('#qTimer');var left=Z.deadline-Date.now();if(t){t.textContent=fmtLeft(Z.deadline);t.classList.toggle('low',left<60000)}if(left<=0&&!Z.finished){for(var i=Z.i;i<Z.list.length;i++){Z.results.push({q:Z.list[i].q,ok:false,skipped:true})}endQuiz(Z);render();window.scrollTo(0,0)}},1000)};

  var qs=QB.filter(function(q){return hit((q.q||'')+' '+(q.a||'')+' '+(q.r||'')+' '+(q.o||[]).join(' ')+' '+(q.s||[]).map(function(x){return Array.isArray(x)?x[0]:x}).join(' ')+' '+(q.p||[]).map(function(x){return x.join(' ')}).join(' ')+' '+q.e)}).slice(0,30);

  (qs.length?'<section class="card grid"><div class="row-b"><h3>Questões</h3><button class="btn pri sm" data-x="searchQuiz">Responder todas ('+qs.length+')</button></div>'+qs.map(function(q){return '<button class="sres" data-x="oneq" data-xv="'+q.id+'"><span class="tag">'+esc(MOD[q.m].n)+' · '+TYPE_LABEL[q.t]+'</span><span>'+esc(q.q||q.a)+'</span></button>'}).join('')+'</section>':'')+

  (nv.length?'<section class="card grid"><h3>Nervos cranianos</h3>'+nv.map(function(n){return '<div class="sres"><b>'+n.r+' · '+esc(n.n)+'</b><span class="small muted">'+esc(n.fn)+' · '+esc(n.fo)+' · '+esc(n.og)+'</span></div>'}).join('')+'</section>':'')+
  (les.length?'<section class="card grid"><h3>Casos de topografia</h3>'+les.map(function(l){return '<div class="sres"><span>'+esc(l.q)+'</span><span class="small muted">'+esc(l.e)+'</span></div>'}).join('')+'</section>':'');
  S._searchIds=qs.map(function(q){return q.id});
 }

 var wid=weekId();
 var arr=Object.keys(S.scores).map(function(k){var s=S.scores[k]||{};var v,a;
  if(RK2.tab==='geral'){v=s.xp||0;a=pct(s.correct||0,s.answered||0)}

/* ---------- FLASHCARDS ---------- */
function fcDeck(mod){
 var cards=[];
 QB.forEach(function(q){if(mod&&q.m!==mod)return;if(q.t==='as'||q.t==='od'||q.t==='vf')return;
  var front=q.t==='ar'?'Asserção: '+q.a+'\nRazão: '+q.r:q.q;var back=answerTextPlain(q);
  cards.push({id:'q_'+q.id,m:q.m,f:front,b:back,e:q.e})});
 QB.forEach(function(q){if(mod&&q.m!==mod)return;if(q.t==='as')q.p.forEach(function(p,i){cards.push({id:'a_'+q.id+'_'+i,m:q.m,f:p[0]+' → ?',b:p[1],e:q.q})});if(q.t==='od')cards.push({id:'o_'+q.id,m:q.m,f:q.q,b:q.s.map(function(x,i){return(i+1)+'. '+x}).join('\n'),e:q.e});if(q.t==='vf')q.s.forEach(function(s,i){cards.push({id:'v_'+q.id+'_'+i,m:q.m,f:'Verdadeiro ou falso: '+s[0],b:s[1]?'Verdadeiro':'Falso',e:q.e})})});
 if(!mod||mod==='nervcran')NERVES.forEach(function(n){cards.push({id:'n_'+n.r,m:'nervcran',f:'Nervo '+n.r+' ('+n.n+'): função, forame e origem aparente?',b:n.fn+'\nForame: '+n.fo+'\nOrigem: '+n.og,e:''})});
 return cards;
}
function answerTextPlain(q){if(q.t==='mc'||q.t==='case')return q.o[0];if(q.t==='ar')return AR_OPTS[q.k];if(q.t==='gp')return q.a[0];return ''}
var FC=null;
function fcStart(mod){var all=fcDeck(mod),t=dayNum(),st=S.priv.fcs||(S.priv.fcs={});var due=all.filter(function(c){return st[c.id]&&st[c.id].due<=t}),fresh=all.filter(function(c){return!st[c.id]});FC={mod:mod||'',queue:shuffle(due).concat(shuffle(fresh)).slice(0,25),i:0,flip:false,done:0,total:all.length,dueN:due.length,newN:fresh.length};go('flash')}

 if(!FC){return '<div class="top"><div><div class="eyebrow">Revisão rápida</div><h1>Flashcards</h1></div></div><div class="card grid"><label class="f">Baralho<select class="in" id="fcMod"><option value="">Todos os módulos</option>'+MODULES.map(function(m){return '<option value="'+m.id+'">'+esc(m.n)+'</option>'}).join('')+'</select></label><div class="actions"><button class="btn pri" data-x="fcGo">Estudar</button></div></div>'+ankiCard()}
 var c=FC.queue[FC.i];
 if(!c)return '<div class="qwrap"><div class="eyebrow">Flashcards</div><h1>Sessão concluída</h1><p>'+FC.done+' cartões revisados. Os que você marcou como difíceis voltam antes.</p><div class="actions"><button class="btn pri" data-x="fcAgain">Outra sessão</button><button class="btn ghost" data-x="fcMenu">Trocar baralho</button></div>'+ankiCard()+'</div>';

 '<button class="fcard'+(FC.flip?' flip':'')+'" data-x="fcFlip" aria-label="Virar cartão"><span class="tag">'+esc(MOD[c.m].n)+'</span><div class="fc-f">'+esc(c.f).replace(/\n/g,'<br>')+'</div>'+(FC.flip?'<div class="fc-b"><b>'+esc(c.b).replace(/\n/g,'<br>')+'</b>'+(c.e?'<p class="small muted">'+esc(c.e)+'</p>':'')+'</div>':'<span class="small muted">Toque para ver a resposta</span>')+'</button>'+
 (FC.flip?'<div class="fc-act"><button class="btn ghost" data-x="fcRate" data-xv="0">Errei<small>amanhã</small></button><button class="btn ghost" data-x="fcRate" data-xv="1">Difícil<small>em 2 dias</small></button><button class="btn pri" data-x="fcRate" data-xv="2">Fácil<small>mais tarde</small></button></div>':'')+'</div>';

function fcRate(r){var c=FC.queue[FC.i],st=S.priv.fcs,t=dayNum(),s=st[c.id]||{b:0};if(r===0){s.b=0;s.due=t+1}else if(r===1){s.b=Math.max(1,s.b);s.due=t+2}else{s.b=Math.min(5,s.b+1);s.due=t+SRS_INT[Math.max(2,s.b)]}st[c.id]=s;FC.done++;FC.i++;FC.flip=false;if(r>0)S.priv.days[dayKey()]=(S.priv.days[dayKey()]||0)+1;persist();render()}

 '<div class="card grid"><div class="row-b"><h3>Seus duelos</h3><button class="btn ghost sm" data-x="duReload">Atualizar</button></div>'+(DO.err?'<p class="small" style="color:var(--bad)">'+esc(DO.err)+'</p>':'')+
 (DO.list===null?'<p class="small muted">Carregando…</p>':DO.list.length?DO.list.map(duelRow).join(''):'<p class="small muted">Nenhum duelo ainda.</p>')+'</div>'+
 '<details class="card"><summary class="small">Duelo por código (sem conta ou fora da plataforma)</summary><div style="margin-top:10px">'+_duelCode().replace('<div class="qwrap">','<div>')+'</div></details></div>';
};
var _duelEnd=duelEnd;
duelEnd=function(Z){var m=Z.meta||{};if(m.role!=='online')return _duelEnd(Z);
 Store.duel.result(m.id,S.user.uid,{p:Z.ok,at:Date.now()}).then(function(){toast('Resultado enviado.');DO.list=null;loadDuels(true)}).catch(function(e){toast(errMsg(e))});
 setTimeout(function(){go('duelo')},0);
};
/* contador de desafios pendentes no menu de games */
var _gamesV=VIEWS.games;
VIEWS.games=function(){var h=_gamesV();if(onlineDuel()){if(DO.list===null)loadDuels();var n=pendingDuels();if(n)h=h.replace('<span class="tag">Duelo</span>','<span class="tag">Duelo</span><span class="tag amb">'+n+' para responder</span>').replace('Funciona por código','Desafie colegas da plataforma')}else h=h;return h.replace('5 questões iguais para os dois. Envie o código e compare o placar.',onlineDuel()?'5 questões iguais para os dois, direto pela plataforma.':'5 questões iguais para os dois. Envie o código e compare o placar.')};

document.addEventListener('click',function(e){
 var b=e.target.closest('[data-x]');if(!b)return;var x=b.dataset.x,v=b.dataset.xv;
 if(x==='duReload'){DO.list=null;DO.err=null;loadDuels(true);render();return}
 if(x==='duChallenge'){var sel=$('#duMate');if(!sel)return;var uid=sel.value,name=sel.options[sel.selectedIndex].text.split(' · ')[0];var seed=Math.floor(Math.random()*4294967295),id='d'+Date.now().toString(36)+Math.floor(Math.random()*1e6).toString(36);
  var data={a:{uid:S.user.uid,name:S.user.name},b:{uid:uid,name:name},seed:seed,at:Date.now(),n:5};
  b.disabled=true;Store.duel.create(id,data).then(function(){startQuiz(duelQs(seed),'Duelo contra '+name,{kind:'duel',meta:{seed:seed,role:'online',id:id}})}).catch(function(err){b.disabled=false;toast(errMsg(err))});return}
 if(x==='duPlay'){var d=(DO.list||[]).find(function(z){return z.id===v});if(!d)return;var op=d.a.uid===S.user.uid?d.b:d.a;startQuiz(duelQs(d.seed),'Duelo contra '+op.name,{kind:'duel',meta:{seed:d.seed,role:'online',id:d.id}});return}
});

window.UPMED={boot:boot};
boot();

})();

</script>
