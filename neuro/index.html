  ['ol',['Fazer sinapse no gânglio paravertebral do **mesmo nível**.','**Subir ou descer** pelos ramos interganglionares e fazer sinapse em outro gânglio (é assim que chegam aos gânglios acima de T1 e abaixo de L2).','Atravessar o gânglio sem sinapse e seguir pelo **nervo esplâncnico** até um **gânglio pré-vertebral**.']],
  ['p','A **fibra pós-ganglionar** chega ao órgão por três caminhos:'],
  ['ul',['**Por um nervo espinal:** volta pelo **ramo comunicante cinzento** e se distribui com o nervo (eretores dos pelos, glândulas sudoríparas, vasos da pele).','**Por um nervo próprio:** como os nervos cardíacos cervicais.','**Por uma artéria:** acolada à adventícia, como o plexo carotídeo interno (do gânglio cervical superior) e os plexos das artérias abdominais (dos pré-vertebrais).']],
  ['mn','**B**ranco = **B**ainha de mielina, **B**ase T1–L2. **C**inzento = **C**ompleto: está em todos os nervos.'],
  ['chk','Por que só há ramos comunicantes brancos de T1 a L2?',['Porque só esses segmentos têm neurônios pré-ganglionares simpáticos','Porque só esses nervos têm gânglio espinal','Porque os outros nervos não têm ramo ventral'],0,'O branco leva as pré-ganglionares, que só existem nesses segmentos.']]},
 {t:'Pupila e síndrome de Horner',b:[
  ['p','O caminho simpático para a pupila é longo:'],
  ['ol',['Pré-ganglionares na coluna lateral de **T1 e T2**.','Raízes ventrais, nervos espinais e ramos comunicantes brancos.','Sobem no tronco simpático.','Sinapse no **gânglio cervical superior**.','Pós-ganglionares sobem no **nervo e plexo carotídeo interno**.','No seio cavernoso deixam a artéria, atravessam o **gânglio ciliar sem sinapse** e seguem pelos nervos ciliares curtos.','Terminam no **músculo dilatador da pupila**.']],
  ['clin','**Síndrome de Horner**, do lado da lesão (tumor do ápice pulmonar, aneurisma, compressões cervicais): **miose** (o parassimpático fica sem oposição), **ptose palpebral** leve (paralisia do músculo tarsal), e na face **vasodilatação** e **falta de sudorese**.'],
  ['chk','Na síndrome de Horner, a ptose é leve porque:',['Só o músculo tarsal, liso, fica paralisado','O oculomotor é lesado parcialmente','O orbicular do olho se contrai'],0,'O elevador da pálpebra (III) está preservado.']]},
 {t:'Parassimpático craniano e sacral',b:[
  ['p','A parte **craniana** usa núcleos do tronco encefálico e os nervos **III, VII, IX e X**. Os gânglios ficam junto a ramos do trigêmeo, mas o trigêmeo não traz fibras parassimpáticas: recebe-as por anastomoses com VII e IX.'],
  ['tbl',[['Núcleo','Nervo','Gânglio','Órgão'],['Edinger-Westphal','III','Ciliar','Esfíncter da pupila e músculo ciliar'],['Lacrimal','VII (intermédio)','Pterigopalatino','Glândula lacrimal'],['Salivatório superior','VII (intermédio)','Submandibular','Glândulas submandibular e sublingual'],['Salivatório inferior','IX','Ótico','Parótida'],['Dorsal do vago','X','Gânglios nas vísceras','Vísceras torácicas e abdominais']]],
  ['p','O trajeto pode ser tortuoso: as fibras para a lacrimal saem com o intermédio, deixam o facial no gânglio geniculado pelo **petroso maior**, seguem pelo **nervo do canal pterigóideo** até o gânglio pterigopalatino. As do submandibular vão pela **corda do tímpano** e pelo lingual.'],
  ['p','A parte **sacral** tem os pré-ganglionares em **S2, S3 e S4**. As fibras saem pelas raízes ventrais e formam os **nervos esplâncnicos pélvicos** (nervos **eretores**), que vão aos gânglios nas paredes das vísceras pélvicas.'],
  ['clin','Lesão dos nervos esplâncnicos pélvicos causa **disfunção erétil**.'],
  ['chk','As fibras pré-ganglionares para a glândula lacrimal chegam ao gânglio pterigopalatino pelo:',['Nervo corda do tímpano','Nervo petroso maior e nervo do canal pterigóideo','Nervo auriculotemporal'],1,'A corda do tímpano vai ao gânglio submandibular.']]},
 {t:'Plexos viscerais',b:[
  ['p','Perto das vísceras, simpático e parassimpático se misturam em **plexos viscerais**, com fibras simpáticas pós-ganglionares (e raras pré), fibras parassimpáticas pré e pós, fibras aferentes viscerais, gânglios parassimpáticos e gânglios pré-vertebrais.'],
  ['ul',['**Tórax:** plexos cardíaco, pulmonar e esofágico. O **plexo cardíaco** recebe os três nervos cardíacos cervicais do simpático e os do vago. O coração é inervado sobretudo a partir do **pescoço** por sua origem cervical no embrião. A inervação é rica no nó sinoatrial: simpático acelera, parassimpático freia.','**Abdome:** o **plexo celíaco (solar)**, adiante da aorta, na altura do tronco celíaco, com os gânglios celíacos, mesentérico superior e aórtico-renais. Recebe os esplâncnicos maior e menor (T5–T12) e os **troncos vagais** anterior e posterior, cujas fibras atravessam os gânglios sem sinapse. Irradia plexos secundários que acompanham as artérias.','**Pelve:** **plexo hipogástrico superior** (adiante do promontório; o "nervo pré-sacral" dos cirurgiões) e **inferior** ou **plexo pélvico**, formados por fibras do plexo aórtico-abdominal, dos nervos esplâncnicos pélvicos e de gânglios lombares e sacrais.']],
  ['p','Os **plexos entéricos**, **mioentérico (Auerbach)** e **submucoso (Meissner)**, têm cerca de **100 milhões de neurônios** (sensoriais, interneurônios e motores), muitos sem ligação direta com o SNC, e coordenam o **peristaltismo** e as secreções. Alguns autores os chamam de **sistema nervoso entérico**, uma terceira divisão do SNA, mas recebem modulação do simpático e do vago.'],
  ['chk','O plexo mioentérico também é chamado de plexo de:',['Meissner','Auerbach','Wrisberg'],1,'Meissner é o submucoso.']]},
 {t:'Bexiga e micção',b:[
  ['p','A aferência da bexiga vai à medula por dois caminhos: com o **simpático** (nervos hipogástricos, até T10–L2) e com o **parassimpático** (nervos esplâncnicos pélvicos, até S2–S4). Ela gera a sensação de bexiga cheia e, pela via sacral, o **reflexo da micção**.'],
  ['ol',['A distensão da parede vesical estimula os receptores.','A aferência chega à medula sacral (S2–S4).','Os pré-ganglionares sacrais saem pelos nervos esplâncnicos pélvicos.','Os gânglios na parede vesical mandam fibras pós-ganglionares curtas.','O **detrusor** contrai e o **esfíncter** relaxa: a bexiga esvazia.']],
  ['p','O simpático tem papel pequeno na micção. O ato reflexo puro só existe no bebê; depois do primeiro ano surge o controle voluntário, que consegue inibir o detrusor mesmo com a bexiga cheia.'],
  ['chk','O esvaziamento da bexiga depende sobretudo do:',['Simpático lombar','Parassimpático sacral','Nervo vago'],1,'S2–S4 contraem o detrusor e relaxam o esfíncter.']]},
 {t:'Correlações: Chagas e fármacos',b:[
  ['clin','**Doença de Chagas** (*Trypanosoma cruzi*, transmitido pelo barbeiro): há intensa destruição de neurônios autônomos. No coração, perde-se a inervação parassimpática e, na fase aguda experimental, também a simpática, com reinervação depois. Nos **plexos entéricos**, a perda neuronal causa **megaesôfago** e **megacólon**.'],
  ['p','Receptores colinérgicos: **muscarínicos** (efetuadores parassimpáticos; bloqueados pela **atropina**) e **nicotínicos** (gânglios autônomos e placa motora).'],
  ['tbl',[['Grupo','Exemplos','Usos e efeitos'],['Agonistas muscarínicos','Pilocarpina, betanecol','Miose (glaucoma), boca e olhos secos'],['Antimuscarínicos','Atropina, escopolamina, ipratrópio','Bradicardia, midríase para exame, DPOC; boca seca e visão turva'],['Anticolinesterásicos','Neostigmina, piridostigmina, donepezila','Miastenia, reversão de bloqueio, Alzheimer'],['Agonistas beta-2','Salbutamol, formoterol','Broncodilatação na asma e DPOC'],['Agonistas alfa-2','Clonidina, metildopa','Hipertensão (metildopa na gestação)'],['Bloqueadores alfa-1','Prazosina, tansulosina','Hipertensão, hiperplasia prostática'],['Betabloqueadores','Propranolol, metoprolol, atenolol','Hipertensão, angina, arritmias; podem causar broncoconstrição e bradicardia']]],
  ['clin','Organofosforados inibem a colinesterase de forma irreversível: bradicardia, excesso de secreções, broncoconstrição, hipermotilidade intestinal e miose, podendo matar.'],
  ['chk','Na doença de Chagas, o megaesôfago e o megacólon resultam da destruição de neurônios:',['Dos plexos entéricos','Do tronco simpático cervical','Da coluna lateral da medula'],0,'A perda neuronal nos plexos mioentérico e submucoso desorganiza o peristaltismo.']]}
];
RESUMO.snaanat={pts:['Tronco simpático: gânglios paravertebrais unidos por ramos interganglionares, da base do crânio ao gânglio ímpar.','Cervicais: superior, médio (inconstante) e inferior; inferior + 1º torácico = estrelado.','Esplâncnicos maior, menor e imo (a partir de T5): pré-ganglionares para os gânglios pré-vertebrais (celíaco, aórtico-renal, mesentéricos).','Ramo comunicante branco: pré-ganglionares, só T1–L2. Cinzento: pós-ganglionares, em todos os nervos espinais.','Pré-ganglionar faz sinapse no gânglio do mesmo nível, em outro nível (sobe ou desce) ou num pré-vertebral (via esplâncnico).','Pós-ganglionar segue por nervo espinal, nervo próprio (cardíacos) ou artéria (plexo carotídeo).','Pupila: T1–T2, gânglio cervical superior, plexo carotídeo, atravessa o ciliar sem sinapse, dilatador.','Parassimpático craniano: III ciliar; VII pterigopalatino (lacrimal) e submandibular; IX ótico (parótida); X vísceras.','Sacral: S2–S4, nervos esplâncnicos pélvicos (eretores).','Plexos: cardíaco, pulmonar, esofágico; celíaco (solar); hipogástricos superior e inferior (pélvico); entéricos (Auerbach e Meissner).','Micção: aferência e eferência sacrais; detrusor contrai e esfíncter relaxa.'],
 clin:['Horner: miose, ptose leve, anidrose e vasodilatação facial do lado da lesão.','Lesão dos esplâncnicos pélvicos: disfunção erétil.','Chagas: desnervação cardíaca e megaesôfago e megacólon pela perda de neurônios entéricos.','Atropina: taquicardia, midríase e boca seca; pilocarpina: miose (glaucoma).','Organofosforados: crise colinérgica.','Betabloqueador pode causar broncoconstrição.']};
QB.push(
 L(mc('snaanat',1,'Os dois troncos simpáticos terminam unidos no:',['Gânglio ímpar','Gânglio estrelado','Gânglio celíaco','Gânglio cervical superior'],'O gânglio ímpar fica na região coccígea.'),'Cada tronco desce de um lado da coluna, da base do crânio ao cóccix, com gânglios cervicais, torácicos, lombares e sacrais. Na frente do cóccix os dois convergem no gânglio ímpar.','Bloqueios do gânglio ímpar são usados no controle de dor perineal crônica de origem visceral.'),
 L(mc('snaanat',2,'O gânglio cervicotorácico (estrelado) resulta, em geral, da fusão do:',['Gânglio cervical inferior com o primeiro torácico','Gânglio cervical superior com o cervical médio','Gânglio cervical médio com o cervical inferior','Último gânglio torácico com o primeiro lombar'],'O cervical médio costuma faltar no homem.'),'Na região cervical há classicamente três gânglios para oito nervos, por isso um gânglio emite vários ramos comunicantes cinzentos. O inferior quase sempre se funde ao 1º torácico.','O bloqueio do gânglio estrelado é usado em dores simpaticamente mantidas do membro superior e pode causar síndrome de Horner transitória.'),
 L(vf('snaanat',2,'Julgue sobre os nervos esplâncnicos.',[['Originam-se da parte torácica do tronco simpático, a partir de T5.',true],['São formados por fibras pós-ganglionares.',false],['O esplâncnico maior termina no gânglio celíaco.',true],['Contêm também fibras aferentes viscerais.',true]],'São pré-ganglionares que atravessam os gânglios paravertebrais sem sinapse.'),'Os esplâncnicos maior, menor e imo descem, atravessam o diafragma e terminam nos gânglios pré-vertebrais, onde as pré-ganglionares fazem sinapse. Por isso podem ser vistos como ramos comunicantes brancos muito longos.','A dor do pâncreas e de outras vísceras do andar superior sobe pelos esplâncnicos; seu bloqueio ou do plexo celíaco alivia essa dor.'),
 L(as('snaanat',2,'Associe o ramo ou nervo ao tipo de fibra que contém.',[['Ramo comunicante branco','Pré-ganglionares mielínicas'],['Ramo comunicante cinzento','Pós-ganglionares amielínicas'],['Nervo esplâncnico maior','Pré-ganglionares para o gânglio celíaco'],['Ramo interganglionar','Pré-ganglionares que sobem ou descem']],'Branco e esplâncnico levam pré; cinzento leva pós.'),'A cor dos ramos vem da mielina: o branco tem fibras mielínicas (pré), o cinzento, amielínicas (pós). Os interganglionares permitem que pré-ganglionares de T1–L2 alcancem gânglios cervicais, lombares baixos e sacrais.','Essa organização explica por que uma lesão alta da medula torácica pode desnervar o simpático da cabeça e do pescoço.'),
 L(ar('snaanat',2,'Existem ramos comunicantes cinzentos em todos os nervos espinais.','Os neurônios pré-ganglionares simpáticos existem em todos os segmentos da medula.',2,'A afirmação é verdadeira, mas a razão é falsa: os pré-ganglionares só estão em T1–L2.'),'Os cinzentos levam pós-ganglionares, que nascem em todos os gânglios da cadeia. Como os gânglios recebem pré-ganglionares que sobem e descem pela cadeia, todos os nervos espinais recebem fibras simpáticas para a pele (sudorese, pelos, vasos).','Por isso uma lesão de nervo periférico causa área sem suor na pele, útil no diagnóstico.'),
 L(od('snaanat',2,'Ordene o trajeto de uma fibra pré-ganglionar simpática até um gânglio pré-vertebral.',['Coluna lateral da medula','Raiz ventral','Ramo comunicante branco','Gânglio paravertebral (sem sinapse)','Nervo esplâncnico','Gânglio pré-vertebral'],'Ela atravessa o gânglio paravertebral sem fazer sinapse.'),'Do corpo na coluna lateral, a fibra sai pela raiz ventral, passa pelo tronco e ramo ventral do nervo espinal, entra no tronco simpático pelo ramo branco, atravessa o gânglio e segue no esplâncnico até o celíaco, aórtico-renal ou mesentérico.','Compreender esse trajeto explica por que simpatectomias torácicas podem alterar a inervação de vísceras abdominais.'),
 L(mc('snaanat',2,'As fibras pós-ganglionares simpáticas que inervam as glândulas sudoríparas da pele do braço chegam ao seu destino:',['Pelo ramo comunicante cinzento e o nervo espinal','Pelo nervo esplâncnico e o plexo celíaco','Pelo nervo vago e seus ramos cutâneos','Acoladas à aorta e às artérias subclávias'],'Voltam ao nervo espinal e se distribuem com ele.'),'É um dos três caminhos da pós-ganglionar: pelo nervo espinal, por um nervo próprio (como os cardíacos) ou acolada a uma artéria. Para a pele, o caminho é o nervo espinal.','A hiperidrose palmar intensa pode ser tratada por simpatectomia torácica, que interrompe essa via.'),
 L(mc('snaanat',2,'O plexo carotídeo interno é formado por fibras:',['Pós-ganglionares do gânglio cervical superior','Pré-ganglionares do nervo vago para a cabeça','Pós-ganglionares do gânglio ciliar para a órbita','Sensitivas do trigêmeo para a dura-máter'],'Sobem acoladas à carótida interna até o crânio.'),'Do polo cranial do gânglio cervical superior sai o nervo carotídeo interno, que forma o plexo na parede da artéria. Por ele o simpático chega aos vasos intracranianos, à pineal, à hipófise e à pupila.','Uma dissecção da carótida interna pode lesar esse plexo e causar Horner com dor cervical, sinal de alerta para AVC.'),
 L(od('snaanat',3,'Ordene a via simpática para o músculo dilatador da pupila.',['Coluna lateral de T1–T2','Ramo comunicante branco','Tronco simpático cervical','Gânglio cervical superior','Plexo carotídeo interno','Gânglio ciliar (sem sinapse)','Músculo dilatador da pupila'],'A sinapse acontece no gânglio cervical superior; no ciliar, não.'),'A pós-ganglionar sobe com a carótida interna, deixa a artéria no seio cavernoso, passa pelo gânglio ciliar sem fazer sinapse e chega ao olho pelos nervos ciliares curtos. O ciliar é gânglio do parassimpático.','Uma lesão em qualquer ponto dessa via, do tórax ao seio cavernoso, causa síndrome de Horner.'),
 L(cs('snaanat',2,'Fumante de 62 anos tem dor no ombro direito, pupila direita menor, pálpebra direita levemente caída e face direita sem suor. A radiografia mostra massa no ápice do pulmão direito. A estrutura lesada é:',['O tronco simpático cervicotorácico direito','O nervo oculomotor direito no seio cavernoso','O nervo facial direito no forame estilomastóideo','O gânglio ciliar direito, dentro da órbita'],'Miose, ptose leve e anidrose formam a síndrome de Horner.'),'O tumor do ápice pulmonar (de Pancoast) invade o gânglio estrelado e o tronco simpático. Sem o simpático, o parassimpático contrai a pupila; o músculo tarsal paralisado deixa a pálpebra cair um pouco; a face perde a sudorese.','A dor no ombro e no braço pode vir da invasão do plexo braquial baixo (C8–T1), que fica junto ao ápice.'),
 L(ar('snaanat',2,'Na síndrome de Horner a ptose palpebral é discreta.','O músculo elevador da pálpebra superior é inervado pelo nervo oculomotor, que está preservado.',0,'As duas são verdadeiras e a razão explica a ptose discreta.'),'A pálpebra é elevada principalmente pelo elevador (III) e auxiliada pelo músculo tarsal superior, liso e simpático. No Horner só o tarsal falha, e a queda é pequena; na lesão do III a ptose é completa.','A diferença ajuda a separar Horner (ptose leve e miose) de paralisia do oculomotor (ptose total e midríase).'),
 L(as('snaanat',2,'Associe o gânglio parassimpático ao nervo que traz as fibras pré-ganglionares.',[['Gânglio ciliar','Oculomotor (III)'],['Gânglio pterigopalatino','Facial (VII, intermédio)'],['Gânglio ótico','Glossofaríngeo (IX)'],['Gânglio submandibular','Facial (VII, intermédio)']],'O VII alimenta dois gânglios: pterigopalatino e submandibular.'),'Os quatro gânglios cranianos ficam ligados a ramos do trigêmeo, mas recebem as pré-ganglionares de III, VII e IX. O vago não tem gânglio craniano: suas fibras terminam em gânglios nas vísceras.','Na paralisia facial com olho seco, a lesão atinge as fibras lacrimais antes do gânglio geniculado.'),
 L(as('snaanat',2,'Associe o núcleo parassimpático ao órgão.',[['Edinger-Westphal','Esfíncter da pupila e músculo ciliar'],['Lacrimal','Glândula lacrimal'],['Salivatório superior','Glândulas submandibular e sublingual'],['Salivatório inferior','Parótida']],'O dorsal do vago cuida das vísceras torácicas e abdominais.'),'Esses núcleos ficam no tronco encefálico e serão revistos na estrutura interna. Cada um usa um nervo e um gânglio próprios.','No reflexo fotomotor, a eferência parte do Edinger-Westphal pelo III até o gânglio ciliar.'),
 L(mc('snaanat',3,'O trigêmeo está relacionado com os quatro gânglios parassimpáticos cranianos, mas, ao sair do crânio:',['Não tem fibras parassimpáticas; recebe-as por anastomoses com VII e IX','É o principal nervo parassimpático da cabeça e da face','Leva as fibras pré-ganglionares do III ao gânglio ciliar','Contém o núcleo salivatório inferior na sua raiz motora'],'As fibras parassimpáticas pegam carona nos ramos do trigêmeo.'),'O auriculotemporal (V3) leva à parótida as pós-ganglionares do gânglio ótico (IX); o lingual (V3) leva as do facial ao submandibular; o zigomático (V2) leva as do pterigopalatino à lacrimal.','Na cirurgia da parótida, a lesão do auriculotemporal com regeneração errada causa a síndrome de Frey (suor gustatório).'),
 L(gp('snaanat',2,'Os nervos esplâncnicos pélvicos, que trazem fibras parassimpáticas de S2 a S4, também são chamados nervos ____.',['eretores','eretor'],'Estão ligados ao fenômeno da ereção.'),'As pré-ganglionares sacrais saem pelas raízes ventrais, ganham os nervos sacrais e se destacam como nervos esplâncnicos pélvicos até os gânglios das paredes das vísceras pélvicas.','Sua lesão em cirurgias pélvicas radicais causa disfunção erétil e retenção urinária.'),
 L(mc('snaanat',2,'O coração, embora torácico, recebe inervação predominantemente da região cervical porque:',['Origina-se na região cervical do embrião','Os gânglios torácicos não emitem nervos cardíacos','O vago não chega ao tórax','O plexo cardíaco é só parassimpático'],'A inervação acompanha a posição embrionária.'),'O plexo cardíaco recebe os nervos cardíacos cervicais superior, médio e inferior do simpático e os nervos cardíacos do vago, além de nervos torácicos. A inervação é especialmente rica no nó sinoatrial.','A dor do infarto pode irradiar para o pescoço e a mandíbula, regiões ligadas aos mesmos segmentos da inervação cardíaca.'),
 L(vf('snaanat',2,'Julgue sobre o plexo celíaco.',[['Fica adiante da aorta, na altura do tronco celíaco.',true],['Recebe os nervos esplâncnicos maior e menor.',true],['As fibras vagais fazem sinapse nos gânglios celíacos.',false],['Dele irradiam plexos secundários que acompanham as artérias.',true]],'As fibras do vago atravessam os gânglios pré-vertebrais sem sinapse.'),'O plexo celíaco, ou solar, é o maior plexo visceral. Seus gânglios são simpáticos; as fibras parassimpáticas do vago apenas passam por eles e terminam em gânglios dentro das vísceras.','A neurólise do plexo celíaco, guiada por imagem, é usada para dor do câncer de pâncreas.'),
 L(mc('snaanat',2,'Os plexos entéricos contêm, aproximadamente:',['100 milhões de neurônios, alguns sem ligação direta com o SNC','Apenas neurônios pós-ganglionares parassimpáticos colinérgicos','Somente fibras simpáticas vindas dos gânglios pré-vertebrais','Algumas centenas de neurônios ligados diretamente ao vago'],'Número comparável ao da medula espinal.'),'Os plexos mioentérico e submucoso têm neurônios sensoriais, interneurônios e motores, com muitos neurotransmissores. Coordenam o peristaltismo (anel de constrição acima e de relaxamento abaixo do bolo) e secreções, com modulação simpática e vagal.','Cólicas e diarreia em situações emocionais refletem essa modulação central sobre o sistema entérico.'),
 L(ar('snaanat',2,'O simpático é o principal responsável pelo esvaziamento da bexiga.','Na micção, o detrusor contrai e o esfíncter relaxa por ação do parassimpático sacral.',3,'A afirmação é falsa; a razão é verdadeira.'),'O arco reflexo da micção é sacral: aferência pelos nervos esplâncnicos pélvicos até S2–S4 e eferência pelos mesmos nervos. O simpático tem papel pequeno ou nulo.','Lesões da medula sacral ou da cauda equina causam bexiga flácida com retenção urinária.'),
 L(od('snaanat',2,'Ordene o reflexo da micção.',['Distensão da parede vesical','Aferência pelos nervos esplâncnicos pélvicos','Medula sacral S2–S4','Fibras pré-ganglionares nos nervos esplâncnicos pélvicos','Gânglios na parede da bexiga','Contração do detrusor e relaxamento do esfíncter'],'Aferência e eferência sacrais.'),'A partir do primeiro ano de vida, centros superiores aprendem a inibir o detrusor, e a micção se torna em parte voluntária.','Na lesão medular acima do cone, após a fase de choque, a bexiga pode se esvaziar por reflexo sem controle voluntário (bexiga neurogênica reflexa).'),
 L(cs('snaanat',2,'Homem de 45 anos, natural de área endêmica, tem disfagia progressiva há anos e constipação de vários dias. Os exames mostram esôfago e cólon muito dilatados. O mecanismo é:',['Destruição de neurônios dos plexos entéricos pelo Trypanosoma cruzi','Lesão bilateral do nervo hipoglosso e do vago','Hiperatividade simpática com esfíncteres sempre fechados','Obstrução mecânica por tumor de esôfago e de cólon'],'Megaesôfago e megacólon chagásicos.'),'Na doença de Chagas há perda de neurônios dos plexos mioentérico e submucoso; sem coordenação, o peristaltismo falha e os segmentos se dilatam. No coração, a desnervação autônoma acompanha a cardiomiopatia.','A doença de Chagas segue relevante no Brasil, com transmissão também oral (alimentos contaminados) e vertical.'),
 L(mc('snaanat',2,'A atropina, antagonista muscarínico, causa:',['Taquicardia, midríase e boca seca','Bradicardia e miose','Broncoconstrição e aumento de secreções','Aumento do peristaltismo'],'Bloqueia os efeitos parassimpáticos.'),'Sem a ação da acetilcolina nos receptores muscarínicos, predomina o simpático: o coração acelera, a pupila dilata, a acomodação se perde e as secreções diminuem.','A atropina é usada na bradicardia sintomática e na intoxicação por organofosforados, que causam excesso colinérgico.'),
 L(as('snaanat',3,'Associe o fármaco ao uso.',[['Pilocarpina (colírio)','Glaucoma, por miose'],['Piridostigmina','Miastenia gravis'],['Salbutamol','Broncodilatação na asma'],['Tansulosina','Hiperplasia prostática benigna']],'Agonista muscarínico, anticolinesterásico, agonista beta-2 e bloqueador alfa-1A.'),'Conhecer o receptor de cada órgão explica os usos: a pilocarpina contrai o esfíncter da pupila e abre a drenagem do humor aquoso; o salbutamol age nos receptores beta-2 dos brônquios; a tansulosina relaxa o músculo liso da próstata e do colo vesical.','Efeitos colaterais seguem a mesma lógica: betabloqueadores não seletivos podem desencadear broncoespasmo em asmáticos.'),
 L(cs('snaanat',2,'Agricultor chega ao pronto-socorro após aplicar agrotóxico sem proteção: pupilas puntiformes, sudorese, salivação intensa, diarreia, bradicardia e chiado no peito. O mecanismo é:',['Inibição da colinesterase com excesso de acetilcolina','Bloqueio dos receptores muscarínicos dos efetuadores','Liberação maciça de noradrenalina pela suprarrenal','Bloqueio da liberação de acetilcolina na placa motora'],'Organofosforados inibem a colinesterase de forma irreversível.'),'A acetilcolina acumulada hiperestimula receptores muscarínicos (miose, secreções, broncoconstrição, bradicardia, diarreia) e nicotínicos (fasciculações e fraqueza muscular).','O tratamento inclui descontaminação, atropina em doses repetidas e suporte ventilatório.')
);

/* Capítulo 13 — Estrutura da medula espinal */
LESSON.medest=[
 {t:'Vocabulário da estrutura interna',b:[
  ['p','A partir daqui estrutura e função andam juntas: conhecer onde passa cada feixe é o que permite **localizar lesões** pelos sinais clínicos. Antes, um glossário:'],
  ['tbl',[['Termo','Significado'],['Substância cinzenta','Neuróglia, corpos de neurônios e fibras principalmente amielínicas'],['Substância branca','Neuróglia e fibras principalmente mielínicas'],['Núcleo','Massa de substância cinzenta dentro da branca; neurônios de estrutura e função parecidas'],['Formação reticular','Neurônios separados por fibras, nem branca nem cinzenta; centro do tronco encefálico'],['Córtex','Cinzenta em camada fina na superfície do cérebro e do cerebelo'],['Trato','Feixe com mesma origem, função e destino; nome = origem + terminação (+ posição)'],['Fascículo','Trato mais compacto (o termo é mais de tradição)'],['Lemnisco','"Fita": feixes sensitivos que vão ao tálamo'],['Funículo','"Cordão": substância branca da medula, com vários tratos']]],
  ['p','**Decussação**: fibras que cruzam a linha média **obliquamente**, na mesma direção (decussação das pirâmides). **Comissura**: fibras que cruzam **perpendicularmente**, em direções opostas (corpo caloso). Fibras de **projeção** saem da área ou do órgão; fibras de **associação** ligam pontos dentro dele.'],
  ['key','"Trato corticospinal lateral" se lê: nasce no **córtex**, termina na **medula**, corre no funículo **lateral**.'],
  ['chk','A diferença entre decussação e comissura está:',['No ângulo em que as fibras cruzam a linha média','No tipo de neurotransmissor','Em serem fibras sensitivas ou motoras'],0,'Decussação cruza obliquamente; comissura, perpendicularmente.']]},
 {t:'Substância cinzenta: divisão e neurônios',b:[
  ['p','A cinzenta em H divide-se em **coluna anterior** (cabeça e base), **coluna posterior** (base, pescoço e ápice, com a **substância gelatinosa**) e **substância cinzenta intermédia** (central e lateral; a coluna lateral faz parte da intermédia lateral). Quanto mais alto o nível, maior a proporção de branca; as colunas anteriores incham nas intumescências.'],
  ['tbl',[['Neurônio','Axônio','Exemplo'],['Radicular visceral','Sai pela raiz ventral','Pré-ganglionares da intermédia lateral (T1–L2 e S2–S4)'],['Radicular somático','Sai pela raiz ventral','Motoneurônios alfa (extrafusais) e gama (intrafusais): neurônio motor inferior'],['Cordonal de projeção','Sobe e sai da medula','Origem das vias ascendentes para tálamo e cerebelo'],['Cordonal de associação','Sobe e desce dentro da medula','Fascículos próprios: reflexos intersegmentares'],['Internuncial (axônio curto)','Fica na cinzenta','Arcos reflexos polissinápticos; célula de Renshaw']]],
  ['p','Para o movimento voluntário, alfa e gama disparam juntos (**coativação alfa-gama**), mantendo o fuso informativo durante a contração.'],
  ['p','A **célula de Renshaw**, na parte medial da coluna anterior, recebe um colateral recorrente do motoneurônio e o **inibe** de volta. Seu neurotransmissor é a **glicina**; a estricnina bloqueia a glicina e causa convulsões violentas.'],
  ['chk','O neurônio motor inferior corresponde ao neurônio:',['Cordonal de projeção','Radicular somático','Internuncial'],1,'É o motoneurônio da coluna anterior, alfa ou gama.']]},
 {t:'Núcleos e lâminas de Rexed',b:[
  ['fig','medRexed','Lâminas de Rexed (à direita) e núcleos da substância cinzenta (à esquerda).'],
  ['ul',['**Coluna anterior, grupo medial:** em toda a medula; musculatura **axial**.','**Coluna anterior, grupo lateral:** só nas intumescências; musculatura dos **membros**. Os mais mediais vão aos músculos proximais; os mais laterais, aos distais (mão e pé).','**Núcleo torácico (dorsal):** T1–L2 (só torácico e lombar alto); propriocepção inconsciente, origem do espinocerebelar posterior.','**Substância gelatinosa:** recebe fibras da raiz dorsal; sede do **portão da dor**, modulado por fibras que descem do tronco encefálico.']],
  ['tbl',[['Lâminas','Papel'],['I a IV','Área receptora exteroceptiva (II = substância gelatinosa)'],['V e VI','Informação proprioceptiva'],['VII','Intermédia (coluna lateral, núcleo torácico)'],['IX','Motoneurônios da coluna anterior'],['X','Em volta do canal central']]],
  ['chk','Os neurônios motores da coluna anterior estão na lâmina:',['II','VII','IX'],2,'A lâmina IX corresponde aos núcleos motores.']]},
 {t:'Como entram as fibras da raiz dorsal',b:[
  ['p','No sulco lateral posterior, cada filamento se divide num **grupo lateral** (fibras finas, para o ápice da coluna posterior) e num **grupo medial** (fibras grossas, para a face medial da coluna posterior). Cada fibra se bifurca em ramo ascendente e descendente e dá muitos colaterais. Os **ramos ascendentes longos do grupo medial** sobem sem sinapse e formam os **fascículos grácil e cuneiforme**.'],
  ['p','Uma mesma fibra pode fazer sinapse com:'],
  ['ul',['**Motoneurônios:** reflexo monossináptico (miotático, patelar).','**Internunciais:** reflexos polissinápticos (reflexo de retirada).','**Cordonais de associação:** reflexos intersegmentares (reflexo de coçar).','**Pré-ganglionares:** reflexos viscerais.','**Cordonais de projeção:** vias ascendentes ao tálamo e ao cerebelo.']],
  ['chk','O reflexo de retirada diante de um estímulo doloroso é:',['Monossináptico','Polissináptico','Exclusivamente visceral'],1,'Envolve ao menos um neurônio internuncial.']]},
 {t:'Vias ascendentes',b:[
  ['fig','medCorteTratos','Posição aproximada dos principais tratos e fascículos.'],
  ['tbl',[['Via','Neurônio de origem','Trajeto','Funículo','Destino','Função'],['Grácil e cuneiforme','Gânglio espinal','Direto','Posterior','Núcleos grácil e cuneiforme (bulbo)','Propriocepção consciente, tato epicrítico, vibração, estereognosia'],['Espinotalâmico anterior','Coluna posterior','Cruzado','Anterior','Tálamo','Tato protopático e pressão'],['Espinotalâmico lateral','Coluna posterior','Cruzado (comissura branca)','Lateral','Tálamo','Temperatura e dor'],['Espinocerebelar posterior','Núcleo torácico','Direto','Lateral','Cerebelo (pedúnculo inferior)','Propriocepção inconsciente'],['Espinocerebelar anterior','Coluna posterior e intermédia','Cruzado (recruza no cerebelo)','Lateral','Cerebelo (pedúnculo superior)','Propriocepção inconsciente e atividade do corticospinal']]],
  ['p','O **grácil** existe em toda a medula e traz membros inferiores e metade inferior do tronco; o **cuneiforme** só aparece da medula torácica alta para cima e traz membros superiores e metade superior do tronco. Funcionalmente são iguais.'],
  ['ul',['**Propriocepção consciente** (cinestesia): saber, de olhos fechados, se o hálux foi fletido ou estendido.','**Tato epicrítico**: discriminação de dois pontos com o compasso.','**Sensibilidade vibratória**: diapasão sobre saliência óssea; perde-se cedo na lesão do funículo posterior.','**Estereognosia**: reconhecer um objeto pela mão (tato + propriocepção).']],
  ['key','O tato tem **duas vias**: uma direta (funículo posterior) e uma cruzada (espinotalâmico anterior). Por isso é raro perder todo o tato numa lesão medular parcial.'],
  ['p','Junto do espinotalâmico lateral sobem as **fibras espinorreticulares** (via espino-retículo-talâmica), ligadas à dor **crônica e difusa**, em queimação; o espinotalâmico lateral cuida da dor aguda e bem localizada. A secção cirúrgica do espinotalâmico lateral chama-se **cordotomia**.'],
  ['chk','A perda da sensibilidade vibratória é sinal precoce de lesão do:',['Funículo posterior','Trato espinotalâmico lateral','Trato corticospinal anterior'],0,'A vibração sobe pelos fascículos grácil e cuneiforme.']]},
 {t:'Vias descendentes: sistemas lateral e medial',b:[
  ['p','A divisão em "piramidal" e "extrapiramidal" não é mais aceita como sistemas separados. Usa-se a divisão de **Kuypers**, baseada em lesões no gato: lesar o funículo **lateral** tira os movimentos finos das extremidades; lesar o **anterior** tira os ajustes posturais (o gato não cai em pé).'],
  ['tbl',[['Sistema','Trato','Origem','Função'],['Lateral','Corticospinal lateral','Córtex motor','Motricidade voluntária distal'],['Lateral','Rubrospinal','Núcleo rubro','Motricidade distal (pequeno no homem)'],['Medial','Corticospinal anterior','Córtex motor','Musculatura axial e proximal; cruza perto do fim'],['Medial','Tetospinal','Colículo superior','Orientação da cabeça por estímulos visuais'],['Medial','Vestibulospinais lateral e medial','Núcleos vestibulares','Equilíbrio; postura da cabeça e do tronco'],['Medial','Reticulospinal pontino','Formação reticular da ponte','Ativa extensores dos membros inferiores (antigravitário)'],['Medial','Reticulospinal bulbar','Formação reticular do bulbo','Relaxa extensores dos membros inferiores']]],
  ['key','A maior parte do corticospinal cruza na **decussação das pirâmides**: o córtex de um lado comanda a musculatura do **lado oposto**. Lesão acima da decussação paralisa a metade oposta do corpo.'],
  ['p','O corticospinal lateral desce até a medula sacral, cada vez menor; o anterior termina por volta da metade da medula torácica. Há ainda vias descendentes para os pré-ganglionares (viscerais) e para a coluna posterior (controle da entrada sensitiva).'],
  ['chk','O sistema medial controla principalmente:',['Os músculos distais dos membros','A musculatura axial e proximal e a postura','Somente os músculos da face'],1,'Liga-se aos motoneurônios da parte medial da coluna anterior.']]}
];
RESUMO.medest={pts:['Trato: mesma origem, função e destino; nome = origem + terminação. Funículo: cordão de branca. Lemnisco: fita sensitiva ao tálamo.','Decussação cruza obliquamente; comissura, perpendicularmente.','Neurônios: radiculares (viscerais e somáticos alfa e gama), cordonais (projeção e associação) e internunciais (Renshaw).','Renshaw: inibição recorrente com glicina; estricnina causa convulsões.','Coluna anterior: grupo medial (axial, toda a medula) e lateral (membros, intumescências).','Núcleo torácico T1–L2: espinocerebelar posterior. Substância gelatinosa: portão da dor.','Rexed: I–IV exteroceptivas, V–VI proprioceptivas, IX motoneurônios, X em volta do canal.','Grácil (toda a medula, membro inferior) e cuneiforme (torácica alta para cima): propriocepção consciente, tato epicrítico, vibração, estereognosia; diretos.','Espinotalâmico lateral (dor, temperatura) e anterior (tato protopático): cruzados.','Espinocerebelar posterior (direto, pedúnculo inferior) e anterior (cruzado e recruzado, pedúnculo superior).','Sistema lateral: corticospinal lateral e rubrospinal (distal). Medial: corticospinal anterior, tetospinal, vestibulospinais e reticulospinais (axial, postura).'],
 clin:['Perda vibratória: sinal precoce de lesão do funículo posterior.','Teste de dois pontos e de posição do hálux avaliam o funículo posterior.','Cordotomia: secção do espinotalâmico lateral para dor oncológica.','Dor crônica em queimação acompanha a via espino-retículo-talâmica.','Lesão do corticospinal acima da decussação: hemiplegia do lado oposto.','Hiperatividade gama: espasticidade.']};
QB.push(
 L(mc('medest',1,'Pela nomenclatura dos tratos, o trato espinocerebelar posterior tem fibras que:',['Nascem na medula e terminam no cerebelo','Nascem no cerebelo e terminam na medula','Nascem no córtex e terminam no cerebelo','Correm no funículo posterior'],'O nome indica origem, depois terminação, e por fim a posição (que, aqui, é a parte posterior do funículo lateral).'),'O padrão origem + terminação vale para quase todos os tratos: corticospinal, rubrospinal, espinotalâmico. "Posterior" e "anterior" indicam posição relativa e não, obrigatoriamente, o funículo.','Ler bem o nome do trato evita erros na topografia: o espinocerebelar posterior corre no funículo lateral, não no posterior.'),
 L(as('medest',2,'Associe o termo à definição.',[['Decussação','Fibras que cruzam a linha média obliquamente'],['Comissura','Fibras que cruzam a linha média perpendicularmente'],['Lemnisco','Feixe sensitivo em fita que vai ao tálamo'],['Funículo','Substância branca da medula com vários tratos']],'Exemplos: decussação das pirâmides e corpo caloso.'),'As fibras de associação ficam dentro de uma área ou órgão; as de projeção saem dele. Esses termos são usados em todo o estudo das vias.','O corpo caloso é a maior comissura e pode ser seccionado na calosotomia, em epilepsias graves.'),
 L(mc('medest',2,'A célula de Renshaw:',['Inibe o próprio motoneurônio que lhe envia um colateral recorrente','Excita os motoneurônios gama durante o movimento','Fica na substância gelatinosa e modula a dor','É um neurônio cordonal de projeção para o tálamo'],'É um interneurônio inibitório da parte medial da coluna anterior.'),'O axônio do motoneurônio dá um ramo colateral que volta à célula de Renshaw; ela, por sua vez, inibe o mesmo motoneurônio. É um freio que estabiliza a descarga motora.','Na intoxicação por estricnina, que bloqueia a glicina usada pela Renshaw, a inibição some e surgem convulsões e espasmos intensos.'),
 L(gp('medest',2,'O neurotransmissor inibitório da maioria das células de Renshaw é a ____.',['glicina'],'A estricnina antagoniza a glicina.'),'A glicina é o principal neurotransmissor inibitório da medula, ao lado do GABA. A toxina tetânica também impede a liberação de glicina e GABA pelos interneurônios inibitórios.','Tétano e estricnina dão quadros parecidos de rigidez e espasmos por perda da inibição medular.'),
 L(vf('medest',2,'Julgue sobre os núcleos da coluna anterior.',[['O grupo medial existe em toda a medula e inerva a musculatura axial.',true],['O grupo lateral existe em toda a medula.',false],['Os neurônios mais laterais do grupo lateral inervam os músculos da mão e do pé.',true],['A coluna anterior é mais volumosa nas intumescências.',true]],'O grupo lateral só aparece nas intumescências.'),'O arranjo é somatotópico: medial para o tronco, lateral para os membros, e dentro do lateral, medial para proximal e lateral para distal.','Na atrofia muscular por doença do motoneurônio, a fraqueza pode começar nas mãos (grupo lateral cervical) ou no tronco, dependendo do segmento atingido.'),
 L(mc('medest',2,'O núcleo torácico (dorsal) existe apenas:',['Na medula torácica e lombar alta (L1–L2)','Na medula cervical, junto à intumescência','Na medula sacral, junto ao cone medular','Em toda a extensão da medula espinal'],'É evidente de T1 a L2.'),'Ele contém neurônios cordonais de projeção cujos axônios formam o trato espinocerebelar posterior, do mesmo lado. Fibras proprioceptivas que entram abaixo de L2 sobem até ele antes de fazer sinapse.','Lesões que atingem o núcleo torácico ou o espinocerebelar posterior causam ataxia sem perda da propriocepção consciente.'),
 L(as('medest',3,'Associe a lâmina de Rexed ao conteúdo.',[['Lâmina II','Substância gelatinosa'],['Lâminas V e VI','Informação proprioceptiva'],['Lâmina IX','Motoneurônios'],['Lâmina X','Região em volta do canal central']],'As lâminas são numeradas de dorsal para ventral.'),'Rexed mostrou que os neurônios medulares se organizam em camadas regulares de I a X. As lâminas I a IV formam a área receptora exteroceptiva.','A lâmina II é o alvo de opioides e outras drogas que modulam a dor na medula.'),
 L(od('medest',2,'Ordene as partes da coluna posterior de anterior para posterior.',['Base','Pescoço','Ápice','Substância gelatinosa'],'A substância gelatinosa fica no ápice.'),'A coluna anterior tem cabeça e base; a posterior tem base, pescoço e ápice, este com a substância gelatinosa, tecido translúcido rico em glia e pequenos neurônios.','É nessa região que chegam as fibras finas de dor e temperatura e onde age o mecanismo do portão da dor.'),
 L(mc('medest',2,'Os fascículos grácil e cuneiforme são formados por:',['Ramos ascendentes longos de fibras do grupo medial da raiz dorsal','Axônios de neurônios cordonais da coluna posterior do outro lado','Axônios do núcleo torácico que sobem sem cruzar','Fibras que cruzaram a linha média na comissura branca'],'São prolongamentos centrais dos neurônios do gânglio espinal, sem sinapse na medula.'),'Por não fazerem sinapse na medula, levam a informação diretamente até os núcleos grácil e cuneiforme no bulbo. A via é direta (ipsilateral) na medula.','Uma lesão hemimedular tira a propriocepção consciente do mesmo lado da lesão, abaixo dela.'),
 L(ar('medest',2,'O fascículo cuneiforme não existe na medula lombar.','O fascículo cuneiforme é formado por fibras que entram pelas raízes cervicais e torácicas superiores.',0,'As duas são verdadeiras e a razão explica a afirmação.'),'O grácil leva os membros inferiores e a metade inferior do tronco e existe em toda a medula. O cuneiforme só se forma quando entram as raízes dos membros superiores.','Na lesão do funículo posterior em nível torácico, a propriocepção dos membros superiores é poupada.'),
 L(cs('medest',2,'Paciente de olhos fechados não sabe dizer se o médico fletiu ou estendeu seu hálux, não percebe o diapasão nos tornozelos e cambaleia no escuro. A dor e a temperatura estão normais. A via lesada é:',['Funículo posterior (fascículos grácil e cuneiforme)','Trato espinotalâmico lateral do lado oposto','Trato corticospinal lateral dos dois lados','Trato espinocerebelar anterior e posterior'],'Propriocepção consciente e vibração dependem do funículo posterior.'),'A dissociação entre perda proprioceptiva e vibratória com dor e temperatura preservadas aponta para o funículo posterior. A piora no escuro (sinal de Romberg) mostra que a visão compensava a propriocepção.','Causas comuns: deficiência de vitamina B12 (degeneração combinada subaguda) e neurossífilis (tabes dorsalis).'),
 L(mc('medest',2,'O trato espinotalâmico anterior conduz:',['Tato protopático e pressão','Dor e temperatura','Propriocepção consciente','Vibração'],'É a via cruzada do tato grosseiro.'),'Seus neurônios estão na coluna posterior; os axônios cruzam e sobem no funículo anterior até o tálamo. O tato protopático localiza o estímulo só de modo grosseiro.','Por haver duas vias de tato (direta e cruzada), lesões medulares parciais raramente abolem todo o tato.'),
 L(mc('medest',2,'As fibras do trato espinotalâmico lateral cruzam a linha média:',['Na comissura branca, perto do nível de entrada','Na decussação das pirâmides','No bulbo, como fibras arqueadas internas','No tálamo'],'O cruzamento acontece logo na medula.'),'O trato aumenta à medida que sobe, pela adição de fibras que cruzam em cada nível. É a principal via de dor e temperatura até o cérebro.','A siringomielia, cavidade junto ao canal central, destrói a comissura branca e causa perda de dor e temperatura "em capa", com tato preservado.'),
 L(ar('medest',1,'A via espino-retículo-talâmica está ligada à dor crônica, difusa e em queimação.','As fibras espinorreticulares sobem junto com o trato espinotalâmico lateral.',1,'As duas são verdadeiras, mas a vizinhança das fibras não explica o tipo de dor que conduzem.'),'O espinotalâmico lateral leva a dor aguda e bem localizada. As espinorreticulares fazem sinapse na formação reticular e dali seguem ao tálamo, num circuito ligado à dor difusa.','Por isso a cordotomia, que corta as duas, alivia a dor oncológica, mas a dor pode voltar com o tempo por vias alternativas.'),
 L(as('medest',2,'Associe o trato espinocerebelar à característica.',[['Posterior','Nasce no núcleo torácico, direto, entra pelo pedúnculo cerebelar inferior'],['Anterior','Cruzado e recruzado, entra pelo pedúnculo cerebelar superior'],['Anterior','Informa a atividade do trato corticospinal na medula'],['Posterior','Só leva impulsos de receptores periféricos']],'Os dois levam propriocepção inconsciente.'),'O recruzamento do espinocerebelar anterior faz com que a informação termine no hemisfério cerebelar do mesmo lado da origem. Assim, cada metade do cerebelo cuida do mesmo lado do corpo.','Lesões cerebelares dão sintomas do mesmo lado da lesão, ao contrário das lesões do córtex motor.'),
 L(mc('medest',2,'No experimento de Kuypers, a lesão do funículo anterior da medula do gato causou:',['Perda dos ajustes posturais, com movimentos finos preservados','Perda dos movimentos finos das extremidades, com postura normal','Anestesia completa e paralisia abaixo da lesão','Perda isolada da sensibilidade dolorosa e térmica'],'É a base da divisão em sistemas lateral e medial.'),'O sistema medial (funículo anterior) cuida da postura e da musculatura axial e proximal; o lateral (funículo lateral), dos movimentos finos distais.','Pacientes com lesão predominante das vias mediais têm instabilidade postural e quedas, mesmo com a destreza das mãos preservada.'),
 L(as('medest',2,'Associe o trato descendente à origem.',[['Rubrospinal','Núcleo rubro do mesencéfalo'],['Tetospinal','Colículo superior'],['Vestibulospinal','Núcleos vestibulares'],['Reticulospinal pontino','Formação reticular da ponte']],'Os nomes indicam a origem.'),'O rubrospinal é do sistema lateral; tetospinal, vestibulospinais e reticulospinais são do medial, junto com o corticospinal anterior.','O equilíbrio entre reticulospinal pontino (ativa extensores) e bulbar (relaxa) explica a postura em extensão de algumas lesões do tronco.'),
 L(ar('medest',2,'O trato reticulospinal pontino favorece a postura ereta.','O trato reticulospinal pontino ativa a musculatura extensora dos membros inferiores, que resiste à gravidade.',0,'As duas são verdadeiras e a razão explica a afirmação.'),'Com os membros inferiores estáveis em extensão, o corpo fica livre para usar os membros superiores. O reticulospinal bulbar faz o contrário, relaxando os extensores.','Lesões que liberam o reticulospinal pontino e o vestibulospinal produzem rigidez em extensão (descerebração).'),
 L(mc('medest',1,'A motricidade voluntária é cruzada porque a maioria das fibras corticospinais:',['Cruza na decussação das pirâmides','Cruza na comissura branca de cada segmento','Cruza no núcleo rubro','Não cruza'],'Um hemisfério comanda a metade oposta do corpo.'),'A maior parte das fibras cruza no bulbo e desce como corticospinal lateral. Uma pequena parte desce sem cruzar como corticospinal anterior e cruza perto do fim, nos segmentos onde termina.','Um AVC na cápsula interna esquerda causa hemiplegia direita; uma lesão medular alta do corticospinal lateral causa fraqueza do mesmo lado, abaixo da lesão.'),
 L(vf('medest',3,'Julgue sobre os tratos corticospinais.',[['O lateral fica cada vez menor à medida que desce.',true],['O anterior chega até a medula sacral.',false],['O anterior faz parte do sistema medial.',true],['O rubrospinal é muito desenvolvido no homem.',false]],'O anterior termina por volta da metade da medula torácica; o rubrospinal é reduzido no homem.'),'Durante a evolução o corticospinal cresceu e o rubrospinal diminuiu. O corticospinal anterior controla a musculatura axial e proximal do membro superior.','A importância clínica do corticospinal lateral é muito maior: é ele que explica a fraqueza distal e os sinais de liberação nas lesões do neurônio motor superior.'),
 L(cs('medest',3,'Na tratografia por ressonância de um paciente com lesão medular antiga, uma área de degeneração aparece acima da lesão, no funículo posterior. Esse achado indica que a via lesada é:',['Ascendente, com corpos celulares abaixo da lesão','Descendente, com corpos celulares acima da lesão','Exclusivamente de associação','Formada por axônios sem mielina'],'A degeneração walleriana atinge o segmento separado do corpo celular.'),'Se a degeneração aparece acima da lesão, o corpo do neurônio está abaixo e a via sobe. Foi assim, estudando lesões, que se mapearam os tratos.','Esse raciocínio também ajuda a interpretar exames de imagem tardios após trauma medular.')
);

/* Capítulo 14 — Estrutura do bulbo */
LESSON.bulbo=[
 {t:'O tronco encefálico em relação à medula',b:[
  ['p','Medula e tronco encefálico pertencem ao sistema nervoso **segmentar**, mas no tronco a substância cinzenta se **fragmenta** em núcleos, em boa parte por causa das muitas fibras **transversais**.'],
  ['ul',['**Substância cinzenta homóloga à da medula:** os núcleos dos nervos cranianos.','**Substância cinzenta própria do tronco:** núcleos sem correspondente na medula (grácil, cuneiforme, olivar inferior, pontinos, rubro, negra).','**Formação reticular:** rede de neurônios e fibras que preenche o espaço entre núcleos e tratos.']],
  ['p','O tronco organiza comportamentos inteiros. Um recém-nascido com grandes lesões do prosencéfalo (como na hidrocefalia) pode chorar, sugar, sorrir e mover olhos e membros quase como um bebê normal; as sequelas aparecem meses depois, quando os centros superiores deveriam assumir o controle.'],
  ['chk','Os núcleos dos nervos cranianos são classificados como:',['Substância cinzenta própria do tronco','Substância cinzenta homóloga à da medula','Formação reticular'],1,'Correspondem a colunas da cinzenta da medula, fragmentadas.']]},
 {t:'Por que o bulbo fica diferente da medula',b:[
  ['fig','bulboFechado','Bulbo fechado, na decussação dos lemniscos.'],
  ['p','Embaixo, o bulbo lembra a medula; na altura da oliva já não há semelhança. Quatro fatores explicam a mudança:'],
  ['ol',['**Novos núcleos próprios:** grácil, cuneiforme e olivar inferior.','**Decussação das pirâmides (motora):** o trato corticospinal cruza e vira corticospinal lateral, atravessando a cinzenta e separando a cabeça da base da coluna anterior.','**Decussação dos lemniscos (sensitiva):** as **fibras arqueadas internas** saem dos núcleos grácil e cuneiforme, cruzam a linha média e sobem como **lemnisco medial**.','**Abertura do IV ventrículo:** os fascículos e núcleos grácil e cuneiforme somem e o canal central se abre no assoalho do IV ventrículo.']],
  ['key','O lemnisco medial de um lado leva ao tálamo a propriocepção consciente, o tato epicrítico e a vibração do **lado oposto** do corpo.'],
  ['chk','O lemnisco medial é formado por fibras que se originam:',['Nos núcleos grácil e cuneiforme','No gânglio espinal','No núcleo olivar inferior'],0,'Saem como fibras arqueadas internas e cruzam.']]},
 {t:'Núcleos de nervos cranianos do bulbo',b:[
  ['fig','bulboAberto','Bulbo aberto, no nível da oliva.'],
  ['tbl',[['Núcleo','Tipo','Nervos','Função'],['Ambíguo','Motor (eferente visceral especial)','IX, X, XI','Faringe e laringe; fica profundo'],['Do hipoglosso','Motor (eferente somático)','XII','Língua; no trígono do hipoglosso'],['Dorsal do vago','Motor parassimpático','X','Vísceras; no trígono do vago (equivale à coluna lateral)'],['Salivatório inferior','Motor parassimpático','IX','Parótida'],['Do trato solitário','Sensitivo visceral (geral e gustação)','VII, IX, X','Vísceras e paladar'],['Do trato espinal do trigêmeo','Sensitivo somático geral','V (e VII, IX, X para o pavilhão)','Sensibilidade da cabeça; continua a substância gelatinosa'],['Vestibulares medial e inferior','Sensitivo','VIII','Equilíbrio; área vestibular']]],
  ['mn','**Tomando sorvete:** pôr a língua para fora (**hipoglosso**), sentir o frio (**trato espinal do V**), sentir o gosto (**trato solitário**), boca cheia d’água (**salivatório inferior**), engolir (**ambíguo**), digerir (**dorsal do vago**) e não cair (**vestibulares**).'],
  ['chk','O núcleo que dá as fibras motoras para a faringe e a laringe é o:',['Dorsal do vago','Ambíguo','Do trato solitário'],1,'O ambíguo é branquiomérico: IX, X e XI.']]},
 {t:'Núcleos próprios e fibras transversais',b:[
  ['p','O **núcleo olivar inferior** aparece como uma lâmina de cinzenta **pregueada**, com abertura voltada medialmente. Recebe fibras do córtex, da medula e do núcleo rubro e manda as **fibras olivocerebelares**, que **cruzam** e entram no cerebelo pelo **pedúnculo cerebelar inferior**, distribuindo-se a todo o córtex cerebelar. Participa da **aprendizagem motora**. Com os núcleos olivares acessórios medial e dorsal, forma o **complexo olivar inferior**.'],
  ['p','O **núcleo cuneiforme acessório**, lateral ao cuneiforme, liga-se ao cerebelo pelo trato cuneocerebelar, que forma as **fibras arqueadas externas**.'],
  ['tbl',[['Fibras arqueadas','Origem e destino'],['Internas (sensitivas)','Núcleos grácil e cuneiforme até o lemnisco medial do outro lado'],['Internas (olivocerebelares)','Complexo olivar até o cerebelo do outro lado'],['Externas','Núcleo cuneiforme acessório até o cerebelo, perto da superfície']]],
  ['p','O **pedúnculo cerebelar inferior** sobe pelas bordas da metade inferior do IV ventrículo e entra no cerebelo. Leva fibras olivocerebelares, do espinocerebelar posterior e arqueadas externas.'],
  ['chk','A lesão do núcleo olivar inferior prejudica principalmente:',['A aprendizagem motora','A sensibilidade da face','A secreção da parótida'],0,'As fibras olivocerebelares participam do aprendizado de movimentos.']]},
 {t:'Fibras longitudinais',b:[
  ['ul',['**Ascendentes:** fascículos grácil e cuneiforme (parte fechada), lemnisco medial (fita junto à linha média), espinotalâmicos lateral e anterior (área lateral), espinocerebelares anterior (segue até o pedúnculo superior) e posterior (junta-se ao pedúnculo inferior).','**Descendentes do sistema lateral:** corticospinal (nas **pirâmides**, por isso "trato piramidal") e rubrospinal (fora das pirâmides).','**Descendentes do sistema medial:** corticospinal anterior, tetospinal, vestibulospinais e reticulospinais.','**Trato corticonuclear:** do córtex aos núcleos motores do tronco; no bulbo, ao **ambíguo** e ao **hipoglosso** (controle voluntário de faringe, laringe e língua).','**Trato espinal do trigêmeo:** fibras do V que descem ao lado do seu núcleo.','**Trato solitário:** fibras viscerais do VII, IX e X que descem dentro do seu núcleo.']],
  ['p','O **fascículo longitudinal medial** é a via de **associação** do tronco (corresponde ao fascículo próprio da medula). Fica sempre medial e dorsal e liga os núcleos motores dos nervos cranianos, sobretudo os do movimento dos olhos (III, IV, VI) e da cabeça (raiz espinal do XI), com grande aporte dos núcleos vestibulares. Coordena movimentos dos olhos com os da cabeça.'],
  ['chk','O trato corticonuclear, no bulbo, termina nos núcleos:',['Ambíguo e do hipoglosso','Grácil e cuneiforme','Olivar inferior e vestibulares'],0,'Permite o controle voluntário de faringe, laringe e língua.']]},
 {t:'Formação reticular e clínica',b:[
  ['p','A formação reticular do bulbo abriga o **centro respiratório**, o **centro vasomotor** e o **centro do vômito**. Por isso lesões bulbares podem ser fatais.'],
  ['clin','O bulbo é pequeno e cheio de tratos e núcleos vizinhos: lesões restritas dão quadros variados. Os sinais mais característicos são **disfagia** e **alteração da voz** (núcleo ambíguo) e **alteração dos movimentos da língua** (hipoglosso), combinados com perdas sensitivas ou paralisias do tronco e dos membros pelas vias que passam ali.'],
  ['chk','Por que lesões bulbares são especialmente graves?',['Porque o bulbo tem os centros respiratório e vasomotor','Porque o bulbo contém o córtex motor','Porque o bulbo produz o liquor'],0,'Os centros vitais ficam na formação reticular do bulbo.']]}
];
RESUMO.bulbo={pts:['Tronco: cinzenta homóloga (núcleos dos nervos cranianos), própria (grácil, cuneiforme, olivar...) e formação reticular.','Bulbo muda por: núcleos próprios novos, decussação das pirâmides, decussação dos lemniscos e abertura do IV ventrículo.','Fibras arqueadas internas dos núcleos grácil e cuneiforme cruzam e formam o lemnisco medial.','Núcleos: ambíguo (IX, X, XI), hipoglosso (XII), dorsal do vago, salivatório inferior, trato solitário (VII, IX, X), trato espinal do V, vestibulares medial e inferior.','Olivar inferior: lâmina pregueada; fibras olivocerebelares cruzadas pelo pedúnculo inferior; aprendizagem motora.','Pedúnculo cerebelar inferior: olivocerebelares, espinocerebelar posterior e arqueadas externas.','Pirâmides: trato corticospinal (piramidal). Corticonuclear vai ao ambíguo e ao hipoglosso.','Fascículo longitudinal medial: associação; liga núcleos oculomotores, do XI e vestibulares.','Formação reticular bulbar: centros respiratório, vasomotor e do vômito.'],
 clin:['Lesões bulbares: disfagia e disfonia (ambíguo), língua (hipoglosso), com sinais de vias longas.','Lesão dos centros respiratório e vasomotor pode ser fatal.','Bebês com lesão do prosencéfalo podem parecer normais nos primeiros meses, porque o tronco organiza o comportamento inicial.']};
QB.push(
 L(mc('bulbo',2,'A fragmentação da substância cinzenta em núcleos no tronco encefálico decorre em parte:',['Do surgimento de muitas fibras de direção transversal','Da ausência de substância branca','Do desaparecimento do canal central em todo o tronco','Da falta de núcleos de nervos cranianos'],'Fibras transversais, quase ausentes na medula, cortam as colunas.'),'Além disso, aparecem núcleos próprios do tronco e a formação reticular. É por isso que o tronco tem aspecto muito diferente da medula nos cortes.','Entender essa organização ajuda a reconhecer o nível de um corte de tronco em provas práticas.'),
 L(as('bulbo',2,'Associe a estrutura à categoria.',[['Núcleo do hipoglosso','Cinzenta homóloga à da medula'],['Núcleo olivar inferior','Cinzenta própria do tronco'],['Centro respiratório','Formação reticular'],['Núcleo grácil','Cinzenta própria do tronco']],'Núcleos de nervos cranianos são homólogos à cinzenta da medula.'),'Os núcleos grácil, cuneiforme e olivar inferior não têm correspondente na medula. Os centros vitais ficam na formação reticular.','Lesões da formação reticular bulbar alteram ritmo respiratório e pressão arterial.'),
 L(od('bulbo',2,'Ordene o caminho da informação do tato epicrítico de um membro inferior até o tálamo.',['Gânglio espinal','Fascículo grácil','Núcleo grácil','Fibras arqueadas internas','Lemnisco medial do lado oposto','Tálamo'],'O cruzamento acontece no bulbo.'),'A primeira sinapse é no núcleo grácil; o segundo neurônio cruza como fibra arqueada interna e sobe no lemnisco medial até o tálamo.','Uma lesão do lemnisco medial no bulbo causa perda da propriocepção e do tato epicrítico do lado oposto do corpo.'),
 L(vf('bulbo',2,'Julgue sobre as decussações do bulbo.',[['Na decussação das pirâmides cruzam fibras motoras.',true],['Na decussação dos lemniscos cruzam fibras do espinotalâmico lateral.',false],['As fibras corticospinais, ao cruzar, separam a cabeça da base da coluna anterior.',true],['O lemnisco medial se forma depois do cruzamento das fibras arqueadas internas.',true]],'O espinotalâmico lateral já cruzou na medula.'),'Há duas grandes decussações no bulbo: motora (pirâmides) e sensitiva (lemniscos). As fibras do espinotalâmico cruzaram antes, na comissura branca da medula.','Por isso lesões medulares dão perda de dor contralateral e de propriocepção ipsilateral, enquanto no bulbo alto ambas ficam contralaterais.'),
 L(mc('bulbo',2,'O IV ventrículo se abre no bulbo porque:',['Os fascículos e núcleos grácil e cuneiforme desaparecem no funículo posterior','O canal central se estreita e se fecha nos níveis mais altos','O cerebelo comprime o tegmento e o empurra para frente','As pirâmides cruzam a linha média e deslocam o canal'],'Sem nada no funículo posterior, o canal central se abre.'),'À medida que as fibras dos fascículos terminam nos seus núcleos, a parte dorsal do bulbo esvazia e o canal central se alarga como IV ventrículo, cujo assoalho tem núcleos de nervos cranianos.','A parte fechada e a parte aberta do bulbo são referências usadas para identificar níveis de corte.'),
 L(as('bulbo',2,'Associe o núcleo ao nervo craniano.',[['Núcleo ambíguo','IX, X e XI'],['Núcleo do trato solitário','VII, IX e X'],['Núcleo dorsal do vago','X'],['Núcleo salivatório inferior','IX']],'O ambíguo é motor branquiomérico; o solitário, sensitivo visceral.'),'O trato solitário recebe gustação (aferente visceral especial) e sensibilidade visceral geral. O dorsal do vago é o principal núcleo parassimpático do bulbo.','A lesão do núcleo do trato solitário pode alterar reflexos cardiovasculares e o paladar.'),
 L(mc('bulbo',2,'O núcleo dorsal do vago corresponde, na medula, à:',['Coluna lateral','Coluna anterior','Substância gelatinosa','Coluna posterior'],'Ambos contêm neurônios pré-ganglionares.'),'O núcleo dorsal do vago fica no trígono do vago, no assoalho do IV ventrículo. Seus axônios saem pelo vago e vão aos gânglios das vísceras torácicas e abdominais.','É o grande centro do parassimpático para coração, pulmões e tubo digestivo até o cólon transverso.'),
 L(mc('bulbo',2,'O núcleo do trato espinal do trigêmeo continua-se, na medula, com:',['A substância gelatinosa','O núcleo torácico','A coluna anterior','O núcleo intermédio-lateral'],'Os dois recebem dor e temperatura.'),'O núcleo recebe a sensibilidade somática geral de quase toda a cabeça pelo V; pelos VII, IX e X chegam apenas fibras do pavilhão e do meato acústico externo.','Na síndrome lateral do bulbo, a lesão do trato e núcleo espinal do V causa perda de dor e temperatura na face do mesmo lado.'),
 L(gp('bulbo',2,'O núcleo do bulbo que origina as fibras motoras para a musculatura da faringe e da laringe é o núcleo ____.',['ambíguo','ambiguo'],'Seu nome vem de ser difícil de delimitar nos cortes.'),'Fica profundamente no bulbo e dá fibras eferentes viscerais especiais pelo IX, X e XI (raiz craniana). É controlado pelo trato corticonuclear.','Sua lesão causa disfagia, disfonia e paralisia do palato e da prega vocal do mesmo lado.'),
 L(cs('bulbo',2,'Um estudante, ao tomar sorvete, põe a língua para fora, sente frio, sente o sabor, saliva e engole. Qual sequência de núcleos do bulbo participa, na ordem?',['Hipoglosso, trato espinal do V, trato solitário, salivatório inferior, ambíguo','Ambíguo, hipoglosso, vestibulares, trato solitário, dorsal do vago','Trato solitário, ambíguo, hipoglosso, salivatório inferior, trato espinal do V','Dorsal do vago, hipoglosso, ambíguo, vestibulares, trato solitário'],'É o mnemônico do sorvete.'),'Língua para fora (XII), sensação térmica (trato espinal do V), gosto (trato solitário), saliva (salivatório inferior), deglutição (ambíguo). Depois, no estômago, o dorsal do vago; e, para manter o equilíbrio, os vestibulares.','Esse exercício ajuda a lembrar que lesões bulbares combinam sintomas de língua, deglutição, sensibilidade da face e paladar.'),
 L(mc('bulbo',2,'As fibras olivocerebelares:',['Cruzam a linha média e entram no cerebelo pelo pedúnculo cerebelar inferior','Sobem sem cruzar pelo pedúnculo cerebelar superior','Terminam no tálamo do mesmo lado, junto ao lemnisco','Formam o lemnisco medial depois de cruzar a linha média'],'Saem do complexo olivar inferior como fibras arqueadas internas.'),'O núcleo olivar inferior recebe do córtex, da medula e do núcleo rubro. Suas fibras se distribuem a todo o córtex cerebelar e são importantes para a aprendizagem motora.','O tremor palatal (mioclonia do palato) ocorre em lesões do circuito que envolve o núcleo olivar inferior.'),
 L(ar('bulbo',1,'O núcleo olivar inferior participa da aprendizagem motora.','O núcleo olivar inferior aparece nos cortes como uma lâmina pregueada com abertura medial.',1,'As duas são verdadeiras, mas a forma do núcleo não explica sua função.'),'A função vem das conexões: as fibras olivocerebelares informam o cerebelo e ajustam a execução de tarefas repetidas, que ficam mais rápidas e eficientes.','Em provas práticas, a forma pregueada da oliva é a melhor pista para reconhecer um corte do bulbo aberto.'),
 L(vf('bulbo',2,'Julgue sobre o pedúnculo cerebelar inferior.',[['Leva fibras olivocerebelares.',true],['Leva o trato espinocerebelar posterior.',true],['Leva o trato espinocerebelar anterior.',false],['Leva fibras arqueadas externas.',true]],'O espinocerebelar anterior entra pelo pedúnculo superior.'),'O pedúnculo inferior sobe pelas bordas da metade inferior do IV ventrículo e se dobra dorsalmente para entrar no cerebelo.','Lesões laterais do bulbo que pegam o pedúnculo inferior causam ataxia do mesmo lado.'),
 L(mc('bulbo',2,'O trato corticospinal, ao passar pelo bulbo, ocupa:',['As pirâmides','O lemnisco medial','O pedúnculo cerebelar inferior','A oliva'],'Por isso é chamado trato piramidal.'),'O trato desce do córtex, passa pelas pirâmides bulbares e, na sua maioria, cruza na decussação das pirâmides. O rubrospinal chega à medula sem passar pelas pirâmides.','A síndrome medial do bulbo, com lesão da pirâmide, causa hemiparesia do lado oposto.'),
 L(ar('bulbo',3,'O trato corticonuclear termina, no bulbo, nos núcleos grácil e cuneiforme.','O trato corticonuclear permite o controle voluntário dos músculos da faringe, da laringe e da língua.',3,'A afirmação é falsa (termina no ambíguo e no hipoglosso); a razão é verdadeira.'),'As fibras corticonucleares saem do córtex motor e terminam em núcleos motores de nervos cranianos. No bulbo, o ambíguo e o hipoglosso.','Lesões bilaterais do corticonuclear causam paralisia pseudobulbar: disfagia e disartria com reflexos faciais exaltados.'),
 L(mc('bulbo',2,'O fascículo longitudinal medial é importante para:',['Coordenar os movimentos dos olhos com os da cabeça','Levar a dor e a temperatura do corpo ao tálamo','Conduzir a gustação até o núcleo do trato solitário','Ligar o córtex motor aos núcleos pontinos'],'Liga núcleos vestibulares aos núcleos dos nervos III, IV, VI e XI.'),'É a via de associação do tronco, sempre medial e dorsal nos cortes. Recebe muitas fibras vestibulares, que informam a posição da cabeça.','Sua lesão causa oftalmoplegia internuclear, comum na esclerose múltipla: o olho não aduz no olhar lateral.'),
 L(gp('bulbo',2,'O feixe de associação do tronco encefálico, correspondente ao fascículo próprio da medula, é o fascículo longitudinal ____.',['medial'],'Fica sempre em posição medial e dorsal.'),'Ele percorre todo o tronco e os níveis altos da medula, ligando núcleos motores de nervos cranianos entre si e aos núcleos vestibulares.','Testar os movimentos conjugados dos olhos e o reflexo oculocefálico avalia essa via em pacientes em coma.'),
 L(mc('bulbo',1,'Na formação reticular do bulbo ficam os centros:',['Respiratório, vasomotor e do vômito','Da fala, da escrita e da leitura','Da visão, da audição e do olfato','Da sede, da fome e da temperatura'],'Por isso lesões bulbares são tão graves.'),'Esses centros regulam o ritmo respiratório, o tônus vascular e o vômito. Serão vistos com a formação reticular e o hipotálamo.','Na herniação das tonsilas cerebelares pelo forame magno, a compressão do bulbo pode causar parada respiratória.'),
 L(cs('bulbo',3,'Paciente tem disfagia, voz anasalada e rouca, e a úvula desvia para a direita ao dizer "a". A língua não desvia. O núcleo mais provavelmente lesado é:',['Ambíguo esquerdo','Hipoglosso direito','Dorsal do vago direito','Trato solitário esquerdo'],'A úvula desvia para o lado sadio; o ambíguo comanda faringe, palato e laringe.'),'Com o palato esquerdo paralisado, a musculatura direita puxa a úvula para a direita. A língua normal mostra que o hipoglosso está preservado.','O ambíguo é irrigado por ramos da artéria vertebral e da cerebelar inferior posterior; sua lesão faz parte da síndrome lateral do bulbo (Wallenberg).'),
 L(vf('bulbo',2,'Julgue sobre as fibras longitudinais do bulbo.',[['O lemnisco medial forma uma fita junto à linha média.',true],['O trato espinotalâmico lateral fica na área lateral do bulbo.',true],['O trato solitário é formado por fibras que sobem para o tálamo.',false],['O trato espinal do trigêmeo fica lateral ao seu núcleo.',true]],'O trato solitário desce e termina no próprio núcleo.'),'Os tratos espinal do V e solitário são formados por fibras que entram no tronco e descem, terminando em níveis cada vez mais caudais.','A posição lateral do espinotalâmico e do trato espinal do V explica a perda cruzada de dor (face de um lado, corpo do outro) na síndrome lateral do bulbo.'),
 L(mc('bulbo',2,'Fibras arqueadas externas originam-se no:',['Núcleo cuneiforme acessório','Núcleo grácil','Núcleo ambíguo','Núcleo olivar inferior'],'Formam parte do trato cuneocerebelar.'),'O núcleo cuneiforme acessório é o equivalente, para o membro superior, do núcleo torácico: leva propriocepção inconsciente ao cerebelo pelo pedúnculo inferior.','Esse sistema mostra que a propriocepção inconsciente do braço e da perna segue vias paralelas até o cerebelo.')
);

/* Capítulo 15 — Estrutura da ponte */
LESSON.ponte=[
 {t:'Base e tegmento',b:[
  ['p','A ponte tem uma parte **ventral**, a **base da ponte**, e uma parte **dorsal**, o **tegmento**. O tegmento se parece com o do bulbo e o do mesencéfalo; a base é exclusiva da ponte. No limite entre as duas corre o **corpo trapezoide**, de fibras mielínicas transversais (estudado com o tegmento).'],
  ['fig','ponteCorte','Ponte em corte no nível do colículo facial.'],
  ['p','A base surgiu na evolução junto com o **neocórtex** e o **neocerebelo**, com quem tem conexões íntimas, e atinge o máximo no homem, onde é maior que o tegmento.'],
  ['chk','Qual parte da ponte não tem correspondente em outros níveis do tronco?',['O tegmento','A base','O corpo trapezoide'],1,'A base da ponte é exclusiva.']]},
 {t:'Base da ponte',b:[
  ['ul',['**Fibras longitudinais:** trato **corticospinal** (aqui dividido em feixes dissociados, não compacto como nas pirâmides), trato **corticonuclear** (para os núcleos motores do V, VI e VII, dos dois lados) e trato **corticopontino** (de várias áreas do córtex até os núcleos pontinos).','**Núcleos pontinos:** pequenos grupos de neurônios espalhados pela base, onde terminam as fibras corticopontinas.','**Fibras transversais (pontinas ou pontocerebelares):** axônios dos núcleos pontinos que **cruzam** a linha média e entram no cerebelo pelo **pedúnculo cerebelar médio**.']],
  ['key','Via **córtico-ponto-cerebelar**: córtex, núcleos pontinos do mesmo lado, cruzamento, cerebelo do lado oposto. É assim que o neocerebelo recebe os planos do córtex.'],
  ['chk','As fibras do pedúnculo cerebelar médio se originam:',['Nos núcleos pontinos do lado oposto','No núcleo rubro','No núcleo olivar inferior'],0,'São as fibras transversais da ponte, que cruzam.']]},
 {t:'Núcleos cocleares e via auditiva na ponte',b:[
  ['p','A parte coclear do VIII termina nos **núcleos cocleares dorsal e ventral**, onde o pedúnculo cerebelar inferior se volta para o cerebelo. As fibras vêm dos neurônios do **gânglio espiral**.'],
  ['ol',['A maioria das fibras dos núcleos cocleares **cruza** formando o **corpo trapezoide**.','Contornam o **núcleo olivar superior** (muitas fazem sinapse nele, do mesmo lado ou do oposto).','Sobem como **lemnisco lateral**.','Terminam no **colículo inferior**, que projeta ao **corpo geniculado medial**.']],
  ['key','A via auditiva tem componentes cruzados e diretos: cada hemisfério recebe informação **dos dois ouvidos**. Uma lesão unilateral da via central não causa surdez de um ouvido.'],
  ['chk','Quais fibras formam o corpo trapezoide?',['Fibras auditivas que cruzam vindas dos núcleos cocleares','Fibras corticospinais','Fibras do pedúnculo cerebelar superior'],0,'É parte da via auditiva.']]},
 {t:'Núcleos vestibulares',b:[
  ['p','São quatro (**lateral, medial, superior e inferior**), na **área vestibular** do assoalho do IV ventrículo. Recebem, pelo gânglio vestibular, a informação sobre posição e movimento da cabeça, além de fibras do cerebelo. Algumas fibras do gânglio vestibular vão direto ao cerebelo.'],
  ['tbl',[['Saída dos núcleos vestibulares','Função'],['Fascículo vestibulocerebelar','Ao vestibulocerebelo (equilíbrio)'],['Fascículo longitudinal medial','Ajuste dos olhos aos movimentos da cabeça'],['Trato vestibulospinal','Motoneurônios da medula: equilíbrio'],['Fibras vestibulotalâmicas','Ao tálamo e córtex (discutidas)']]],
  ['chk','A maioria das fibras do fascículo longitudinal medial vem dos núcleos:',['Cocleares','Vestibulares','Pontinos'],1,'Informam a posição da cabeça para ajustar os olhos.']]},
 {t:'Facial e abducente: o colículo facial',b:[
  ['p','As fibras do **núcleo do facial** sobem em direção dorsomedial, encurvam-se cranialmente logo abaixo do assoalho, correm medialmente ao **núcleo do abducente** e depois passam **por cima** dele: é o **joelho interno do facial**, que eleva o assoalho formando o **colículo facial**. Então descem em direção ventrolateral e emergem no **sulco bulbopontino**.'],
  ['p','As fibras do **abducente** saem do núcleo em direção ventral, atravessam a base da ponte e emergem no sulco bulbopontino, perto da linha média.'],
  ['clin','Pela proximidade, uma lesão no colículo facial pode atingir **ao mesmo tempo** o núcleo do VI e as fibras do VII: paralisia do reto lateral e paralisia facial do mesmo lado.'],
  ['p','No tegmento ficam ainda o **núcleo salivatório superior** e o **núcleo lacrimal**, do parassimpático craniano, que mandam fibras pelo nervo intermédio às glândulas submandibular, sublingual e lacrimal.'],
  ['chk','O colículo facial é formado pelo:',['Núcleo do facial','Joelho interno do facial sobre o núcleo do abducente','Núcleo vestibular medial'],1,'As fibras do VII contornam o núcleo do VI.']]},
 {t:'Núcleos do trigêmeo',b:[
  ['tbl',[['Núcleo','Onde','Função'],['Do trato espinal','Bulbo e ponte (até a medula cervical alta)','Dor e temperatura da cabeça'],['Sensitivo principal','Ponte, lateral, na entrada do V','Tato da face (continuação cranial dilatada do núcleo do trato espinal)'],['Do trato mesencefálico','Da ponte ao mesencéfalo','Propriocepção (músculos mastigadores, ATM)'],['Motor (mastigador)','Ponte, medial ao sensitivo principal','Músculos da mastigação']]],
  ['p','Dos núcleos sensitivos saem fibras que sobem como **lemnisco trigeminal** até o tálamo.'],
  ['chk','Num corte da ponte na entrada do trigêmeo, o núcleo motor fica:',['Medial ao núcleo sensitivo principal','Lateral ao núcleo sensitivo principal','Dentro do pedúnculo cerebelar médio'],0,'Motor medial, sensitivo principal lateral.']]},
 {t:'Fibras longitudinais e formação reticular',b:[
  ['ul',['**Lemnisco medial:** na ponte vira uma **faixa transversal**, cruzada perpendicularmente pelo corpo trapezoide, e sobe ao tálamo.','**Lemnisco espinal:** união dos espinotalâmicos lateral e anterior.','**Lemnisco lateral:** via auditiva.','**Lemnisco trigeminal:** sensibilidade da cabeça.','**Pedúnculo cerebelar superior:** principal saída do cerebelo; forma a parede dorsolateral da metade cranial do IV ventrículo, aprofunda-se e começa a **decussar** no limite com o mesencéfalo.']],
  ['p','Na formação reticular da ponte ficam o **locus ceruleus** (neurônios ricos em **noradrenalina**) e os **núcleos da rafe** (na linha média, ricos em **serotonina**), que modulam a atividade do córtex.'],
  ['clin','Lesões da ponte combinam sinais do V (sensibilidade da face e mastigação), VI (reto lateral), VII (mímica) e VIII (tontura e equilíbrio) com paralisias ou perdas sensitivas no tronco e nos membros, pelas vias que atravessam a ponte.'],
  ['chk','O locus ceruleus contém neurônios ricos em:',['Serotonina','Noradrenalina','Dopamina'],1,'Os núcleos da rafe é que são serotoninérgicos.']]}
];
RESUMO.ponte={pts:['Ponte: base (ventral, própria) e tegmento (dorsal, como o do bulbo e do mesencéfalo); corpo trapezoide no limite.','Base: corticospinal em feixes dissociados, corticonuclear (V, VI, VII), corticopontino, núcleos pontinos e fibras transversais que cruzam ao pedúnculo cerebelar médio.','Via auditiva: núcleos cocleares, corpo trapezoide (cruza), olivar superior, lemnisco lateral, colículo inferior; componentes cruzados e diretos.','Vestibulares (4) na área vestibular: vestibulocerebelar, FLM, vestibulospinal.','Joelho interno do VII contorna o núcleo do VI e forma o colículo facial.','Salivatório superior e lacrimal: parassimpático pelo nervo intermédio.','Trigêmeo: trato espinal, sensitivo principal (lateral), mesencefálico (propriocepção) e motor (medial).','Lemnisco medial transversal na ponte; lemniscos espinal, lateral e trigeminal.','Pedúnculo cerebelar superior começa a decussar no limite com o mesencéfalo.','Locus ceruleus (noradrenalina) e núcleos da rafe (serotonina).'],
 clin:['Lesão no colículo facial: reto lateral e mímica do mesmo lado.','Lesão unilateral da via auditiva central não causa surdez unilateral (via bilateral).','Lesões da ponte: sinais de V, VI, VII e VIII com sinais de vias longas.']};
QB.push(
 L(mc('ponte',1,'A base da ponte se desenvolveu, na evolução, junto com:',['O neocórtex e o neocerebelo','O teto do mesencéfalo','O bulbo olfatório','A medula sacral'],'Ela liga o córtex ao cerebelo.'),'A base da ponte é maior no homem do que em qualquer outro animal e maior que o próprio tegmento. Seus núcleos fazem a ponte entre o córtex cerebral e o neocerebelo.','Infartos da base da ponte podem causar hemiparesia com ataxia, pela lesão combinada do corticospinal e das fibras pontocerebelares.'),
 L(od('ponte',2,'Ordene a via córtico-ponto-cerebelar.',['Córtex cerebral','Trato corticopontino','Núcleos pontinos','Fibras transversais da ponte (cruzam)','Pedúnculo cerebelar médio','Córtex do cerebelo do lado oposto'],'A primeira sinapse é nos núcleos pontinos.'),'As fibras corticopontinas terminam nos núcleos pontinos do mesmo lado. Os axônios pontinos cruzam como fibras transversais e entram pelo pedúnculo médio.','Assim o hemisfério cerebral de um lado conversa com o hemisfério cerebelar do lado oposto.'),
 L(vf('ponte',2,'Julgue sobre a base da ponte.',[['O trato corticospinal forma ali um feixe compacto, como nas pirâmides.',false],['O trato corticonuclear vai aos núcleos motores do V, VI e VII.',true],['Os núcleos pontinos ficam espalhados pela base.',true],['As fibras transversais cruzam a linha média.',true]],'Na base da ponte o corticospinal se divide em vários feixes dissociados.'),'As fibras transversais e os núcleos pontinos separam o corticospinal em fascículos. Ao chegar ao bulbo, ele se reúne de novo nas pirâmides.','Por isso lesões pequenas na base da ponte podem pegar só parte do corticospinal, com fraqueza parcial.'),
 L(as('ponte',2,'Associe a estrutura à via de que faz parte.',[['Corpo trapezoide','Via auditiva'],['Lemnisco lateral','Via auditiva'],['Lemnisco medial','Propriocepção consciente e tato epicrítico'],['Lemnisco espinal','Dor, temperatura e tato protopático']],'Na ponte os lemniscos correm juntos no tegmento.'),'O lemnisco espinal reúne os tratos espinotalâmicos. O lateral leva a audição ao colículo inferior. O medial e o espinal seguem até o tálamo.','Lesões laterais da ponte afetam lemnisco espinal e trigeminal; mediais, o lemnisco medial.'),
