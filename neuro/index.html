 L(mc('meninges',2,'O liquor passa ao sangue principalmente:',['Nas granulações aracnóideas dos seios da dura','Nos plexos corioides','No canal central da medula','Nos espaços perivasculares do córtex'],'As granulações, sobretudo no seio sagital superior, absorvem o liquor.'),'Nelas o liquor fica separado do sangue apenas pelo endotélio e por fina camada de aracnoide e atravessa em vacúolos.','Inflamação ou sangue no espaço subaracnóideo pode bloquear as granulações e causar hidrocefalia comunicante.'),
 L(vf('meninges',2,'Julgue sobre o liquor normal do adulto.',[['Tem de 0 a 4 leucócitos por mm³.',true],['A glicose é cerca de dois terços da glicemia.',true],['A concentração de proteínas é maior que a do plasma.',false],['O volume total é de cerca de 150 mL.',true]],'As proteínas no liquor são muito mais baixas que no plasma.'),'O liquor tem cerca de 25 mg/dL de proteínas e cloretos maiores que o plasma. É renovado a cada 8 horas, com produção de cerca de 500 mL por dia.','Na meningite bacteriana, há muitos neutrófilos, proteína alta e glicose baixa.'),
 L(gp('meninges',2,'A pressão normal do liquor medida na região lombar, em decúbito lateral, vai de 5 a ____ cm de água.',['20','vinte'],'Normal: 5 a 20 cmH2O.'),'A medida é feita com manômetro durante a punção lombar.','Pressão elevada sugere hipertensão intracraniana, como na hipertensão intracraniana idiopática.'),
 L(mc('meninges',2,'O liquor é produzido principalmente por:',['Secreção ativa dos plexos corioides','Filtração passiva nas granulações aracnóideas','Secreção da pia-máter na convexidade','Difusão a partir do canal central'],'Os plexos corioides secretam o liquor com transporte ativo de íons.'),'O transporte de Na⁺ e Cl⁻ pelas células ependimárias modificadas arrasta água; por isso a composição difere da do plasma.','Papilomas do plexo corioide podem produzir liquor em excesso e causar hidrocefalia.'),
 L(as('meninges',3,'Associe o local de obstrução aos ventrículos dilatados.',[['Forame interventricular esquerdo','Só o ventrículo lateral esquerdo'],['Aqueduto cerebral','Laterais e III'],['Aberturas do IV ventrículo','Todos os ventrículos'],['Granulações aracnóideas','Todos (hidrocefalia comunicante)']],'Dilata tudo o que está antes do bloqueio.'),'Na obstrução das granulações, o liquor sai dos ventrículos mas não é absorvido: todo o sistema dilata, e a hidrocefalia é comunicante.','A terceiroventriculostomia funciona nas obstruções do aqueduto, mas não nas comunicantes.'),
 L(cs('meninges',2,'Criança com cabeça aumentando rapidamente e fontanela tensa. A RM mostra ventrículos laterais e III ventrículo muito dilatados, com IV ventrículo normal. Onde está a obstrução?',['Aqueduto cerebral','Forame interventricular','Aberturas do IV ventrículo','Granulações aracnóideas'],'IV ventrículo normal com III e laterais dilatados: aqueduto.'),'A estenose do aqueduto é causa comum de hidrocefalia congênita obstrutiva.','Pode ser tratada com terceiroventriculostomia endoscópica, que cria um desvio do III ventrículo para as cisternas da base.'),
 L(mc('meninges',2,'O papiledema na hipertensão intracraniana ocorre porque:',['O espaço subaracnóideo envolve o nervo óptico e comprime a veia central da retina','A artéria oftálmica sofre espasmo','O quiasma é empurrado contra a sela','O IV ventrículo dilata e comprime o nervo óptico'],'A pressão alta se transmite ao redor do nervo óptico.'),'A compressão da veia central da retina causa ingurgitamento venoso e edema da papila, visível no fundo de olho.','O fundo de olho deve ser examinado antes de uma punção lombar quando se suspeita de hipertensão intracraniana.'),
 L(cs('meninges',3,'Homem com tumor temporal direito fica sonolento. A pupila direita está dilatada e reage lentamente à luz, e há fraqueza no lado esquerdo do corpo. Qual o processo em curso?',['Hérnia do unco direito pela incisura do tentório','Hérnia de tonsila pelo forame magno','Hérnia do cíngulo sob a foice','Hidrocefalia por estenose do aqueduto'],'Midríase ipsilateral, hemiparesia contralateral e rebaixamento: hérnia do unco.'),'O unco comprime o oculomotor (pupila), a base do pedúnculo (hemiparesia oposta) e o mesencéfalo (consciência).','É emergência neurocirúrgica; medidas para baixar a pressão e descompressão podem salvar a vida.'),
 L(ar('meninges',2,'Não se deve fazer punção lombar em suspeita de hipertensão intracraniana sem exame de fundo de olho ou imagem.','A queda súbita da pressão espinal pode provocar hérnia das tonsilas pelo forame magno.',0,'O risco de herniação justifica o cuidado.'),'A diferença de pressão entre o crânio e o canal espinal empurra as tonsilas para baixo, comprimindo o bulbo.','Se há massa intracraniana, a punção deve ser evitada ou feita com muita cautela após avaliação.'),
 L(as('meninges',2,'Associe o tipo de sangramento à fonte típica.',[['Hematoma extradural','Artéria meníngea média'],['Hematoma subdural','Veias em ponte'],['Hemorragia subaracnóidea','Aneurisma cerebral'],['Exoftalmia pulsátil','Fístula carótido-cavernosa']],'Cada espaço tem sua fonte típica.'),'O extradural é arterial e rápido; o subdural, venoso e lento; o subaracnóideo espalha sangue no liquor.','Idosos e alcoolistas têm mais hematoma subdural crônico, pela atrofia que estica as veias em ponte.'),
 L(cs('meninges',2,'Jovem leva pancada na têmpora, perde a consciência, acorda e conversa normalmente por algumas horas, depois piora e entra em coma. A tomografia mostra coleção biconvexa. Qual o diagnóstico?',['Hematoma extradural','Hematoma subdural crônico','Hemorragia subaracnóidea','Hérnia de tonsila isolada'],'Intervalo lúcido e lente biconvexa: hematoma extradural.'),'A fratura temporal lesa a artéria meníngea média. O sangue arterial descola a dura do osso e cresce rápido.','É emergência: a drenagem cirúrgica precoce tem ótimo prognóstico; sem ela, a morte vem em horas.'),
 L(mc('meninges',2,'O tumor primário mais comum do SNC, originado nas meninges, é o:',['Meningioma','Glioblastoma','Meduloblastoma','Schwannoma'],'O meningioma é o mais comum.'),'É mais frequente em mulheres adultas, geralmente benigno e de crescimento lento.','O tratamento é cirúrgico quando há sintomas ou crescimento; muitos são achados incidentais.')
);

/* Capítulo 9 — Nervos em geral, terminações nervosas e nervos espinais */
LESSON.nervos=[
 {t:'O que é um nervo',b:[
  ['p','Nervos são cordões esbranquiçados de **fibras nervosas reforçadas por tecido conjuntivo** que ligam o SNC à periferia. Levam impulsos **eferentes** (do SNC para fora) e **aferentes** (da periferia para o SNC). Conforme se liguem à medula ou ao encéfalo, são **espinais** ou **cranianos**.'],
  ['ul',['A maioria das fibras é **mielínica com neurilema** (célula de Schwann).','Exceções: o **nervo óptico** é mielinizado por oligodendrócitos (sem neurilema) e o **olfatório** tem fibras amielínicas com neurilema (fibras de Remak).','Três bainhas conjuntivas: **endoneuro** (em volta de cada fibra), **perineuro** (em volta de cada fascículo) e **epineuro** (o nervo inteiro).']],
  ['p','Os nervos são muito vascularizados, com vasos longitudinais que se anastomosam, e quase **insensíveis** ao longo do trajeto: estimulá-los produz dor sentida no território que inervam, e não no ponto tocado. É a base da **dor fantasma** do amputado, quando o coto do nervo irritado gera impulsos que o cérebro atribui ao membro que já não existe.'],
  ['p','Quando um nervo "se divide" ou "se anastomosa", as fibras não se bifurcam: apenas se **reagrupam** em outros feixes. Só perto da terminação as fibras se ramificam de verdade.'],
  ['key','**Origem real** é onde estão os corpos dos neurônios (coluna anterior, núcleos, gânglios). **Origem aparente** é o ponto em que o nervo sai ou entra na superfície do SNC (ou no crânio e coluna).'],
  ['chk','A dor fantasma depois de uma amputação se explica porque:',['O nervo irritado no coto gera impulsos interpretados como vindos do membro','O córtex motor continua enviando comandos ao membro','Os receptores da pele do coto ficam hipersensíveis'],0,'A estimulação do nervo é sentida no território que ele inervava, não no local estimulado.']]},
 {t:'Condução e tipos de fibra',b:[
  ['p','O neurônio sensitivo do gânglio espinal é **pseudounipolar**. Seu prolongamento periférico é um axônio na forma, mas leva o impulso em direção ao corpo (função de dendrito); o prolongamento central é axônio na forma e na função. Admite-se que o impulso passe do periférico ao central **sem atravessar o corpo celular**.'],
  ['p','A velocidade varia de cerca de 1 a 120 m/s e cresce com o **calibre** e a mielinização da fibra.'],
  ['tbl',[['Grupo','Calibre e mielina','Exemplos'],['A (alfa, beta, gama)','Grandes, ricamente mielinizadas','Motoras e proprioceptivas; A alfa até 120 m/s'],['B','Médias, mielinizadas','Pré-ganglionares do autônomo'],['C','Finas, amielínicas','Pós-ganglionares do autônomo, dor e temperatura (0,5 a 1 m/s)']]],
  ['p','Para fibras de músculos e tendões usa-se também a numeração I, II, III e IV; o grupo IV é amielínico e equivale às fibras C.'],
  ['chk','As fibras pré-ganglionares do sistema autônomo pertencem ao grupo:',['A','B','C'],1,'B são as pré-ganglionares; C, as pós-ganglionares amielínicas.']]},
 {t:'Lesão e regeneração',b:[
  ['p','Esmagamento ou secção de um nervo periférico causa:'],
  ['ul',['**Degeneração walleriana** do segmento distal do axônio e de sua mielina.','No coto proximal, degeneração só até o **nó de Ranvier** mais próximo.','**Cromatólise** no corpo celular (perda da substância cromidial), máxima entre 7 e 15 dias e mais intensa quanto mais perto do corpo for a lesão.']],
  ['p','A ponta do coto proximal forma um **cone de crescimento**, que avança aderindo à **laminina** das membranas basais por meio de integrinas e capta **fatores neurotróficos** (neurotrofinas, como o fator de crescimento neural, e o fator derivado da glia).'],
  ['p','As **células de Schwann** são decisivas: ativadas por citocinas de macrófagos, proliferam, produzem laminina e fatores tróficos e formam tubos dentro do endoneuro pelos quais o axônio cresce. Cada axônio emite vários brotos, o que aumenta a chance de achar o caminho.'],
  ['clin','Na secção com afastamento dos cotos, as fibras crescem desordenadas na cicatriz e formam um **neuroma**. A recuperação exige retirar a cicatriz e aproximar os cotos com precisão (sutura dos envoltórios conjuntivos, idealmente justapondo o perineuro).'],
  ['p','No **SNC adulto** a regeneração é inibida pela **cicatriz astrocitária** (barreira física e química, com proteoglicanas) e por **inibidores ligados à mielina central** (como a proteína NOGO). Axônios centrais crescem num enxerto de nervo periférico, mas param ao reencontrar o tecido do SNC.'],
  ['chk','Qual célula forma os tubos por onde o axônio periférico se regenera?',['Astrócito','Oligodendrócito','Célula de Schwann'],2,'As células de Schwann com suas membranas basais guiam o crescimento.']]},
 {t:'Receptores',b:[
  ['p','Receptor é a estrutura que transforma um estímulo físico ou químico em atividade elétrica (**transdução**). Cada receptor é **específico**: tem limiar mínimo para uma forma de energia, embora possa ser ativado, com dificuldade, por outras.'],
  ['tbl',[['Pelo estímulo','Exemplos'],['Quimiorreceptores','Olfação, gustação, corpo carotídeo (O2)'],['Osmorreceptores','Pressão osmótica'],['Fotorreceptores','Cones e bastonetes'],['Termorreceptores','Terminações livres; também no hipotálamo'],['Nociceptores','Terminações livres ativadas por estímulos lesivos'],['Mecanorreceptores','Audição, equilíbrio, barorreceptores, fusos, tato e vibração']]],
  ['p','Pela localização (Sherrington): **exteroceptores** na superfície, **proprioceptores** em músculos, tendões e articulações, e **interoceptores** nas vísceras e vasos. Os dois primeiros são somáticos; os interoceptores, viscerais.'],
  ['p','Morfologicamente, os receptores gerais são **livres** (os mais frequentes: dor, temperatura, tato grosseiro; incluem os discos de Merkel) ou **encapsulados**:'],
  ['tbl',[['Encapsulado','Onde','Função'],['Meissner','Papilas dérmicas da pele espessa','Tato, pressão, vibração lenta (cerca de 50 Hz)'],['Vater-Paccini','Subcutâneo, septos, periósteo; o maior','Vibração rápida (200 a 300 Hz)'],['Ruffini','Papilas dérmicas, pele glabra e pilosa','Tato e pressão'],['Fuso neuromuscular','Ventre muscular','Estiramento do músculo'],['Órgão neurotendinoso','Junção músculo-tendão','Tensão do tendão']]],
  ['clin','**Dor referida:** nociceptores viscerais entram na medula pelos mesmos segmentos de áreas da pele, e o SNC atribui a dor à pele. O infarto do miocárdio dói na parede torácica alta e no braço esquerdo.'],
  ['chk','Nociceptores não existem:',['No periósteo','No tecido do encéfalo','Nas vísceras'],1,'No encéfalo eles faltam; na cabeça, só as meninges e vasos têm nociceptores.']]},
 {t:'Fuso, órgão neurotendinoso e reflexo miotático',b:[
  ['fig','fusoNM','Fuso neuromuscular: fibras intrafusais na cápsula, terminação anuloespiral na região equatorial e fibras gama nos polos.'],
  ['p','O **fuso neuromuscular** fica no ventre muscular, paralelo às fibras comuns (**extrafusais**). Dentro da cápsula há de 2 a 10 **fibras intrafusais**, cada uma com região **equatorial** não contrátil e regiões **polares** contráteis. Em volta do equador se enrolam as **terminações anuloespirais**.'],
  ['ol',['O músculo é estirado (por exemplo, pela gravidade ou pelo martelo).','A terminação anuloespiral é deformada e dispara.','A fibra aferente entra na medula e faz sinapse **direta** com o motoneurônio alfa da coluna anterior.','O motoneurônio alfa contrai as fibras extrafusais: **reflexo miotático**.']],
  ['p','As fibras **gama** (motoneurônios gama) contraem os polos das intrafusais, mantendo o equador tenso. Assim o fuso continua informando mesmo enquanto o músculo encurta, e o SNC regula sua sensibilidade e o **tônus**.'],
  ['p','O **órgão neurotendinoso** fica na junção músculo-tendão, dispara tanto no estiramento passivo quanto na contração e **não tem inervação gama**. Informa a tensão, ou seja, a força exercida.'],
  ['clin','Reflexos mais pesquisados: patelar, tríceps sural, adutor, bicipital, tricipital, braquiorradial e masseteriano. Na lesão do neurônio motor superior há **hiperatividade gama**, com hipertonia e espasticidade.'],
  ['chk','O que distingue o órgão neurotendinoso do fuso?',['Dispara também durante a contração e não tem inervação gama','Fica no ventre do músculo','Faz sinapse direta com o motoneurônio gama'],0,'O fuso tende a silenciar na contração (sem o gama); o órgão neurotendinoso não.']]},
 {t:'Terminações motoras',b:[
  ['p','A **placa motora** liga a fibra somática à fibra muscular esquelética: o axônio perde a mielina (mantém o neurilema), forma **botões sinápticos** com vesículas agranulares de **acetilcolina** e zonas ativas; o sarcolema forma **pregas juncionais**. A acetilcolinesterase desfaz o excesso.'],
  ['p','Nas **terminações viscerais** não há placa: o neurotransmissor sai ao longo de **varicosidades** de um longo trecho da fibra, e uma mesma fibra age sobre muitas células. Vesículas **agranulares** guardam acetilcolina; **granulares**, noradrenalina, que é recaptada pela própria fibra.'],
  ['clin','**Miastenia gravis:** forma autoimune mais comum, com anticorpos contra o receptor de acetilcolina; o timo participa em boa parte dos casos. Começa muitas vezes com **ptose** e diplopia, e a fraqueza **piora com o esforço e ao longo do dia**. Trata-se com anticolinesterásicos, imunossupressão e, em casos selecionados, timectomia.'],
  ['clin','**Botulismo:** a toxina bloqueia a **liberação** de acetilcolina na membrana pré-sináptica, causando paralisia flácida; a recuperação depende de formar novas terminações (meses). A mesma toxina, em doses locais, trata distonias, espasticidade e rugas de expressão.'],
  ['p','Depois de uma simpatectomia, o órgão fica **mais sensível** à noradrenalina injetada, porque perdeu a recaptação que a removia.'],
  ['chk','Na miastenia gravis autoimune, o alvo dos anticorpos é:',['O receptor de acetilcolina','A acetilcolinesterase','A liberação da acetilcolina'],0,'A liberação é bloqueada no botulismo; na miastenia o alvo é o receptor.']]},
 {t:'Nervos espinais',b:[
  ['fig','nervoEspinal','Formação do nervo espinal: raízes, gânglio espinal, tronco e ramos.'],
  ['p','São **31 pares**: 8 cervicais, 12 torácicos, 5 lombares, 5 sacrais e 1 coccígeo. Cada um nasce da união da **raiz dorsal** (sensitiva, com o gânglio espinal) e da **raiz ventral** (motora, das colunas anterior e lateral). O **tronco** resultante é misto e sai pelo **forame intervertebral**, dividindo-se logo em **ramo dorsal** e **ramo ventral**, ambos mistos.'],
  ['ul',['Ramo dorsal: músculos e pele do dorso, nuca e região occipital; menor que o ventral, salvo nos três primeiros cervicais.','Ramo ventral: membros e região anterolateral do pescoço e do tronco.','Torácicos: os ramos ventrais (**intercostais**) seguem isolados, **unissegmentares**.','Demais: formam **plexos** e originam nervos **plurissegmentares** (como o mediano, com fibras de várias raízes).']],
  ['tbl',[['Fibras do nervo espinal','Tipos'],['Aferentes somáticas','Exteroceptivas (temperatura, dor, pressão, tato) e proprioceptivas (conscientes e inconscientes)'],['Aferentes viscerais','Dos interoceptores'],['Eferentes somáticas','Músculo estriado esquelético'],['Eferentes viscerais','Músculo liso, cardíaco e glândulas (autônomo)']]],
  ['p','Nenhum nervo é "puro": nervos musculares levam fibras proprioceptivas dos fusos, e nervos cutâneos levam fibras autônomas para glândulas sudoríparas, eretores dos pelos e vasos. O laríngeo recorrente é exemplo de trajeto longo por razão embriológica.'],
  ['chk','O nervo intercostal é um exemplo de nervo:',['Plurissegmentar, saído de plexo','Unissegmentar','Exclusivamente sensitivo'],1,'Os intercostais conservam a disposição metamérica; seus axônios vêm de um só segmento.']]},
 {t:'Dermátomos, unidade motora e clínica',b:[
  ['p','**Dermátomo** é a faixa de pele inervada por uma única raiz dorsal. Há dermátomos de **C2 a C8** (C1 é praticamente só motora), 12 torácicos, 5 lombares, 5 sacrais e 1 coccígeo. No tronco ficam em faixas; nos membros ficam irregulares (C5 encosta em T1 no braço).'],
  ['key','Raízes vizinhas se **sobrepõem**: cortar uma raiz só não anestesia o dermátomo inteiro. No **herpes-zóster**, porém, o vírus atinge a raiz dorsal e as vesículas desenham exatamente o dermátomo.'],
  ['p','Comparar o mapa dos dermátomos com o dos **nervos periféricos** permite dizer se a perda sensitiva é de nervo, raiz ou medula. O território de uma raiz ventral chama-se **campo radicular motor**; a maioria dos músculos é plurirradicular.'],
  ['p','**Unidade motora** é um motoneurônio com seu axônio e todas as fibras musculares que ele inerva. Músculos de força têm unidades grandes (até cerca de 1.700 fibras por axônio no gastrocnêmio); músculos de precisão, pequenas (cerca de 100 no primeiro lumbrical). A força cresce recrutando mais unidades e aumentando a frequência de disparo. **Unidade sensitiva** é o equivalente sensitivo: um neurônio com todos os seus receptores, todos de um só tipo.'],
  ['clin','**Paralisia obstétrica do plexo braquial:** tração no parto. Na **alta (Erb)**, C5–C7: ombro, flexão do cotovelo e supinação. Na **baixa (Klumpke)**, C8–T1: flexores do punho e músculos da mão.'],
  ['clin','A **eletroneuromiografia** junta a neurocondução (estímulos e registro ao longo do nervo) e a eletromiografia com agulha. Separa miopatia, doença da junção, neuropatia e lesão de raiz ou de motoneurônio, e acompanha a reinervação depois de uma neurorrafia.'],
  ['chk','Na paralisia de Klumpke, o mais comprometido é:',['O ombro e a flexão do cotovelo','A musculatura intrínseca da mão','O diafragma'],1,'Klumpke é a paralisia baixa, C8–T1.']]}
];
RESUMO.nervos={pts:['Nervo: fibras + conjuntivo (endo, peri e epineuro). Óptico sem neurilema; olfatório com fibras de Remak.','Nervo é quase insensível no trajeto: dor projetada no território (dor fantasma).','Origem real = corpos dos neurônios; origem aparente = ponto na superfície do SNC (ou no crânio e coluna).','Fibras A (grossas, mielínicas), B (pré-ganglionares) e C (amielínicas: pós-ganglionares, dor e temperatura).','Lesão: degeneração walleriana distal, cromatólise no corpo; regeneração guiada por Schwann, laminina e fatores neurotróficos. No SNC: cicatriz astrocitária e inibidores da mielina.','Receptores: exteroceptores, proprioceptores e interoceptores. Livres (dor, temperatura) e encapsulados (Meissner, Paccini, Ruffini, fusos, órgão neurotendinoso).','Fuso: anuloespiral no equador, gama nos polos; reflexo miotático é monossináptico com o motoneurônio alfa.','Placa motora colinérgica com pregas juncionais; terminação visceral por varicosidades, sem placa.','31 pares espinais; raiz dorsal sensitiva com gânglio, raiz ventral motora; ramos dorsal e ventral mistos.','Intercostais unissegmentares; plexos formam nervos plurissegmentares.','Dermátomos C2–C8 (C1 sem dermátomo), com sobreposição entre raízes vizinhas.','Unidade motora: motoneurônio + fibras que inerva; pequena nos músculos de precisão.'],
 clin:['Dor referida: infarto com dor no braço esquerdo.','Neuroma quando os cotos ficam afastados; sutura precisa melhora a recuperação.','Miastenia: anticorpos contra o receptor de acetilcolina, ptose e fraqueza que piora com o esforço.','Botulismo: bloqueio da liberação de acetilcolina, paralisia flácida descendente.','Hiperatividade gama no neurônio motor superior: espasticidade.','Herpes-zóster segue um dermátomo.','Erb (C5–C7) e Klumpke (C8–T1).','Eletroneuromiografia separa músculo, junção, nervo, raiz e motoneurônio.']};
QB.push(
 L(mc('nervos',1,'A origem aparente de um nervo espinal na medula está:',['Nos sulcos lateral anterior e lateral posterior','Na coluna anterior da substância cinzenta','No gânglio da raiz dorsal','No forame vertebral'],'Origem aparente é o ponto de entrada ou saída na superfície; a coluna anterior e o gânglio são origens reais.'),'Origem real é onde ficam os corpos dos neurônios: coluna anterior e lateral para as fibras motoras, gânglio espinal para as sensitivas. A aparente é a superfície: sulcos lateral anterior e posterior. Há ainda uma origem aparente no esqueleto, o forame intervertebral.','Essa distinção orienta a topografia: uma lesão da coluna anterior (como na poliomielite) e uma lesão da raiz no forame podem afetar o mesmo músculo, mas com quadros associados diferentes.'),
 L(mc('nervos',2,'O prolongamento periférico do neurônio do gânglio espinal é classificado como:',['Axônio na morfologia, dendrito na função','Dendrito na morfologia e na função','Axônio na morfologia e na função','Dendrito na morfologia, axônio na função'],'Tem estrutura de axônio, mas conduz em direção ao corpo celular.'),'O neurônio pseudounipolar tem um prolongamento que se divide em ramo periférico e ramo central. O periférico tem estrutura de axônio (inclusive mielina), mas leva o impulso do receptor para o centro, como um dendrito. O central é axônio nos dois sentidos.','Na neuropatia sensitiva, quem adoece é esse longo prolongamento periférico, e os pés, mais distantes do corpo celular, são atingidos primeiro.'),
 L(as('nervos',2,'Associe o grupo de fibra ao exemplo.',[['A alfa','Fibra motora para músculo esquelético'],['B','Fibra pré-ganglionar do autônomo'],['C','Fibra pós-ganglionar amielínica'],['Grupo IV','Fibra amielínica de músculo, equivalente à C']],'A são grossas e rápidas; B, pré-ganglionares; C e IV, finas amielínicas.'),'A classificação A, B e C se baseia principalmente na velocidade de condução, que acompanha o calibre. A alfa chega a 120 m/s; C conduz a cerca de 0,5 a 1 m/s. A numeração I a IV é usada para fibras ligadas a músculos e tendões.','Anestésicos locais bloqueiam primeiro as fibras finas: a dor e a temperatura somem antes do tato e da força.'),
 L(vf('nervos',2,'Julgue sobre a lesão de um nervo periférico.',[['O segmento distal do axônio sofre degeneração walleriana.',true],['O coto proximal degenera até o corpo celular.',false],['A cromatólise é mais intensa quando a lesão é perto do corpo celular.',true],['O cone de crescimento adere à laminina das membranas basais.',true]],'O coto proximal degenera só até o nó de Ranvier mais próximo.'),'Depois da lesão, o corpo celular entra em cromatólise e reorganiza seu metabolismo para regenerar. O cone de crescimento avança aderindo à laminina por meio de integrinas e captando fatores neurotróficos, que sobem ao corpo por transporte retrógrado.','Lesões muito proximais (como avulsão de raízes) têm pior prognóstico: a cromatólise pode matar o neurônio.'),
 L(ar('nervos',3,'As fibras do SNC adulto regeneram tão bem quanto as do sistema nervoso periférico.','A cicatriz astrocitária e inibidores associados à mielina central dificultam o crescimento axonal no SNC.',3,'A afirmação é falsa e a razão é verdadeira: é justamente por isso que o SNC regenera mal.'),'Os axônios centrais têm potencial de crescer, como mostram os enxertos de nervo periférico, mas o ambiente é hostil: a cicatriz glial com proteoglicanas (como o sulfato de condroitina) e proteínas da mielina dos oligodendrócitos (como a NOGO) fazem o cone de crescimento recuar.','É a razão de a lesão medular completa deixar sequelas permanentes, e o alvo de pesquisas com bloqueio desses inibidores.'),
 L(mc('nervos',2,'Quando os cotos de um nervo seccionado ficam afastados, as fibras em crescimento tendem a formar:',['Um neuroma no tecido cicatricial','Uma nova raiz dorsal','Uma placa motora ectópica','Um gânglio sensitivo'],'Sem achar o coto distal, crescem desordenadas e formam o neuroma.'),'O neuroma é um emaranhado de tecido conjuntivo, células de Schwann e axônios que não acharam o caminho. A conduta é remover a cicatriz e aproximar os cotos com sutura dos elementos conjuntivos, de preferência justapondo o perineuro.','Neuromas de coto de amputação são causa de dor e de dor fantasma, e às vezes precisam ser ressecados.'),
 L(mc('nervos',2,'O corpúsculo de Vater-Paccini responde melhor a:',['Vibrações rápidas, em torno de 200 a 300 Hz','Calor intenso aplicado à pele glabra','Estiramento do tendão na junção miotendínea','Toque leve e contínuo, como o dos discos de Merkel'],'É o receptor da sensibilidade vibratória rápida.'),'Os corpúsculos de Paccini são os maiores receptores encapsulados, no subcutâneo, septos e periósteo. Meissner responde melhor a vibrações lentas, em torno de 50 Hz. Os dois ajudam a perceber texturas.','O diapasão de 128 Hz testa a palestesia, que se perde cedo na neuropatia diabética e nas lesões do funículo posterior.'),
 L(mc('nervos',3,'Durante a contração ativa de um músculo, o fuso neuromuscular continua enviando informação ao SNC porque:',['Os motoneurônios gama contraem os polos das fibras intrafusais','O órgão neurotendinoso estira a região equatorial','A placa motora excita diretamente a terminação anuloespiral','As fibras extrafusais se alongam'],'Sem o gama, o fuso afrouxaria e silenciaria na contração.'),'Quando o músculo encurta, a cápsula do fuso também encurta e a região equatorial afrouxa. A coativação alfa-gama contrai os polos das intrafusais, mantendo o equador tenso e a terminação anuloespiral ativa.','O excesso de atividade gama nas lesões do neurônio motor superior torna o fuso hiperexcitável: hiper-reflexia e espasticidade.'),
 L(ar('nervos',2,'O órgão neurotendinoso informa a força que o músculo está exercendo.','O órgão neurotendinoso é ativado pelo estiramento do tendão, que ocorre tanto na tração passiva quanto na contração.',0,'As duas são verdadeiras e a razão explica a afirmação.'),'Como fica em série com o músculo, na junção com o tendão, o órgão neurotendinoso sente a tensão aplicada ao osso. Diferentemente do fuso, não perde a informação durante a contração e não recebe fibras gama.','A propriocepção consciente depende sobretudo de fusos e órgãos neurotendinosos; os receptores articulares têm papel acessório.'),
 L(cs('nervos',2,'Mulher de 28 anos nota pálpebras caídas e visão dupla que pioram no fim da tarde e melhoram com repouso. Às vezes cansa ao mastigar. O mecanismo mais provável envolve:',['Anticorpos contra o receptor de acetilcolina da placa motora','Bloqueio da liberação de acetilcolina por toxina bacteriana','Lesão isquêmica do núcleo do oculomotor no mesencéfalo','Desmielinização inflamatória de nervos periféricos e raízes'],'Fraqueza flutuante e fatigável, com ptose e diplopia, é a apresentação típica da miastenia.'),'Na miastenia autoimune, anticorpos contra o receptor de acetilcolina reduzem os receptores funcionais. A transmissão falha com o uso repetido, daí a fatigabilidade. O timo participa em grande parte dos casos.','O tratamento inclui anticolinesterásicos (piridostigmina), corticoide e imunossupressores, e a crise miastênica com insuficiência respiratória exige UTI.'),
 L(mc('nervos',2,'Nas terminações eferentes viscerais, o neurotransmissor é liberado principalmente:',['Ao longo de varicosidades num trecho longo da fibra','Apenas no botão terminal, organizado numa placa motora','Nas pregas juncionais que aumentam a área do sarcolema','Pelo corpo do neurônio pós-ganglionar, dentro do gânglio'],'Não há placa: a fibra varicosa libera ao longo do caminho.'),'As fibras autônomas terminais são cheias de varicosidades ricas em vesículas, e uma única fibra pode influenciar muitas células musculares lisas ou glandulares. A distância até o efetuador varia muito (de dezenas a milhares de nanômetros).','Isso explica a ação difusa de drogas autonômicas e a hipersensibilidade de órgãos desnervados à noradrenalina circulante.'),
 L(gp('nervos',2,'O território cutâneo inervado por fibras de uma única raiz dorsal chama-se ____.',['dermátomo','dermatomo'],'Dermátomo leva o nome da raiz que o inerva.'),'Há dermátomos de C2 a C8, já que C1 é essencialmente motora. Por causa da sobreposição entre raízes vizinhas, a perda completa de um dermátomo exige lesão de três raízes.','O herpes-zóster, que atinge a raiz dorsal, desenha o dermátomo inteiro com dor e vesículas.'),
 L(vf('nervos',2,'Julgue sobre nervos espinais e plexos.',[['Os ramos ventrais torácicos formam os nervos intercostais.',true],['O nervo mediano é unissegmentar.',false],['Os ramos dorsais são, em geral, menores que os ventrais.',true],['Nervos cutâneos também levam fibras autônomas para glândulas sudoríparas.',true]],'O mediano é plurissegmentar, com fibras de várias raízes do plexo braquial.'),'Os plexos misturam fibras de vários segmentos; por isso, os nervos que saem deles são plurissegmentares. Os intercostais conservam a disposição metamérica do embrião.','Distinguir lesão de nervo plurissegmentar (déficit no território do nervo) de lesão radicular (déficit no dermátomo e no miótomo) é a base do diagnóstico topográfico.'),
 L(mc('nervos',2,'Na paralisia obstétrica de Erb, as raízes acometidas e o déficit típico são:',['C5–C7: ombro, flexão do cotovelo e supinação','C8–T1: flexores do punho e músculos intrínsecos da mão','C3–C5: diafragma e respiração do recém-nascido','T1–T2: pupila, com síndrome de Horner isolada'],'Erb é a lesão alta do plexo braquial.'),'A tração da cabeça ou do braço no parto estira o plexo. Na forma alta (Erb), o membro fica pendente, em rotação medial e pronação. Na baixa (Klumpke), a mão é o mais comprometido.','As lesões variam de neuropraxia, que se recupera, a ruptura completa, que pode exigir cirurgia de reconexão.'),
 L(mc('nervos',3,'Um músculo responsável por movimentos finos, como o primeiro lumbrical, tem unidades motoras:',['Pequenas, com poucas fibras musculares por axônio','Grandes, com milhares de fibras por axônio','Sem motoneurônio alfa','Formadas só por fibras intrafusais'],'Unidades pequenas permitem graduar a força com precisão.'),'No gastrocnêmio, um axônio pode inervar até cerca de 1.700 fibras; no primeiro lumbrical, perto de 100. A força aumenta recrutando mais unidades e elevando a frequência de disparo.','Na reinervação após lesão, a eletromiografia mostra unidades motoras maiores, porque os axônios sobreviventes brotam e adotam fibras órfãs.'),
 L(ar('nervos',3,'A secção de uma única raiz dorsal causa anestesia completa do dermátomo correspondente.','Raízes dorsais adjacentes inervam áreas cutâneas que se sobrepõem.',3,'A afirmação é falsa; a razão é verdadeira e explica justamente por que não há anestesia completa.'),'Pela sobreposição, a perda total de sensibilidade num dermátomo exigiria cortar a raiz dele e as duas vizinhas. Uma raiz isolada dá, no máximo, hipoestesia.','Na radiculopatia por hérnia de disco, o achado sensitivo costuma ser hipoestesia parcial e dor no trajeto do dermátomo, mais útil que a anestesia.'),
 L(cs('nervos',2,'Homem de 70 anos tem dor em queimação e vesículas agrupadas numa faixa que vai da coluna até o esterno, só do lado direito, na altura dos mamilos. A estrutura atingida é:',['A raiz dorsal e o gânglio espinal de T4','O nervo frênico','O tronco simpático cervical','A coluna anterior da medula torácica'],'O herpes-zóster reativa no gânglio sensitivo e desenha o dermátomo (T4 passa pelos mamilos).'),'O vírus varicela-zóster fica latente nos gânglios sensitivos e, ao reativar, desce pelas fibras da raiz até a pele do dermátomo. Por isso a lesão é unilateral e em faixa.','O dermátomo T4 marca a linha dos mamilos e T10, o umbigo: pontos de referência úteis para estimar o nível de lesões medulares.')
);

/* Capítulo 10 — Nervos cranianos */
FIG.nervosCranAnt=function(){return eFig('tronco',true,['n2','quiasma','trato','n3','pedunculo','n5','pcm','n6','n7','n8','n910','n12','oliva','piramide'])};
LESSON.nervcran=[
 {t:'Doze pares e suas origens aparentes',b:[
  ['p','Nervos cranianos fazem conexão com o **encéfalo**. Quase todos se ligam ao **tronco encefálico**; as exceções são o **olfatório** (telencéfalo) e o **óptico** (diencéfalo). São numerados de I a XII no sentido craniocaudal. Existe ainda um **nervo terminal** (par zero), rudimentar no homem.'],
  ['fig','nervosCranAnt','Origem aparente dos nervos cranianos na face anterior do tronco encefálico.'],
  ['tbl',[['Par','No encéfalo','No crânio'],['I olfatório','Bulbo olfatório','Lâmina crivosa do etmoide'],['II óptico','Quiasma óptico','Canal óptico'],['III oculomotor','Sulco medial do pedúnculo cerebral','Fissura orbital superior'],['IV troclear','Véu medular superior (face dorsal)','Fissura orbital superior'],['V trigêmeo','Entre a ponte e o pedúnculo cerebelar médio','V1 fissura orbital superior; V2 forame redondo; V3 forame oval'],['VI abducente','Sulco bulbopontino, junto à linha média','Fissura orbital superior'],['VII facial','Sulco bulbopontino, lateral ao VI','Forame estilomastóideo'],['VIII vestibulococlear','Sulco bulbopontino, lateral ao VII','Meato acústico interno (não sai do crânio)'],['IX glossofaríngeo','Sulco lateral posterior do bulbo','Forame jugular'],['X vago','Sulco lateral posterior, abaixo do IX','Forame jugular'],['XI acessório','Sulco lateral posterior (raiz craniana) e medula (raiz espinal)','Forame jugular'],['XII hipoglosso','Sulco lateral anterior, adiante da oliva','Canal do hipoglosso']]],
  ['mn','Pela **fissura orbital superior** passam III, IV, V1 e VI: todos os que movem o olho mais o nervo da sensibilidade da órbita. Pelo **forame jugular**, IX, X e XI.'],
  ['chk','Qual nervo craniano emerge da face dorsal do tronco encefálico?',['Abducente','Troclear','Hipoglosso'],1,'O IV sai do véu medular superior, logo abaixo do colículo inferior.']]},
 {t:'Componentes funcionais',b:[
  ['p','Os nervos cranianos têm, além dos componentes dos espinais, componentes **especiais**, ligados aos órgãos dos sentidos da cabeça e aos músculos dos **arcos branquiais**.'],
  ['tbl',[['Componente','Origem ou destino','Exemplo'],['Aferente somático geral','Exteroceptores e proprioceptores','Trigêmeo: pele da face'],['Aferente somático especial','Retina e orelha interna','Óptico; vestibulococlear'],['Aferente visceral geral','Visceroceptores','Vago: vísceras; IX: seio carotídeo'],['Aferente visceral especial','Gustação e olfação','Facial: gustação; olfatório'],['Eferente somático','Músculos miotômicos','III, IV, VI (olho) e XII (língua)'],['Eferente visceral especial','Músculos branquioméricos','V (mastigação), VII (mímica), IX, X, XI'],['Eferente visceral geral','Pré-ganglionares parassimpáticas','III, VII, IX e X']]],
  ['p','Os músculos dos arcos branquiais são estriados esqueléticos, mas os arcos são considerados formações viscerais. Por isso as fibras que os inervam são **eferentes viscerais especiais**. A gustação e a olfação são viscerais porque seus receptores ficam nos sistemas digestivo e respiratório.'],
  ['tbl',[['Arco','Nervo','Músculos'],['1º','Trigêmeo (V)','Mastigação; ventre anterior do digástrico'],['2º','Facial (VII)','Mímica; ventre posterior do digástrico; estilo-hióideo'],['3º','Glossofaríngeo (IX)','Estilofaríngeo; constritor superior da faringe'],['4º e 5º','Vago (X)','Constritores médio e inferior da faringe; laringe']]],
  ['key','O **digástrico** resume a regra: ventre anterior do 1º arco (trigêmeo), ventre posterior do 2º arco (facial).'],
  ['chk','A fibra que inerva o músculo masseter é classificada como:',['Eferente somática','Eferente visceral especial','Eferente visceral geral'],1,'O masseter deriva do 1º arco branquial.']]},
 {t:'I, II, III, IV e VI',b:[
  ['p','O **olfatório** é formado por feixes finos que atravessam a lâmina crivosa e terminam no bulbo olfatório (aferente visceral especial). O **óptico** sai do polo posterior do olho, entra pelo canal óptico e forma o **quiasma**, onde há cruzamento parcial; segue como trato óptico até o corpo geniculado lateral (aferente somático especial).'],
  ['p','**III, IV e VI** entram na órbita pela fissura orbital superior e movem o olho. Os músculos extrínsecos vêm dos somitos pré-ópticos: fibras **eferentes somáticas**.'],
  ['ul',['**Abducente (VI):** reto lateral.','**Troclear (IV):** oblíquo superior.','**Oculomotor (III):** todos os outros (reto superior, inferior e medial, oblíquo inferior e elevador da pálpebra superior).']],
  ['p','O oculomotor também leva fibras **pré-ganglionares parassimpáticas** ao gânglio ciliar, para o **músculo ciliar** (acomodação) e o **esfíncter da pupila** (eferentes viscerais gerais).'],
  ['mn','**RL6 OS4**: reto lateral pelo 6, oblíquo superior pelo 4; o resto é do 3.'],
  ['chk','Uma lesão do oculomotor pode causar midríase porque o nervo leva:',['Fibras simpáticas para o dilatador','Fibras parassimpáticas para o esfíncter da pupila','Fibras para o reto lateral'],1,'Sem o parassimpático do III, o dilatador simpático predomina.']]},
 {t:'Trigêmeo (V)',b:[
  ['p','Misto, com componente **sensitivo** muito maior. A raiz sensitiva vem do **gânglio trigeminal**, na parte petrosa do temporal; dele saem as três divisões: **oftálmico (V1)**, **maxilar (V2)** e **mandibular (V3)**.'],
  ['p','Sensibilidade geral (aferente somática geral) de:'],
  ['ul',['Pele da face e da fronte.','Conjuntiva.','Mucosa da boca, nariz e seios paranasais.','Dentes.','Dois terços anteriores da língua (sensibilidade geral).','Maior parte da dura-máter craniana.','Propriocepção dos músculos mastigadores e da articulação temporomandibular.']],
  ['p','A **raiz motora** acompanha o mandibular até os músculos mastigadores (temporal, masseter, pterigóideos), o milo-hióideo e o ventre anterior do digástrico: eferentes viscerais especiais do 1º arco.'],
  ['clin','A **neuralgia do trigêmeo** dá crises de dor fortíssima, em choque, no território de um ramo. Quando os remédios falham, pode-se fazer termocoagulação controlada do ramo para destruir as fibras sensitivas.'],
  ['chk','A sensibilidade geral dos dois terços anteriores da língua é do:',['Facial','Trigêmeo','Glossofaríngeo'],1,'Via nervo lingual (V3). A gustação dessa área é do facial.']]},
 {t:'Facial (VII) e vestibulococlear (VIII)',b:[
  ['p','O facial sai do sulco bulbopontino com duas raízes: o **facial propriamente dito** (motor) e o **nervo intermédio** (sensitivo e visceral). Com o VIII, entra no **meato acústico interno**, percorre o canal facial, faz o **joelho externo** com o **gânglio geniculado**, desce e sai pelo **forame estilomastóideo**, atravessando a parótida.'],
  ['ul',['**Eferente visceral especial** (o principal): músculos da mímica, estilo-hióideo e ventre posterior do digástrico.','**Eferente visceral geral:** pré-ganglionares para o gânglio **pterigopalatino** (via petroso maior: glândula lacrimal) e para o gânglio **submandibular** (via corda do tímpano e nervo lingual: glândulas submandibular e sublingual).','**Aferente visceral especial:** gustação dos dois terços anteriores da língua, pelo lingual e pela **corda do tímpano**, com corpos no gânglio geniculado.']],
  ['key','Curiosidade cobrada: o facial atravessa a parótida, mas **não a inerva**; a parótida recebe o parassimpático do **glossofaríngeo** (gânglio ótico).'],
  ['p','O **vestibulococlear** é só sensitivo (aferente somático especial). Entra na ponte na parte lateral do sulco bulbopontino, no **ângulo pontocerebelar**. A parte **vestibular** vem do gânglio vestibular (equilíbrio); a **coclear**, do gânglio espiral e do órgão espiral de Corti (audição).'],
  ['clin','Lesão do VIII causa hipoacusia, vertigem, desequilíbrio, enjoo e nistagmo. O **neurinoma** (tumor de células de Schwann) do VIII cresce no ângulo pontocerebelar e pode comprimir o facial, o intermédio, o trigêmeo e o pedúnculo cerebelar médio.'],
  ['chk','As fibras da gustação dos dois terços anteriores da língua chegam ao facial pelo:',['Nervo petroso maior','Nervo corda do tímpano','Nervo auriculotemporal'],1,'Seguem com o lingual e passam ao facial pela corda do tímpano.']]},
 {t:'IX, X, XI e XII',b:[
  ['p','O **glossofaríngeo** sai do sulco lateral posterior do bulbo e do crânio pelo forame jugular, com os gânglios **superior** e **inferior**. O componente mais importante é o **aferente visceral geral**: sensibilidade do terço posterior da língua, faringe, úvula, tonsila, tuba auditiva e do **seio e corpo carotídeos**. Leva também a **gustação** do terço posterior e pré-ganglionares para o **gânglio ótico** (parótida).'],
  ['p','O **vago** é o maior nervo craniano, misto e essencialmente visceral. Sai pelo forame jugular, com gânglios **superior** (fibras somáticas) e **inferior** ou nodoso (fibras viscerais), percorre pescoço e tórax e termina no abdome.'],
  ['ul',['Aferentes viscerais gerais: faringe, laringe, traqueia, esôfago e vísceras torácicas e abdominais.','Eferentes viscerais gerais: parassimpático das vísceras torácicas e abdominais.','Eferentes viscerais especiais: músculos da faringe e da laringe. O laríngeo recorrente é o principal nervo motor da laringe, com muitas fibras vindas do ramo interno do acessório.']],
  ['p','O **acessório** tem raiz **craniana** (bulbo) e raiz **espinal** (cinco ou seis primeiros segmentos cervicais, que sobe pelo forame magno). Ao sair pelo forame jugular, divide-se: o **ramo interno** junta-se ao vago; o **ramo externo** inerva **trapézio** e **esternocleidomastóideo**.'],
  ['p','O **hipoglosso** sai do sulco lateral anterior, adiante da oliva, e do crânio pelo canal do hipoglosso. Inerva os músculos intrínsecos e extrínsecos da língua: eferente somático.'],
  ['clin','Na lesão do hipoglosso, a língua protraída **desvia para o lado lesado**, empurrada pela metade sadia.'],
  ['chk','Os impulsos dos barorreceptores do seio carotídeo chegam ao SNC pelo:',['Vago','Glossofaríngeo','Hipoglosso'],1,'Seio e corpo carotídeos são inervados pelo IX.']]},
 {t:'Inervação da língua',b:[
  ['fig','linguaInerv','Territórios de inervação sensitiva e gustativa da língua.'],
  ['tbl',[['Nervo','Função na língua'],['Trigêmeo (lingual, V3)','Sensibilidade geral dos 2/3 anteriores'],['Facial (corda do tímpano)','Gustação dos 2/3 anteriores'],['Glossofaríngeo','Sensibilidade geral e gustação do 1/3 posterior'],['Hipoglosso','Motricidade'],['Vago','Gustação na epiglote']]],
  ['p','Quatro nervos cranianos servem à língua, mas só **três chegam a ela**: hipoglosso, glossofaríngeo e lingual. As fibras do facial viajam dentro do lingual, que as recebe pela **corda do tímpano**.'],
  ['chk','Quantos nervos chegam fisicamente à língua?',['Dois','Três','Quatro'],1,'Hipoglosso, glossofaríngeo e lingual; o facial chega embutido no lingual.']]}
];
RESUMO.nervcran={pts:['I e II ligam-se ao telencéfalo e ao diencéfalo; os outros dez, ao tronco encefálico.','Fissura orbital superior: III, IV, V1 e VI. Forame redondo: V2. Forame oval: V3. Estilomastóideo: VII. Jugular: IX, X e XI. Canal do hipoglosso: XII.','IV é o único que sai da face dorsal (véu medular superior).','Componentes especiais: aferente somático especial (visão, audição, equilíbrio), aferente visceral especial (gustação, olfação), eferente visceral especial (músculos branquioméricos).','Arcos: 1º V, 2º VII, 3º IX, 4º e 5º X. Digástrico: anterior V, posterior VII.','III: músculos extrínsecos menos reto lateral (VI) e oblíquo superior (IV); parassimpático para ciliar e esfíncter da pupila.','V: sensibilidade da face, dentes, 2/3 anteriores da língua e dura; motor da mastigação.','VII: mímica; lacrimal (pterigopalatino), submandibular e sublingual (submandibular); gustação 2/3 anteriores (corda do tímpano).','VIII só sensitivo, no ângulo pontocerebelar.','IX: seio carotídeo, 1/3 posterior da língua, parótida (gânglio ótico).','X: vísceras torácicas e abdominais, faringe e laringe.','XI: trapézio e esternocleidomastóideo (raiz espinal). XII: língua.'],
 clin:['Neuralgia do trigêmeo: dor em choque num ramo; termocoagulação nos casos refratários.','Neurinoma do VIII: hipoacusia e vertigem, podendo comprimir VII, V e o pedúnculo cerebelar médio.','Neuralgia do glossofaríngeo: dor na faringe e base da língua, irradiada ao ouvido.','Hipoglosso lesado: língua desvia para o lado da lesão.','Lesão do III: ptose, olho para baixo e para fora, midríase.']};
QB.push(
 L(mc('nervcran',1,'Os nervos cranianos que NÃO se ligam ao tronco encefálico são:',['Olfatório e óptico','Óptico e oculomotor','Olfatório e hipoglosso','Troclear e abducente'],'O olfatório liga-se ao telencéfalo; o óptico, ao diencéfalo.'),'Dez dos doze pares se conectam ao tronco encefálico. O olfatório termina no bulbo olfatório (telencéfalo) e o óptico chega ao quiasma, na base do diencéfalo.','Por isso, lesões do tronco nunca explicam, sozinhas, perda de olfato ou de visão monocular.'),
 L(as('nervcran',2,'Associe o nervo à origem aparente no encéfalo.',[['Oculomotor','Sulco medial do pedúnculo cerebral'],['Trigêmeo','Entre a ponte e o pedúnculo cerebelar médio'],['Abducente','Sulco bulbopontino, perto da linha média'],['Hipoglosso','Sulco lateral anterior do bulbo']],'Cada par tem uma origem aparente própria, ao contrário dos espinais.'),'Do sulco bulbopontino saem VI (medial), VII e VIII (lateral). Do sulco lateral posterior do bulbo saem IX, X e a raiz craniana do XI. O XII sai entre a pirâmide e a oliva.','Conhecer a origem aparente ajuda a entender síndromes do tronco: uma lesão na base da ponte pode pegar o VI; uma no bulbo anterior, o XII.'),
 L(mc('nervcran',2,'O ramo maxilar do trigêmeo sai do crânio pelo:',['Forame redondo','Forame oval','Fissura orbital superior','Forame espinhoso'],'V1 fissura orbital superior; V2 forame redondo; V3 forame oval.'),'A sequência de saída das divisões do trigêmeo segue de anterior para posterior na fossa média: oftálmico pela fissura orbital superior, maxilar pelo forame redondo e mandibular pelo forame oval.','Bloqueios anestésicos do V2 e V3 em odontologia e cirurgia buscam esses forames como referência.'),
 L(mc('nervcran',2,'As fibras do nervo facial que inervam os músculos da mímica são classificadas como:',['Eferentes viscerais especiais','Eferentes somáticas','Eferentes viscerais gerais','Aferentes viscerais especiais'],'A mímica deriva do 2º arco branquial.'),'Os músculos derivados dos arcos branquiais são estriados, mas os arcos são considerados estruturas viscerais. Daí o termo eferente visceral especial, que vale para V (mastigação), VII (mímica), IX e X (faringe e laringe).','Os núcleos desses nervos têm posição própria no tronco (coluna eferente visceral especial), diferente da dos núcleos somáticos, o que será usado na topografia das lesões.'),
 L(as('nervcran',2,'Associe o arco branquial ao nervo e a um músculo.',[['1º arco','Trigêmeo: ventre anterior do digástrico'],['2º arco','Facial: ventre posterior do digástrico'],['3º arco','Glossofaríngeo: estilofaríngeo'],['4º e 5º arcos','Vago: músculos da laringe']],'Cada arco recebe cedo o seu nervo, que inerva a musculatura que ali se forma.'),'O digástrico tem dois ventres de arcos diferentes e, por isso, dois nervos. O esternocleidomastóideo e o trapézio são considerados, ao menos em parte, branquioméricos, inervados pela raiz espinal do acessório.','Esse raciocínio embriológico explica inervações que parecem arbitrárias, como o estilo-hióideo pelo facial.'),
 L(vf('nervcran',2,'Julgue sobre o nervo facial.',[['Atravessa a parótida e é o responsável pela sua secreção.',false],['O gânglio geniculado fica no joelho externo do nervo.',true],['O nervo intermédio leva a gustação dos dois terços anteriores da língua.',true],['Sai do crânio pelo forame estilomastóideo.',true]],'A parótida é inervada pelo glossofaríngeo, via gânglio ótico.'),'O facial inerva todas as grandes glândulas da cabeça, menos a parótida, que ele apenas atravessa. A lacrimal é atendida pelo gânglio pterigopalatino e as submandibular e sublingual, pelo gânglio submandibular.','Na paralisia facial periférica alta (antes do geniculado), pode haver olho seco por perda da inervação lacrimal; lesões abaixo da corda do tímpano poupam o paladar.'),
 L(od('nervcran',3,'Ordene o trajeto das fibras gustativas dos dois terços anteriores da língua até o tronco encefálico.',['Nervo lingual','Nervo corda do tímpano','Nervo facial no canal facial','Gânglio geniculado','Nervo intermédio'],'Lingual, corda do tímpano, facial, gânglio geniculado e nervo intermédio.'),'As fibras começam junto ao lingual (ramo do V3), passam ao facial pela corda do tímpano pouco antes do forame estilomastóideo, sobem pelo canal facial até o gânglio geniculado, onde estão os corpos, e entram no tronco pela raiz sensitiva, o intermédio.','O nível da lesão do facial no canal pode ser estimado pelos achados: paladar, lacrimejamento e hiperacusia (nervo estapédio).'),
 L(cs('nervcran',3,'Homem de 50 anos tem perda auditiva progressiva à esquerda, zumbido e desequilíbrio. Há pouco surgiram fraqueza da hemiface esquerda e diminuição do reflexo corneano esquerdo. A localização mais provável da lesão é:',['Ângulo pontocerebelar esquerdo','Forame jugular esquerdo','Seio cavernoso esquerdo','Fissura orbital superior esquerda'],'VIII, depois VII e V juntos apontam para o ângulo pontocerebelar.'),'O neurinoma do vestibulococlear nasce de células de Schwann e cresce no ângulo pontocerebelar, comprimindo primeiro o VIII (hipoacusia, zumbido, vertigem) e depois os vizinhos: facial e intermédio, trigêmeo (reflexo corneano) e pedúnculo cerebelar médio (ataxia).','O exame de escolha é a ressonância com contraste; tumores pequenos podem ser acompanhados ou tratados com radiocirurgia.'),
 L(mc('nervcran',2,'O componente mais importante do nervo glossofaríngeo é o aferente visceral geral, que leva a sensibilidade de:',['Terço posterior da língua, faringe, tonsila e seio carotídeo','Dois terços anteriores da língua e mucosa do palato duro','Pele da face, da fronte e da maior parte do pavilhão','Vísceras torácicas e abdominais até o cólon transverso'],'Inclui também tuba auditiva e corpo carotídeo.'),'O IX é misto. Além da sensibilidade geral dessas regiões, leva a gustação do terço posterior, inerva o estilofaríngeo e manda pré-ganglionares ao gânglio ótico, para a parótida.','O reflexo do vômito tem aferência pelo IX (faringe) e eferência pelo X; sua ausência sugere lesão desses nervos.'),
 L(gp('nervcran',2,'O gânglio parassimpático que recebe fibras do glossofaríngeo e inerva a parótida é o gânglio ____.',['ótico','otico'],'Fica junto ao V3, abaixo do forame oval; as fibras pós-ganglionares seguem pelo auriculotemporal.'),'O núcleo salivatório inferior envia as fibras pré-ganglionares pelo IX até o gânglio ótico. Dali, as pós-ganglionares pegam carona no nervo auriculotemporal (ramo do V3) para chegar à parótida.','Na síndrome de Frey, após cirurgia da parótida, essas fibras regeneram erradas para glândulas sudoríparas: suor na face ao comer.'),
 L(mc('nervcran',2,'O vago tem dois gânglios sensitivos. O inferior (nodoso) contém principalmente neurônios de fibras:',['Viscerais','Somáticas do pavilhão auditivo','Gustativas dos dois terços anteriores','Motoras da laringe'],'O superior tem as somáticas; o inferior, as viscerais.'),'O gânglio superior (jugular) fica no forame jugular e o inferior (nodoso), logo abaixo. Entre eles o vago recebe o ramo interno do acessório. As fibras eferentes do vago nascem em núcleos do bulbo.','O gânglio nodoso concentra a aferência visceral que informa o tronco sobre pressão, distensão de vísceras e inflamação.'),
 L(ar('nervcran',1,'O laríngeo recorrente é o principal nervo motor da laringe.','Muitas fibras do laríngeo recorrente se originam no ramo interno do nervo acessório.',1,'As duas são verdadeiras, mas a origem das fibras não explica por que ele é o principal nervo motor.'),'O laríngeo recorrente inerva quase todos os músculos intrínsecos da laringe. Grande parte de suas fibras vem da raiz craniana do acessório, que se junta ao vago pelo ramo interno.','Lesão do recorrente (cirurgia da tireoide, tumor do ápice pulmonar à direita ou do arco aórtico à esquerda) causa rouquidão por paralisia da prega vocal.'),
 L(mc('nervcran',2,'A raiz espinal do nervo acessório inerva:',['Trapézio e esternocleidomastóideo','Músculos intrínsecos da laringe','Constritores médio e inferior da faringe','Músculos intrínsecos e extrínsecos da língua'],'O ramo externo leva as fibras da raiz espinal.'),'A raiz espinal nasce dos cinco ou seis primeiros segmentos cervicais, sobe pelo forame magno, junta-se à raiz craniana e sai pelo forame jugular. Ali se separa no ramo interno (para o vago) e no ramo externo (para os dois músculos).','Lesão do ramo externo, como em biópsias de linfonodo cervical, causa ombro caído e dificuldade para elevar o braço acima da horizontal.'),
 L(vf('nervcran',2,'Julgue sobre a inervação da língua.',[['A sensibilidade geral dos dois terços anteriores é do trigêmeo.',true],['A gustação dos dois terços anteriores é do glossofaríngeo.',false],['A motricidade é do hipoglosso.',true],['Apenas três nervos chegam fisicamente à língua.',true]],'A gustação dos dois terços anteriores é do facial.'),'O glossofaríngeo cuida do terço posterior (geral e gustação). Os três nervos que chegam à língua são o lingual (com fibras do facial), o glossofaríngeo e o hipoglosso.','Testar o paladar na ponta da língua ajuda a localizar lesões do facial dentro do canal (acima da corda do tímpano).'),
 L(mc('nervcran',2,'Os músculos extrínsecos do bulbo ocular são considerados de origem miotômica porque derivam:',['Dos somitos pré-ópticos','Do primeiro arco branquial','Do segundo arco branquial','Da crista neural'],'Por isso III, IV e VI têm fibras eferentes somáticas.'),'Na cabeça quase não se formam somitos, exceto os pequenos somitos pré-ópticos, de onde vêm os músculos que movem o olho. A língua, por sua vez, vem dos miótomos occipitais: o XII também é eferente somático.','Os núcleos do III, IV, VI e XII ficam perto da linha média no tronco, na coluna eferente somática.'),
 L(cs('nervcran',2,'Paciente com tumor no forame jugular direito apresenta disfagia, rouquidão e dificuldade para elevar o ombro direito. Os nervos afetados são:',['IX, X e XI','VII e VIII','V e VI','XII isolado'],'Os três passam juntos pelo forame jugular.'),'Glossofaríngeo e vago explicam a disfagia e a rouquidão (faringe e laringe); o acessório, a fraqueza do trapézio. O hipoglosso, que sai pelo canal próprio, é poupado, a menos que o tumor cresça.','É a síndrome do forame jugular (Vernet); quando o XII também é atingido, pensa-se em lesão mais baixa, no espaço retroestiloide.'),
 L(ar('nervcran',2,'O nervo vestibulococlear é um nervo misto.','O nervo vestibulococlear sai do crânio pelo forame jugular.',4,'O VIII é só sensitivo e não sai do crânio: entra no meato acústico interno.'),'O VIII tem duas partes sensitivas, vestibular e coclear, ambas aferentes somáticas especiais, que entram no tronco pelo ângulo pontocerebelar. No crânio, apenas penetra no temporal pelo meato acústico interno, junto com o facial.','A surdez neurossensorial unilateral com vertigem deve levantar a suspeita de lesão do ângulo pontocerebelar.'),
 L(mc('nervcran',1,'O nervo craniano que inerva o músculo oblíquo superior é o:',['Troclear','Oculomotor','Abducente','Oftálmico'],'O IV inerva só o oblíquo superior.'),'O oblíquo superior passa pela tróclea, polia fibrocartilaginosa, daí o nome do nervo. O abducente inerva o reto lateral e o oculomotor, os demais.','Na lesão do troclear, o paciente tem diplopia vertical, pior ao olhar para baixo (descer escadas), e inclina a cabeça para o lado oposto para compensar.')
);

/* Capítulo 11 — Sistema nervoso autônomo: aspectos gerais */
LESSON.sna=[
 {t:'Somático, visceral e autônomo',b:[
  ['p','O sistema nervoso **somático** (da vida de relação) liga o organismo ao meio externo: recebe informação do ambiente e comanda os músculos esqueléticos. O **visceral** cuida das vísceras e da **homeostase**. Os dois têm parte aferente e parte eferente.'],
  ['p','Seguindo o conceito de Langley, chamamos de **sistema nervoso autônomo (SNA)** apenas a parte **eferente** do sistema visceral, que termina em **glândulas, músculo liso e músculo cardíaco**. Ele se divide em **simpático** e **parassimpático**.'],
  ['key','As fibras **eferentes viscerais especiais** dos nervos cranianos (músculos branquioméricos) **não** fazem parte do SNA: inervam músculo estriado esquelético. Só as **eferentes viscerais gerais** pertencem a ele.'],
  ['chk','Pelo conceito adotado aqui, o sistema nervoso autônomo corresponde a:',['Toda a parte visceral, aferente e eferente','Apenas a parte eferente do sistema visceral','Apenas os gânglios simpáticos'],1,'Alguns autores incluem a aferência visceral, mas aqui o SNA é só eferente.']]},
 {t:'Aferência visceral',b:[
  ['p','As fibras **viscerais aferentes** vêm dos visceroceptores e viajam junto com as fibras autônomas. A maioria das que levam **dor visceral** acompanha o **simpático**; as de alguns órgãos pélvicos acompanham o parassimpático. Antes de entrar no SNC passam pelos **mesmos gânglios** das fibras somáticas (nos nervos espinais, os gânglios espinais).'],
  ['p','Grande parte dessa informação é **inconsciente**: pressão arterial e teor de O2 chegam continuamente ao SNC e alimentam reflexos. O **seio carotídeo** detecta a pressão e o **corpo carotídeo**, o O2; ambos falam pelo **glossofaríngeo**.'],
  ['p','Quando consciente (fome, sede, plenitude, dor), a sensibilidade visceral é **difusa e mal localizada**. E o estímulo que dói é outro: cortar uma alça intestinal não dói, mas distendê-la dói muito. A dor alarma contra o que costuma lesar aquele órgão.'],
  ['clin','**Dor referida:** irritação do diafragma dói no ombro; apendicite causa hipersensibilidade na fossa ilíaca direita; infarto, dor no braço esquerdo.'],
  ['chk','Qual estímulo costuma causar dor intensa numa alça intestinal?',['Corte com bisturi','Distensão','Calor moderado'],1,'A víscera é insensível ao corte, mas a distensão é muito dolorosa.']]},
 {t:'Um neurônio ou dois',b:[
  ['fig','snaMapa','Organização geral: simpático à esquerda e parassimpático à direita. Linha contínua: pré-ganglionar; tracejada: pós-ganglionar.'],
  ['p','No somático, **um só neurônio** liga o SNC ao efetuador: o motoneurônio da coluna anterior, que termina em placas motoras. No autônomo são **dois**:'],
  ['ul',['**Neurônio pré-ganglionar:** corpo no SNC (tronco encefálico ou medula); sua **fibra pré-ganglionar** é mielínica.','**Neurônio pós-ganglionar:** corpo num **gânglio** periférico, cercado por células-satélite (anfícitos), multipolar; sua **fibra pós-ganglionar** é **amielínica** (fibra de Remak).']],
  ['p','Na medula, os pré-ganglionares ocupam **T1 a L2** (na **coluna lateral**) e **S2 a S4**; no tronco, formam núcleos de nervos cranianos como o do vago. As terminações autônomas são **livres**, sem placa.'],
  ['p','O SNC comanda esse sistema a partir de áreas do telencéfalo e do diencéfalo, principalmente o **hipotálamo**, ligadas também ao comportamento emocional. Isso explica os sintomas viscerais das emoções.'],
  ['chk','O corpo do neurônio pós-ganglionar fica:',['Na coluna lateral da medula','Num gânglio fora do SNC','No hipotálamo'],1,'O pré-ganglionar está no SNC; o pós-ganglionar, no gânglio.']]},
 {t:'Simpático e parassimpático: anatomia',b:[
  ['tbl',[['Critério','Simpático','Parassimpático'],['Neurônio pré-ganglionar','Medula T1–L2 (toracolombar)','Tronco encefálico e S2–S4 (craniossacral)'],['Gânglio (pós-ganglionar)','Longe da víscera, perto da coluna','Perto ou dentro da víscera'],['Fibra pré-ganglionar','Curta','Longa'],['Fibra pós-ganglionar','Longa','Curta'],['Vesículas granulares pequenas','Presentes','Ausentes'],['Pós-ganglionar','Adrenérgica (a maioria)','Colinérgica']]],
  ['p','Os gânglios simpáticos são **paravertebrais** (tronco simpático) e **pré-vertebrais** (adiante da aorta). No simpático, uma fibra pré-ganglionar faz sinapse com **muitos** neurônios pós-ganglionares (no gânglio cervical superior do homem, de 1 para 63 até 1 para 196).'],
  ['mn','**S**impático = **S**hort pré (pré curta) e gânglio perto da **S**pinha. **P**arassimpático = **P**ré longa, gânglio **P**erto do órgão.'],
  ['chk','No parassimpático, a fibra pós-ganglionar é curta porque:',['O gânglio fica perto ou dentro da víscera','O neurônio pré-ganglionar está na medula torácica','Ela é mielínica'],0,'Com o gânglio junto ao órgão, sobra pouco caminho para a pós-ganglionar.']]},
 {t:'Neurotransmissores',b:[
  ['p','Drogas que imitam o simpático (adrenalina, noradrenalina) são **simpaticomiméticas**; as que imitam o parassimpático (acetilcolina e análogos), **parassimpaticomiméticas**. A explicação está nos neurotransmissores.'],
  ['ul',['Todas as **pré-ganglionares** (simpáticas e parassimpáticas) são **colinérgicas**.','As **pós-ganglionares parassimpáticas** são **colinérgicas**.','A grande maioria das **pós-ganglionares simpáticas** é **adrenérgica**: libera **noradrenalina** (o nome "adrenérgica" ficou por tradição; nos anfíbios é a adrenalina).','Exceções simpáticas **colinérgicas**: fibras das **glândulas sudoríparas** e dos **vasos dos músculos esqueléticos**.']],
  ['p','Na ultraestrutura, as **vesículas granulares pequenas** (com noradrenalina) são exclusivas das pós-ganglionares simpáticas; nas parassimpáticas predominam as **agranulares** (acetilcolina).'],
  ['chk','A fibra simpática que inerva a glândula sudorípara libera:',['Noradrenalina','Acetilcolina','Adrenalina'],1,'É a exceção colinérgica do simpático.']]},
 {t:'Ações e a reação de alarme',b:[
  ['p','Em geral, os dois sistemas têm ações **antagônicas** num mesmo órgão, mas **colaboram** na regulação visceral. Há exceções: nas glândulas salivares ambos aumentam a secreção (o parassimpático, uma saliva fluida e abundante).'],
  ['ul',['Inervação **só simpática**: glândulas sudoríparas, músculos eretores dos pelos e vasos do tronco e extremidades.','Glândulas endócrinas: em geral só os vasos são inervados (controle hormonal).','Glândula lacrimal: parênquima parassimpático; o simpático fica nos vasos.']],
  ['p','O parassimpático age de forma **localizada** (gânglios junto ao órgão, pouca divergência). O simpático tende a ser **difuso**: gânglios longe, grande divergência e, numa descarga em massa, a **medula da suprarrenal** (que recebe fibras pré-ganglionares e funciona como gânglio) lança **adrenalina** no sangue.'],
  ['p','Na **reação de alarme** (luta ou fuga, de Cannon), comandada pelo hipotálamo:'],
  ['ul',['Mais glicose no sangue (glicogenólise).','Taquicardia e dilatação das coronárias.','Vasoconstrição cutânea e mesentérica (palidez) para desviar sangue aos músculos.','Aumento da pressão arterial.','Broncodilatação.','Midríase.','Menos peristaltismo e esfíncteres fechados.','Sudorese e ereção dos pelos.']],
  ['tbl',[['Órgão','Simpático','Parassimpático'],['Íris','Midríase','Miose'],['Coração','Taquicardia; dilata coronárias','Bradicardia; contrai coronárias'],['Brônquios','Dilatação','Constrição'],['Tubo digestivo','Menos peristaltismo; fecha esfíncteres','Mais peristaltismo; abre esfíncteres'],['Bexiga','Relaxa a parede; contrai o esfíncter interno','Contrai a parede; esvazia'],['Genitais masculinos','Ejaculação','Ereção'],['Cristalino','Acomodação para longe','Acomodação para perto'],['Suprarrenal','Secreção de adrenalina','Nenhuma ação']]],
  ['mn','Para o pênis: **P**arassimpático **P**õe de pé (ereção); **S**impático **S**olta (ejaculação).'],
  ['chk','A medula da suprarrenal é considerada equivalente a um gânglio simpático porque:',['Recebe fibras pré-ganglionares e libera adrenalina','Recebe fibras pós-ganglionares','Contém neurônios pré-ganglionares'],0,'Suas células cromafins fazem o papel de neurônios pós-ganglionares.']]}
];
RESUMO.sna={pts:['SNA = parte eferente do sistema visceral; termina em glândulas, músculo liso e cardíaco.','Eferentes viscerais especiais (branquioméricos) não são do SNA.','Aferência visceral passa pelos mesmos gânglios sensitivos; dor visceral acompanha sobretudo o simpático.','Seio carotídeo (pressão) e corpo carotídeo (O2) informam pelo glossofaríngeo.','Dois neurônios: pré-ganglionar no SNC (fibra mielínica) e pós-ganglionar no gânglio (fibra amielínica).','Simpático toracolombar (T1–L2), gânglios perto da coluna, pré curta e pós longa.','Parassimpático craniossacral (tronco e S2–S4), gânglios junto às vísceras, pré longa e pós curta.','Pré-ganglionares e pós parassimpáticas: acetilcolina. Pós simpáticas: noradrenalina (exceções: sudoríparas e vasos musculares).','Simpático difuso (divergência, suprarrenal); parassimpático localizado.','Só simpático: sudoríparas, eretores dos pelos, vasos do tronco e extremidades.'],
 clin:['Dor referida: diafragma no ombro, infarto no braço esquerdo.','Reação de alarme: taquicardia, hipertensão, midríase, broncodilatação e palidez.','Drogas simpaticomiméticas e parassimpaticomiméticas imitam os neurotransmissores.','Emoções alteram o funcionamento visceral pelas conexões do hipotálamo com os pré-ganglionares.']};
QB.push(
 L(mc('sna',1,'O sistema nervoso autônomo termina em:',['Glândulas, músculo liso e músculo cardíaco','Músculos estriados esqueléticos dos membros','Receptores das vísceras e dos vasos sanguíneos','Fusos neuromusculares e órgãos neurotendinosos'],'É a parte eferente do sistema visceral.'),'O somático eferente termina em músculo estriado esquelético por placas motoras; o autônomo, em glândulas, músculo liso e cardíaco, por terminações livres. Por isso o primeiro é voluntário e o segundo, involuntário.','A paralisia de um membro e a perda do controle da bexiga dependem de sistemas diferentes, o que ajuda a separar lesões somáticas e autônomas.'),
 L(ar('sna',3,'As fibras eferentes viscerais especiais do nervo facial pertencem ao sistema nervoso autônomo.','As fibras eferentes viscerais especiais inervam músculos estriados derivados dos arcos branquiais.',3,'A afirmação é falsa; a razão é verdadeira e mostra justamente por que essas fibras não são autônomas.'),'Só as eferentes viscerais gerais (pré-ganglionares parassimpáticas, por exemplo) integram o SNA. As especiais vão para músculos esqueléticos da mímica, da mastigação, da faringe e da laringe.','A paralisia facial é um problema motor somático-branquial, e não autonômico, ainda que o mesmo nervo leve fibras lacrimais e salivares.'),
 L(mc('sna',2,'A maior parte das fibras que conduzem a dor visceral acompanha:',['As fibras do sistema simpático','As fibras do parassimpático craniano','Os nervos cranianos motores','As fibras eferentes somáticas'],'A exceção são alguns órgãos pélvicos, cujas fibras acompanham o parassimpático.'),'As fibras aferentes viscerais seguem nos mesmos nervos que as fibras autônomas e entram na medula pelos gânglios espinais, junto com as somáticas. A maior parte da dor visceral sobe pelos nervos do simpático.','Simpatectomias e bloqueios do plexo celíaco são usados para aliviar dor visceral intratável, como no câncer de pâncreas.'),
 L(vf('sna',2,'Julgue sobre a sensibilidade visceral.',[['É mais difusa e menos localizada que a somática.',true],['Cortar uma víscera oca é muito doloroso.',false],['Grande parte dos impulsos viscerais é inconsciente.',true],['Os gânglios das fibras viscerais nos nervos espinais são os gânglios espinais.',true]],'O corte de uma víscera não dói; a distensão sim.'),'A dor sinaliza o que costuma lesar cada região: para a pele, o corte; para a víscera oca, a distensão e a isquemia. Impulsos de pressão arterial e O2 chegam ao SNC sem se tornarem conscientes.','Por isso a cólica (distensão) é tão dolorosa, enquanto biópsias de mucosa intestinal costumam ser indolores.'),
 L(gp('sna',2,'O fenômeno em que a irritação do diafragma provoca dor no ombro chama-se dor ____.',['referida'],'A dor visceral é atribuída a um território cutâneo.'),'As fibras viscerais entram nos mesmos segmentos medulares que fibras de certas áreas da pele, e o SNC projeta a dor na pele. O diafragma tem inervação do frênico (C3–C5), segmentos que também inervam a pele do ombro.','Dor no ombro após cirurgia laparoscópica (gás sob o diafragma) e na ruptura de baço (sinal de Kehr) são exemplos.'),
 L(mc('sna',2,'Os neurônios pré-ganglionares do sistema autônomo, na medula, ocupam os segmentos:',['T1 a L2 e S2 a S4','C1 a C8','L3 a S1','Todos os segmentos medulares'],'T1–L2 para o simpático, S2–S4 para o parassimpático sacral.'),'Na porção toracolombar eles formam a coluna lateral, entre as colunas anterior e posterior. O restante dos pré-ganglionares parassimpáticos está em núcleos do tronco encefálico.','Lesões medulares cervicais altas desconectam todo o simpático do comando central, causando hipotensão e bradicardia (choque neurogênico).'),
 L(as('sna',2,'Associe a característica ao tipo de fibra.',[['Mielínica, sai do SNC','Fibra pré-ganglionar'],['Amielínica, sai do gânglio','Fibra pós-ganglionar'],['Pseudounipolar, num gânglio sensitivo','Neurônio aferente visceral'],['Multipolar, envolvido por anfícitos','Neurônio pós-ganglionar']],'Pré mielínica; pós amielínica (fibra de Remak).'),'O neurônio pós-ganglionar é multipolar, cercado por células-satélite no gânglio autônomo. O neurônio sensitivo, também em gânglio, é pseudounipolar. A diferença histológica ajuda a reconhecer gânglios autônomos e sensitivos ao microscópio.','A fibra pré-ganglionar é do grupo B e a pós-ganglionar, do grupo C, o que explica respostas diferentes a anestésicos locais.'),
 L(mc('sna',2,'No sistema simpático, a fibra pré-ganglionar é curta porque:',['Os gânglios ficam perto da coluna vertebral','Os neurônios pré-ganglionares estão no tronco encefálico','Ela termina dentro da víscera','Ela é amielínica'],'Gânglios paravertebrais e pré-vertebrais ficam longe das vísceras e perto da coluna.'),'Com o gânglio perto da coluna, a pré-ganglionar percorre pouco caminho e a pós-ganglionar precisa ir longe até o órgão. No parassimpático é o inverso.','Esse arranjo permite que tumores e cirurgias junto à coluna atinjam o simpático de vários órgãos ao mesmo tempo.'),
 L(ar('sna',2,'As ações do simpático tendem a ser difusas, atingindo vários órgãos.','No simpático, uma fibra pré-ganglionar faz sinapse com grande número de neurônios pós-ganglionares, de gânglios distantes das vísceras.',0,'As duas são verdadeiras e a razão explica a afirmação.'),'A divergência (uma pré para dezenas ou centenas de pós) e a distância dos gânglios espalham o efeito. A adrenalina da suprarrenal amplia ainda mais o alcance. O parassimpático, com gânglios junto ao órgão e pouca divergência, age localmente.','Por isso o estresse agudo mexe com o corpo todo, enquanto um reflexo parassimpático (como a miose à luz) é bem focal.'),
 L(mc('sna',2,'São colinérgicas todas as fibras abaixo, EXCETO:',['A maioria das pós-ganglionares simpáticas','As pré-ganglionares simpáticas','As pré-ganglionares parassimpáticas','As pós-ganglionares parassimpáticas'],'As pós-ganglionares simpáticas são, na maioria, adrenérgicas.'),'Todas as pré-ganglionares e as pós parassimpáticas liberam acetilcolina. Das pós simpáticas, só as das glândulas sudoríparas e dos vasos musculares são colinérgicas.','Bloqueadores ganglionares (nicotínicos) afetam simpático e parassimpático ao mesmo tempo, porque os dois usam acetilcolina no gânglio.'),
 L(mc('sna',3,'Uma característica ultraestrutural exclusiva das fibras pós-ganglionares simpáticas é a presença de:',['Vesículas granulares pequenas','Vesículas agranulares com acetilcolina','Bainha de mielina espessa','Pregas juncionais pós-sinápticas'],'As granulares pequenas contêm noradrenalina.'),'Nas pós-ganglionares parassimpáticas predominam vesículas agranulares, com acetilcolina. As vesículas granulares grandes podem aparecer nos dois tipos.','Métodos histoquímicos para monoaminas (como fluorescência para noradrenalina) permitem mapear a inervação simpática de um órgão.'),
 L(vf('sna',2,'Julgue sobre a inervação autônoma dos órgãos.',[['As glândulas sudoríparas têm inervação só simpática.',true],['Os músculos eretores dos pelos recebem parassimpático.',false],['Nas glândulas salivares, simpático e parassimpático aumentam a secreção.',true],['Na glândula lacrimal, a secreção depende do parassimpático.',true]],'Os eretores dos pelos recebem só simpático.'),'Nem todo órgão tem dupla inervação, e nem sempre os dois sistemas se opõem. Na salivar, o parassimpático produz saliva fluida e abundante; o simpático, saliva viscosa e escassa.','A boca seca de quem está nervoso reflete o predomínio simpático sobre a salivação.'),
 L(as('sna',2,'Associe o órgão ao efeito do simpático.',[['Íris','Midríase'],['Brônquios','Dilatação'],['Coração','Taquicardia'],['Tubo digestivo','Menos peristaltismo e esfíncteres fechados']],'Todos fazem parte da reação de luta ou fuga.'),'Na reação de alarme, o organismo se prepara para o esforço: mais sangue e glicose para os músculos, mais ar nos pulmões, pupila aberta e digestão em espera.','Betabloqueadores reduzem a taquicardia e o tremor de ansiedade, mas podem causar broncoconstrição em asmáticos.'),
 L(as('sna',2,'Associe o órgão ao efeito do parassimpático.',[['Íris','Miose'],['Cristalino','Acomodação para perto'],['Bexiga','Contração da parede e esvaziamento'],['Pênis','Ereção']],'O parassimpático é o sistema do repouso e da manutenção.'),'Cada efeito parassimpático é localizado: o III contrai o esfíncter da pupila e o músculo ciliar; o parassimpático sacral (nervos esplâncnicos pélvicos) cuida da bexiga e da ereção.','Drogas anticolinérgicas (como a atropina) causam midríase, visão de perto turva e retenção urinária.'),
 L(cs('sna',2,'Um estudante é surpreendido por um cão bravo. Em segundos fica pálido, com o coração disparado e as pupilas dilatadas. A palidez se explica por:',['Vasoconstrição cutânea e mesentérica simpática','Vasodilatação parassimpática dos vasos da pele','Bradicardia vagal com queda do débito cardíaco','Queda da glicose por consumo muscular imediato'],'O sangue é desviado para os músculos esqueléticos.'),'Do hipotálamo partem impulsos para os pré-ganglionares da coluna lateral. A vasoconstrição na pele e nas vísceras redistribui o sangue; a suprarrenal libera adrenalina, que amplifica a resposta.','A elevação súbita da pressão nessa descarga pode romper vasos fragilizados, o que dá base anatômica à expressão "morreu de susto".'),
 L(mc('sna',2,'A medula da suprarrenal secreta adrenalina quando recebe fibras:',['Pré-ganglionares simpáticas','Pós-ganglionares simpáticas','Pós-ganglionares parassimpáticas','Do nervo vago'],'Funciona como um gânglio simpático.'),'As células da medula suprarrenal derivam da crista neural, como os neurônios pós-ganglionares. Recebem diretamente as fibras pré-ganglionares e liberam adrenalina no sangue, que age como hormônio.','O feocromocitoma, tumor dessas células, causa crises de hipertensão, taquicardia, sudorese e cefaleia.'),
 L(ar('sna',2,'O parassimpático causa ejaculação e o simpático, ereção.','A suprarrenal recebe inervação parassimpática que estimula a secreção de adrenalina.',4,'As duas são falsas: o parassimpático causa ereção e o simpático, ejaculação; a suprarrenal recebe simpático.'),'Nos genitais masculinos, o parassimpático (S2–S4, nervos esplâncnicos pélvicos) causa vasodilatação e ereção; o simpático, vasoconstrição e ejaculação. O parassimpático não age sobre a suprarrenal.','Lesões dos nervos pélvicos em cirurgias do reto e da próstata podem causar disfunção erétil.'),
 L(cs('sna',3,'Estudante relata palpitações, diarreia e dor de estômago sempre que tem prova. O exame físico e os exames são normais. A base anatômica para esses sintomas é:',['A conexão do hipotálamo e áreas emocionais com os neurônios pré-ganglionares','Uma lesão estrutural do tronco simpático torácico','Hiperatividade do nervo frênico durante a ansiedade','Uma doença primária e progressiva dos plexos entéricos'],'Áreas do comportamento emocional influenciam diretamente o SNA.'),'O hipotálamo e áreas límbicas projetam fibras para os pré-ganglionares do tronco e da medula. Emoções intensas alteram, por essa via, coração, intestino e glândulas.','Reconhecer a origem funcional evita exames desnecessários, sem descartar a avaliação de causas orgânicas quando há sinais de alarme.')
);

/* Capítulo 12 — SNA: anatomia do simpático, do parassimpático e dos plexos viscerais */
LESSON.snaanat=[
 {t:'Tronco simpático',b:[
  ['p','A principal formação do simpático é o **tronco simpático**: uma cadeia de **gânglios paravertebrais** unidos por **ramos interganglionares**, de cada lado da coluna, da base do crânio ao cóccix, onde os dois troncos se juntam no **gânglio ímpar**.'],
  ['ul',['**Cervical:** gânglios cervical superior, médio (muitas vezes ausente) e inferior. O inferior costuma fundir-se ao 1º torácico: **gânglio cervicotorácico (estrelado)**.','**Torácica:** 10 a 12 gânglios (pode haver fusões).','**Lombar:** 3 a 5. **Sacral:** 4 a 5. **Coccígea:** só o gânglio ímpar.']],
  ['p','Da parte torácica, a partir de T5, saem os **nervos esplâncnicos maior, menor e imo**, que atravessam o diafragma e terminam nos **gânglios pré-vertebrais**: **celíacos**, **aórtico-renais**, **mesentérico superior** e **mesentérico inferior**, junto à origem das artérias de mesmo nome. O esplâncnico maior vai ao celíaco; o menor, ao aórtico-renal.'],
  ['key','Os nervos esplâncnicos parecem sair de gânglios paravertebrais, mas são feitos de fibras **pré-ganglionares** (e aferentes viscerais) que atravessam esses gânglios **sem sinapse**.'],
  ['chk','O gânglio estrelado resulta da fusão do:',['Cervical superior com o médio','Cervical inferior com o 1º torácico','Último lombar com o 1º sacral'],1,'Também chamado cervicotorácico.']]},
 {t:'Ramos comunicantes e trajeto das fibras',b:[
  ['fig','simpTrajeto','Trajeto das fibras simpáticas num segmento torácico.'],
  ['tbl',[['Ramo comunicante','Fibras','Onde existe'],['Branco','Pré-ganglionares (mielínicas) e aferentes viscerais','Só de T1 a L2'],['Cinzento','Pós-ganglionares (amielínicas)','Em todos os nervos espinais']]],
  ['p','O **neurônio pré-ganglionar** está na coluna lateral (T1–L2). A fibra sai pela raiz ventral, passa ao tronco do nervo e ao ramo ventral, e entra no tronco simpático pelo **ramo comunicante branco**. Ali pode:'],
