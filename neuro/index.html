/* ---------- questões novas e explicações em 3 níveis ---------- */
var ENRICH={
 'Quais estruturas compõem o encéfalo?':['O SNC divide-se em encéfalo, dentro do crânio, e medula espinal, dentro do canal vertebral. O encéfalo reúne o cérebro (telencéfalo e diencéfalo), o cerebelo e o tronco encefálico. A medula não faz parte do encéfalo, e os nervos cranianos pertencem ao SNP.','Em exames de imagem, "lesão encefálica" e "lesão medular" têm quadros e prognósticos bem diferentes; saber os limites anatômicos orienta a leitura do laudo.'],
 'O tronco encefálico é formado por:':['O tronco encefálico liga o cérebro à medula e é formado, de cima para baixo, por mesencéfalo, ponte e bulbo. O diencéfalo, embora fique logo acima do mesencéfalo, pertence ao cérebro. O cerebelo fica dorsal ao tronco e se liga a ele pelos pedúnculos cerebelares, mas não o integra.','O tronco abriga núcleos de dez pares cranianos e os centros respiratório e cardiovascular. Por isso lesões pequenas ali podem ser fatais ou causar síndromes cruzadas (nervo craniano de um lado, hemiplegia do outro).'],
 'Na medula embrionária, o sulco limitante separa:':['O sulco limitante corre na parede lateral do tubo neural. Atrás dele, a lâmina alar origina neurônios sensitivos, que formam a coluna posterior da medula. À frente, a lâmina basal origina neurônios motores, que formam a coluna anterior e a lateral. Placas do teto e do assoalho são regiões finas na linha média, sem neurônios relevantes.','Essa organização se mantém no tronco encefálico: núcleos motores mediais, sensitivos laterais. Ela ajuda a prever quais núcleos uma lesão vascular medial ou lateral vai atingir.'],
 'Qual estrutura deriva da crista neural?':['A crista neural forma-se das bordas das pregas neurais e migra pelo embrião. Origina gânglios sensitivos e autônomos, células de Schwann, células satélites, medula da adrenal, melanócitos e parte do esqueleto da face. Neurônios motores, oligodendrócitos e células de Purkinje vêm do próprio tubo neural.','Tumores de derivados da crista neural, como o neuroblastoma na infância e o feocromocitoma (medula da adrenal), lembram essa origem comum.'],
 'O cerebelo e o cérebro pertencem ao sistema nervoso suprassegmentar.':['Segmentar é o que se relaciona diretamente com os nervos e mantém a organização em segmentos: medula, tronco e nervos. Cérebro e cerebelo ficam acima, comandam e modulam o segmentar, e compartilham a presença de córtex. A razão explica bem a asserção.','Um reflexo segmentar, como o patelar, continua existindo após lesões suprassegmentares, mas fica alterado (hiper-reflexia), o que ajuda a localizar a lesão no exame neurológico.'],
 'Recém-nascido com falha de fechamento do neuróporo caudal apresenta tecido nervoso exposto na região lombar. O diagnóstico é:':['O neuróporo caudal fecha por volta do 27º dia. Quando falha, o arco vertebral não se forma sobre a medula: na mielomeningocele, meninges e tecido nervoso fazem saliência pela pele. Anencefalia é falha do neuróporo rostral; espinha bífida oculta é só defeito ósseo, sem exposição; hidrocefalia é acúmulo de líquor, frequentemente associada à mielomeningocele.','A mielomeningocele costuma causar paraplegia, bexiga neurogênica e hidrocefalia (malformação de Chiari II). A correção é cirúrgica precoce, e a prevenção passa pelo ácido fólico, disponível no pré-natal do SUS.'],
 'A flexura cefálica do embrião ocorre na região do:':['O tubo neural se dobra em três pontos. A flexura cefálica, ventral, fica no mesencéfalo. A cervical, também ventral, fica na transição entre rombencéfalo e medula. A pontina, dorsal, fica no rombencéfalo e abre o teto do IV ventrículo.','Essas curvaturas explicam por que, no adulto, o eixo do encéfalo forma um ângulo com o eixo da medula, o que importa na descrição de cortes em neuroimagem.'],
 'O oligodendrócito':null
};
var ENRICH2={
 'Qual célula forma a bainha de mielina no sistema nervoso central?':['No SNC a mielina vem do oligodendrócito, que estende vários prolongamentos e mieliniza segmentos de diversos axônios ao mesmo tempo. No SNP quem faz isso é a célula de Schwann, cada uma responsável por um único internodo de um único axônio. Astrócitos e micróglia não formam mielina.','Doenças desmielinizantes centrais (esclerose múltipla) poupam os nervos periféricos, e as periféricas (Guillain-Barré) poupam o SNC. A distinção orienta exames: ressonância de crânio e medula na primeira, eletroneuromiografia e líquor na segunda.'],
 'Os neurônios dos gânglios sensitivos dos nervos espinais são classificados como:':['O neurônio pseudounipolar tem um único prolongamento que sai do corpo e se divide em T. O ramo periférico vai ao receptor e o central entra na medula pela raiz dorsal. Assim o impulso pode passar direto, sem atravessar o corpo celular.','Na neuropatia diabética e no herpes-zóster, o comprometimento desses neurônios ganglionares explica a dor e a perda sensitiva no território de um dermátomo.'],
 'Após secção de um nervo periférico, a degeneração do coto distal é chamada de:':['Separado do corpo celular, o coto distal perde o suprimento de proteínas e degenera: axônio e mielina se fragmentam e são removidos por macrófagos (degeneração walleriana). No corpo celular ocorre cromatólise. Degeneração transneuronal atinge neurônios que perderam suas conexões; desmielinização segmentar poupa o axônio.','Após trauma de nervo, a eletroneuromiografia só mostra sinais de desnervação depois de cerca de 2 a 3 semanas, tempo da degeneração walleriana; exames feitos antes podem subestimar a lesão.'],
 'Por que a regeneração axonal é muito limitada no SNC?':['No SNC, proteínas inibitórias da mielina central (como a Nogo) e a cicatriz glial formada por astrócitos bloqueiam o crescimento. Faltam também as faixas de células de Schwann que guiam o broto no SNP. Os neurônios centrais têm corpo celular e sofrem degeneração walleriana normalmente.','É a base da baixa recuperação após trauma raquimedular e AVC, e o alvo de pesquisas com fatores de crescimento e células-tronco.']
};

/* ===== Organização e desenvolvimento (novas) ===== */
L(mc('intro',1,'Uma via aferente é aquela que:',['Leva informação da periferia para o SNC','Leva comandos do SNC para os músculos','Liga os dois hemisférios cerebrais','Liga o cerebelo ao tronco encefálico'],'Aferente chega ao SNC; eferente sai dele.'),'Aferente e eferente são termos relativos ao SNC. Vias aferentes trazem informação de receptores (pele, músculos, vísceras) e são sensitivas. Vias eferentes levam comandos a músculos e glândulas. Fibras que ligam hemisférios são comissurais.','No exame neurológico, separar o déficit em sensitivo (aferente) e motor (eferente) é o primeiro passo para localizar a lesão.'),
L(mc('intro',1,'O sistema nervoso periférico é formado por:',['Nervos, gânglios e terminações nervosas','Medula espinal, nervos e gânglios','Tronco encefálico e nervos cranianos','Cerebelo, nervos e terminações'],'Tudo o que está fora do crânio e do canal vertebral, exceto a medula.'),'O SNP liga o SNC ao corpo: nervos cranianos e espinais, gânglios (sensitivos e autônomos) e terminações (receptores e placas motoras). Medula, tronco e cerebelo são SNC.','Neuropatias periféricas (diabetes, hanseníase, deficiência de B12) começam geralmente nas extremidades dos nervos mais longos, nos pés.'),
L(gp('intro',1,'Agrupamento de corpos de neurônios dentro do SNC chama-se ____.',['nucleo','núcleo','núcleos'],'Fora do SNC, o agrupamento chama-se gânglio.'),'Núcleo (no SNC) e gânglio (no SNP) são o mesmo conceito em lugares diferentes. Uma exceção de nome é "núcleos da base", que alguns livros antigos chamavam de gânglios da base.','Núcleos dos nervos cranianos, no tronco, são alvos de síndromes vasculares; gânglios, como o trigeminal, são alvos do herpes-zóster.'),
L(as('intro',2,'Associe o feixe de fibras ao local.',[['Trato','Feixe no SNC'],['Nervo','Feixe no SNP'],['Gânglio','Corpos neuronais no SNP'],['Núcleo','Corpos neuronais no SNC']],'Trato e núcleo ficam no SNC; nervo e gânglio no SNP.'),'No SNC, feixes recebem nomes como trato, fascículo, lemnisco ou pedúnculo; no SNP, o feixe é o nervo. Para corpos neuronais, núcleo (central) e gânglio (periférico).','Saber se a lesão está num trato (SNC) ou num nervo (SNP) define o tipo de déficit: central com espasticidade, ou periférico com flacidez e atrofia.'),
L(vf('intro',1,'Julgue sobre a substância cinzenta e a branca.',[['A substância branca é rica em fibras mielínicas.',true],['Na medula, a substância cinzenta fica na periferia.',false],['O córtex cerebral é formado por substância cinzenta.',true],['Os núcleos da base são substância cinzenta dentro do cérebro.',true]],'Na medula, a cinzenta é central; no cérebro, forma o córtex e núcleos profundos.'),'A cor branca vem da mielina. No segmentar (medula e tronco) a cinzenta é central; no suprassegmentar ela forma o córtex na superfície, além de núcleos isolados na profundidade.','Em ressonância, doenças da substância branca (como esclerose múltipla) e da cinzenta (como alguns quadros de demência) têm padrões de imagem distintos.'),
L(cs('intro',2,'Gestante de 30 anos pergunta, na primeira consulta do pré-natal, o que pode fazer para reduzir o risco de defeitos no "fechamento da coluna" do bebê. A medida com melhor evidência é:',['Usar ácido fólico, idealmente antes de engravidar','Evitar exercício físico nas primeiras semanas','Aumentar a ingestão de proteína animal','Fazer ultrassonografia a cada duas semanas'],'O ácido fólico reduz os defeitos de fechamento do tubo neural.'),'O tubo neural fecha até cerca do 28º dia, muitas vezes antes de a mulher saber que está grávida. Por isso a recomendação é começar o ácido fólico antes da concepção e manter no primeiro trimestre. Ultrassom detecta o defeito, mas não o previne.','A suplementação está na rotina do pré-natal da Atenção Básica do SUS e a farinha de trigo e milho é fortificada com ácido fólico no Brasil.'),
L(mc('intro',2,'O neuróporo rostral fecha, aproximadamente, no:',['25º dia','10º dia','40º dia','60º dia'],'O rostral fecha por volta do 25º dia e o caudal por volta do 27º.'),'O fechamento do tubo começa no meio (região cervical) e segue para as pontas. Os neuróporos são as últimas aberturas: rostral (cranial) por volta do 25º dia e caudal por volta do 27º.','Falha do rostral causa anencefalia, incompatível com a vida; falha do caudal causa espinha bífida aberta.'),
L(ar('intro',2,'A lâmina basal do tubo neural origina neurônios motores.','Ela fica ventral ao sulco limitante.',1,'As duas são verdadeiras, mas a posição não explica a função.'),'A lâmina basal fica ventral (anterior) ao sulco limitante e origina neurônios motores. Mas a função motora não decorre da posição em si; decorre do programa de diferenciação induzido pela notocorda e pela placa do assoalho. Por isso a razão é verdadeira, mas não justifica.','Na medula adulta, a coluna anterior (lâmina basal) é atingida na poliomielite e na ELA, gerando déficits puramente motores.'),
L(as('intro',2,'Associe a flexura ao local.',[['Flexura cefálica','Mesencéfalo'],['Flexura cervical','Entre rombencéfalo e medula'],['Flexura pontina','Rombencéfalo']],'A pontina é dorsal; as outras duas, ventrais.'),'As flexuras surgem porque o encéfalo cresce mais rápido que o espaço disponível. A cefálica e a cervical dobram o tubo para frente; a pontina, para trás, afastando as paredes do rombencéfalo e formando o IV ventrículo.','A disposição em ângulo do tronco em relação ao cérebro explica as orientações de cortes em ressonância (eixo do tronco versus eixo do cérebro).'),
L(od('intro',2,'Ordene as vesículas secundárias de cranial para caudal.',['Telencéfalo','Diencéfalo','Mesencéfalo','Metencéfalo','Mielencéfalo'],'Telencéfalo → diencéfalo → mesencéfalo → metencéfalo → mielencéfalo.'),'Do prosencéfalo saem telencéfalo e diencéfalo; o mesencéfalo não se divide; do rombencéfalo saem metencéfalo e mielencéfalo. Essa ordem se mantém no adulto: hemisférios, diencéfalo, mesencéfalo, ponte com cerebelo, bulbo.','Malformações como a holoprosencefalia resultam de falha na divisão do prosencéfalo em dois hemisférios.'),
L(mc('intro',2,'O mesencéfalo do adulto tem como cavidade o:',['Aqueduto cerebral','III ventrículo','IV ventrículo','Canal central'],'A luz do mesencéfalo fica estreita e forma o aqueduto.'),'Cada vesícula mantém uma cavidade: ventrículos laterais (telencéfalo), III ventrículo (diencéfalo), aqueduto (mesencéfalo), IV ventrículo (metencéfalo e mielencéfalo) e canal central (medula).','O aqueduto é o ponto mais estreito do sistema ventricular; sua estenose causa hidrocefalia dos ventrículos laterais e do III.'),
L(vf('intro',2,'Julgue sobre a crista neural.',[['Origina os neurônios dos gânglios autônomos.',true],['Origina os oligodendrócitos.',false],['Origina a medula da adrenal.',true],['Origina as células de Schwann.',true]],'Oligodendrócitos vêm do tubo neural.'),'A crista neural forma praticamente todos os componentes celulares do SNP e alguns de outros sistemas. A glia central (astrócitos, oligodendrócitos, ependimárias) vem do tubo neural; a micróglia vem da linhagem monocítica.','Na doença de Hirschsprung, células da crista neural não chegam a parte do intestino, que fica sem gânglios entéricos e sem peristalse.'),
L(cs('intro',3,'Lactente com sinais de doença de Hirschsprung (constipação grave, distensão abdominal, ausência de eliminação de mecônio). A falha embrionária envolve a migração de células da:',['Crista neural','Lâmina basal','Placa do assoalho','Camada do manto'],'Os gânglios entéricos derivam da crista neural.'),'Os neurônios dos plexos mioentérico e submucoso vêm da crista neural, que migra em direção craniocaudal pelo intestino. Se a migração para antes de chegar ao reto e ao cólon distal, esse segmento fica aganglionar e contraído, sem peristalse.','O diagnóstico é feito por biópsia retal mostrando ausência de células ganglionares; o tratamento é cirúrgico, com retirada do segmento aganglionar.'),
L(gp('intro',2,'A cavidade do diencéfalo é o ____ ventrículo.',['iii','terceiro','3','3º'],'O III ventrículo fica entre os dois tálamos.'),'O III ventrículo é uma fenda mediana entre as duas metades do diencéfalo, comunica-se com os laterais pelos forames interventriculares e com o IV pelo aqueduto.','Tumores da região (craniofaringioma, cisto coloide) podem obstruir o III ventrículo e causar hidrocefalia aguda.'),
L(ar('intro',3,'A medula espinal é parte do sistema nervoso suprassegmentar.','Ela se relaciona diretamente com os nervos espinais.',3,'A asserção é falsa: a medula é segmentar. A razão é verdadeira.'),'A medula pertence ao segmentar justamente porque se relaciona diretamente com os nervos. O suprassegmentar (cérebro e cerebelo) não emite nervos e tem córtex.','Lesões segmentares produzem déficit no nível do segmento (por exemplo, perda de reflexo), enquanto lesões suprassegmentares alteram o comando sobre os segmentos.'),
L(mc('intro',2,'A notocorda é importante para o sistema nervoso porque:',['Induz o ectoderma a formar a placa neural','Origina diretamente a medula espinal','Forma as meninges da medula','Dá origem à crista neural'],'A notocorda induz a neurulação.'),'A notocorda, estrutura mesodérmica, libera sinais (como o Sonic hedgehog) que induzem o ectoderma acima dela a se tornar neuroectoderma e organizam a placa do assoalho. No adulto, restos da notocorda permanecem no núcleo pulposo dos discos intervertebrais.','O cordoma é um tumor raro derivado de restos da notocorda, mais comum na base do crânio e no sacro.'),
L(as('intro',3,'Associe o defeito ao mecanismo.',[['Anencefalia','Falha do neuróporo rostral'],['Mielomeningocele','Falha do neuróporo caudal'],['Espinha bífida oculta','Falha só do arco vertebral'],['Hidrocefalia congênita','Obstrução da circulação do líquor']],'Defeitos de fechamento e de circulação de líquor.'),'Os defeitos do tubo neural vão de leves (espinha bífida oculta, só óssea, muitas vezes com tufo de pelos na pele) a graves (mielomeningocele, anencefalia). A hidrocefalia é um problema de líquor, frequentemente associado à mielomeningocele.','Alfafetoproteína elevada no soro materno e ultrassom morfológico ajudam a detectar defeitos abertos no pré-natal.'),
L(mc('intro',3,'No tronco encefálico adulto, os núcleos sensitivos ficam laterais aos motores porque:',['A abertura do IV ventrículo afasta as lâminas para os lados','A crista neural migra para a região medial','A lâmina basal desaparece no tronco','Os núcleos sensitivos vêm da notocorda'],'O tubo se abre e as lâminas ficam lado a lado.'),'Com a flexura pontina, as paredes do rombencéfalo se afastam como um livro aberto. O que era dorsal (lâmina alar) passa a ser lateral, e o que era ventral (lâmina basal) passa a ser medial, separados pelo sulco limitante no assoalho do IV ventrículo.','Por isso síndromes bulbares mediais atingem núcleos motores (como o XII) e laterais atingem sensitivos (como o trigêmeo espinal).'),
L(vf('intro',2,'Julgue sobre a divisão funcional do sistema nervoso.',[['O sistema nervoso visceral é também chamado de autônomo na parte eferente.',true],['O sistema nervoso somático relaciona o organismo com o meio externo.',true],['O sistema nervoso visceral não tem componente aferente.',false],['Simpático e parassimpático são divisões do componente eferente visceral.',true]],'O visceral também tem fibras aferentes.'),'Somático: relação com o meio externo (pele, músculos esqueléticos). Visceral: relação com vísceras e vasos. Ambos têm parte aferente e eferente; a eferente visceral é o sistema nervoso autônomo, com simpático e parassimpático.','A dor referida (como a dor do infarto no braço esquerdo) surge porque aferências viscerais e somáticas convergem nos mesmos neurônios da medula.'),
L(mc('intro',1,'Os nervos cranianos fazem parte do:',['Sistema nervoso periférico','Sistema nervoso central','Sistema suprassegmentar','Tronco encefálico'],'Nervos são sempre SNP, mesmo os cranianos.'),'Os nervos cranianos saem do encéfalo, mas, como todos os nervos, pertencem ao SNP. Apenas seus núcleos de origem ou terminação ficam no SNC. Uma exceção conceitual é o nervo óptico, que embriologicamente é um prolongamento do diencéfalo e é mielinizado por oligodendrócitos.','Por ser um "trato do SNC", o nervo óptico é afetado pela esclerose múltipla (neurite óptica), o que não ocorre com os outros nervos cranianos.'),
L(cs('intro',2,'Recém-nascido com polidrâmnio na gestação e ausência da calota craniana, com tecido encefálico exposto. O defeito ocorreu por volta do:',['25º dia, no neuróporo rostral','27º dia, no neuróporo caudal','10º dia, na formação da notocorda','8ª semana, na formação das meninges'],'Anencefalia: falha do neuróporo rostral.'),'O neuróporo rostral fecha por volta do 25º dia. Sem o fechamento, o prosencéfalo fica exposto ao líquido amniótico e degenera, e a calota não se forma. O polidrâmnio ocorre porque o feto não deglute adequadamente o líquido.','É incompatível com a vida prolongada. No Brasil, o STF reconheceu em 2012 a possibilidade de interrupção da gestação de feto anencéfalo.'),
L(od('intro',1,'Ordene as partes do encéfalo de cima para baixo, no eixo principal.',['Telencéfalo','Diencéfalo','Mesencéfalo','Ponte','Bulbo'],'O cerebelo fica atrás da ponte e do bulbo.'),'Essa ordem segue as vesículas: telencéfalo e diencéfalo (prosencéfalo), mesencéfalo, ponte (metencéfalo) e bulbo (mielencéfalo). O bulbo continua-se com a medula no forame magno.','Lesões que comprimem o tronco de cima para baixo, como na herniação transtentorial, produzem sinais em sequência: pupila, padrão respiratório e postura.'),
L(mc('intro',2,'A camada do manto do tubo neural origina, na medula adulta:',['A substância cinzenta','A substância branca','O canal central','As meninges'],'A camada marginal forma a substância branca.'),'O tubo neural tem três camadas: ventricular (epitélio próximo à luz, que origina células), do manto (corpos de neurônios, que forma a substância cinzenta) e marginal (fibras, que forma a substância branca).','A disposição explica por que, na medula, a substância cinzenta é central e a branca é periférica.'),
L(gp('intro',2,'Pares de nervos cranianos: ____.',['12','doze'],'São 12 pares de nervos cranianos e 31 de espinais.'),'Os 12 pares cranianos emergem do encéfalo (I e II do prosencéfalo; III a XII do tronco). Os 31 pares espinais emergem da medula.','O exame dos 12 pares é parte obrigatória do exame neurológico e ajuda a localizar lesões no tronco.'),
L(mc('intro',2,'O sistema ventricular adulto deriva:',['Da luz do tubo neural','Da crista neural','Do mesoderma que envolve o tubo','Da notocorda'],'A luz do tubo persiste como ventrículos e canal central.'),'A cavidade do tubo neural não desaparece: dilata-se nas vesículas e forma os ventrículos, e na medula fica reduzida ao canal central. Os plexos corioides, que produzem o líquor, formam-se nas paredes finas desses ventrículos.','Ventrículos aumentados em exame de imagem sugerem hidrocefalia ou atrofia cerebral; o contexto clínico ajuda a diferenciar.'),
/* ===== Tecido nervoso (novas) ===== */
L(mc('tecido',1,'Os corpúsculos de Nissl correspondem a:',['Retículo endoplasmático rugoso','Mitocôndrias agrupadas','Neurofilamentos','Vesículas sinápticas'],'Nissl = RER, sinal de grande síntese de proteínas.'),'Os corpúsculos de Nissl são acúmulos de retículo endoplasmático rugoso e ribossomos, abundantes no corpo e nos dendritos proximais. Faltam no cone de implantação e no axônio.','Na cromatólise, após lesão do axônio, os corpúsculos de Nissl se dispersam: é um sinal histológico de sofrimento e tentativa de regeneração.'),
L(as('tecido',2,'Associe o tipo de neurônio ao local típico.',[['Pseudounipolar','Gânglio sensitivo espinal'],['Bipolar','Retina'],['Multipolar','Coluna anterior da medula']],'A maioria dos neurônios é multipolar.'),'Multipolares predominam (motores, interneurônios, piramidais do córtex). Bipolares aparecem em órgãos dos sentidos especiais. Pseudounipolares formam os gânglios sensitivos.','Doenças como a ELA atingem multipolares motores; neuropatias sensitivas atingem pseudounipolares dos gânglios.'),
L(mc('tecido',2,'A barreira hematoencefálica depende principalmente de:',['Junções oclusivas entre células endoteliais','Células de Schwann ao redor dos vasos','Micróglia dentro dos capilares','Fibras colágenas espessas na parede vascular'],'As junções oclusivas do endotélio são o principal componente.'),'O endotélio dos capilares cerebrais tem junções oclusivas contínuas e pouca transcitose. Os pés dos astrócitos e os pericitos induzem e mantêm essas características.','A barreira dificulta a chegada de muitos antibióticos e quimioterápicos ao encéfalo; na meningite, a inflamação aumenta sua permeabilidade.'),
L(vf('tecido',2,'Julgue sobre os astrócitos.',[['Formam cicatriz após lesão do SNC.',true],['Captam excesso de potássio e de glutamato.',true],['Formam mielina no SNP.',false],['Apoiam pés vasculares nos capilares sanguíneos.',true]],'Mielina no SNP é das células de Schwann.'),'Os astrócitos regulam o meio extracelular (potássio, glutamato), sustentam neurônios, participam da barreira hematoencefálica e formam a cicatriz glial. Existem os protoplasmáticos (substância cinzenta) e os fibrosos (substância branca).','Os astrocitomas são os tumores primários mais comuns do encéfalo; o glioblastoma é sua forma mais agressiva.'),
L(mc('tecido',2,'Qual célula reveste os ventrículos e o canal central?',['Ependimária','Astrócito fibroso','Micróglia','Célula satélite'],'O epêndima reveste as cavidades do SNC.'),'As células ependimárias formam um epitélio cúbico ou colunar, muitas vezes com cílios, que reveste ventrículos e canal central. Nos plexos corioides, células ependimárias modificadas produzem o líquor.','O ependimoma é um tumor dessas células; em crianças é comum no IV ventrículo e pode causar hidrocefalia.'),
L(ar('tecido',2,'A micróglia é a célula de defesa do SNC.','Ela tem origem na linhagem monocítica, como os macrófagos.',0,'As duas são verdadeiras e a origem explica a função.'),'A micróglia deriva de precursores mieloides que colonizam o SNC no desenvolvimento. Como os macrófagos, ela fagocita restos celulares e apresenta antígenos.','No HIV, a micróglia é infectada e participa da demência associada ao vírus.'),
L(mc('tecido',2,'Uma célula de Schwann mieliniza:',['Um segmento de um único axônio','Segmentos de dezenas de axônios','Todo o comprimento de um axônio','Apenas axônios do SNC'],'Uma Schwann = um internodo.'),'Cada célula de Schwann envolve um único segmento (internodo) de um axônio. Em fibras amielínicas, uma Schwann pode abrigar vários axônios em reentrâncias, sem enrolar mielina.','Na hanseníase, o bacilo infecta células de Schwann, o que explica o comprometimento precoce dos nervos periféricos.'),
L(od('tecido',2,'Ordene os eventos da sinapse química.',['Potencial de ação chega ao terminal','Entrada de cálcio','Exocitose das vesículas','Ligação ao receptor pós-sináptico','Remoção do neurotransmissor'],'Cálcio é o gatilho da liberação.'),'O potencial de ação abre canais de cálcio dependentes de voltagem no terminal; o cálcio promove a fusão das vesículas (proteínas SNARE); o neurotransmissor age nos receptores e depois é recaptado ou degradado.','A toxina botulínica impede a exocitose de acetilcolina, causando paralisia flácida; em doses mínimas é usada em distonias e espasticidade.'),
L(mc('tecido',2,'Na sinapse elétrica, a comunicação entre os neurônios ocorre por:',['Junções comunicantes','Vesículas de neurotransmissor','Receptores metabotrópicos','Fenda sináptica larga'],'Junções comunicantes permitem passagem direta de íons.'),'Junções comunicantes (gap junctions), formadas por conexinas, ligam o citoplasma das duas células. A transmissão é muito rápida e pode ser bidirecional, útil para sincronizar grupos de neurônios.','Alguns núcleos do tronco usam sinapses elétricas para gerar ritmos sincronizados, como na oliva inferior.'),
L(cs('tecido',3,'Homem de 45 anos com fraqueza que começa nos pés e sobe em dias, após diarreia, com arreflexia e líquor com proteína alta e células normais. A célula-alvo do processo é a:',['Célula de Schwann','Oligodendrócito','Astrócito','Micróglia'],'Guillain-Barré: desmielinização periférica.'),'A síndrome de Guillain-Barré é uma polirradiculoneuropatia autoimune, muitas vezes após infecção (Campylobacter jejuni). Anticorpos atacam a mielina periférica, produzida pelas células de Schwann, causando fraqueza ascendente e arreflexia. A dissociação proteíno-citológica no líquor é típica.','É uma emergência pelo risco de insuficiência respiratória; trata-se com imunoglobulina ou plasmaférese, disponíveis no SUS.'),
L(gp('tecido',2,'A regeneração de um axônio periférico ocorre em média a ____ mm por dia.',['1','1 a 3','1-3','2','3','1 a 2'],'Cerca de 1 a 3 mm por dia.'),'O broto axonal cresce cerca de 1 a 3 mm/dia guiado pelas faixas de células de Schwann. Isso permite estimar o tempo de recuperação a partir da distância entre a lesão e o músculo.','Uma lesão do nervo radial no braço, a 20 cm dos extensores do punho, pode levar meses para recuperar a função; o sinal de Tinel avançando indica regeneração.'),
L(vf('tecido',2,'Julgue sobre o axônio.',[['Cada neurônio tem, em geral, um único axônio.',true],['O axônio contém muitos corpúsculos de Nissl.',false],['O transporte axonal leva proteínas do corpo ao terminal.',true],['Os axônios podem ter ramos colaterais.',true]],'O axônio não tem Nissl.'),'O axônio não sintetiza proteínas em quantidade; depende do transporte axonal anterógrado (do corpo para o terminal) e retrógrado (do terminal para o corpo), por microtúbulos.','O vírus da raiva e a toxina tetânica chegam ao SNC por transporte axonal retrógrado, a partir da mordida ou do ferimento.'),
L(mc('tecido',3,'Fibras do tipo C:',['São amielínicas e conduzem lentamente','Têm mielina espessa e conduzem rápido','Inervam as fibras intrafusais','Levam o tato fino da pele glabra'],'Fibras C: finas, sem mielina, lentas.'),'Fibras C têm pequeno diâmetro e não têm mielina, conduzindo a menos de 2 m/s. Carregam dor lenta (em queimação), temperatura e fibras autonômicas pós-ganglionares.','Anestésicos locais bloqueiam primeiro as fibras finas, por isso a dor some antes do tato e da força.'),
L(as('tecido',2,'Associe a célula glial ao sistema.',[['Oligodendrócito','SNC'],['Célula de Schwann','SNP'],['Célula satélite','SNP'],['Astrócito','SNC']],'Schwann e satélite são periféricas.'),'No SNC: astrócitos, oligodendrócitos, micróglia e ependimárias. No SNP: células de Schwann (nervos) e satélites (gânglios), ambas derivadas da crista neural.','Neurofibromas e schwannomas (como o do nervo vestibular) derivam de células de Schwann.'),
L(ar('tecido',3,'A condução saltatória aumenta a velocidade do impulso.','Nela, a despolarização ocorre ao longo de toda a membrana do axônio.',2,'A asserção é verdadeira; a razão é falsa.'),'Na condução saltatória a despolarização acontece só nos nódulos de Ranvier, onde se concentram canais de sódio. A mielina isola os internodos, e o impulso "salta". Isso aumenta a velocidade e economiza energia.','Na esclerose múltipla, a perda de mielina expõe trechos sem canais suficientes, e a condução fica lenta ou bloqueada.'),
L(mc('tecido',2,'O segmento do neurônio que normalmente recebe a maior parte das sinapses é:',['O dendrito','O cone de implantação','O terminal axônico','O nódulo de Ranvier'],'Dendritos são receptores de sinapses.'),'Dendritos, com suas espinhas, recebem a maior parte das sinapses excitatórias. O corpo celular também recebe sinapses, muitas inibitórias. O potencial resultante se soma até o segmento inicial do axônio.','Alterações em espinhas dendríticas aparecem em deficiência intelectual (como na síndrome do X frágil).'),
L(cs('tecido',2,'Paciente com fraqueza flutuante que piora no fim do dia, ptose e visão dupla, melhorando com repouso. O defeito está:',['Nos receptores de acetilcolina da placa motora','Na mielina dos nervos periféricos','Nos motoneurônios da coluna anterior','Nos fusos neuromusculares'],'Miastenia grave.'),'Na miastenia grave, anticorpos bloqueiam e destroem receptores nicotínicos de acetilcolina da placa motora. Com o uso repetido, a liberação de acetilcolina cai e a fraqueza piora (fatigabilidade). Músculos oculares são os primeiros afetados.','O tratamento inclui anticolinesterásicos (piridostigmina), imunossupressores e timectomia em casos selecionados, pela associação com timoma.'),
L(gp('tecido',1,'A célula glial que forma mielina no SNP é a célula de ____.',['schwann'],'No SNC é o oligodendrócito.'),'A célula de Schwann deriva da crista neural; além de formar mielina, guia a regeneração axonal.','A boa regeneração periférica, em comparação à central, depende das células de Schwann.'),
L(mc('tecido',2,'Neurotransmissor da placa motora esquelética:',['Acetilcolina','Noradrenalina','Dopamina','Glutamato'],'Placa motora = acetilcolina, receptor nicotínico.'),'Todos os motoneurônios alfa e gama liberam acetilcolina na placa motora, agindo em receptores nicotínicos que abrem canais de sódio na fibra muscular.','Bloqueadores neuromusculares usados em anestesia (como o rocurônio) competem com a acetilcolina nesse receptor.'),
L(vf('tecido',3,'Julgue sobre a lesão axonal.',[['A cromatólise ocorre no corpo celular.',true],['A degeneração walleriana ocorre no coto proximal.',false],['Células de Schwann formam faixas de Büngner no coto distal.',true],['No SNC a cicatriz astrocitária dificulta a regeneração.',true]],'A walleriana é no coto distal.'),'Após a secção, o coto distal degenera (walleriana), o corpo celular faz cromatólise e, no SNP, as células de Schwann proliferam e formam faixas que orientam o broto. No SNC, inibidores da mielina e a cicatriz glial impedem esse crescimento.','A sutura microcirúrgica precoce de nervos seccionados melhora o alinhamento dos fascículos e o resultado funcional.'),
L(od('tecido',3,'Ordene a velocidade de condução, da mais rápida para a mais lenta.',['Aα','Aβ','Aδ','C'],'Quanto mais grossa e mielinizada, mais rápida.'),'Aα (Ia, motores alfa) são as maiores e mais rápidas; Aβ (tato); Aδ (dor rápida, temperatura), finas e com pouca mielina; C, sem mielina, as mais lentas.','A dor dupla de uma topada (pontada imediata e depois queimação) reflete a chegada das fibras Aδ e depois das C.'),
L(mc('tecido',2,'Pericitos e pés de astrócitos ao redor dos capilares cerebrais:',['Induzem e mantêm a barreira hematoencefálica','Produzem o líquor','Formam mielina ao redor dos vasos','Geram o potencial de ação'],'Ajudam a manter as propriedades do endotélio.'),'A barreira é endotelial, mas depende de sinais de astrócitos e pericitos para manter as junções oclusivas e os transportadores específicos.','Em tumores cerebrais, a barreira se rompe e o contraste da tomografia ou ressonância extravasa, realçando a lesão.'),
L(as('tecido',3,'Associe a doença à estrutura principal.',[['Esclerose múltipla','Mielina central'],['Guillain-Barré','Mielina periférica'],['Miastenia grave','Placa motora'],['Esclerose lateral amiotrófica','Neurônios motores']],'Cada doença tem um alvo.'),'Desmielinizantes (central ou periférica), juncionais (placa motora) e neuronais (corpo do neurônio motor) têm quadros diferentes: a ELA, por exemplo, mistura sinais de neurônio motor superior e inferior sem alterar a sensibilidade.','Pensar no alvo celular orienta o exame complementar: ressonância, eletroneuromiografia, anticorpos ou líquor.'),
L(mc('tecido',3,'O transporte axonal retrógrado é a via pela qual chega ao SNC a:',['Toxina tetânica','Toxina botulínica','Acetilcolina da placa motora','Mielina produzida pela Schwann'],'Tétano: toxina sobe pelo axônio motor.'),'A toxina tetânica entra no terminal do motoneurônio e sobe por transporte retrógrado até a medula, onde bloqueia a liberação de neurotransmissores inibitórios (glicina e GABA), causando espasmos. A botulínica age só no terminal periférico.','A vacinação (antitetânica, no calendário do SUS) previne a doença; ferimentos contaminados exigem avaliação da situação vacinal.'),
L(gp('tecido',2,'O espaço entre dois neurônios numa sinapse química chama-se fenda ____.',['sinaptica','sináptica'],'Mede cerca de 20 a 30 nm.'),'A fenda sináptica separa as membranas pré e pós-sinápticas e é atravessada pelo neurotransmissor por difusão.','A enzima acetilcolinesterase, presente na fenda da placa motora, é o alvo de inseticidas organofosforados, cuja intoxicação causa crise colinérgica.'),
L(mc('tecido',1,'O pericário é o:',['Corpo celular do neurônio','Envoltório do fascículo nervoso','Prolongamento que recebe sinapses','Espaço entre dois internodos'],'Pericário = corpo celular.'),'O pericário contém o núcleo e a maquinaria de síntese (Nissl, Golgi). É o centro metabólico do neurônio.','Lesões que destroem o corpo celular (como na poliomielite) causam perda definitiva daquele neurônio.'),
/* ===== Nervos e terminações (novas) ===== */
L(mc('nervos',1,'A barreira hematoneural é formada principalmente pelo:',['Perineuro','Epineuro','Endoneuro','Neurilema'],'O perineuro tem células unidas por junções oclusivas.'),'O perineuro tem camadas de células achatadas unidas por junções oclusivas, que controlam o que entra no ambiente das fibras, de forma parecida com a barreira hematoencefálica.','Na reconstrução cirúrgica de nervos, o cirurgião alinha os fascículos pelo perineuro (sutura perineural).'),
L(vf('nervos',1,'Julgue sobre os nervos.',[['A maioria dos nervos espinais é mista.',true],['O epineuro envolve cada fibra isoladamente.',false],['Os nervos fazem parte do SNP.',true],['Um nervo pode conter fibras somáticas e viscerais.',true]],'Endoneuro envolve cada fibra.'),'Os nervos espinais são mistos desde a união das raízes. Um mesmo nervo pode levar fibras motoras somáticas, sensitivas somáticas e viscerais (por exemplo, simpáticas para vasos e glândulas sudoríparas).','Por isso uma lesão de nervo periférico pode causar, além de fraqueza e anestesia, pele seca e alteração da cor no território afetado.'),
L(as('nervos',2,'Associe o receptor ao estímulo.',[['Corpúsculo de Ruffini','Tato e pressão na pele'],['Discos de Merkel','Pressão contínua'],['Corpúsculo de Pacini','Vibração'],['Terminação livre','Dor']],'Cada receptor tem estímulo preferencial.'),'Os mecanorreceptores diferem em adaptação: Pacini e Meissner adaptam rápido (vibração e toque que muda); Merkel e Ruffini adaptam devagar (pressão e estiramento mantidos). Terminações livres respondem a estímulos lesivos e térmicos.','O teste de vibração com diapasão (Pacini) é sensível para detectar neuropatia diabética inicial nos pés.'),
L(mc('nervos',2,'Proprioceptores informam principalmente sobre:',['Posição e movimento do corpo','Temperatura da pele','Dor visceral','Pressão arterial'],'Proprioceptores: músculos, tendões, articulações e labirinto.'),'Fusos neuromusculares, órgãos tendinosos de Golgi, receptores articulares e o labirinto informam posição e movimento. Parte vai ao cerebelo (inconsciente) e parte ao córtex (consciente).','A perda da propriocepção consciente causa ataxia sensitiva e Romberg positivo, como na tabes dorsalis e na deficiência de B12.'),
L(mc('nervos',2,'Os motoneurônios gama inervam:',['As fibras intrafusais do fuso','As fibras extrafusais do músculo','Os órgãos tendinosos de Golgi','As glândulas sudoríparas'],'Gama ajusta a sensibilidade do fuso.'),'Ao contrair as extremidades das fibras intrafusais, os motoneurônios gama esticam a região central do fuso e mantêm sua sensibilidade mesmo quando o músculo se encurta.','Hiperatividade gama, por perda do controle descendente, contribui para a espasticidade após AVC e lesão medular.'),
L(ar('nervos',2,'O órgão tendinoso de Golgi detecta a tensão do músculo.','Ele fica entre as fibras musculares e o tendão, em série com elas.',0,'As duas são verdadeiras e a localização explica a função.'),'Por estar em série, o órgão de Golgi é deformado quando o músculo puxa o tendão, sinalizando tensão. O fuso, em paralelo às fibras, sinaliza comprimento e estiramento.','O reflexo miotático inverso, mediado pelo órgão de Golgi, ajuda a proteger o tendão de tensões excessivas.'),
L(od('nervos',2,'Ordene o reflexo miotático.',['Estiramento do músculo','Ativação do fuso neuromuscular','Fibra aferente Ia','Sinapse com motoneurônio alfa','Contração do músculo'],'Reflexo monossináptico.'),'O arco tem um receptor (fuso), uma via aferente (fibra Ia, corpo no gânglio sensitivo), um centro (sinapse direta na coluna anterior), uma via eferente (motoneurônio alfa) e um efetor (o mesmo músculo).','Testar reflexos profundos em vários níveis (bicipital, tricipital, patelar, aquileu) permite localizar raízes e segmentos lesados.'),
L(mc('nervos',2,'Na unidade motora de músculos responsáveis por movimentos finos, cada motoneurônio inerva:',['Poucas fibras musculares','Milhares de fibras musculares','Fibras de vários músculos diferentes','Apenas fibras intrafusais'],'Unidades pequenas = controle fino.'),'Músculos extrínsecos do olho e intrínsecos da mão têm unidades motoras pequenas, com poucas fibras por neurônio, o que permite ajustes finos de força. Músculos posturais têm unidades grandes.','Na eletroneuromiografia, potenciais de unidade motora aumentados indicam reinervação após perda de neurônios, como na ELA.'),
L(cs('nervos',2,'Diabético de longa data perde a sensibilidade vibratória e ao monofilamento nos pés, com feridas que não doem. A conduta preventiva mais importante é:',['Exame e cuidado diário dos pés','Repouso absoluto dos membros inferiores','Uso de calçados apertados para proteção','Aplicar calor local para melhorar a circulação'],'O pé insensível precisa de inspeção diária.'),'A neuropatia diabética afeta primeiro as fibras mais longas, nos pés. Sem dor, pequenas lesões passam despercebidas e evoluem para úlceras e amputação. Inspeção diária, calçados adequados e acompanhamento previnem complicações; calor local pode queimar a pele insensível.','O teste com monofilamento de 10 g é feito na Atenção Básica do SUS no rastreio do pé diabético.'),
L(gp('nervos',1,'A sinapse entre o nervo e a fibra muscular esquelética chama-se placa ____.',['motora'],'Neurotransmissor: acetilcolina.'),'A placa motora (junção neuromuscular) tem dobras pós-juncionais ricas em receptores nicotínicos.','Doenças da placa (miastenia, botulismo, síndrome de Lambert-Eaton) causam fraqueza sem alteração sensitiva.'),
L(mc('nervos',3,'Receptores viscerais (interoceptores) mais frequentemente levam ao SNC informação sobre:',['Distensão, química e dor das vísceras','Posição das articulações dos membros','Vibração da pele','Luz e som'],'Interoceptores: vísceras e vasos.'),'Interoceptores incluem mecanorreceptores de distensão (estômago, bexiga), quimiorreceptores (corpos carotídeos) e barorreceptores (seio carotídeo). Grande parte dessas informações não chega à consciência.','A dor visceral é mal localizada e frequentemente referida a áreas da pele, como a dor da apendicite que começa no umbigo.'),
L(vf('nervos',2,'Julgue sobre os receptores.',[['Exteroceptores captam estímulos da superfície do corpo.',true],['Fusos neuromusculares são proprioceptores.',true],['Terminações nervosas livres são encapsuladas.',false],['Barorreceptores são interoceptores.',true]],'Terminações livres não têm cápsula.'),'A classificação de Sherrington separa receptores pela origem do estímulo: superfície, aparelho locomotor e labirinto, ou vísceras e vasos.','O exame da sensibilidade testa exteroceptores (tato, dor, temperatura) e proprioceptores (posição, vibração) separadamente, porque usam vias diferentes.'),
L(cs('nervos',3,'Após picada de inseto no braço, paciente sente dor imediata em pontada e, segundos depois, queimação difusa. A segunda sensação é conduzida por fibras:',['C, amielínicas','Aα, mielínicas grossas','Aβ, mielínicas','Ia, dos fusos'],'Dor lenta: fibras C.'),'A dor rápida e bem localizada viaja por fibras Aδ; a dor lenta, em queimação e difusa, por fibras C, sem mielina. A diferença de velocidade explica as duas ondas de dor.','Medicamentos como os opioides atuam mais sobre a dor lenta (fibras C) do que sobre a rápida.'),
L(as('nervos',2,'Associe a estrutura à camada.',[['Cada fibra nervosa','Endoneuro'],['Cada fascículo','Perineuro'],['Nervo inteiro','Epineuro']],'Endo → peri → epi.'),'O epineuro, mais externo, tem tecido conjuntivo frouxo e vasos; o perineuro forma a barreira; o endoneuro é delicado, entre as fibras.','O epineuro espesso protege o nervo contra compressão; nervos superficiais com pouco epineuro (como o ulnar no cotovelo) são mais vulneráveis.'),
L(mc('nervos',2,'O reflexo patelar diminuído sugere lesão:',['No arco reflexo (nervo, raiz ou motoneurônio)','No córtex motor','Na cápsula interna','No cerebelo'],'Hiporreflexia: lesão no próprio arco.'),'Lesões do neurônio motor inferior, da raiz ou do nervo interrompem o arco e reduzem o reflexo. Lesões do neurônio motor superior (córtex, cápsula, trato corticospinal) aumentam os reflexos após a fase aguda.','Um reflexo patelar abolido com dor na face anterior da coxa sugere radiculopatia L3–L4.'),
L(ar('nervos',3,'A dor visceral costuma ser bem localizada.','Os interoceptores são numerosos e têm campos receptivos pequenos.',4,'As duas são falsas.'),'A dor visceral é difusa e mal localizada: os receptores são escassos, os campos receptivos amplos e as fibras convergem com aferências somáticas na medula, gerando dor referida.','A dor do infarto no braço esquerdo e na mandíbula e a dor da colecistite no ombro direito são exemplos de dor referida.'),
L(mc('nervos',2,'Corpúsculos de Meissner são mais abundantes:',['Nas pontas dos dedos e nos lábios','Na pele das costas','No interior dos músculos','Nas cápsulas articulares'],'Tato fino em pele glabra.'),'Os corpúsculos de Meissner ficam nas papilas dérmicas de pele sem pelos e são muito densos nas pontas dos dedos, lábios e língua, o que explica a alta discriminação tátil nessas regiões.','O teste de discriminação de dois pontos nas polpas digitais avalia a função de nervos como o mediano após lesão.'),
L(od('nervos',2,'Ordene os envoltórios de dentro para fora.',['Endoneuro','Perineuro','Epineuro'],'Endo, peri, epi.'),'A sequência corresponde a fibra, fascículo e nervo.','Na compressão crônica (como no túnel do carpo), o edema e a fibrose do epineuro e do perineuro contribuem para a lesão.'),
L(cs('nervos',2,'Criança com toxina botulínica ingerida em conserva caseira apresenta paralisia descendente simétrica, visão turva e boca seca. A toxina atua:',['Impedindo a liberação de acetilcolina no terminal','Destruindo os receptores de acetilcolina','Desmielinizando nervos periféricos','Bloqueando canais de sódio do axônio'],'Botulismo: bloqueio da exocitose de acetilcolina.'),'A toxina botulínica cliva proteínas SNARE no terminal colinérgico e impede a exocitose. Afeta placa motora e sinapses autonômicas colinérgicas, daí a boca seca e a midríase.','É doença de notificação compulsória no Brasil; o tratamento inclui suporte ventilatório e antitoxina fornecida pelo Ministério da Saúde.'),
L(mc('nervos',1,'Um nervo que leva fibras sensitivas e motoras é chamado de:',['Misto','Aferente','Eferente','Autônomo'],'Misto = sensitivo + motor.'),'Os nervos espinais são mistos a partir da união das raízes dorsal e ventral. Alguns nervos cranianos são só sensitivos (I, II, VIII) ou só motores (III, IV, VI, XI, XII).','Lesão de um nervo misto produz déficit motor e sensitivo no mesmo território, o que ajuda a diferenciá-la de lesões de raiz.'),
L(vf('nervos',3,'Julgue sobre o fuso neuromuscular.',[['Fica em paralelo às fibras extrafusais.',true],['Detecta mudanças no comprimento do músculo.',true],['É inervado por fibras Ia aferentes.',true],['Sua ativação inibe diretamente o próprio músculo.',false]],'O fuso excita o próprio músculo.'),'A ativação do fuso gera o reflexo miotático, que contrai o músculo estirado e inibe o antagonista (inibição recíproca, por interneurônio).','A espasticidade dependente de velocidade (sinal do canivete) reflete reflexos miotáticos exagerados após lesão do neurônio motor superior.'),
L(mc('nervos',2,'Barorreceptores do seio carotídeo informam:',['Variações da pressão arterial','Concentração de oxigênio','Temperatura do sangue','Posição da cabeça'],'Barorreceptores: estiramento da parede arterial.'),'Os barorreceptores do seio carotídeo e do arco aórtico detectam o estiramento da parede vascular e informam o tronco encefálico (via nervos glossofaríngeo e vago), que ajusta frequência cardíaca e tônus vascular.','A massagem do seio carotídeo pode reverter algumas taquicardias, mas causa bradicardia intensa em pessoas com hipersensibilidade do seio carotídeo.'),
L(gp('nervos',2,'O receptor encapsulado em lamelas, sensível à vibração, é o corpúsculo de ____.',['pacini','vater-pacini','vater pacini'],'Corpúsculo de Pacini.'),'O corpúsculo de Pacini tem lamelas concêntricas como uma cebola e adapta muito rápido, respondendo a vibração e pressão que mudam.','A perda da sensibilidade vibratória é um dos primeiros sinais de neuropatia periférica e de lesão dos funículos posteriores.'),
L(mc('nervos',3,'Paciente com secção completa do nervo mediano no punho terá, no território do nervo:',['Perda de sensibilidade e fraqueza dos músculos inervados','Apenas perda de sensibilidade, com força normal','Apenas fraqueza, com sensibilidade normal','Hiper-reflexia e espasticidade'],'Nervo misto: déficit sensitivo e motor.'),'O mediano no punho leva fibras sensitivas para a face palmar dos três primeiros dedos e metade do quarto, e motoras para os músculos tenares. A lesão causa anestesia e perda da oposição do polegar. Espasticidade é sinal de lesão central.','O teste de oposição do polegar e da sensibilidade da polpa do indicador avalia rapidamente o mediano no pronto-socorro.')
);

/* explicações completas e clínicas para as questões antigas destes módulos (busca pelo início do enunciado) */
var ENRICH3=[
 ['Associe cada vesícula encefálica secundária','As cinco vesículas secundárias dão os grandes segmentos do encéfalo adulto. O mesencéfalo é o único que conserva o mesmo nome do embrião ao adulto, e o metencéfalo origina duas estruturas: ponte e cerebelo.','Malformações de Chiari e Dandy-Walker envolvem derivados do rombencéfalo (cerebelo e IV ventrículo) e costumam vir com hidrocefalia.'],
 ['Associe a cavidade do tubo neural','A luz do tubo neural se transforma no sistema ventricular: ventrículos laterais no telencéfalo, III ventrículo no diencéfalo, aqueduto no mesencéfalo, IV ventrículo no rombencéfalo e canal central na medula.','Saber em qual cavidade o líquor fica represado indica o local da obstrução na hidrocefalia: aqueduto estreito dilata laterais e III, mas não o IV.'],
 ['Julgue as afirmativas sobre a divisão do sistema nervoso.','O SNP inclui nervos, gânglios e terminações. O SNA tem componente aferente visceral, além do eferente. Na divisão funcional, cerebelo e cérebro são suprassegmentares; medula, tronco e nervos são segmentares.','Disautonomias (como na neuropatia diabética) envolvem tanto aferências quanto eferências viscerais, causando hipotensão postural e alterações digestivas.'],
 ['A vesícula primitiva que não se subdivide','Das três vesículas primárias, o prosencéfalo se divide em telencéfalo e diencéfalo e o rombencéfalo em metencéfalo e mielencéfalo. O mesencéfalo continua único, o que explica ele ter o mesmo nome no embrião e no adulto.','O mesencéfalo abriga o aqueduto e os núcleos do III e IV pares; tumores da pineal, logo acima, comprimem seu teto (síndrome de Parinaud).'],
 ['Ordene as etapas da neurulação.','A notocorda induz o ectoderma a se espessar em placa neural; as bordas se elevam e o centro afunda (goteira); as pregas se fundem formando o tubo, a partir da região cervical; por fim fecham os neuróporos rostral (cerca de 25 dias) e caudal (cerca de 27 dias).','Todo o processo termina antes de muitas mulheres saberem que estão grávidas, por isso o ácido fólico deve começar antes da concepção.'],
 ['A substância cinzenta do cerebelo e do cérebro forma um córtex. Na med','No segmentar (medula e tronco), a substância cinzenta fica no centro, cercada pela branca. No suprassegmentar ela se espalha na superfície como córtex. Na medula a cinzenta tem forma de H ou borboleta.','Na ressonância de medula, lesões centrais (como a siringomielia) atingem primeiro a substância cinzenta e as fibras que cruzam no centro.'],
 ['Associe a célula glial à sua função principal.','Astrócitos sustentam, regulam o meio e participam da barreira; oligodendrócitos e células de Schwann produzem mielina no SNC e no SNP; micróglia defende; ependimárias revestem cavidades e formam o epitélio dos plexos corioides.','A origem de muitos tumores do SNC está na glia: astrocitomas, oligodendrogliomas, ependimomas e schwannomas.'],
 ['Julgue sobre a sinapse química.','Na sinapse química, o sentido é único: do pré para o pós-sináptico. O cálcio que entra no terminal dispara a exocitose. Sinapses elétricas não usam vesículas, e sim junções comunicantes. Se a sinapse excita ou inibe depende do neurotransmissor e do receptor.','Muitos fármacos agem na sinapse: antidepressivos inibem recaptação, benzodiazepínicos potencializam receptores GABA-A, antipsicóticos bloqueiam receptores de dopamina.'],
 ['A condução do impulso é mais rápida em fibras mielínicas.','A mielina isola o axônio entre os nódulos, e a despolarização só ocorre nos nódulos de Ranvier, ricos em canais de sódio. O impulso salta de nódulo em nódulo, ganhando velocidade com menos gasto de energia. A razão explica a asserção.','Doenças desmielinizantes reduzem a velocidade de condução, o que aparece nos exames de potencial evocado e na eletroneuromiografia.'],
 ['O espaço entre dois segmentos de mielina','O nódulo de Ranvier é o trecho de axônio sem mielina entre dois internodos, com alta densidade de canais de sódio. É onde o potencial de ação é regenerado na condução saltatória.','Anticorpos contra proteínas nodais aparecem em algumas variantes de Guillain-Barré, com bloqueio de condução.'],
 ['Mulher de 28 anos com neurite óptica','Neurite óptica, déficits em surtos e placas periventriculares na ressonância apontam para esclerose múltipla, doença autoimune que destrói a mielina central e os oligodendrócitos. O nervo óptico, mielinizado por oligodendrócitos, é alvo frequente. As células de Schwann não participam.','O diagnóstico usa ressonância e líquor (bandas oligoclonais). O SUS oferece medicamentos modificadores da doença por protocolo clínico específico.'],
 ['O cone de implantação do axônio é importante','O cone de implantação e o segmento inicial do axônio concentram canais de sódio dependentes de voltagem e têm o menor limiar de disparo. Ali os potenciais somados dos dendritos e do corpo decidem se haverá potencial de ação. Não há corpúsculos de Nissl nessa região.','Alguns anticonvulsivantes (como a carbamazepina e a fenitoína) bloqueiam canais de sódio e reduzem disparos repetitivos.'],
 ['Ordene os envoltórios conjuntivos do nervo','Endoneuro envolve cada fibra; perineuro reúne fibras em fascículos e forma a barreira hematoneural; epineuro envolve o nervo inteiro e contém vasos.','Na cirurgia de reparo, a sutura pode ser epineural (mais simples) ou perineural (alinha os fascículos com mais precisão).'],
 ['Associe o receptor à sensibilidade que detecta.','Meissner (tato fino, pele glabra), Pacini (vibração e pressão), terminações livres (dor e temperatura) são exteroceptores; fuso (estiramento) e órgão de Golgi (tensão) são proprioceptores.','Cada modalidade é testada de um jeito no exame: algodão (tato), diapasão (vibração), alfinete (dor), tubos quente e frio (temperatura).'],
 ['Quanto à classificação de Sherrington','Exteroceptores captam estímulos da superfície (pele), proprioceptores do aparelho locomotor e do labirinto, interoceptores das vísceras e vasos. Telerreceptores são exteroceptores de estímulos a distância (visão, audição).','A dor visceral, mediada por interoceptores, é mal localizada e frequentemente referida a áreas da pele.'],
 ['Julgue sobre a placa motora.','A placa motora liga o motoneurônio à fibra esquelética usando acetilcolina sobre receptores nicotínicos. Em regra, cada fibra muscular tem uma única placa. A miastenia grave destrói os receptores pós-sinápticos.','O teste do gelo (melhora da ptose após gelo nas pálpebras) é um recurso simples à beira do leito para suspeitar de miastenia.'],
 ['Unidade motora é o conjunto formado por:','A unidade motora é a menor unidade funcional do controle motor: um motoneurônio alfa e todas as fibras musculares que ele inerva. Quando o neurônio dispara, todas essas fibras contraem juntas.','Na eletroneuromiografia, a análise das unidades motoras diferencia doença do nervo (neuropática) de doença do músculo (miopática).'],
 ['As fibras do tipo C conduzem a dor lenta','Fibras C são finas e sem mielina, conduzem a menos de 2 m/s e carregam a dor lenta, difusa e em queimação. Fibras Aδ, finas e com pouca mielina, carregam a dor rápida e localizada. A razão explica a lentidão.','Neuropatias de fibras finas (como no diabetes inicial) causam dor em queimação nos pés com força e reflexos ainda normais.'],
 ['A fibra intrafusal do fuso neuromuscular','Motoneurônios gama inervam as fibras intrafusais e regulam a sensibilidade do fuso; motoneurônios alfa inervam as fibras extrafusais, que geram a força do músculo.','O desequilíbrio do sistema gama, sem o controle descendente, contribui para a espasticidade.'],
 ['Paciente com hanseníase perde a sensibilidade','O Mycobacterium leprae tem tropismo pelas células de Schwann e pelos nervos periféricos. As fibras finas, que levam dor e temperatura, são atingidas cedo, por isso o paciente se queima sem perceber. Motricidade e propriocepção podem ser poupadas no início.','O Brasil tem uma das maiores cargas de hanseníase do mundo. O teste de sensibilidade térmica e dolorosa nas manchas faz parte do exame na Atenção Básica, e o tratamento (poliquimioterapia) é gratuito no SUS.'],
 ['O reflexo miotático é desencadeado','O estiramento do músculo ativa o fuso; fibras Ia levam o impulso à medula e fazem sinapse direta com o motoneurônio alfa do mesmo músculo, que contrai. O órgão de Golgi participa do reflexo miotático inverso, não do direto.','A pesquisa dos reflexos profundos é parte básica do exame e ajuda a separar lesão de neurônio motor inferior (reflexos diminuídos) de superior (aumentados).']
];
